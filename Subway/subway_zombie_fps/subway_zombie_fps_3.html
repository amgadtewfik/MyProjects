<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SUBWAY SIEGE — Zombie FPS</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#000;font-family:'Courier New',monospace;}
  #c{display:block;width:100vw;height:100vh;}
  #hud{position:fixed;inset:0;pointer-events:none;color:#e8e8e8;text-shadow:0 0 6px #000,0 0 2px #000;}
  #crosshair{position:absolute;top:50%;left:50%;width:24px;height:24px;transform:translate(-50%,-50%);}
  #crosshair::before,#crosshair::after{content:'';position:absolute;background:#39ff6a;}
  #crosshair::before{left:50%;top:0;width:2px;height:100%;transform:translateX(-1px);}
  #crosshair::after{top:50%;left:0;height:2px;width:100%;transform:translateY(-1px);}
  #dot{position:absolute;left:50%;top:50%;width:4px;height:4px;background:#ff3b3b;border-radius:50%;transform:translate(-50%,-50%);}
  #bottomleft{position:absolute;bottom:24px;left:28px;font-size:20px;}
  #bottomleft .big{font-size:44px;font-weight:bold;color:#ff3b3b;letter-spacing:2px;}
  #ammo{position:absolute;bottom:24px;right:28px;font-size:34px;text-align:right;color:#ffd23b;}
  #ammo .lbl{font-size:14px;color:#aaa;letter-spacing:2px;}
  #wave{position:absolute;top:20px;left:50%;transform:translateX(-50%);font-size:22px;letter-spacing:3px;color:#39ff6a;}
  #score{position:absolute;top:20px;right:28px;font-size:20px;color:#fff;}
  #msg{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:46px;color:#ff3b3b;letter-spacing:4px;text-align:center;display:none;}
  #sub{position:absolute;top:56%;left:50%;transform:translate(-50%,-50%);font-size:18px;color:#ccc;text-align:center;display:none;}
  #startScreen{position:fixed;inset:0;background:radial-gradient(ellipse at center,#1a1a1a,#000);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:10;cursor:pointer;}
  #startScreen h1{font-size:64px;color:#ff3b3b;letter-spacing:6px;text-shadow:0 0 30px #ff3b3b;margin:0;}
  #startScreen h2{font-weight:normal;color:#39ff6a;letter-spacing:4px;margin-top:6px;}
  #startScreen p{color:#999;max-width:520px;text-align:center;line-height:1.7;font-size:15px;}
  #startScreen .go{margin-top:30px;padding:14px 40px;border:2px solid #39ff6a;color:#39ff6a;font-size:20px;letter-spacing:3px;animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
  #hpbar{position:absolute;bottom:80px;left:28px;width:220px;height:16px;border:2px solid #700;background:#200;}
  #hpfill{background:linear-gradient(90deg,#ff3b3b,#ff8a3b);height:100%;width:100%;}
  #vignette{position:fixed;inset:0;box-shadow:inset 0 0 220px 40px rgba(255,0,0,0);transition:box-shadow .15s;pointer-events:none;}
  #reload{position:absolute;bottom:70px;right:28px;font-size:16px;color:#ff3b3b;display:none;letter-spacing:2px;}
  #debug{position:absolute;top:60px;left:28px;font-size:12px;color:#0f0;opacity:0.7;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>
<div id="hud">
  <div id="crosshair"></div><div id="dot"></div>
  <div id="wave">WAVE 1</div>
  <div id="score">SCORE 0</div>
  <div id="bottomleft">
    <div class="big" id="hpnum">100</div>
    <div id="hpbar"><div id="hpfill"></div></div>
  </div>
  <div id="ammo"><div id="ammonum">12 / 48</div><div class="lbl">AMMO</div></div>
  <div id="reload">RELOADING...</div>
  <div id="msg">YOU DIED</div>
  <div id="sub">Click to restart</div>
  <div id="debug"></div>
</div>
<div id="startScreen">
  <h1>SUBWAY SIEGE</h1>
  <h2>platform 3 — they're already here</h2>
  <p>WASD to move · MOUSE to look · CLICK to shoot · R to reload · SHIFT to sprint<br>
  Hold the platform. Don't let them corner you against the turnstiles.</p>
  <div class="go">▶ CLICK TO ENTER THE STATION</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
window.addEventListener('error', function(e){
  var d = document.getElementById('debug');
  if(d) d.textContent = 'ERROR: ' + e.message + ' @ line ' + e.lineno;
});

(function(){
"use strict";

// ================= renderer / scene =================
var canvas = document.getElementById('c');
var renderer = new THREE.WebGLRenderer({canvas: canvas, antialias: true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

var scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0806, 0.014);
scene.background = new THREE.Color(0x050403);

var camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 300);
var yawObj = new THREE.Object3D();
var pitchObj = new THREE.Object3D();
yawObj.add(pitchObj);
pitchObj.add(camera);
yawObj.position.set(0, 1.7, 20);
scene.add(yawObj);

window.addEventListener('resize', function(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ================= layout constants =================
var STATION_LEN = 150;       // z runs from +25 (near/start end) to -125 (dark tunnel mouth)
var PLATFORM_MIN_X = -7.5;
var PLATFORM_MAX_X = 7.5;
var NEAR_Z = 25;
var FAR_Z = NEAR_Z - STATION_LEN;
var CENTER_Z = (NEAR_Z + FAR_Z) / 2;

// ================= lighting =================
scene.add(new THREE.AmbientLight(0x554433, 0.9));
scene.add(new THREE.HemisphereLight(0x66594a, 0x0e0a08, 0.6));

var flicker = new THREE.PointLight(0xffb066, 1.6, 20, 2);
flicker.position.set(0, 3.6, 15);
scene.add(flicker);

var lampFixtures = [];
for (var lz = NEAR_Z - 5; lz > FAR_Z + 10; lz -= 9) {
  var l = new THREE.PointLight(0xffcc88, 1.1, 16, 2);
  l.position.set(0, 4.0, lz);
  scene.add(l);
  lampFixtures.push(l);

  var fixture = new THREE.Mesh(
    new THREE.BoxGeometry(2.2, 0.15, 0.4),
    new THREE.MeshStandardMaterial({color: 0x222018, emissive: 0xffaa55, emissiveIntensity: 0.6})
  );
  fixture.position.set(0, 4.35, lz);
  scene.add(fixture);
}

// ================= materials =================
function mat(c, r, m) { return new THREE.MeshStandardMaterial({color: c, roughness: (r===undefined?0.9:r), metalness: (m===undefined?0.05:m)}); }

var floorMat = mat(0x4a463f, 0.85);
var wallUpperMat = mat(0x59544a, 0.95);
var wallLowerMat = mat(0x2f6b57, 0.6);
var ceilMat = mat(0x1c1a16, 0.95);
var pillarMat = mat(0x3d3a33, 0.8);
var benchMat = mat(0x2a2420, 0.7);
var trackPitMat = mat(0x0d0d0d, 0.9);
var railMat = new THREE.MeshStandardMaterial({color: 0x0e0e0e, roughness: 0.4, metalness: 0.85});
var safetyLineMat = new THREE.MeshStandardMaterial({color: 0xd4a017, roughness: 0.6, emissive: 0x332200, emissiveIntensity: 0.2});

// ================= platform floor =================
var floor = new THREE.Mesh(new THREE.PlaneGeometry(PLATFORM_MAX_X - PLATFORM_MIN_X, STATION_LEN), floorMat);
floor.rotation.x = -Math.PI/2;
floor.position.set((PLATFORM_MAX_X+PLATFORM_MIN_X)/2, 0, CENTER_Z);
scene.add(floor);

// safety line near track edge
var safetyLine = new THREE.Mesh(new THREE.PlaneGeometry(0.35, STATION_LEN), safetyLineMat);
safetyLine.rotation.x = -Math.PI/2;
safetyLine.position.set(PLATFORM_MAX_X - 0.6, 0.01, CENTER_Z);
scene.add(safetyLine);

// ceiling
var ceiling = new THREE.Mesh(new THREE.PlaneGeometry(PLATFORM_MAX_X - PLATFORM_MIN_X + 6, STATION_LEN), ceilMat);
ceiling.rotation.x = Math.PI/2;
ceiling.position.set((PLATFORM_MAX_X+PLATFORM_MIN_X)/2, 4.6, CENTER_Z);
scene.add(ceiling);

// far wall (station wall, opposite the tracks) - x = PLATFORM_MIN_X side
function wallStrip(x, rotY) {
  var g = new THREE.Group();
  var lower = new THREE.Mesh(new THREE.PlaneGeometry(STATION_LEN, 1.3), wallLowerMat);
  lower.position.set(x, 0.65, CENTER_Z);
  lower.rotation.y = rotY;
  g.add(lower);
  var upper = new THREE.Mesh(new THREE.PlaneGeometry(STATION_LEN, 3.3), wallUpperMat);
  upper.position.set(x, 3.0, CENTER_Z);
  upper.rotation.y = rotY;
  g.add(upper);
  return g;
}
scene.add(wallStrip(PLATFORM_MIN_X - 0.05, Math.PI/2));

// ================= track pit (visual only, past the safety line) =================
var pitOuterX = PLATFORM_MAX_X + 6;
var trackPit = new THREE.Mesh(new THREE.PlaneGeometry(pitOuterX - PLATFORM_MAX_X, STATION_LEN), trackPitMat);
trackPit.rotation.x = -Math.PI/2;
trackPit.position.set(PLATFORM_MAX_X + (pitOuterX-PLATFORM_MAX_X)/2, -0.55, CENTER_Z);
scene.add(trackPit);

var pitWallFace = new THREE.Mesh(new THREE.PlaneGeometry(STATION_LEN, 0.6), pillarMat);
pitWallFace.rotation.y = -Math.PI/2;
pitWallFace.position.set(PLATFORM_MAX_X, -0.25, CENTER_Z);
scene.add(pitWallFace);

var farTrackWall = wallStrip(pitOuterX + 0.05, -Math.PI/2);
scene.add(farTrackWall);

for (var tz = NEAR_Z - 2; tz > FAR_Z + 5; tz -= 1.4) {
  var tie = new THREE.Mesh(new THREE.BoxGeometry(pitOuterX - PLATFORM_MAX_X - 1, 0.12, 0.25), new THREE.MeshStandardMaterial({color: 0x1a120a}));
  tie.position.set(PLATFORM_MAX_X + (pitOuterX-PLATFORM_MAX_X)/2, -0.5, tz);
  scene.add(tie);
}
var rail1 = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, STATION_LEN), railMat);
rail1.position.set(PLATFORM_MAX_X + 1.6, -0.42, CENTER_Z);
scene.add(rail1);
var rail2 = rail1.clone();
rail2.position.x = PLATFORM_MAX_X + (pitOuterX-PLATFORM_MAX_X) - 1.6;
scene.add(rail2);

// ================= columns (cover, station character) =================
for (var cz = NEAR_Z - 6; cz > FAR_Z + 12; cz -= 8) {
  var pillar = new THREE.Mesh(new THREE.BoxGeometry(1.0, 4.5, 1.0), pillarMat);
  pillar.position.set(-2.5, 2.25, cz + (Math.random()*2 - 1));
  scene.add(pillar);
  var capLight = new THREE.PointLight(0xffddaa, 0.4, 6);
  capLight.position.set(-2.5, 4.2, cz);
  scene.add(capLight);
}

// ================= benches =================
for (var bz = NEAR_Z - 10; bz > FAR_Z + 20; bz -= 14) {
  var bench = new THREE.Group();
  var seat = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.12, 0.6), benchMat);
  seat.position.set(-6.6, 0.5, bz);
  var back = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.6, 0.1), benchMat);
  back.position.set(-6.6, 0.85, bz - 0.28);
  bench.add(seat, back);
  scene.add(bench);
}

// ================= dark tunnel mouth at far end =================
var tunnelMouth = new THREE.Mesh(
  new THREE.PlaneGeometry(PLATFORM_MAX_X - PLATFORM_MIN_X + 6, 4.6),
  new THREE.MeshBasicMaterial({color: 0x000000})
);
tunnelMouth.position.set((PLATFORM_MAX_X+PLATFORM_MIN_X)/2, 2.3, FAR_Z - 0.5);
scene.add(tunnelMouth);

// station sign
var signMat = new THREE.MeshStandardMaterial({color: 0x111111, emissive: 0x2255ff, emissiveIntensity: 0.5});
var sign = new THREE.Mesh(new THREE.BoxGeometry(4, 0.6, 0.1), signMat);
sign.position.set(-2, 3.6, NEAR_Z - 8);
sign.rotation.y = Math.PI/2;
scene.add(sign);

// ================= extra station detail =================
// turnstiles near the start (behind player spawn)
var turnstileMat = new THREE.MeshStandardMaterial({color: 0x777766, roughness: 0.4, metalness: 0.8});
for (var tsx = -4; tsx <= 4; tsx += 2) {
  var post = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1.0, 8), turnstileMat);
  post.position.set(tsx, 0.5, NEAR_Z - 2);
  scene.add(post);
  var arm = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.6, 0.7), new THREE.MeshStandardMaterial({color: 0x222222, metalness: 0.6}));
  arm.position.set(tsx, 0.75, NEAR_Z - 2);
  arm.rotation.y = Math.random()*0.6 - 0.3;
  scene.add(arm);
}

// posters / ad boards on the far wall
var posterColors = [0x224466, 0x662233, 0x336633, 0x555522];
for (var pz = NEAR_Z - 14; pz > FAR_Z + 25; pz -= 16) {
  var poster = new THREE.Mesh(
    new THREE.PlaneGeometry(1.4, 1.9),
    new THREE.MeshStandardMaterial({color: posterColors[Math.floor(Math.random()*posterColors.length)], roughness: 0.7, emissive: 0x0a0a0a})
  );
  poster.position.set(PLATFORM_MIN_X + 0.06, 2.2, pz);
  poster.rotation.y = -Math.PI/2;
  scene.add(poster);
  var frame = new THREE.Mesh(new THREE.PlaneGeometry(1.55, 2.05), new THREE.MeshStandardMaterial({color: 0x111111}));
  frame.position.set(PLATFORM_MIN_X + 0.04, 2.2, pz);
  frame.rotation.y = -Math.PI/2;
  scene.add(frame);
}

// grime / water stains streaking down the walls
var grimeMat = new THREE.MeshStandardMaterial({color: 0x1a1a15, transparent: true, opacity: 0.5, roughness: 1});
for (var gz = NEAR_Z - 3; gz > FAR_Z + 8; gz -= 5.5) {
  var grime = new THREE.Mesh(new THREE.PlaneGeometry(0.4 + Math.random()*0.6, 2.5 + Math.random()*1.5), grimeMat);
  grime.position.set(PLATFORM_MIN_X + 0.07, 2.6, gz + Math.random()*2);
  grime.rotation.y = -Math.PI/2;
  scene.add(grime);
}

// hanging ceiling cables/pipes
var pipeMat = new THREE.MeshStandardMaterial({color: 0x2a2a24, roughness: 0.6, metalness: 0.5});
var pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, STATION_LEN, 6), pipeMat);
pipe.rotation.x = Math.PI/2;
pipe.position.set(-4.5, 4.35, CENTER_Z);
scene.add(pipe);
for (var hz = NEAR_Z - 4; hz > FAR_Z + 8; hz -= 6) {
  var cableLen = 0.3 + Math.random()*0.5;
  var cable = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, cableLen, 5), pipeMat);
  cable.position.set(0.5 + Math.random()*3, 4.6 - cableLen/2, hz);
  scene.add(cable);
}

// trash / debris scattered on the platform floor
var trashMat = new THREE.MeshStandardMaterial({color: 0x333322, roughness: 1});
for (var trI = 0; trI < 22; trI++) {
  var trash = new THREE.Mesh(new THREE.BoxGeometry(0.15 + Math.random()*0.2, 0.05, 0.15 + Math.random()*0.2), trashMat);
  trash.position.set(
    PLATFORM_MIN_X + 1 + Math.random()*(PLATFORM_MAX_X - PLATFORM_MIN_X - 3),
    0.03,
    NEAR_Z - Math.random()*STATION_LEN + 5
  );
  trash.rotation.y = Math.random()*Math.PI;
  scene.add(trash);
}

// overturned trash can
var canMat = new THREE.MeshStandardMaterial({color: 0x2f4f3f, roughness: 0.6, metalness: 0.3});
var trashCan = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.22, 0.7, 10), canMat);
trashCan.rotation.z = Math.PI/2;
trashCan.position.set(3.5, 0.25, NEAR_Z - 18);
scene.add(trashCan);

// info board
var boardMat = new THREE.MeshStandardMaterial({color: 0x0a1a0a, emissive: 0x114411, emissiveIntensity: 0.4});
var infoBoard = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.5), boardMat);
infoBoard.position.set(PLATFORM_MIN_X + 0.06, 2.9, NEAR_Z - 24);
infoBoard.rotation.y = -Math.PI/2;
scene.add(infoBoard);

// ================= gun viewmodel =================
var gunGroup = new THREE.Group();
var gunMatDark = new THREE.MeshStandardMaterial({color: 0x1c1c1c, roughness: 0.35, metalness: 0.8});
var gunMatWood = new THREE.MeshStandardMaterial({color: 0x3a2416, roughness: 0.6});

var gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.13, 0.62), gunMatDark);
gunBody.position.set(0.26, -0.26, -0.55);
var gunBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.42, 10), gunMatDark);
gunBarrel.rotation.x = Math.PI/2;
gunBarrel.position.set(0.26, -0.215, -0.98);
var gunMag = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.28, 0.11), gunMatDark);
gunMag.rotation.z = 0.15;
gunMag.position.set(0.26, -0.46, -0.44);
var gunStock = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.16, 0.32), gunMatWood);
gunStock.position.set(0.26, -0.3, -0.16);
var gunSight = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.06, 0.05), gunMatDark);
gunSight.position.set(0.26, -0.16, -0.62);
var gunGrip = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.2, 0.09), gunMatWood);
gunGrip.rotation.x = 0.35;
gunGrip.position.set(0.26, -0.42, -0.2);
gunGroup.add(gunBody, gunBarrel, gunMag, gunStock, gunSight, gunGrip);
camera.add(gunGroup);
var gunRestX = 0.26, gunRestY = -0.26, gunRestZ = -0.55;

// visible muzzle flash geometry (additive, scales+fades each shot)
var flashGroup = new THREE.Group();
flashGroup.position.set(0.26, -0.215, -1.22);
flashGroup.visible = false;
var flashMat = new THREE.MeshBasicMaterial({color: 0xffdd77, transparent: true, opacity: 1, blending: THREE.AdditiveBlending, depthWrite: false});
var flashCore = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), flashMat);
flashGroup.add(flashCore);
for (var fi = 0; fi < 4; fi++) {
  var spike = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.32, 6), flashMat);
  spike.rotation.z = (Math.PI/2) * fi + Math.PI/8;
  spike.rotation.x = Math.PI/2;
  flashGroup.add(spike);
}
camera.add(flashGroup);

var muzzleLight = new THREE.PointLight(0xffaa33, 0, 9);
muzzleLight.position.set(0.26, -0.215, -1.2);
camera.add(muzzleLight);

// ================= screen shake =================
var shakeAmt = 0;
function addShake(v){ shakeAmt = Math.min(0.35, shakeAmt + v); }

// ================= input =================
var yaw = 0, pitch = 0;
var locked = false;
var keys = {};

document.addEventListener('keydown', function(e){ keys[e.code] = true; });
document.addEventListener('keyup', function(e){ keys[e.code] = false; });

function requestLock() {
  if (canvas.requestPointerLock) canvas.requestPointerLock();
}

document.getElementById('startScreen').addEventListener('click', function(){
  document.getElementById('startScreen').style.display = 'none';
  requestLock();
  startGame();
});

canvas.addEventListener('click', function(){
  if (!gameOver && gameStarted) requestLock();
});

document.addEventListener('pointerlockchange', function(){
  locked = (document.pointerLockElement === canvas);
});

document.addEventListener('mousemove', function(e){
  if (!locked) return;
  yaw -= e.movementX * 0.0022;
  pitch -= e.movementY * 0.0022;
  pitch = Math.max(-1.3, Math.min(1.3, pitch));
});

// ================= shooting =================
var ammo = 12, reserve = 48, magSize = 12;
var reloading = false;
var canShoot = true;
var raycaster = new THREE.Raycaster();

document.addEventListener('mousedown', function(e){
  if (e.button === 0) tryShoot();
});
document.addEventListener('keydown', function(e){
  if (e.code === 'KeyR') startReload();
});

function updateAmmoHUD(){
  document.getElementById('ammonum').textContent = ammo + ' / ' + reserve;
}

function startReload(){
  if (reloading || ammo === magSize || reserve <= 0) return;
  reloading = true;
  document.getElementById('reload').style.display = 'block';
  setTimeout(function(){
    var need = magSize - ammo;
    var take = Math.min(need, reserve);
    ammo += take; reserve -= take;
    reloading = false;
    document.getElementById('reload').style.display = 'none';
    updateAmmoHUD();
  }, 1300);
}

function tryShoot(){
  if (gameOver || !gameStarted || reloading || !canShoot) return;
  if (ammo <= 0) { startReload(); return; }
  ammo--; updateAmmoHUD();
  canShoot = false;
  setTimeout(function(){ canShoot = true; }, 95);

  muzzleLight.intensity = 10;
  flashGroup.visible = true;
  flashGroup.scale.setScalar(0.7 + Math.random()*0.6);
  flashGroup.rotation.z = Math.random()*Math.PI*2;
  flashMat.opacity = 1;
  setTimeout(function(){ muzzleLight.intensity = 0; flashGroup.visible = false; }, 55);

  gunGroup.position.set(gunRestX, gunRestY + 0.02, gunRestZ + 0.12);
  gunGroup.rotation.x = -0.08;
  setTimeout(function(){
    gunGroup.position.set(gunRestX, gunRestY, gunRestZ);
    gunGroup.rotation.x = 0;
  }, 80);

  pitch += 0.012;
  addShake(0.06);

  raycaster.setFromCamera({x: 0, y: 0}, camera);
  var targets = [];
  for (var i = 0; i < zombies.length; i++) targets.push(zombies[i].hitMesh);
  var hits = raycaster.intersectObjects(targets);
  var hitPoint = null;
  if (hits.length > 0) {
    var zHit = null;
    for (var j = 0; j < zombies.length; j++) {
      if (zombies[j].hitMesh === hits[0].object) { zHit = zombies[j]; break; }
    }
    hitPoint = hits[0].point;
    if (zHit) {
      var headshot = hitPoint.y > zHit.group.position.y + 1.3;
      damageZombie(zHit, headshot ? 90 : 42);
      spawnHitMarker(headshot);
    }
  }
  spawnTracer(hitPoint);
  if (hitPoint) spawnImpactSpark(hitPoint);
}

function spawnHitMarker(headshot){
  var hm = document.createElement('div');
  hm.textContent = headshot ? 'HEADSHOT' : 'HIT';
  hm.style.cssText = 'position:absolute;top:47%;left:50%;transform:translate(-50%,-50%);font-family:Courier New,monospace;font-weight:bold;font-size:' + (headshot?'20px':'14px') + ';color:' + (headshot?'#ff3b3b':'#ffdd77') + ';text-shadow:0 0 6px #000;pointer-events:none;';
  document.getElementById('hud').appendChild(hm);
  setTimeout(function(){ hm.remove(); }, 220);
}

function spawnTracer(hitPoint){
  var dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  var start = new THREE.Vector3();
  camera.getWorldPosition(start);
  start.addScaledVector(dir, 0.6);
  var end;
  if (hitPoint) {
    end = hitPoint.clone();
  } else {
    end = start.clone().addScaledVector(dir, 90);
  }
  var geo = new THREE.BufferGeometry().setFromPoints([start, end]);
  var lmat = new THREE.LineBasicMaterial({color: 0xfff2a0, transparent: true, opacity: 1});
  var line = new THREE.Line(geo, lmat);
  scene.add(line);
  var op = 1;
  function fade(){
    op -= 0.1;
    lmat.opacity = op;
    if (op <= 0) { scene.remove(line); }
    else requestAnimationFrame(fade);
  }
  fade();
}

function spawnImpactSpark(point){
  var light = new THREE.PointLight(0xff6622, 3.5, 5);
  light.position.copy(point);
  scene.add(light);
  var particles = [];
  var sparkGeo = new THREE.SphereGeometry(0.04, 4, 4);
  var sparkMat = new THREE.MeshBasicMaterial({color: 0xff3311});
  for (var i = 0; i < 10; i++) {
    var p = new THREE.Mesh(sparkGeo, sparkMat);
    p.position.copy(point);
    var v = new THREE.Vector3((Math.random()-0.5), (Math.random()-0.2), (Math.random()-0.5));
    v.normalize().multiplyScalar(2 + Math.random()*3);
    p.userData.v = v;
    scene.add(p);
    particles.push(p);
  }
  var t = 0;
  function anim(){
    t += 0.03;
    for (var i = 0; i < particles.length; i++) {
      particles[i].position.addScaledVector(particles[i].userData.v, 0.035);
      particles[i].userData.v.y -= 0.18;
    }
    light.intensity = Math.max(0, 3.5 - t*12);
    if (t < 0.3) {
      requestAnimationFrame(anim);
    } else {
      for (var j = 0; j < particles.length; j++) scene.remove(particles[j]);
      scene.remove(light);
    }
  }
  anim();
}

// ================= zombies =================
var zombies = [];
var wave = 1, score = 0, hp = 100, gameOver = false, gameStarted = false;
var zombiesAliveOrPending = 0;
var skinPalette = [0x4a6b4a, 0x557055, 0x3f5f3f, 0x5a6b45];

function makeZombie(){
  var isRunner = Math.random() < 0.22;
  var g = new THREE.Group();
  var skinColor = skinPalette[Math.floor(Math.random()*skinPalette.length)];
  var bodyMat = new THREE.MeshStandardMaterial({color: skinColor, roughness: 0.95});
  var goreMat = new THREE.MeshStandardMaterial({color: 0x6b0f0f, roughness: 0.8, emissive: 0x2a0303, emissiveIntensity: 0.3});
  var clothMat = new THREE.MeshStandardMaterial({color: [0x2b2f22, 0x24242a, 0x33241f][Math.floor(Math.random()*3)], roughness: 0.95});
  var eyeMat = new THREE.MeshStandardMaterial({color: 0xff2200, emissive: isRunner ? 0xff5500 : 0xff2200, emissiveIntensity: 1.4});

  var scale = 0.9 + Math.random()*0.3;
  var torso = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.8, 0.35), clothMat);
  torso.position.y = 1.1;
  var chestWound = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.3, 0.37), goreMat);
  chestWound.position.set(0.08, 1.15, 0.01);
  var head = new THREE.Mesh(new THREE.SphereGeometry(0.24, 10, 10), bodyMat);
  head.position.y = 1.68;
  head.rotation.z = (Math.random()-0.5)*0.4;
  var jawWound = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.1, 0.16), goreMat);
  jawWound.position.set(0, 1.56, 0.14);
  var eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.035, 6, 6), eyeMat);
  eyeL.position.set(0.09, 1.7, 0.2);
  var eyeR = eyeL.clone();
  eyeR.position.x = -0.09;
  var armL = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.7, 0.18), bodyMat);
  armL.position.set(0.42, 1.05, 0);
  armL.rotation.z = -0.4 + (Math.random()-0.5)*0.3;
  var armR = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.7, 0.18), bodyMat);
  armR.position.set(-0.42, 1.05, 0);
  armR.rotation.z = 0.4 + (Math.random()-0.5)*0.3;
  var legMat = new THREE.MeshStandardMaterial({color: 0x1c1c22, roughness: 0.9});
  var legL = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.9, 0.2), legMat);
  legL.position.set(0.15, 0.45, 0);
  var legR = legL.clone();
  legR.position.x = -0.15;

  var tornCloth1 = new THREE.Mesh(new THREE.PlaneGeometry(0.15, 0.35), clothMat);
  tornCloth1.position.set(0.3, 0.75, 0.19);
  tornCloth1.rotation.y = 0.3;
  var tornCloth2 = new THREE.Mesh(new THREE.PlaneGeometry(0.12, 0.28), clothMat);
  tornCloth2.position.set(-0.25, 0.7, -0.19);
  tornCloth2.rotation.y = -0.4;

  g.add(torso, chestWound, head, jawWound, eyeL, eyeR, armL, armR, legL, legR, tornCloth1, tornCloth2);
  if (isRunner) {
    g.scale.setScalar(0.92);
    bodyMat.color = new THREE.Color(0x6f4a3a);
  } else {
    g.scale.setScalar(scale);
  }

  var hitMesh = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.9, 0.6), new THREE.MeshBasicMaterial({visible: false}));
  hitMesh.position.y = 1.0;
  g.add(hitMesh);

  var baseSpeed = isRunner ? (2.6 + Math.random()*0.8) : (1.0 + Math.random()*0.6);
  var speed = baseSpeed + wave*0.06;
  var z = {
    group: g, hitMesh: hitMesh, torso: torso, armL: armL, armR: armR, legL: legL, legR: legR,
    hp: (isRunner ? 40 : 60) + wave*8, speed: speed, alive: true, attackCD: 0,
    bobPhase: Math.random()*10, isRunner: isRunner
  };
  return z;
}

function spawnWave(){
  var toSpawn = 3 + wave*2;
  zombiesAliveOrPending = toSpawn;
  document.getElementById('wave').textContent = 'WAVE ' + wave;
  var spawned = 0;

  function spawnOne(){
    if (spawned >= toSpawn || gameOver) return;
    var z = makeZombie();
    var side = Math.random() > 0.5 ? 1 : -1;
    z.group.position.set(side * (Math.random()*5), 0, FAR_Z + 5 + Math.random()*10);
    scene.add(z.group);
    zombies.push(z);
    spawned++;
    setTimeout(spawnOne, 600 + Math.random()*800);
  }
  spawnOne();
}

function damageZombie(z, dmg){
  if (!z.alive) return;
  z.hp -= dmg;
  z.torso.material.emissive = new THREE.Color(0x660000);
  setTimeout(function(){ if (z.torso.material) z.torso.material.emissive = new THREE.Color(0x000000); }, 100);
  if (z.hp <= 0) killZombie(z);
}

function killZombie(z){
  z.alive = false;
  score += z.isRunner ? 15 : 10;
  document.getElementById('score').textContent = 'SCORE ' + score;
  addShake(0.05);

  var pool = new THREE.Mesh(
    new THREE.CircleGeometry(0.5 + Math.random()*0.3, 10),
    new THREE.MeshBasicMaterial({color: 0x3a0505, transparent: true, opacity: 0.85})
  );
  pool.rotation.x = -Math.PI/2;
  pool.position.set(z.group.position.x, 0.015, z.group.position.z);
  scene.add(pool);

  var startY = z.group.position.y;
  var t = 0;
  function anim(){
    t += 0.05;
    z.group.rotation.z = Math.min(1.5, t*2);
    z.group.position.y = startY - t*0.6;
    if (t < 1) {
      requestAnimationFrame(anim);
    } else {
      scene.remove(z.group);
      var idx = zombies.indexOf(z);
      if (idx > -1) zombies.splice(idx, 1);
    }
  }
  anim();
  zombiesAliveOrPending--;
  checkWaveClear();
}

function checkWaveClear(){
  if (zombiesAliveOrPending <= 0 && zombies.length === 0 && !gameOver) {
    setTimeout(function(){
      if (gameOver) return;
      wave++;
      reserve += 24;
      updateAmmoHUD();
      spawnWave();
    }, 2200);
  }
}

function damagePlayer(dmg){
  hp -= dmg;
  addShake(0.18);
  document.getElementById('hpnum').textContent = Math.max(0, Math.round(hp));
  document.getElementById('hpfill').style.width = Math.max(0, hp) + '%';
  var vg = document.getElementById('vignette');
  vg.style.boxShadow = 'inset 0 0 220px 40px rgba(255,0,0,0.55)';
  setTimeout(function(){ vg.style.boxShadow = 'inset 0 0 220px 40px rgba(255,0,0,0)'; }, 200);
  if (hp <= 0 && !gameOver) die();
}

function die(){
  gameOver = true;
  document.exitPointerLock();
  document.getElementById('msg').style.display = 'block';
  document.getElementById('sub').style.display = 'block';
  document.getElementById('sub').textContent = 'FINAL SCORE: ' + score + ' — Click to restart';
}

document.addEventListener('mousedown', function(){
  if (gameOver) location.reload();
});

function startGame(){
  gameStarted = true;
  spawnWave();
}

// ================= player movement =================
function updatePlayer(dt){
  yawObj.rotation.y = yaw;
  pitchObj.rotation.x = pitch;

  var forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
  var right = new THREE.Vector3(Math.sin(yaw + Math.PI/2), 0, Math.cos(yaw + Math.PI/2));
  var mv = new THREE.Vector3();
  if (keys['KeyW'] || keys['ArrowUp']) mv.add(forward);
  if (keys['KeyS'] || keys['ArrowDown']) mv.sub(forward);
  if (keys['KeyD'] || keys['ArrowRight']) mv.add(right);
  if (keys['KeyA'] || keys['ArrowLeft']) mv.sub(right);
  var sprint = (keys['ShiftLeft'] || keys['ShiftRight']) ? 2.1 : 1;
  if (mv.lengthSq() > 0) {
    mv.normalize().multiplyScalar(9.5 * sprint * dt);
    yawObj.position.add(mv);
  }
  yawObj.position.x = Math.max(PLATFORM_MIN_X + 0.5, Math.min(PLATFORM_MAX_X - 1.2, yawObj.position.x));
  yawObj.position.z = Math.max(FAR_Z + 3, Math.min(NEAR_Z, yawObj.position.z));

  var speed = mv.length();
  camera.position.y = Math.sin(performance.now()*0.012) * (speed > 0 ? 0.035 : 0.006);

  flicker.position.set(0, 3.6, yawObj.position.z - 3);
  flicker.intensity = 1.4 + Math.sin(performance.now()*0.01)*0.4 + (Math.random() < 0.02 ? -1 : 0);
}

// ================= zombie AI =================
function updateZombies(dt){
  for (var i = 0; i < zombies.length; i++) {
    var z = zombies[i];
    if (!z.alive) continue;
    var g = z.group;
    var dx = yawObj.position.x - g.position.x;
    var dz = yawObj.position.z - g.position.z;
    var dist = Math.sqrt(dx*dx + dz*dz);
    if (dist > 1.1) {
      var nx = dx/dist, nz = dz/dist;
      g.position.x += nx * z.speed * dt;
      g.position.z += nz * z.speed * dt;
      g.rotation.y = Math.atan2(nx, nz);
      z.bobPhase += dt * (z.isRunner ? 14 : 7);
      z.legL.rotation.x = Math.sin(z.bobPhase)*0.55;
      z.legR.rotation.x = -Math.sin(z.bobPhase)*0.55;
      z.armL.rotation.x = -Math.sin(z.bobPhase)*0.35 + 0.35;
      z.armR.rotation.x = Math.sin(z.bobPhase)*0.35 + 0.35;
      g.rotation.z = Math.sin(z.bobPhase*0.5) * (z.isRunner ? 0.05 : 0.12);
      g.position.y = Math.abs(Math.sin(z.bobPhase)) * (z.isRunner ? 0.06 : 0.03);
    } else {
      z.attackCD -= dt;
      if (z.attackCD <= 0) {
        z.attackCD = 1.0;
        damagePlayer(8 + wave);
      }
    }
  }
}

// ================= main loop =================
var lastT = performance.now();
function loop(){
  var now = performance.now();
  var dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (gameStarted && !gameOver) {
    updatePlayer(dt);
    updateZombies(dt);
  }
  if (shakeAmt > 0.001) {
    camera.rotation.z = (Math.random()-0.5) * shakeAmt;
    pitchObj.rotation.x += (Math.random()-0.5) * shakeAmt * 0.3;
    shakeAmt *= 0.85;
  } else {
    camera.rotation.z = 0;
  }
  for (var i = 0; i < lampFixtures.length; i++) {
    lampFixtures[i].intensity = 0.9 + Math.sin(now*0.002 + i)*0.3;
  }

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
updateAmmoHUD();

})();
</script>
