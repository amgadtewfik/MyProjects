<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Subway Station — FPS</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#000;font-family:'Courier New',monospace;color:#eee;}
  #c{position:fixed;top:0;left:0;width:100%;height:100%;display:block;}
  #hud{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;}
  #crosshair{position:absolute;top:50%;left:50%;width:20px;height:20px;margin:-10px 0 0 -10px;}
  #crosshair:before,#crosshair:after{content:'';position:absolute;background:rgba(255,255,255,0.85);}
  #crosshair:before{left:9px;top:0;width:2px;height:20px;}
  #crosshair:after{top:9px;left:0;width:20px;height:2px;}
  #bottomLeft{position:absolute;bottom:20px;left:20px;font-size:20px;text-shadow:0 0 4px #000;}
  #bottomLeft div{margin-bottom:6px;}
  #healthBarBg{width:220px;height:16px;border:1px solid #888;background:#222;}
  #healthBarFill{height:100%;background:#c0392b;width:100%;transition:width .15s;}
  #panel{position:absolute;top:16px;left:16px;pointer-events:auto;background:rgba(10,10,12,0.7);border:1px solid #444;padding:10px 14px;border-radius:4px;font-size:13px;max-width:260px;}
  #panel label{display:block;margin:6px 0 2px;}
  #panel input[type=range]{width:100%;}
  #blocker{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;pointer-events:auto;z-index:10;}
  #blocker h1{font-size:28px;letter-spacing:2px;margin-bottom:6px;color:#e74c3c;}
  #blocker p{max-width:440px;line-height:1.5;color:#ccc;font-size:14px;}
  #startBtn{margin-top:18px;padding:12px 26px;font-size:16px;background:#c0392b;border:none;color:#fff;cursor:pointer;letter-spacing:1px;border-radius:3px;}
  #startBtn:hover{background:#e74c3c;}
  #hitFlash{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(200,0,0,0.35);opacity:0;pointer-events:none;transition:opacity .3s;}
  #modeTag{position:absolute;top:16px;right:16px;font-size:12px;color:#888;background:rgba(0,0,0,0.5);padding:4px 8px;border-radius:3px;}
  #topMsg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:34px;color:#e74c3c;text-shadow:0 0 8px #000;display:none;letter-spacing:3px;}
  #ammoLabel{font-size:15px;color:#ccc;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="crosshair"></div>
  <div id="bottomLeft">
    <div id="healthBarBg"><div id="healthBarFill"></div></div>
    <div id="ammoLabel">AMMO: <span id="ammoCount">18</span> / 126</div>
  </div>
  <div id="modeTag">MODE: EXPLORE (WASD to move)</div>
  <div id="topMsg">YOU DIED</div>
</div>
<div id="hitFlash"></div>
<div id="blocker">
  <h1>METRO STATION — LINE 4</h1>
  <p>A quiet, dimly lit subway platform. Walk around with <b>WASD</b> and look with the mouse.
  Adjust the brightness slider anytime. When you're ready, hit the button below to arm yourself —
  the tunnel isn't as empty as it looks.</p>
  <div id="panel" style="position:static;margin-top:14px;">
    <label>Brightness: <span id="brightVal">100</span>%</label>
    <input type="range" id="brightness" min="10" max="200" value="100">
  </div>
  <button id="startBtn">CLICK TO EXPLORE</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){

// ---------- basic setup ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070a);
scene.fog = new THREE.FogExp2(0x05070a, 0.028);

const camera = new THREE.PerspectiveCamera(72, window.innerWidth/window.innerHeight, 0.1, 200);
camera.position.set(0, 1.7, 10);

window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- procedural textures ----------
function makeTexture(draw, w=256,h=256, repX=1, repY=1){
  const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
  const ctx = cv.getContext('2d');
  draw(ctx,w,h);
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(repX,repY);
  return tex;
}

const wallTex = makeTexture((ctx,w,h)=>{
  ctx.fillStyle = '#cfd3d6'; ctx.fillRect(0,0,w,h);
  const tile = 32;
  for(let y=0;y<h;y+=tile){
    for(let x=0;x<w;x+=tile){
      const shade = 205 + Math.floor(Math.random()*30);
      ctx.fillStyle = `rgb(${shade},${shade+3},${shade+6})`;
      ctx.fillRect(x+1,y+1,tile-2,tile-2);
    }
  }
  ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth=1;
  for(let y=0;y<=h;y+=tile){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
  for(let x=0;x<=w;x+=tile){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
}, 512,512, 10, 2);

const floorTex = makeTexture((ctx,w,h)=>{
  ctx.fillStyle = '#3a3a3d'; ctx.fillRect(0,0,w,h);
  const tile = 64;
  for(let y=0;y<h;y+=tile){
    for(let x=0;x<w;x+=tile){
      const shade = 50 + Math.floor(Math.random()*20);
      ctx.fillStyle = `rgb(${shade},${shade},${shade+2})`;
      ctx.fillRect(x+1,y+1,tile-2,tile-2);
    }
  }
}, 512,512, 6, 20);

const ceilTex = makeTexture((ctx,w,h)=>{
  ctx.fillStyle = '#1c1e22'; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  for(let x=0;x<w;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
},256,256,10,3);

// ---------- lighting ----------
const ambient = new THREE.AmbientLight(0x40485a, 0.5);
scene.add(ambient);

const hemi = new THREE.HemisphereLight(0x445566, 0x0a0a0c, 0.35);
scene.add(hemi);

const ceilingLights = [];
function addCeilingLight(x,z){
  const fixtureGeo = new THREE.BoxGeometry(1.6,0.08,0.5);
  const fixtureMat = new THREE.MeshStandardMaterial({color:0x111111, emissive:0xfff2c8, emissiveIntensity:1.4});
  const fixture = new THREE.Mesh(fixtureGeo, fixtureMat);
  fixture.position.set(x, 4.35, z);
  scene.add(fixture);

  const light = new THREE.PointLight(0xffe8bf, 1.6, 14, 2);
  light.position.set(x, 4.1, z);
  light.castShadow = true;
  light.shadow.mapSize.set(512,512);
  scene.add(light);
  ceilingLights.push({light, fixture, baseIntensity:1.6, flickerSeed:Math.random()*10});
}
for(let z=-18; z<=18; z+=6){ addCeilingLight(-3.2, z); addCeilingLight(3.2, z); }

// track pit glow (subtle red for atmosphere)
const trackGlow = new THREE.PointLight(0xaa3322, 0.6, 10);
trackGlow.position.set(0, 0.3, -25);
scene.add(trackGlow);

// ---------- geometry: platform ----------
const ROOM_LEN = 44, PLAT_WIDTH = 8, WALL_H = 4.4;

const floorMat = new THREE.MeshStandardMaterial({map:floorTex, roughness:0.9});
const floor = new THREE.Mesh(new THREE.BoxGeometry(PLAT_WIDTH, 0.4, ROOM_LEN), floorMat);
floor.position.set(0,-0.2,0);
floor.receiveShadow = true;
scene.add(floor);

// platform edge (yellow safety strip)
const stripMat = new THREE.MeshStandardMaterial({color:0xd8b400, roughness:0.6});
const strip = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.42,ROOM_LEN), stripMat);
strip.position.set(-PLAT_WIDTH/2+0.15, -0.19, 0);
scene.add(strip);

// track pit
const pitMat = new THREE.MeshStandardMaterial({color:0x0c0c0e, roughness:1});
const pit = new THREE.Mesh(new THREE.BoxGeometry(4.5,0.6,ROOM_LEN), pitMat);
pit.position.set(-PLAT_WIDTH/2-2.4, -0.5, 0);
scene.add(pit);
// rails
const railMat = new THREE.MeshStandardMaterial({color:0x666a6e, metalness:0.7, roughness:0.35});
[-1,1].forEach(s=>{
  const rail = new THREE.Mesh(new THREE.BoxGeometry(0.1,0.08,ROOM_LEN), railMat);
  rail.position.set(-PLAT_WIDTH/2-2.4 + s*0.8, -0.19, 0);
  scene.add(rail);
});

// walls
const wallMat = new THREE.MeshStandardMaterial({map:wallTex, roughness:0.85});
const backWall = new THREE.Mesh(new THREE.BoxGeometry(PLAT_WIDTH+5, WALL_H, 0.4), wallMat);
backWall.position.set(1.2, WALL_H/2-0.2, ROOM_LEN/2);
backWall.receiveShadow = true;
scene.add(backWall);

const farWall = new THREE.Mesh(new THREE.BoxGeometry(0.4, WALL_H, ROOM_LEN), wallMat);
farWall.position.set(PLAT_WIDTH/2, WALL_H/2-0.2, 0);
scene.add(farWall);

// ceiling
const ceilMat = new THREE.MeshStandardMaterial({map:ceilTex, roughness:1});
const ceiling = new THREE.Mesh(new THREE.BoxGeometry(PLAT_WIDTH+5, 0.3, ROOM_LEN), ceilMat);
ceiling.position.set(1.2, WALL_H+0.1, 0);
scene.add(ceiling);

// tunnel openings (dark arches at both ends)
function makeTunnel(z){
  const arch = new THREE.Mesh(new THREE.BoxGeometry(4,3.2,4), new THREE.MeshStandardMaterial({color:0x030304}));
  arch.position.set(-PLAT_WIDTH/2-2.4, 1.2, z);
  scene.add(arch);
}
makeTunnel(ROOM_LEN/2+1.5);
makeTunnel(-ROOM_LEN/2-1.5);

// columns
const colMat = new THREE.MeshStandardMaterial({color:0xb9bcbe, roughness:0.7});
const columns = [];
for(let z=-15; z<=15; z+=7.5){
  const col = new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.4,WALL_H,16), colMat);
  col.position.set(2.3, WALL_H/2-0.2, z);
  col.castShadow = true;
  scene.add(col);
  columns.push(col);
}

// benches
const benchMat = new THREE.MeshStandardMaterial({color:0x2c3e50, roughness:0.6});
for(let z=-12; z<=12; z+=12){
  const seat = new THREE.Mesh(new THREE.BoxGeometry(2.4,0.12,0.6), benchMat);
  seat.position.set(0.6, 0.45, z);
  scene.add(seat);
  [-1,1].forEach(s=>{
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.08,0.45,0.5), benchMat);
    leg.position.set(0.6+s*1.05, 0.22, z);
    scene.add(leg);
  });
}

// signage (emissive strip)
function makeSign(z){
  const signMat = new THREE.MeshStandardMaterial({color:0x111, emissive:0x2aa198, emissiveIntensity:1.2});
  const sign = new THREE.Mesh(new THREE.BoxGeometry(2.2,0.5,0.08), signMat);
  sign.position.set(1.1, 3.0, z);
  scene.add(sign);
}
[-16,-4,8,20].forEach(makeSign);

// ---------- brightness control ----------
let brightnessMul = 1.0;
function applyBrightness(){
  ambient.intensity = 0.5*brightnessMul;
  hemi.intensity = 0.35*brightnessMul;
  ceilingLights.forEach(c=>{ c.light.intensity = c.baseIntensity*brightnessMul; });
}
document.getElementById('brightness').addEventListener('input', e=>{
  brightnessMul = e.target.value/100;
  document.getElementById('brightVal').textContent = e.target.value;
  applyBrightness();
});
applyBrightness();

// ---------- pointer lock / movement ----------
let yaw = 0, pitch = 0;
const keys = {};
document.addEventListener('keydown', e=>keys[e.code]=true);
document.addEventListener('keyup', e=>keys[e.code]=false);

const blocker = document.getElementById('blocker');
document.getElementById('startBtn').addEventListener('click', ()=>{
  document.body.requestPointerLock();
});
document.addEventListener('pointerlockchange', ()=>{
  if(document.pointerLockElement === document.body){
    blocker.style.display = 'none';
  } else if(!gameOver){
    blocker.style.display = 'flex';
  }
});
document.addEventListener('mousemove', e=>{
  if(document.pointerLockElement !== document.body) return;
  yaw -= e.movementX*0.0022;
  pitch -= e.movementY*0.0022;
  pitch = Math.max(-1.3, Math.min(1.3, pitch));
});

const playerBounds = {minX:-PLAT_WIDTH/2+0.9, maxX:PLAT_WIDTH/2-0.4, minZ:-ROOM_LEN/2+1.5, maxZ:ROOM_LEN/2-1.5};
const velocity = new THREE.Vector3();
let bobTime = 0;

function updateMovement(dt){
  const speed = 4.2;
  const forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)).multiplyScalar(-1);
  const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
  const move = new THREE.Vector3();
  if(keys['KeyW']) move.add(forward);
  if(keys['KeyS']) move.sub(forward);
  if(keys['KeyD']) move.add(right);
  if(keys['KeyA']) move.sub(right);
  let moving = false;
  if(move.lengthSq()>0){
    move.normalize().multiplyScalar(speed*dt);
    camera.position.x += move.x;
    camera.position.z += move.z;
    moving = true;
  }
  camera.position.x = Math.max(playerBounds.minX, Math.min(playerBounds.maxX, camera.position.x));
  camera.position.z = Math.max(playerBounds.minZ, Math.min(playerBounds.maxZ, camera.position.z));

  // simple column collision push-out
  columns.forEach(col=>{
    const dx = camera.position.x - col.position.x;
    const dz = camera.position.z - col.position.z;
    const dist = Math.sqrt(dx*dx+dz*dz);
    const minDist = 0.75;
    if(dist < minDist && dist>0.0001){
      const push = (minDist-dist)/dist;
      camera.position.x += dx*push;
      camera.position.z += dz*push;
    }
  });

  bobTime += moving ? dt*9 : dt*2;
  const bobY = moving ? Math.sin(bobTime)*0.035 : Math.sin(bobTime)*0.008;
  camera.position.y = 1.7 + bobY;

  camera.rotation.order = 'YXZ';
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  return moving;
}

// ---------- audio (synth, no external files) ----------
let actx;
function ensureAudio(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); }

function playGunshot(){
  ensureAudio();
  const dur = 0.16;
  const buffer = actx.createBuffer(1, actx.sampleRate*dur, actx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<data.length;i++){ data[i] = (Math.random()*2-1) * Math.pow(1-i/data.length, 2); }
  const noise = actx.createBufferSource();
  noise.buffer = buffer;
  const filter = actx.createBiquadFilter();
  filter.type = 'lowpass'; filter.frequency.value = 2400;
  const gain = actx.createGain();
  gain.gain.setValueAtTime(0.9, actx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, actx.currentTime+dur);
  noise.connect(filter).connect(gain).connect(actx.destination);
  noise.start();

  const osc = actx.createOscillator();
  osc.type='square'; osc.frequency.setValueAtTime(140, actx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(40, actx.currentTime+0.08);
  const og = actx.createGain(); og.gain.setValueAtTime(0.5, actx.currentTime);
  og.gain.exponentialRampToValueAtTime(0.01, actx.currentTime+0.09);
  osc.connect(og).connect(actx.destination);
  osc.start(); osc.stop(actx.currentTime+0.1);
}

function playGrowl(){
  ensureAudio();
  const osc = actx.createOscillator();
  osc.type='sawtooth';
  osc.frequency.setValueAtTime(70+Math.random()*30, actx.currentTime);
  osc.frequency.linearRampToValueAtTime(35, actx.currentTime+0.4);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, actx.currentTime);
  g.gain.linearRampToValueAtTime(0.25, actx.currentTime+0.05);
  g.gain.linearRampToValueAtTime(0.0001, actx.currentTime+0.45);
  osc.connect(g).connect(actx.destination);
  osc.start(); osc.stop(actx.currentTime+0.5);
}

function playHit(){
  ensureAudio();
  const osc = actx.createOscillator();
  osc.type='square';
  osc.frequency.setValueAtTime(220, actx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(60, actx.currentTime+0.12);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.3, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.01, actx.currentTime+0.12);
  osc.connect(g).connect(actx.destination);
  osc.start(); osc.stop(actx.currentTime+0.13);
}

// ---------- weapon ----------
const weaponGroup = new THREE.Group();
const gunMat = new THREE.MeshStandardMaterial({color:0x1b1b1d, metalness:0.6, roughness:0.4});
const gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.1,0.12,0.55), gunMat);
gunBody.position.set(0.28,-0.22,-0.55);
weaponGroup.add(gunBody);
const gunGrip = new THREE.Mesh(new THREE.BoxGeometry(0.08,0.2,0.09), gunMat);
gunGrip.position.set(0.28,-0.34,-0.32);
weaponGroup.add(gunGrip);
const gunBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,0.28,10), gunMat);
gunBarrel.rotation.x = Math.PI/2;
gunBarrel.position.set(0.28,-0.19,-0.86);
weaponGroup.add(gunBarrel);
camera.add(weaponGroup);
scene.add(camera);

const muzzleLight = new THREE.PointLight(0xffcc66, 0, 6, 2);
muzzleLight.position.copy(gunBarrel.position).add(new THREE.Vector3(0,0,-0.2));
weaponGroup.add(muzzleLight);

const flashMat = new THREE.SpriteMaterial({color:0xffd27f, transparent:true, opacity:0});
const flashSprite = new THREE.Sprite(flashMat);
flashSprite.scale.set(0.25,0.25,0.25);
flashSprite.position.copy(gunBarrel.position).add(new THREE.Vector3(0,0,-0.25));
weaponGroup.add(flashSprite);

let recoilT = 0;
function fireRecoil(){ recoilT = 1; }
function updateWeapon(dt, moving){
  const swayX = Math.sin(bobTime*0.5)*0.01;
  const swayY = moving ? Math.abs(Math.sin(bobTime))*0.02 : Math.sin(bobTime*0.5)*0.004;
  weaponGroup.position.set(swayX, -swayY, 0);
  if(recoilT>0){
    recoilT -= dt*6;
    if(recoilT<0) recoilT=0;
    weaponGroup.position.z = recoilT*0.12;
    weaponGroup.rotation.x = -recoilT*0.25;
  } else {
    weaponGroup.position.z = 0;
    weaponGroup.rotation.x = 0;
  }
  muzzleLight.intensity = Math.max(0, muzzleLight.intensity - dt*18);
  flashMat.opacity = Math.max(0, flashMat.opacity - dt*14);
}

// ---------- tracers ----------
const tracers = [];
function spawnTracer(from, to){
  const geo = new THREE.BufferGeometry().setFromPoints([from, to]);
  const mat = new THREE.LineBasicMaterial({color:0xfff2b0, transparent:true, opacity:0.95});
  const line = new THREE.Line(geo, mat);
  scene.add(line);
  tracers.push({line, life:0.06});
}
function updateTracers(dt){
  for(let i=tracers.length-1;i>=0;i--){
    const t = tracers[i];
    t.life -= dt;
    t.line.material.opacity = Math.max(0, t.life/0.06)*0.95;
    if(t.life<=0){ scene.remove(t.line); t.line.geometry.dispose(); t.line.material.dispose(); tracers.splice(i,1); }
  }
}

// ---------- game state ----------
let fpsMode = false;
let gameOver = false;
let playerHealth = 100;
let ammo = 18, reserve = 126;
const zombies = [];
const raycaster = new THREE.Raycaster();

function updateHUD(){
  document.getElementById('healthBarFill').style.width = Math.max(0,playerHealth)+'%';
  document.getElementById('ammoCount').textContent = ammo;
}

function enterFpsMode(){
  fpsMode = true;
  document.getElementById('modeTag').textContent = 'MODE: FPS — hostiles inbound';
  spawnTimer = 1.5;
}

// ---------- zombies ----------
function makeZombie(){
  const g = new THREE.Group();
  const skinMat = new THREE.MeshStandardMaterial({color:0x5a6e4f, roughness:0.9});
  const clothMat = new THREE.MeshStandardMaterial({color:0x35342e, roughness:0.95});

  const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.26,0.3,0.85,10), clothMat);
  torso.position.y = 1.05;
  torso.castShadow = true;
  g.add(torso);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.22,12,10), skinMat);
  head.position.y = 1.65;
  head.castShadow = true;
  g.add(head);
  g.userData.head = head;

  const armGeo = new THREE.CylinderGeometry(0.08,0.08,0.65,8);
  const armL = new THREE.Mesh(armGeo, skinMat); armL.position.set(-0.36,1.05,0); armL.rotation.z = 0.5;
  const armR = new THREE.Mesh(armGeo, skinMat); armR.position.set(0.36,1.05,0); armR.rotation.z = -0.5;
  g.add(armL, armR);
  g.userData.armL = armL; g.userData.armR = armR;

  const legGeo = new THREE.CylinderGeometry(0.1,0.1,0.75,8);
  const legL = new THREE.Mesh(legGeo, clothMat); legL.position.set(-0.13,0.4,0);
  const legR = new THREE.Mesh(legGeo, clothMat); legR.position.set(0.13,0.4,0);
  g.add(legL, legR);
  g.userData.legL = legL; g.userData.legR = legR;

  g.userData.hp = 3;
  g.userData.speed = 0.7 + Math.random()*0.6;
  g.userData.alive = true;
  g.userData.attackCd = 0;
  g.userData.walkPhase = Math.random()*10;
  return g;
}

let spawnTimer = 3;
let waveCount = 0;
function spawnZombie(){
  const z = makeZombie();
  const side = Math.random()<0.5 ? 1 : -1;
  const spawnZ = side * (ROOM_LEN/2 + 1);
  z.position.set(-PLAT_WIDTH/2-2.2 + Math.random()*1.5, 0, spawnZ);
  scene.add(z);
  zombies.push(z);
}

function updateZombies(dt){
  const playerPos = camera.position;
  for(let i=zombies.length-1;i>=0;i--){
    const z = zombies[i];
    if(!z.userData.alive) continue;
    const dx = playerPos.x - z.position.x;
    const dz = playerPos.z - z.position.z;
    const dist = Math.sqrt(dx*dx+dz*dz);
    if(dist > 1.1){
      const nx = dx/dist, nz = dz/dist;
      z.position.x += nx * z.userData.speed * dt;
      z.position.z += nz * z.userData.speed * dt;
      z.rotation.y = Math.atan2(nx, nz);
      z.userData.walkPhase += dt*6;
      const swing = Math.sin(z.userData.walkPhase)*0.5;
      z.userData.legL.rotation.x = swing;
      z.userData.legR.rotation.x = -swing;
      z.userData.armL.rotation.x = -swing*0.6;
      z.userData.armR.rotation.x = swing*0.6;
    } else {
      z.userData.attackCd -= dt;
      if(z.userData.attackCd<=0){
        z.userData.attackCd = 1.0;
        playerHealth -= 8;
        flashHit();
        if(playerHealth<=0 && !gameOver) endGame(false);
      }
    }
    if(Math.random()<0.002) playGrowl();
  }
}

function flashHit(){
  const el = document.getElementById('hitFlash');
  el.style.opacity = 0.5;
  setTimeout(()=>{ el.style.opacity = 0; }, 150);
  updateHUD();
}

function endGame(won){
  gameOver = true;
  document.exitPointerLock();
  const msg = document.getElementById('topMsg');
  msg.textContent = won ? 'AREA CLEARED' : 'YOU DIED';
  msg.style.color = won ? '#2ecc71' : '#e74c3c';
  msg.style.display = 'block';
}

// ---------- shooting ----------
function shoot(){
  if(!fpsMode || gameOver) return;
  if(ammo<=0){ return; }
  ammo--; updateHUD();
  fireRecoil();
  muzzleLight.intensity = 3.2;
  flashMat.opacity = 1;
  playGunshot();

  raycaster.setFromCamera({x:0,y:0}, camera);
  const meshes = [];
  zombies.forEach(z=>{ if(z.userData.alive) z.traverse(o=>{ if(o.isMesh){ o.userData.owner = z; meshes.push(o); } }); });
  const hits = raycaster.intersectObjects(meshes, false);

  const from = new THREE.Vector3();
  gunBarrel.getWorldPosition(from);
  let to;
  if(hits.length>0){
    to = hits[0].point;
    const zombie = hits[0].object.userData.owner;
    zombie.userData.hp -= 1;
    playHit();
    if(zombie.userData.hp<=0 && zombie.userData.alive){
      zombie.userData.alive = false;
      scene.remove(zombie);
      zombies.splice(zombies.indexOf(zombie),1);
      waveCount++;
    }
  } else {
    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    to = from.clone().add(dir.multiplyScalar(40));
  }
  spawnTracer(from, to);
}

document.addEventListener('mousedown', e=>{
  if(e.button===0 && document.pointerLockElement===document.body) shoot();
});
document.addEventListener('keydown', e=>{
  if(e.code==='KeyR' && fpsMode){
    const need = 18-ammo;
    const take = Math.min(need, reserve);
    ammo += take; reserve -= take; updateHUD();
  }
});

// transition: after exploring, clicking start a second time (or pressing F) enters FPS
document.addEventListener('keydown', e=>{
  if(e.code==='KeyF' && !fpsMode && document.pointerLockElement===document.body){
    enterFpsMode();
  }
});
document.getElementById('startBtn').addEventListener('click', ()=>{
  // second click after already unlocked & explored triggers fps if desired later; handled by F key
});

// show a hint about F key
const hint = document.createElement('div');
hint.style.position='absolute'; hint.style.bottom='20px'; hint.style.right='20px';
hint.style.fontSize='12px'; hint.style.color='#999'; hint.textContent='Press F to arm up and start the encounter · Left click to fire · R to reload';
document.getElementById('hud').appendChild(hint);

updateHUD();

// ---------- render loop ----------
let last = performance.now();
function animate(){
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min(0.05,(now-last)/1000);
  last = now;

  if(!gameOver){
    const moving = updateMovement(dt);
    updateWeapon(dt, moving);
  }
  updateTracers(dt);

  // ceiling light flicker
  const t = now*0.001;
  ceilingLights.forEach(c=>{
    const flicker = 0.92 + 0.08*Math.sin(t*6 + c.flickerSeed) + (Math.random()<0.01 ? -0.4 : 0);
    c.light.intensity = c.baseIntensity*brightnessMul*Math.max(0.4,flicker);
  });

  if(fpsMode && !gameOver){
    spawnTimer -= dt;
    if(spawnTimer<=0 && zombies.length<10){
      spawnZombie();
      spawnTimer = Math.max(0.8, 2.2 - waveCount*0.05);
    }
    updateZombies(dt);
  }

  renderer.render(scene, camera);
}
animate();

})();
</script>
