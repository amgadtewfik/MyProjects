<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUBWAY PROTOCOL: FPS</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; }
        #ui { position: absolute; top: 20px; left: 20px; color: #0f0; pointer-events: none; text-shadow: 2px 2px #000; }
        #crosshair { 
            position: absolute; top: 50%; left: 50%; 
            width: 10px; height: 10px; 
            border: 2px solid rgba(0, 255, 0, 0.5); 
            border-radius: 50%; transform: translate(-50%, -50%); 
            pointer-events: none;
        }
        #controls {
            position: absolute; bottom: 20px; left: 20px;
            background: rgba(0,0,0,0.7); padding: 15px; color: white; border: 1px solid #444;
        }
        input[type=range] { width: 200px; cursor: pointer; }
        #msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; text-align: center; }
    </style>
</head>
<body>

<div id="ui">
    <div style="font-size: 24px;">AMMO: <span id="ammo-val">30</span> / ∞</div>
    <div>HEALTH: <span id="hp-val">100</span></div>
</div>

<div id="crosshair"></div>

<div id="controls">
    <label>STATION LIGHTING</label><br>
    <input type="range" id="lightSlider" min="0.1" max="3" step="0.1" value="1"><br>
    <small>WASD to Move | Click to Shoot | Mouse to Look</small>
</div>

<div id="msg"><h1>CLICK TO START SESSION</h1><p>WASD to Move | Mouse to Aim & Shoot</p></div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

// --- CONFIG & GLOBALS ---
let scene, camera, renderer, controls, clock;
let ambientLight, directionalLight, pointLight;
let gun, flash;
let ammo = 30;
let moveForward = false, moveBackward = false, moveLeft = false, moveRight=false;
const velocity = new THREE.Vector3();
const direction = new THREE.Vector3();
const enemies = [];

// --- INITIALIZATION ---
function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020202);
    scene.fog = new THREE.FogExp2(0x020202, 0.05);

    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.y = 1.7; // Human height

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    controls = new PointerLockControls(camera, document.body);

    // Listeners
    document.addEventListener('click', () => {
        if (!controls.isLocked) {
            controls.lock();
            document.getElementById('msg').style.display = 'none';
        } else {
            shoot();
        }
    });

    document.addEventListener('keydown', (e) => {
        if(e.code === 'KeyW') moveForward = true;
        if(e.code === 'KeyS') moveBack = true; // Fixed typo below
        if(e.code === 'KeyA') moveLeft = true;
        if(e.code === 'KeyD') moveRight = true;
    });
    // Re-mapping keys for standard WASD
    window.addEventListener('keydown', (e) => {
        switch(e.code) {
            case 'KeyW': moveForward = true; break;
            case 'KeyS': moveBackward = true; break;
            case 'KeyA': moveLeft = true; break;
            case 'KeyD': moveRight = true; break;
        }
    });
    window.addEventListener('keyup', (e) => {
        switch(e.code) {
            case 'KeyW': moveForward = false; break;
            case 'KeyS': moveBackward = false; break;
            case 'KeyA': moveLeft = false; break;
            case 'KeyD': moveRight = false; break;
        }
    });

    setupLighting();
    buildSubway();
    createWeapon();
    spawnEnemies();
    clock = new THREE.Clock();
    animate();
}

// --- LIGHTING SYSTEM ---
function setupLighting() {
    ambientLight = new THREE.AmbientLight(0x404040, 0.5);
    scene.add(ambientLight);

    directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
    directionalLight.position.set(5, 10, 7);
    scene.add(directionalLight);

    // Brightness Slider logic
    document.getElementById('lightSlider').addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        ambientLight.intensity = val * 0.5;
        directionalLight.intensity = val;
    });
}

// --- PROCEDURAL ENVIRONMENT ---
function buildSubway() {
    // Floor: Concrete texture feel
    const floorGeo = new THREE.PlaneGeometry(100, 100);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.1, metalness: 0.5 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Walls (The Station)
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
    
    // Left Wall (Tracks side)
    const wallL = new THREE.Mesh(new THREE.PlaneGeometry(20, 10), wallMat);
    wallL.position.set(-10, 5, -20);
    wallL.rotation.y = Math.PI / 2;
    scene.add(wallL);

    // Right Wall (Platform side)
    const wallR = new THREE.Mesh(new THREE.PlaneGeometry(20, 10), wallMat);
    wallR.position.set(10, 5, -20);
    wallR.rotation.y = -Math.PI / 2;
    scene.add(wallR);

    // Pillars
    for(let i = -40; i < 40; i += 15) {
        const pillar = new THREE.Mesh(new THREE.BoxGeometry(2, 10, 2), wallMat);
        pillar.position.set(5, 5, i);
        pillar.castShadow = true;
        scene.add(pillar);
    }

    // Ceiling
    const ceil = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), wallMat);
    ceil.position.y = 8;
    ceil.rotation.x = Math.PI / 2;
    scene.add(ceil);

    // Add some "industrial" details (Yellow lines)
    const yellowLineGeo = new THREE.PlaneGeometry(0.5, 100);
    const yellowLineMat = new THREE.MeshStandardMaterial({ color: 0xffcc00 });
    const line = new THREE.Mesh(yellowLineGeo, new THREE.MeshStandardMaterial({color: 0xaa8800}));
    line.rotation.x = -Math.PI/2;
    line.position.set(-2, 0.01, -20);
    scene.add(line);
}

// --- WEAPON SYSTEM ---
function createWeapon() {
    const gunGroup = new THREE.Group();
    
    // Gun Body
    const body = new THREE.Mesh(
        new THREE.BoxGeometry(0.15, 0.2, 0.5),
        new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.2 })
    );
    gunGroup.add(body);

    // Muzzle Flash (Hidden initially)
    const flashGeo = new THREE.SphereGeometry(0.1, 8, 8);
    const flashMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0 });
    flash = new THREE.Mesh(flashGeo, flashMat);
    flash.position.z = 0.3;
    gunGroup.add(flash);

    scene.add(gunGroup);
    gun = gunGroup;
}

function shoot() {
    if (ammo <= 0) return;
    ammo--;
    document.getElementById('ammo-val').innerText = ammo;

    // 1. Recoil
    const recoilAmount = 0.05;
    camera.position.y += 0.02; 
    gun.position.z += 0.1;

    // 2. Muzzle Flash
    flash.material.opacity = 1;
    
    // 3. Tracer (Visual Line)
    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
    const intersects = raycaster.intersectObjects(enemies);

    if (intersects.length > 0) {
        const target = intersects[0].object;
        target.material.color.set(0xff0000); // Hit feedback
        setTimeout(() => target.material.color.set(0x330000), 100);
    }

    // Create Tracer Line
    const tracerGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0,0,0), 
        new THREE.Vector3(0,0, -10)
    ]);
    // We'll use a more dynamic approach for tracers
    const tracerMat = new THREE.LineBasicMaterial({ color: 0xffff00 });
    const tracer = new THREE.Line(tracerGeo, tracerMat);
    
    // Position tracer at gun
    const gunWorldPos = new THREE.Vector3();
    gun.getWorldPosition(gunWorldPos);
    
    // Simplified tracer effect:
    const targetDir = new THREE.Vector3();
    camera.getWorldDirection(targetDir);
    const endPoint = gunWorldPos.clone().add(targetDir.multiplyScalar(50));
    
    const lineGeo = new THREE.BufferGeometry().setFromPoints([gunWorldPos, endPoint]);
    const material = new THREE.LineBasicMaterial({color: 0xffcc00, transparent: true, opacity: 0.8});
    const line = new THREE.Line(lineGeo, material);
    scene.add(line);
    setTimeout(() => scene.remove(line), 50);

    // Reset visuals
    setTimeout(() => {
        flash.material.opacity = 0;
        gun.position.z = 0;
    }, 50);
}

// --- ENEMIES ---
function spawnEnemies() {
    const enemyGeo = new THREE.CapsuleGeometry(0.5, 1, 4, 8);
    const enemyMat = new THREE.MeshStandardMaterial({ color: 0x440000 });

    for(let i = 0; i < 5; i++) {
        const enemy = new THREE.Mesh(enemyGeo, enemyMat);
        enemy.position.set(Math.random() * 10 - 5, 1, -20 - (i * 10));
        scene.add(enemy);
        enemies.push(enemy);
    }
}

// --- CORE LOOP ---
function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();

    if (controls.isLocked) {
        // Movement Logic
        velocity.x -= velocity.x * 10.0 * delta;
        velocity.z -= velocity.z * 10.0 * delta;

        direction.z = Number(moveForward) - Number(moveBackward);
        direction.x = Number(moveRight) - Number(moveLeft);
        direction.normalize();

        if (moveForward || moveBackward) velocity.z -= direction.z * 40.0 * delta;
        if (moveLeft || moveRight) velocity.x -= direction.x * 40.0 * delta;

        controls.moveRight(-velocity.x * delta);
        controls.moveForward(-velocity.z * delta);

        // Weapon Follow Camera
        gun.position.copy(camera.position);
        gun.quaternion.copy(camera.quaternion);
        gun.updateMatrix();
        gun.translateZ(-0.4);
        gun.translateX(0.3);
        gun.translateY(-0.2);
    }

    // Enemy AI (Simple walk towards player)
    enemies.forEach(en => {
        const dir = new THREE.Vector3().subVectors(camera.position, en.position).normalize();
        en.position.x += dir.x * 0.02;
        en.position.z += dir.z * 0.02;
        en.lookAt(camera.position.x, 1, camera.position.z);
    });

    renderer.render(scene, camera);
}

// Start
init();

</script>
</body>
</html>
