<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earth from Space</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: Arial, sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #info {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.6); font-size: 14px; text-align: center;
            pointer-events: none; user-select: none;
        }
    </style>
</head>
<body>
    <div id="info">🌍 Earth from Space — Drag to orbit • Scroll to zoom</div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // ============================================================
        // SCENE SETUP
        // ============================================================
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, -3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ReinhardToneMapping;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 1.5;
        controls.maxDistance = 10;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;

        // ============================================================
        // STARFIELD
        // ============================================================
        const starCount = 8000;
        const starsGeometry = new THREE.BufferGeometry();
        const positions = [];
        const colors = [];
        for (let i = 0; i < starCount; i++) {
            const r = 50 + Math.random() * 150;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            positions.push(r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi));

            // Subtle color variation for stars
            const starType = Math.random();
            if (starType < 0.7) { colors.push(1, 1, 1); }
            else if (starType < 0.85) { colors.push(0.8, 0.9, 1); }
            else { colors.push(1, 0.8, 0.6); }
        }
        starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        starsGeometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

        const starMaterial = new THREE.PointsMaterial({ size: 0.5, vertexColors: true, transparent: true, opacity: 0.8 });
        scene.add(new THREE.Points(starsGeometry, starMaterial));

        // ============================================================
        // EARTH SHADER (Procedural Earth)
        // ============================================================
        const earthVertexShader = `
            varying vec2 vUv;
            varying vec3 vNormal;
            varying vec3 vPosition;
            void main() {
                vUv = uv;
                vNormal = normalize(normalMatrix * normal);
                vPosition = (modelViewMatrix * vec4(position, 1.0)).xyz;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        const earthFragmentShader = `
            uniform float time;
            varying vec2 vUv;
            varying vec3 vNormal;
            varying vec3 vPosition;

            // Simplex-like noise functions
            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 permute(vec4 y) { return mod289(((y*34.0)+1.0)*y); }

            float snoise(vec3 v) {
                const vec2 C = vec2(1.0/6.0, 1.0/3.0);
                vec3 x = floor(v + (v.y+v.x)*C.x);
                vec3 dx = v - x;
                float n = dot(x, vec3(1.0, 5.0, 2.0));
                vec3 p = mod289(vec3(n/34.0));
                float a = fract(p * (1.0/5.0)) * 0.5 + 0.5;
                float b = fract(p * (1.0/7.0)) * 0.5 + 0.5;
                float c = fract(p * (1.0/11.0)) * 0.5 + 0.5;
                vec3 o = vec3(a, b, c);
                return mix(mix(mix(n*o.x, n*o.y), mix(n*o.z, n*o.w, o.x), o.y),
                           mix(mix(n*o.z, n*o.w, o.x), mix(n*o.w, n*o.v, o.x), o.y), o.z);
            }

            float noise(vec3 x) { return snoise(x * 0.15); }

            void main() {
                vec3 worldPos = vPosition;
                vec3 norm = normalize(vNormal);

                // Procedural Earth surface
                float n1 = noise(worldPos * 2.0 + time * 0.01);
                float n2 = noise(worldPos * 4.0 + time * 0.005);
                float continent = smoothstep(0.3, 0.7, n1 + n2 * 0.5);

                // Ocean color (deep blue)
                vec3 oceanColor = vec3(0.02, 0.08, 0.25);
                // Land colors (greens and browns)
                float landNoise = noise(worldPos * 6.0 + time * 0.003);
                vec3 landColor = mix(vec3(0.15, 0.45, 0.2), vec3(0.35, 0.55, 0.25), landNoise);

                // Polar ice caps
                float latitude = abs(normalize(worldPos).y);
                float polarCap = smoothstep(0.7, 0.9, latitude);
                vec3 iceColor = vec3(0.85, 0.9, 1.0);

                // Combine surface
                vec3 surfaceColor = mix(oceanColor, landColor, continent);
                surfaceColor = mix(surfaceColor, iceColor, polarCap);

                // Cloud layer (slightly transparent)
                float cloudNoise = noise(worldPos * 3.0 + time * 0.02);
                float clouds = smoothstep(0.4, 0.8, cloudNoise);
                vec3 cloudColor = vec3(0.95, 0.97, 1.0);

                // Lighting from sun direction
                vec3 sunDir = normalize(vec3(-1.0, 0.2, -1.0));
                float diff = max(dot(norm, sunDir), 0.0);

                // Ambient light (very dim)
                vec3 ambientColor = vec3(0.05, 0.06, 0.1);
                vec3 litColor = surfaceColor * (ambientColor + vec3(diff));

                // Add clouds on top
                float cloudAlpha = clouds * 0.7;
                vec3 finalColor = mix(litColor, cloudColor * (ambientColor + vec3(diff)), cloudAlpha);

                // Fresnel-like rim for atmosphere hint
                float fresnel = pow(1.0 - dot(norm, normalize(vec3(camera.position - worldPos))), 2.0);
                vec3 atmosHint = vec3(0.3, 0.5, 1.0) * fresnel * 0.3;

                gl_FragColor = vec4(finalColor + atmosHint, 1.0);
            }
        `;

        const earthGeometry = new THREE.SphereGeometry(1, 64, 64);
        const earthMaterial = new THREE.ShaderMaterial({
            uniforms: { time: { value: 0 } },
            vertexShader: earthVertexShader,
            fragmentShader: earthFragmentShader
        });
        const earth = new THREE.Mesh(earthGeometry, earthMaterial);
        scene.add(earth);

        // ============================================================
        // ATMOSPHERE GLOW (Rim Shader)
        // ============================================================
        const atmosphereVertexShader = `
            varying vec3 vNormal;
            varying vec3 vPosition;
            void main() {
                vNormal = normalize(normalMatrix * normal);
                vPosition = (modelViewMatrix * vec4(position, 1.0)).xyz;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        const atmosphereFragmentShader = `
            uniform float time;
            varying vec3 vNormal;
            varying vec3 vPosition;

            void main() {
                vec3 worldPos = vPosition;
                vec3 norm = normalize(vNormal);
                vec3 viewDir = normalize(camera.position - worldPos);

                // Fresnel effect for atmosphere rim
                float fresnel = 1.0 - dot(norm, viewDir);
                fresnel = pow(fresnel, 3.0);

                // Atmospheric color (blue haze)
                vec3 atmosColor = mix(vec3(0.2, 0.5, 1.0), vec3(0.4, 0.7, 1.0), fresnel);
                float alpha = fresnel * 0.8;

                // Add subtle variation based on sun direction
                vec3 sunDir = normalize(vec3(-1.0, 0.2, -1.0));
                float sunFacing = max(dot(norm, sunDir), 0.0);
                alpha *= (0.6 + 0.4 * sunFacing);

                gl_FragColor = vec4(atmosColor, alpha);
            }
        `;

        const atmosphereGeometry = new THREE.SphereGeometry(1.02, 64, 64);
        const atmosphereMaterial = new THREE.ShaderMaterial({
            uniforms: { time: { value: 0 } },
            vertexShader: atmosphereVertexShader,
            fragmentShader: atmosphereFragmentShader,
            transparent: true,
            side: THREE.FrontSide,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });
        const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
        scene.add(atmosphere);

        // Outer glow layer
        const outerGlowVertexShader = `
            varying vec3 vNormal;
            varying vec3 vPosition;
            void main() {
                vNormal = normalize(normalMatrix * normal);
                vPosition = (modelViewMatrix * vec4(position, 1.0)).xyz;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        const outerGlowFragmentShader = `
            varying vec3 vNormal;
            varying vec3 vPosition;

            void main() {
                vec3 worldPos = vPosition;
                vec3 norm = normalize(vNormal);
                vec3 viewDir = normalize(camera.position - worldPos);

                float fresnel = 1.0 - dot(norm, viewDir);
                fresnel = pow(fresnel, 5.0);

                vec3 glowColor = vec3(0.3, 0.6, 1.0);
                float alpha = fresnel * 0.4;

                gl_FragColor = vec4(glowColor, alpha);
            }
        `;

        const outerGlowGeometry = new THREE.SphereGeometry(1.15, 32, 32);
        const outerGlowMaterial = new THREE.ShaderMaterial({
            vertexShader: outerGlowVertexShader,
            fragmentShader: outerGlowFragmentShader,
            transparent: true,
            side: THREE.BackSide,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });
        const outerGlow = new THREE.Mesh(outerGlowGeometry, outerGlowMaterial);
        scene.add(outerGlow);

        // ============================================================
        // SUN LIGHTING SETUP
        // ============================================================
        // Main directional light (sun)
        const sunLight = new THREE.DirectionalLight(0xfff5e0, 2.5);
        sunLight.position.set(-3, 1, -3);
        scene.add(sunLight);

        // Subtle fill light from opposite side
        const fillLight = new THREE.DirectionalLight(0x1a2a4a, 0.3);
        fillLight.position.set(3, -1, 3);
        scene.add(fillLight);

        // Ambient light (very dim)
        const ambientLight = new THREE.AmbientLight(0x050810, 0.2);
        scene.add(ambientLight);

        // Sun visual marker (bright glowing sphere)
        const sunGeometry = new THREE.SphereGeometry(0.3, 16, 16);
        const sunMaterial = new THREE.MeshBasicMaterial({ color: 0xfff5e0 });
        const sunMesh = new THREE.Mesh(sunGeometry, sunMaterial);
        sunMesh.position.copy(sunLight.position).normalize().multiplyScalar(8);
        scene.add(sunMesh);

        // Sun glow sprite
        const sunGlowCanvas = document.createElement('canvas');
        sunGlowCanvas.width = 256;
        sunGlowCanvas.height = 256;
        const ctx = sunGlowCanvas.getContext('2d');
        const gradient = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
        gradient.addColorStop(0, 'rgba(255, 245, 224, 1)');
        gradient.addColorStop(0.3, 'rgba(255, 245, 224, 0.6)');
        gradient.addColorStop(0.7, 'rgba(255, 200, 100, 0.2)');
        gradient.addColorStop(1, 'rgba(255, 200, 100, 0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 256, 256);

        const sunGlowTexture = new THREE.CanvasTexture(sunGlowCanvas);
        const sunGlowMaterial = new THREE.SpriteMaterial({ map: sunGlowTexture, transparent: true, blending: THREE.AdditiveBlending });
        const sunGlowSprite = new THREE.Sprite(sunGlowMaterial);
        sunGlowSprite.scale.set(3, 3, 1);
        sunGlowSprite.position.copy(sunMesh.position);
        scene.add(sunGlowSprite);

        // ============================================================
        // POST-PROCESSING (Bloom Effect via RenderTarget)
        // ============================================================
        const renderTarget = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight);
        const quadCamera = new THREE.OrthographicCamera(-1, 1, -1, 1, 0, 1);

        const bloomScene = new THREE.Scene();
        const bloomGeometry = new THREE.PlaneGeometry(2, 2);

        // Simple bloom shader
        const bloomShader = {
            uniforms: {
                tDiffuse: { value: null },
                resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform vec2 resolution;
                varying vec2 vUv;

                void main() {
                    vec3 color = texture2D(tDiffuse, vUv).rgb;

                    // Extract bright areas for bloom
                    float brightness = max(color.r, max(color.g, color.b));
                    float bloom = smoothstep(0.5, 1.0, brightness);

                    // Simple blur approximation (4 samples)
                    vec2 texelSize = 1.0 / resolution;
                    vec3 bloomBlur = vec3(0.0);
                    for(int i = -1; i <= 1; i++) {
                        for(int j = -1; j <= 1; j++) {
                            vec2 offset = vec2(float(i), float(j)) * texelSize * 2.0;
                            bloomBlur += texture2D(tDiffuse, vUv + offset).rgb;
                        }
                    }
                    bloomBlur /= 9.0;

                    // Combine original with bloom
                    vec3 finalColor = color + bloomBlur * bloom * 0.5;

                    gl_Frag_COLOR = vec4(finalColor, 1.0);
                }
            `
        };

        const bloomMaterial = new THREE.ShaderMaterial({
            uniforms: {
                tDiffuse: { value: null },
                resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
            },
            vertexShader: bloomShader.vertexShader,
            fragmentShader: bloomShader.fragmentShader
        });

        const bloomQuad = new THREE.Mesh(bloomGeometry, bloomMaterial);
        bloomScene.add(bloomQuad);

        // ============================================================
        // ANIMATION LOOP
        // ============================================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Update uniforms
            earthMaterial.uniforms.time.value = elapsedTime;
            atmosphereMaterial.uniforms.time.value = elapsedTime;

            // Slow rotation of Earth
            earth.rotation.y += 0.001;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // ============================================================
        // RESIZE HANDLER
        // ============================================================
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });

    </script>
</body>
</html>
