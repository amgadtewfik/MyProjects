<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini 2.0 Flash - 3D Racing</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #222;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            border: 4px solid #444;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background: #000;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .hud {
            position: absolute;
            padding: 20px;
            color: white;
            text-shadow: 2px 2px 2px black;
            font-size: 20px;
        }
        #speed-display { bottom: 20px; right: 20px; }
        #lap-display { top: 20px; right: 20px; text-align: right; }
        #timer-display { top: 20px; left: 20px; }
        
        #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            pointer-events: auto;
            z-index: 10;
        }
        h1 { font-size: 48px; margin-bottom: 10px; color: #00ffcc; }
        p { font-size: 18px; margin-bottom: 30px; }
        button {
            padding: 15px 40px;
            font-size: 24px;
            background: #00ffcc;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.1); }
        
        #game-over {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            pointer-events: auto;
            z-index: 11;
        }
        #result-text { font-size: 48px; margin-bottom: 10px; color: #00ffcc; }
        #final-stats { font-size: 20px; margin-bottom: 30px; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="ui-layer">
        <div id="timer-display">Time: 0.00s</div>
        <div id="lap-display">Lap: 1/3<br>Best: --</div>
        <div id="speed-display">Speed: 0 km/h</div>
    </div>

    <div id="menu">
        <h1>GEMINI 2.0 FLASH</h1>
        <p>3D Racing Experience</p>
        <button id="start-btn">START RACE</button>
    </div>

    <div id="game-over">
        <h1 id="result-text">FINISH!</h1>
        <p id="final-stats"></p>
        <button id="restart-btn">PLAY AGAIN</button>
    </div>
</div>

<script>
/**
 * GAME CONFIGURATION & CONSTANTS
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = 800;
canvas.height = 600;

const ROAD_WIDTH = 2000;
const SEGMENT_LENGTH = 200;
const DRAW_DISTANCE = 300;

// Colors
const COLORS = {
    SKY: '#729fcf',
    GRASS: '#109410',
    GRASS_LIGHT: '#10b910',
    ROAD: '#444',
    ROAD_LINE: '#fff',
    RUMBLE: '#fff',
    RUMBLE_DARK: '#444',
    CAR: '#ff0000',
    BOOST: '#00ffff'
};

/**
 * GAME STATE
 */
let gameState = 'MENU';
let startTime = 0;
let elapsedTime = 0;
let currentLap = 1;
let totalLaps = 3;
let bestTime = Infinity;
let speed = 0;
let playerX = 0; // -1 to 1
let playerZ = 0;
let track = [];
let checkpoints = [];
let boostPads = [];
let obstacles = [];

// Input handling
const keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

/**
 * TRACK GENERATION
 * Creates a winding track with curves and straights
 */
function createTrack() {
    track = [];
    checkpoints = [];
    boostPads = [];
    obstacles = [];
    
    const trackLength = 5000; // Total segments
    
    for (let i = 0; i < trackLength; i++) {
        track.push({
            p1: { world: { x: 0, y: 0, z: i * SEGMENT_LENGTH }, screen: { x: 0, y: 0, w: 0 } },
            p2: { world: { x: 0, y: 0, z: (i + 1) * SEGMENT_LENGTH }, screen: { x: 0, y: 0, w: 0 } },
            curve: 0,
            color: (Math.floor(i / 100) % 2 === 0) ? COLORS.ROAD : COLORS.ROAD,
            rumble: (Math.floor(i / 100) % 2 === 0) ? COLORS.RUMBLE : COLORS.RUMBLE_DARK,
            isGrass: false
        });

        // Add curves
        if (i > 200 && i < 500) track[i].curve = 2;
        if (i > 800 && i < 1200) track[i].curve = -3;
        if (i > 1500 && i < 2000) track[i].curve = 4;
        if (i > 2500 && i < 3000) track[i].curve = -2;
        if (i > 3500 && i < 4000) track[i].curve = 3;
        if (i > 4500 && i < 4800) track[i].curve = -5;

        // Add some off-road areas
        if (i > 1000 && i < 1200) {
            if (i % 50 === 0) track[i].isGrass = true;
        }

        // Add Checkpoints
        if (i === 500) checkpoints.push(i);
        if (i === 1500) checkpoints.push(i);
        if (i === 2500) checkpoints.push(i);
        if (i === 3500) checkpoints.push(i);
        if (i === 4500) checkpoints.push(i);

        // Add Boost Pads
        if (i === 1000) boostPads.push({z: i * SEGMENT_LENGTH, x: 0});
        if (i === 2000) boostPads.push({z: i * SEGMENT_LENGTH, x: 1});
        if (i === 3000) boostPads.push({z: i * SEGMENT_LENGTH, x: -1});
        if (i === 4000) boostPads.push({z: i * SEGMENT_LENGTH, x: 0.5});

        // Add Obstacles
        if (i === 2200) obstacles.push({z: i * SEGMENT_LENGTH, x: 0.5, w: 100});
        if (i === 3200) obstacles.push({z: i * SEGMENT_LENGTH, x: -0.5, w: 100});
    }
}

/**
 * PHYSICS & LOGIC
 */
function update() {
    if (gameState !== 'RACING') return;

    // Acceleration
    if (keys['ArrowUp'] || keys['KeyW']) {
        speed += 2;
    } else if (keys['ArrowDown'] || keys['KeyS']) {
        speed -= 3;
    } else {
        speed *= 0.98; // Friction
    }

    // Steering
    if (Math.abs(speed) > 0.1) {
        const steerSpeed = 0.04 * (speed / 100);
        if (keys['ArrowLeft'] || keys['KeyA']) playerX -= steerSpeed;
        if (keys['ArrowRight'] || keys['KeyD']) playerX += steerSpeed;
    }

    // Drift / Sliding effect
    playerX *= 0.99; // Return to center slightly

    // Speed limits
    speed = Math.max(-50, Math.min(speed, 150));

    // Update Position
    playerZ += speed;
    
    // Loop track
    if (playerZ >= track.length * SEGMENT_LENGTH) {
        playerZ = 0;
        currentLap++;
        if (currentLap > totalLaps) {
            finishRace();
        }
    }

    // Checkpoints
    checkpoints.forEach((cpIdx, i) => {
        const cpZ = cpIdx * SEGMENT_LENGTH;
        if (Math.abs(playerZ - cpZ) < 500) {
            // Logic for lap progression could go here
        }
    });

    // Boost Pads
    boostPads.forEach(pad => {
        if (Math.abs(playerZ - pad.z) < 200 && Math.abs(playerX - pad.x) < 0.3) {
            speed += 50;
        }
    });

    // Obstacles
    obstacles.forEach(obs => {
        if (Math.abs(playerZ - obs.z) < 200 && Math.abs(playerX - obs.x) < 0.4) {
            speed *= 0.8; // Collision slow down
        }
    });

    // Off-road penalty
    const currentSegment = track[Math.floor(playerZ / SEGMENT_LENGTH) % track.length];
    if (currentSegment && currentSegment.isGrass && Math.abs(playerX) > 0.8) {
        speed *= 0.95;
    }

    // Update HUD
    elapsedTime = (performance.now() - startTime) / 1000;
    document.getElementById('timer-display').innerText = `Time: ${elapsedTime.toFixed(2)}s`;
    document.getElementById('speed-display').innerText = `Speed: ${Math.floor(speed)} km/h`;
    document.getElementById('lap-display').innerHTML = `Lap: ${currentLap}/${totalLaps}<br>Best: ${bestTime === Infinity ? '--' : bestTime.toFixed(2)}s`;
}

/**
 * RENDERING
 */
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw Sky
    ctx.fillStyle = COLORS.SKY;
    ctx.fillRect(0, 0, canvas.width, canvas.height / 2);

    // Draw Ground
    ctx.fillStyle = COLORS.GRASS;
    ctx.fillRect(0, canvas.height / 2, canvas.width, canvas.height / 2);

    // Render Road
    const baseSegment = Math.floor(playerZ / SEGMENT_LENGTH);
    
    for (let i = 0; i < DRAW_DISTANCE; i++) {
        const segment = track[(baseSegment + i) % track.length];
        const p1 = segment.p1;
        const p2 = segment.p2;

        const cameraDepth = 1 / (i * 0.05 + 1);
        const scale = cameraDepth * canvas.height;

        // Perspective projection
        const x1 = (p1.world.x - playerX * ROAD_WIDTH) * cameraDepth + canvas.width / 2;
        const y1 = (p1.world.y) * cameraDepth + canvas.height / 2;
        const w1 = ROAD_WIDTH * cameraDepth * canvas.height;

        const x2 = (p2.world.x - playerX * ROAD_WIDTH) * cameraDepth + canvas.width / 2;
        const y2 = (p2.world.y) * cameraDepth + canvas.height / 2;
        const w2 = ROAD_WIDTH * cameraDepth * canvas.height;

        // Draw Road
        ctx.fillStyle = segment.color;
        ctx.beginPath();
        ctx.moveTo(x1 - w1, y1);
        ctx.lineTo(x1 + w1, y1);
        ctx.lineTo(x2 + w2, y2);
        ctx.lineTo(x2 - w2, y2);
        ctx.fill();

        // Draw Rumble
        ctx.fillStyle = segment.rumble;
        ctx.beginPath();
        ctx.moveTo(x1 - w1 - 20, y1);
        ctx.lineTo(x1 - w1 + 20, y1);
        ctx.lineTo(x2 - w2 + 20, y2);
        ctx.lineTo(x2 - w2 - 20, y2);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(x1 + w1 + 20, y1);
        ctx.lineTo(x1 + w1 - 20, y1);
        ctx.lineTo(x2 + w2 - 20, y2);
        ctx.lineTo(x2 + w2 + 20, y2);
        ctx.fill();

        // Draw Road Lines
        if (i % 2 === 0) {
            ctx.fillStyle = COLORS.ROAD_LINE;
            ctx.beginPath();
            ctx.moveTo(x1 - w1 / 30, y1);
            ctx.lineTo(x1 + w1 / 30, y1);
            ctx.lineTo(x2 + w2 / 30, y2);
            ctx.lineTo(x2 - w2 / 30, y2);
            ctx.fill();
        }
    }

    // Draw Boost Pads
    boostPads.forEach(pad => {
        const dist = pad.z - playerZ;
        if (dist > 0 && dist < 2000) {
            const segIdx = Math.floor((playerZ + dist) / SEGMENT_LENGTH) % track.length;
            const seg = track[segIdx];
            const camDepth = 1 / (dist / 200 + 1);
            const x = (pad.x * ROAD_WIDTH - playerX * ROAD_WIDTH) * camDepth + canvas.width / 2;
            const y = (seg.p1.world.y) * camDepth + canvas.height / 2;
            const w = ROAD_WIDTH * camDepth * canvas.height;
            
            ctx.fillStyle = COLORS.BOOST;
            ctx.fillRect(x - w/10, y - w/10, w/5, w/5);
        }
    });

    // Draw Obstacles
    obstacles.forEach(obs => {
        const dist = obs.z - playerZ;
        if (dist > 0 && dist < 2000) {
            const segIdx = Math.floor((playerZ + dist) / SEGMENT_LENGTH) % track.length;
            const seg = track[segIdx];
            const camDepth = 1 / (dist / 200 + 1);
            const x = (obs.x * ROAD_WIDTH - playerX * ROAD_WIDTH) * camDepth + canvas.width / 2;
            const y = (seg.p1.world.y) * camDepth + canvas.height / 2;
            const w = ROAD_WIDTH * camDepth * canvas.height;

            ctx.fillStyle = '#555';
            ctx.fillRect(x - w/5, y - w/5, w/2, w/2);
        }
    });

    // Draw Player Car
    const carW = 100;
    const carH = 50;
    const carX = canvas.width / 2;
    const carY = canvas.height - 100;
    
    // Simple 3D-ish car body
    ctx.fillStyle = COLORS.CAR;
    ctx.fillRect(carX - carW/2, carY - carH/2, carW, carH);
    // Windows
    ctx.fillStyle = '#333';
    ctx.fillRect(carX - carW/3, carY - carH/2, carW/1.5, carH/3);
    // Wheels
    ctx.fillStyle = '#000';
    ctx.fillRect(carX - carW/2 - 5, carY - carH/2, 10, carH/2);
    ctx.fillRect(carX + carW/2 - 5, carY - carH/2, 10, carH/2);
    ctx.fillRect(carX - carW/2 - 5, carY + carH/2 - 5, 10, carH/2);
    ctx.fillRect(carX + carW/2 - 5, carY + carH/2 - 5, 10, carH/2);

    if (gameState === 'RACING') {
        requestAnimationFrame(() => {
            update();
            draw();
        });
    }
}

function finishRace() {
    gameState = 'FINISHED';
    if (elapsedTime < bestTime) bestTime = elapsedTime;
    document.getElementById('game-over').style.display = 'flex';
    document.getElementById('final-stats').innerText = `Time: ${elapsedTime.toFixed(2)}s | Best: ${bestTime === Infinity ? '--' : bestTime.toFixed(2)}s`;
}

/**
 * INITIALIZATION
 */
function init() {
    createTrack();
    
    document.getElementById('start-btn').addEventListener('click', () => {
        gameState = 'RACING';
        startTime = performance.now();
        document.getElementById('menu').style.display = 'none';
        requestAnimationFrame(draw);
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
        location.reload();
    });
}

init();
</script>
</body
</html>
