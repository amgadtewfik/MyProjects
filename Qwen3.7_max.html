    function getSunPosition(date) {
        const rad = Math.PI / 180;
        const dayOfYear = Math.floor((date - new Date(date.getFullYear(), 0, 0)) / 86400000);
        const hours = date.getUTCHours() + date.getUTCMinutes() / 60 + date.getUTCSeconds() / 3600;
        
        // Solar declination
        const declination = -23.45 * Math.cos(rad * (360 / 365) * (dayOfYear + 10));
        
        // Hour angle - sun is at longitude 0 at 12:00 UTC
        const sunLongitude = -(hours - 12) * 15; // degrees
        
        return {
            declination: declination * rad,
            longitude: sunLongitude * rad,
            lat: declination,
            lon: sunLongitude
        };
    }

    // ============ PERLIN NOISE ============
    class PerlinNoise {
        constructor(seed = 0) {
            this.perm = new Uint8Array(512);
            const p = new Uint8Array(256);
            for (let i = 0; i < 256; i++) p[i] = i;
            let s = seed;
            for (let i = 255; i > 0; i--) {
                s = (s * 16807 + 0) % 2147483647;
                const j = s % (i + 1);
                [p[i], p[j]] = [p[j], p[i]];
            }
            for (let i = 0; i < 512; i++) this.perm[i] = p[i & 255];
        }
        fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
        lerp(a, b, t) { return a + t * (b - a); }
        grad(hash, x, y) {
            const h = hash & 3;
            const u = h < 2 ? x : y;
            const v = h < 2 ? y : x;
            return ((h & 1) ? -u : u) + ((h & 2) ? -v : v);
        }
        noise(x, y) {
            const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
            x -= Math.floor(x); y -= Math.floor(y);
            const u = this.fade(x), v = this.fade(y);
            const A = this.perm[X] + Y, B = this.perm[X + 1] + Y;
            return this.lerp(
                this.lerp(this.grad(this.perm[A], x, y), this.grad(this.perm[B], x - 1, y), u),
                this.lerp(this.grad(this.perm[A + 1], x, y - 1), this.grad(this.perm[B + 1], x - 1, y - 1), u),
                v
            );
        }
        fbm(x, y, octaves = 6) {
            let val = 0, amp = 1, freq = 1, max = 0;
            for (let i = 0; i < octaves; i++) {
                val += this.noise(x * freq, y * freq) * amp;
                max += amp;
                amp *= 0.5;
                freq *= 2;
            }
            return val / max;
        }
    }

    // ============ TEXTURE GENERATION ============
    function generateEarthTexture(width, height) {
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        const imgData = ctx.createImageData(width, height);
        const data = imgData.data;
        
        const noise1 = new PerlinNoise(42);
        const noise2 = new PerlinNoise(123);
        const noise3 = new PerlinNoise(789);
        
        // Create land mask from continent polygons
        const landMask = new Float32Array(width * height);
        
        for (const continent of continents) {
            for (let y = 0; y < height; y++) {
                const lat = 90 - (y / height) * 180;
                for (let x = 0; x < width; x++) {
                    const lon = (x / width) * 360 - 180;
                    if (pointInPolygon(lon, lat, continent)) {
                        landMask[y * width + x] = 1;
                    }
                }
            }
        }
        
        // Smooth the land mask
        const smoothMask = new Float32Array(width * height);
        const blurRadius = 3;
        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                let sum = 0, count = 0;
                for (let dy = -blurRadius; dy <= blurRadius; dy++) {
                    for (let dx = -blurRadius; dx <= blurRadius; dx++) {
                        const nx = (x + dx + width) % width;
                        const ny = Math.min(height - 1, Math.max(0, y + dy));
                        sum += landMask[ny * width + nx];
                        count++;
                    }
                }
                smoothMask[y * width + x] = sum / count;
            }
        }
        
        // Generate final texture
        for (let y = 0; y < height; y++) {
            const lat = 90 - (y / height) * 180;
            for (let x = 0; x < width; x++) {
                const lon = (x / width) * 360 - 180;
                const idx = (y * width + x) * 4;
                const mask = smoothMask[y * width + x];
                
                // Noise values
                const n1 = noise1.fbm(lon * 0.05, lat * 0.05, 6);
                const n2 = noise2.fbm(lon * 0.02, lat * 0.02, 4);
                const n3 = noise3.fbm(lon * 0.1, lat * 0.1, 4);
                const detail = noise1.fbm(lon * 0.3, lat * 0.3, 3);
                
                let r, g, b;
                
                if (mask > 0.5) {
                    // Land
                    const landBlend = Math.min(1, (mask - 0.5) * 4);
                    
                    // Elevation
                    const elevation = n1 * 0.5 + n2 * 0.3 + n3 * 0.2;
                    
                    // Biome based on latitude and noise
                    const absLat = Math.abs(lat);
                    
                    if (absLat > 65) {
                        // Snow/Ice
                        r = 235 + detail * 20;
                        g = 240 + detail * 15;
                        b = 245 + detail * 10;
                    } else if (absLat > 55) {
                        // Tundra/Boreal
                        const snow = noise1.fbm(lon * 0.08, lat * 0.08, 3);
                        if (snow > 0.2) {
                            r = 200 + detail * 30;
                            g = 210 + detail * 20;
                            b = 200 + detail * 20;
                        } else {
                            r = 60 + elevation * 40 + detail * 20;
                            g = 80 + elevation * 30 + detail * 15;
                            b = 40 + elevation * 20 + detail * 10;
                        }
                    } else if (absLat > 35) {
                        // Temperate forest/grassland
                        r = 50 + elevation * 60 + detail * 25;
                        g = 90 + elevation * 40 + n3 * 30;
                        b = 35 + elevation * 20 + detail * 15;
                    } else if (absLat > 20) {
                        // Subtropical - mix of desert and vegetation
                        const desertFactor = noise2.fbm(lon * 0.03, lat * 0.04, 4);
                        if (desertFactor > 0.1) {
                            // Desert
                            r = 180 + elevation * 40 + detail * 20;
                            g = 155 + elevation * 30 + detail * 15;
                            b = 100 + elevation * 20 + detail * 10;
                        } else {
                            // Savanna/tropical
                            r = 80 + elevation * 50 + detail * 20;
                            g = 110 + elevation * 30 + n3 * 25;
                            b = 40 + elevation * 20 + detail * 10;
                        }
                    } else {
                        // Tropical
                        const tropicalNoise = noise3.fbm(lon * 0.06, lat * 0.06, 4);
                        if (tropicalNoise > 0.2) {
                            // Rainforest
                            r = 20 + elevation * 40 + detail * 15;
                            g = 80 + elevation * 50 + n3 * 30;
                            b = 20 + elevation * 15 + detail * 10;
                        } else {
                            // Tropical dry
                            r = 100 + elevation * 50 + detail * 20;
                            g = 120 + elevation * 40 + n3 * 25;
                            b = 50 + elevation * 20 + detail * 10;
                        }
                    }
                    
                    // Mountains
                    if (elevation > 0.35) {
                        const mt = (elevation - 0.35) * 3;
                        r = r * (1 - mt) + (140 + detail * 40) * mt;
                        g = g * (1 - mt) + (130 + detail * 30) * mt;
                        b = b * (1 - mt) + (120 + detail * 25) * mt;
                    }
                    
                    // Coastline blend
                    if (landBlend < 1) {
                        const oceanR = 15, oceanG = 40 + n1 * 20, oceanB = 100 + n2 * 30;
                        r = r * landBlend + oceanR * (1 - landBlend);
                        g = g * landBlend + oceanG * (1 - landBlend);
                        b = b * landBlend + oceanB * (1 - landBlend);
                    }
                } else {
                    // Ocean
                    const depth = 0.5 + n1 * 0.3 + n2 * 0.2;
                    r = 5 + depth * 20 + detail * 5;
                    g = 20 + depth * 40 + n3 * 15;
                    b = 80 + depth * 60 + n1 * 30;
                    
                    // Shallow water near coasts
                    if (mask > 0.2) {
                        const shallow = (mask - 0.2) * 5;
                        r = r * (1 - shallow) + 30 * shallow;
                        g = g * (1 - shallow) + 100 * shallow;
                        b = b * (1 - shallow) + 140 * shallow;
                    }
                }
                
                data[idx] = Math.min(255, Math.max(0, r));
                data[idx + 1] = Math.min(255, Math.max(0, g));
                data[idx + 2] = Math.min(255, Math.max(0, b));
                data[idx + 3] = 255;
            }
        }
        
        ctx.putImageData(imgData, 0, 0);
        return canvas;
    }

    function generateNightTexture(width, height) {
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        const imgData = ctx.createImageData(width, height);
        const data = imgData.data;
        
        const noise = new PerlinNoise(999);
        
        // Create land mask
        const landMask = new Float32Array(width * height);
        for (const continent of continents) {
            for (let y = 0; y < height; y++) {
                const lat = 90 - (y / height) * 180;
                for (let x = 0; x < width; x++) {
                    const lon = (x / width) * 360 - 180;
                    if (pointInPolygon(lon, lat, continent)) {
                        landMask[y * width + x] = 1;
                    }
                }
            }
        }
        
        // Generate city lights
        for (let y = 0; y < height; y++) {
            const lat = 90 - (y / height) * 180;
            for (let x = 0; x < width; x++) {
                const lon = (x / width) * 360 - 180;
                const idx = (y * width + x) * 4;
                
                if (landMask[y * width + x] > 0.5) {
                    const absLat = Math.abs(lat);
                    // More lights in populated areas (rough approximation)
                    let popDensity = 0;
                    if (absLat > 20 && absLat < 55) popDensity = 0.6;
                    if (absLat > 30 && absLat < 50) popDensity = 0.8;
                    
                    // Coastal areas more populated
                    let nearCoast = 0;
                    for (let dy = -5; dy <= 5; dy++) {
                        for (let dx = -5; dx <= 5; dx++) {
                            const nx = (x + dx + width) % width;
                            const ny = Math.min(height - 1, Math.max(0, y + dy));
                            if (landMask[ny * width + nx] < 0.5) nearCoast = 1;
                        }
                    }
                    if (nearCoast) popDensity += 0.3;
                    
                    const cityNoise = noise.fbm(lon * 0.5, lat * 0.5, 4);
                    const lightIntensity = Math.max(0, cityNoise * popDensity);
                    
                    if (lightIntensity > 0.2) {
                        const intensity = (lightIntensity - 0.2) * 2;
                        data[idx] = Math.min(255, intensity * 255 * 0.9);
                        data[idx + 1] = Math.min(255, intensity * 200 * 0.8);
                        data[idx + 2] = Math.min(255, intensity * 100 * 0.5);
                    }
                }
                data[idx + 3] = 255;
            }
        }
        
        ctx.putImageData(imgData, 0, 0);
        return canvas;
    }

    function generateCloudTexture(width, height) {
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        const imgData = ctx.createImageData(width, height);
        const data = imgData.data;
        
        const noise1 = new PerlinNoise(555);
        const noise2 = new PerlinNoise(777);
        
        for (let y = 0; y < height; y++) {
            const lat = 90 - (y / height) * 180;
            for (let x = 0; x < width; x++) {
                const lon = (x / width) * 360 - 180;
                const idx = (y * width + x) * 4;
                
                const n1 = noise1.fbm(lon * 0.03, lat * 0.04, 5);
                const n2 = noise2.fbm(lon * 0.06, lat * 0.06, 4);
                
                let cloud = n1 * 0.6 + n2 * 0.4;
                cloud = Math.max(0, cloud - 0.1) * 1.5;
                cloud = Math.min(1, cloud);
                
                // More clouds near equator and mid-latitudes
                const absLat = Math.abs(lat);
                if (absLat < 15 || (absLat > 40 && absLat < 60)) {
                    cloud *= 1.3;
                }
                cloud = Math.min(1, cloud);
                
                const brightness = 255 * cloud;
                data[idx] = brightness;
                data[idx + 1] = brightness;
                data[idx + 2] = brightness;
                data[idx + 3] = brightness;
            }
        }
        
        ctx.putImageData(imgData, 0, 0);
        return canvas;
    }

    function generateBumpMap(width, height) {
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        const imgData = ctx.createImageData(width, height);
        const data = imgData.data;
        
        const noise = new PerlinNoise(42);
        
        const landMask = new Float32Array(width * height);
        for (const continent of continents) {
            for (let y = 0; y < height; y++) {
                const lat = 90 - (y / height) * 180;
                for (let x = 0; x < width; x++) {
                    const lon = (x / width) * 360 - 180;
                    if (pointInPolygon(lon, lat, continent)) {
                        landMask[y * width + x] = 1;
                    }
                }
            }
        }
        
        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                const idx = (y * width + x) * 4;
                const mask = landMask[y * width + x];
                
                if (mask > 0.5) {
                    const lat = 90 - (y / height) * 180;
                    const lon = (x / width) * 360 - 180;
                    const bump = noise.fbm(lon * 0.1, lat * 0.1, 6) * 0.5 + 0.5;
                    const val = bump * 255;
                    data[idx] = val;
                    data[idx + 1] = val;
                    data[idx + 2] = val;
                }
                data[idx + 3] = 255;
            }
        }
        
        ctx.putImageData(imgData, 0, 0);
        return canvas;
    }

    function pointInPolygon(x, y, polygon) {
        let inside = false;
        for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
            const xi = polygon[i][0], yi = polygon[i][1];
            const xj = polygon[j][0], yj = polygon[j][1];
            if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) {
                inside = !inside;
            }
        }
        return inside;
    }

    // ============ THREE.JS SCENE ============
    let scene, camera, renderer, earth, clouds, atmosphere;
    let sunLight, ambientLight;
    let mouseDown = false, mouseX = 0, mouseY = 0;
    let rotationX = 0.3, rotationY = 0;
    let targetRotationX = 0.3, targetRotationY = 0;
    let zoom = 2.8;

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = zoom;

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // Generate textures
        console.log('Generating Earth textures...');
        const texSize = 2048;
        const earthCanvas = generateEarthTexture(texSize, texSize / 2);
        const nightCanvas = generateNightTexture(texSize, texSize / 2);
        const cloudCanvas = generateCloudTexture(1024, 512);
        const bumpCanvas = generateBumpMap(1024, 512);

        const earthTexture = new THREE.CanvasTexture(earthCanvas);
        const nightTexture = new THREE.CanvasTexture(nightCanvas);
        const cloudTexture = new THREE.CanvasTexture(cloudCanvas);
        const bumpTexture = new THREE.CanvasTexture(bumpCanvas);

        earthTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();

        // Earth with custom shader
        const earthGeometry = new THREE.SphereGeometry(1, 128, 64);
        
        const earthMaterial = new THREE.ShaderMaterial({
            uniforms: {
                dayTexture: { value: earthTexture },
                nightTexture: { value: nightTexture },
                bumpTexture: { value: bumpTexture },
                sunDirection: { value: new THREE.Vector3(1, 0, 0) }
            },
            vertexShader: `
                varying vec2 vUv;
                varying vec3 vNormal;
                varying vec3 vPosition;
                void main() {
                    vUv = uv;
                    vNormal = normalize(normalMatrix * normal);
                    vPosition = (modelMatrix * vec4(position, 1.0)).xyz;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D dayTexture;
                uniform sampler2D nightTexture;
                uniform sampler2D bumpTexture;
                uniform vec3 sunDirection;
                varying vec2 vUv;
                varying vec3 vNormal;
                varying vec3 vPosition;
                
                void main() {
                    vec3 normal = normalize(vNormal);
                    float sunDot = dot(normal, sunDirection);
                    
                    // Day/night transition
                    float dayFactor = smoothstep(-0.15, 0.2, sunDot);
                    
                    vec4 dayColor = texture2D(dayTexture, vUv);
                    vec4 nightColor = texture2D(nightTexture, vUv);
                    
                    // Apply lighting to day side
                    float diffuse = max(0.0, sunDot);
                    vec3 litDay = dayColor.rgb * (0.3 + 0.7 * diffuse);
                    
                    // Specular for oceans (darker areas in day texture)
                    float specular = 0.0;
                    vec3 viewDir = normalize(-vPosition);
                    vec3 reflectDir = reflect(-sunDirection, normal);
                    specular = pow(max(dot(viewDir, reflectDir), 0.0), 32.0) * 0.5;
                    float isOcean = 1.0 - smoothstep(0.1, 0.3, dayColor.g - dayColor.b * 0.5);
                    litDay += specular * isOcean * diffuse;
                    
                    // Night side with city lights
                    vec3 nightSide = nightColor.rgb * 1.5;
                    
                    // Blend
                    vec3 finalColor = mix(nightSide, litDay, dayFactor);
                    
                    // Slight blue tint on terminator
                    float terminator = 1.0 - smoothstep(0.0, 0.3, abs(sunDot));
                    finalColor += vec3(0.02, 0.03, 0.08) * terminator;
                    
                    gl_FragColor = vec4(finalColor, 1.0);
                }
            `
        });

        earth = new THREE.Mesh(earthGeometry, earthMaterial);
        // Tilt Earth's axis (23.5 degrees)
        earth.rotation.z = -23.5 * Math.PI / 180;
        scene.add(earth);

        // Clouds
        const cloudGeometry = new THREE.SphereGeometry(1.01, 64, 32);
        const cloudMaterial = new THREE.ShaderMaterial({
            uniforms: {
                cloudTexture: { value: cloudTexture },
                sunDirection: { value: new THREE.Vector3(1, 0, 0) }
            },
            vertexShader: `
                varying vec2 vUv;
                varying vec3 vNormal;
                void main() {
                    vUv = uv;
                    vNormal = normalize(normalMatrix * normal);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D cloudTexture;
                uniform vec3 sunDirection;
                varying vec2 vUv;
                varying vec3 vNormal;
                void main() {
                    vec3 normal = normalize(vNormal);
                    float sunDot = dot(normal, sunDirection);
                    float dayFactor = smoothstep(-0.1, 0.3, sunDot);
                    
                    float cloud = texture2D(cloudTexture, vUv).r;
                    vec3 cloudColor = vec3(1.0) * (0.2 + 0.8 * dayFactor);
                    
                    gl_FragColor = vec4(cloudColor, cloud * 0.6 * dayFactor);
                }
            `,
            transparent: true,
            depthWrite: false
        });

        clouds = new THREE.Mesh(cloudGeometry, cloudMaterial);
        earth.add(clouds);

        // Atmosphere glow
        const atmosphereGeometry = new THREE.SphereGeometry(1.04, 64, 32);
        const atmosphereMaterial = new THREE.ShaderMaterial({
            uniforms: {
                sunDirection: { value: new THREE.Vector3(1, 0, 0) }
            },
            vertexShader: `
                varying vec3 vNormal;
                varying vec3 vPosition;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    vPosition = (modelViewMatrix * vec4(position, 1.0)).xyz;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform vec3 sunDirection;
                varying vec3 vNormal;
                varying vec3 vPosition;
                void main() {
                    vec3 viewDir = normalize(-vPosition);
                    float rim = 1.0 - max(0.0, dot(viewDir, vNormal));
                    rim = pow(rim, 3.0);
                    
                    float sunDot = dot(vNormal, sunDirection);
                    float dayFactor = smoothstep(-0.5, 0.5, sunDot);
                    
                    vec3 atmosColor = mix(
                        vec3(0.1, 0.15, 0.4),
                        vec3(0.3, 0.6, 1.0),
                        dayFactor
                    );
                    
                    float alpha = rim * (0.3 + 0.7 * dayFactor);
                    gl_FragColor = vec4(atmosColor, alpha * 0.8);
                }
            `,
            transparent: true,
            depthWrite: false,
            side: THREE.BackSide
        });

        atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
        earth.add(atmosphere);

        // Stars
        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 10000;
        const positions = new Float32Array(starsCount * 3);
        const colors = new Float32Array(starsCount * 3);
        const sizes = new Float32Array(starsCount);
        
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = 50 + Math.random() * 50;
            positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
            positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
            positions[i * 3 + 2] = r * Math.cos(phi);
            
            const brightness = 0.5 + Math.random() * 0.5;
            const tint = Math.random();
            colors[i * 3] = brightness * (tint > 0.8 ? 1.0 : 0.9);
            colors[i * 3 + 1] = brightness * 0.95;
            colors[i * 3 + 2] = brightness * (tint < 0.2 ? 1.0 : 0.9);
            
            sizes[i] = Math.random() * 2 + 0.5;
        }
        
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        starsGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        starsGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
        
        const starsMaterial = new THREE.PointsMaterial({
            size: 0.15,
            vertexColors: true,
            transparent: true,
            opacity: 0.9,
            sizeAttenuation: true
        });
        
        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);

        // Event listeners
        setupControls();
        window.addEventListener('resize', onResize);
        
        updateSunPosition();
        animate();
    }

    function updateSunPosition() {
        const now = new Date();
        const sun = getSunPosition(now);
        
        // Sun direction in 3D space
        const sunDir = new THREE.Vector3(
            Math.cos(sun.declination) * Math.cos(sun.longitude),
            Math.sin(sun.declination),
            Math.cos(sun.declination) * Math.sin(sun.longitude)
        ).normalize();
        
        // Update shader uniforms
        earth.material.uniforms.sunDirection.value.copy(sunDir);
        clouds.material.uniforms.sunDirection.value.copy(sunDir);
        atmosphere.material.uniforms.sunDirection.value.copy(sunDir);
        
        // Rotate Earth to show correct longitude facing camera
        // The Earth's rotation should align the sun position correctly
        const utcHours = now.getUTCHours() + now.getUTCMinutes() / 60;
        earth.rotation.y = -sun.longitude;
        
        // Update display
        const timeStr = now.toLocaleTimeString();
        const dateStr = now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
        
        document.getElementById('timeDisplay').innerHTML = 
            `📅 ${dateStr}<br>🕐 ${timeStr} (${tz})`;
        document.getElementById('sunPos').innerHTML = 
            `☀️ Sun at ${sun.lat.toFixed(1)}° lat, ${sun.lon.toFixed(1)}° lon`;
    }

    function setupControls() {
        const canvas = renderer.domElement;
        
        canvas.addEventListener('mousedown', (e) => {
            mouseDown = true;
            mouseX = e.clientX;
            mouseY = e.clientY;
        });
        
        canvas.addEventListener('mousemove', (e) => {
            if (!mouseDown) return;
            const dx = e.clientX - mouseX;
            const dy = e.clientY - mouseY;
            targetRotationY += dx * 0.005;
            targetRotationX += dy * 0.005;
            targetRotationX = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, targetRotationX));
            mouseX = e.clientX;
            mouseY = e.clientY;
        });
        
        canvas.addEventListener('mouseup', () => mouseDown = false);
        canvas.addEventListener('mouseleave', () => mouseDown = false);
        
        canvas.addEventListener('wheel', (e) => {
            zoom += e.deltaY * 0.001;
            zoom = Math.max(1.5, Math.min(8, zoom));
        });
        
        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            mouseDown = true;
            mouseX = e.touches[0].clientX;
            mouseY = e.touches[0].clientY;
        });
        canvas.addEventListener('touchmove', (e) => {
            if (!mouseDown) return;
            e.preventDefault();
            const dx = e.touches[0].clientX - mouseX;
            const dy = e.touches[0].clientY - mouseY;
            targetRotationY += dx * 0.005;
            targetRotationX += dy * 0.005;
            targetRotationX = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, targetRotationX));
            mouseX = e.touches[0].clientX;
            mouseY = e.touches[0].clientY;
        });
        canvas.addEventListener('touchend', () => mouseDown = false);
    }

    function onResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        
        // Smooth camera rotation
        rotationX += (targetRotationX - rotationX) * 0.05;
        rotationY += (targetRotationY - rotationY) * 0.05;
        
        camera.position.x = zoom * Math.sin(rotationY) * Math.cos(rotationX);
        camera.position.y = zoom * Math.sin(rotationX);
        camera.position.z = zoom * Math.cos(rotationY) * Math.cos(rotationX);
        camera.lookAt(0, 0, 0);
        
        // Slow cloud rotation
        if (clouds) {
            clouds.rotation.y += 0.0001;
        }
        
        // Update sun position every 30 seconds
        if (Math.floor(Date.now() / 30000) !== Math.floor((Date.now() - 16) / 30000)) {
            updateSunPosition();
        }
        
        renderer.render(scene, camera);
    }

    // Start
    init();
    </script>
</body>
