<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Space Racer</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0a0a0a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            pointer-events: none;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }
    </style>
</head>
<body class="bg-black">
    <div id="ui">Speed: <span id="speed">0</span> km/h</div>
    <div id="instructions">Use ARROW KEYS to Drive | Avoid Obstacles</div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';

        // --- Initialization ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        scene.fog = new THREE.Fog(0x050510, 20, 100);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0x00ffcc, 1);
        directionalLight.position.set(5, 10, 7.5);
        scene.add(directionalLight);

        // --- Road / Track ---
        const roadGeometry = new THREE.PlaneGeometry(20, 1000);
        const roadMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x222222,
            side: THREE.DoubleSide 
        });
        const road = new THREE.Mesh(roadGeometry, roadMaterial);
        road.rotation.x = -Math.PI / 2;
        scene.add(road);

        // --- Player Car ---
        const carGroup = new THREE.Group();
        
        const bodyGeom = new THREE.BoxGeometry(1.5, 0.5, 3);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff0044 });
        const body = new THREE.Mesh(bodyGeom, bodyMat);
        carGroup.add(body);

        const cockpitGeom = new THREE.BoxGeometry(1, 0.4, 1);
        const cockpitMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
        const cockpit = new THREE.Mesh(cockpitGeom, cockpitMat);
        cockpit.position.set(0, 0.4, -0.2);
        carGroup.add(cockpit);

        carGroup.position.y = 0.5;
        scene.add(carGroup);

        // --- Obstacles ---
        const obstacles = [];
        function createObstacle() {
            const geom = new THREE.BoxGeometry(2, 2, 2);
            const mat = new THREE.MeshStandardMaterial({ color: 0x00ffcc });
            const obs = new THREE.Mesh(geom, mat);
            obs.position.set((Math.random() - 0.5) * 18, 1, -50);
            scene.add(obs);
            obstacles.push(obs);
        }

        // --- Gameplay State ---
        let speed = 0;
        const maxSpeed = 0.8;
        const acceleration = 0.005;
        const friction = 0.99;
        let keys = {};

        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        // --- Game Loop ---
        function animate() {
            requestAnimationFrame(animate);

            if (keys['ArrowUp']) speed += acceleration;
            else if (keys['ArrowDown']) speed -= acceleration;
            else speed *= friction;

            speed = Math.max(0, Math.min(speed, maxSpeed));

            if (keys['ArrowLeft']) carGroup.position.x -= 0.15 * (speed + 0.2);
            if (keys['ArrowRight']) carGroup.position.x += 0.15 * (speed + 0.2);
            
            carGroup.position.x = Math.max(-9, Math.min(9, carGroup.position.x));

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].position.z += speed + 0.2;
                
                if (obstacles[i].position.z > 5) {
                    scene.remove(obstacles[i]);
                    obstacles.splice(i, 1);
                    createObstacle();
                }

                const dist = carGroup.position.distanceTo(obstacles[i].position);
                if (dist < 2.5) {
                    speed *= 0.8;
                    carGroup.position.x -= (Math.random() - 0.5) * 3;
                }
            }

            if(Math.random() < 0.03 && obstacles.length < 12) {
                createObstacle();
            }

            camera.position.x = carGroup.position.x * 0.5;
            camera.position.y = 3 + (speed * 2);
            camera.position.z = -8;
            camera.lookAt(carGroup.position.x, carGroup.position.y + 1, carGroup.position.z - 10);

            document.getElementById('speed').innerText = Math.floor(speed * 500);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
