<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Subway Station FPS</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; font-family: 'Courier New', monospace; cursor: none; }
canvas { display: block; }

#hud {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 10;
}

#crosshair {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 24px; height: 24px;
}
#crosshair::before, #crosshair::after {
  content: ''; position: absolute; background: rgba(255,255,255,0.8);
}
#crosshair::before { width: 2px; height: 100%; left: 50%; transform: translateX(-50%); }
#crosshair::after { height: 2px; width: 100%; top: 50%; transform: translateY(-50%); }

#ammo-display {
  position: absolute; bottom: 40px; right: 40px;
  color: #0f0; font-size: 28px; text-shadow: 0 0 10px rgba(0,255,0,0.5);
}
#ammo-display .label { font-size: 14px; opacity: 0.6; }

#health-bar-container {
  position: absolute; bottom: 40px; left: 40px;
  width: 250px; height: 20px; background: rgba(0,0,0,0.7);
  border: 1px solid #333; border-radius: 3px;
}
#health-bar {
  height: 100%; width: 100%; background: linear-gradient(90deg, #f00, #0f0);
  transition: width 0.3s; border-radius: 2px;
}
#health-text {
  position: absolute; bottom: 65px; left: 40px;
  color: #fff; font-size: 14px; text-shadow: 0 0 5px rgba(255,255,255,0.3);
}

#kill-count {
  position: absolute; top: 20px; right: 20px;
  color: #ff4444; font-size: 18px; text-shadow: 0 0 8px rgba(255,68,68,0.5);
}

#brightness-control {
  position: absolute; top: 20px; left: 20px;
  pointer-events: all; z-index: 20;
}
#brightness-control label {
  color: #aaa; font-size: 13px; display: block; margin-bottom: 5px;
}
#brightness-slider {
  -webkit-appearance: none; width: 180px; height: 6px;
  background: linear-gradient(90deg, #222, #ffcc44);
  border-radius: 3px; outline: none; cursor: pointer;
}
#brightness-slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 16px; height: 16px;
  background: radial-gradient(circle, #fff, #aaa);
  border-radius: 50%; cursor: pointer; box-shadow: 0 0 8px rgba(255,255,255,0.5);
}

#recoil-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 9;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(255,80,0,0.15) 100%);
  opacity: 0; transition: opacity 0.05s;
}

#damage-flash {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 9;
  background: rgba(255,0,0,0.3); opacity: 0; transition: opacity 0.1s;
}

#instructions {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  color: #fff; text-align: center; background: rgba(0,0,0,0.85);
  padding: 40px 60px; border-radius: 10px; border: 1px solid #333;
  pointer-events: all; z-index: 25; cursor: default;
}
#instructions h2 { margin-bottom: 20px; color: #ff4444; }
#instructions p { margin: 8px 0; font-size: 14px; color: #aaa; }
#instructions .key { color: #ffcc44; font-weight: bold; }

#weapon-view {
  position: absolute; bottom: -20px; right: 5%; width: 350px; height: 350px;
  pointer-events: none; z-index: 8;
}

#fps-counter {
  position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
  color: #666; font-size: 12px;
}

#minimap {
  position: absolute; bottom: 40px; right: 320px;
  width: 150px; height: 150px; background: rgba(0,0,0,0.7);
  border: 1px solid #444; border-radius: 5px; pointer-events: none;
}

#game-over {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.8); display: none; z-index: 30;
  justify-content: center; align-items: center; flex-direction: column;
}
#game-over h1 { color: #ff0000; font-size: 64px; text-shadow: 0 0 30px rgba(255,0,0,0.5); }
#game-over p { color: #aaa; margin-top: 20px; }
</style>
</head>
<body>

<div id="hud">
  <div id="crosshair"></div>
  <div id="ammo-display"><span class="label">AMMO</span><br><span id="ammo-count">30 / ∞</span></div>
  <div id="health-text">HEALTH</div>
  <div id="health-bar-container"><div id="health-bar"></div></div>
  <div id="kill-count">☠ KILLS: <span id="kills">0</span></div>
  <div id="fps-counter" id="fps-display">FPS: 60</div>

  <div id="brightness-control">
    <label>☀ BRIGHTNESS</label>
    <input type="range" id="brightness-slider" min="5" max="100" value="50">
  </div>

  <canvas id="minimap"></canvas>
</div>

<div id="recoil-overlay"></div>
<div id="damage-flash"></div>

<div id="instructions">
  <h2>🚇 SUBWAY STATION FPS</h2>
  <p><span class="key">W A S D</span> — Move</p>
  <p><span class="key">MOUSE</span> — Turn / Aim</p>
  <p><span class="key">E</span> — Jump</p>
  <p><span class="key">LEFT CLICK</span> or <span class="key">SPACE</span> — Shoot</p>
  <p><span class="key">SHIFT</span> — Sprint</p>
  <p><span class="key">R</span> — Reload</p>
  <p><span class="key">1 2 3 4</span> — Switch Weapons</p>
  <p style="margin-top:20px; color:#ffcc44;">Click anywhere to begin</p>
</div>

<div id="game-over">
  <h1>YOU DIED</h1>
  <p>Kills: <span id="final-kills">0</span></p>
  <p style="margin-top:20px; color:#ffcc44;">Click to restart</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================================
// SCENE SETUP
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0a);
scene.fog = new THREE.FogExp2(0x111111, 0.035);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 1.7, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

// ============================================================
// MATERIALS & GEOMETRIES (Reusable)
// ============================================================
const matTileFloor = new THREE.MeshStandardMaterial({ color: 0x8899aa, roughness: 0.3, metalness: 0.1 });
const matTileWall = new THREE.MeshStandardMaterial({ color: 0xaabbcc, roughness: 0.4, metalness: 0.05 });
const matDarkMetal = new THREE.MeshStandardMaterial({ color: 0x222233, roughness: 0.6, metalness: 0.8 });
const matBrightMetal = new THREE.MeshStandardMaterial({ color: 0xccccdd, roughness: 0.2, metalness: 0.9 });
const matYellowStripe = new THREE.MeshStandardMaterial({ color: 0xddaa00, emissive: 0x443300, roughness: 0.5 });
const matTrackRail = new THREE.MeshStandardMaterial({ color: 0x666677, roughness: 0.4, metalness: 0.9 });
const matConcrete = new THREE.MeshStandardMaterial({ color: 0x555566, roughness: 0.8 });
const matGlowYellow = new THREE.MeshStandardMaterial({ color: 0xffffcc, emissive: 0xffee88, emissiveIntensity: 2 });
const matGlowGreen = new THREE.MeshStandardMaterial({ color: 0x44ff44, emissive: 0x22aa22, emissiveIntensity: 1.5 });
const matZombieSkin = new THREE.MeshStandardMaterial({ color: 0x667755, roughness: 0.8 });
const matZombieClothes = new THREE.MeshStandardMaterial({ color: 0x334433, roughness: 0.9 });
const matBlood = new THREE.MeshStandardMaterial({ color: 0x881111, emissive: 0x220000 });
const matTrainBody = new THREE.MeshStandardMaterial({ color: 0x445566, roughness: 0.3, metalness: 0.7 });
const matTrainWindow = new THREE.MeshStandardMaterial({ color: 0x112233, emissive: 0x223344, emissiveIntensity: 0.5 });
const matPlatformEdge = new THREE.MeshStandardMaterial({ color: 0xffcc00, emissive: 0xaa8800, emissiveIntensity: 0.5 });

// ============================================================
// SUBWAY STATION CONSTRUCTION
// ============================================================

// Ground / Platform floor
function createStation() {
  const stationGroup = new THREE.Group();

  // Main platform floor - large rectangular area
  const platformGeo = new THREE.BoxGeometry(20, 0.3, 60);
  const platform = new THREE.Mesh(platformGeo, matTileFloor);
  platform.position.set(0, -0.15, 0);
  platform.receiveShadow = true;
  stationGroup.add(platform);

  // Platform edge yellow safety strip
  for (let z = -28; z <= 28; z += 4) {
    const stripGeo = new THREE.BoxGeometry(0.15, 0.35, 3.8);
    const strip = new THREE.Mesh(stripGeo, matPlatformEdge);
    strip.position.set(-9.9, -0.17, z);
    stationGroup.add(strip);
    const strip2 = new THREE.Mesh(stripGeo, matPlatformEdge);
    strip2.position.set(9.9, -0.17, z);
    stationGroup.add(strip2);
  }

  // Ceiling
  const ceilingGeo = new THREE.BoxGeometry(24, 0.3, 65);
  const ceiling = new THREE.Mesh(ceilingGeo, matConcrete);
  ceiling.position.set(0, 7, 0);
  ceiling.receiveShadow = true;
  stationGroup.add(ceiling);

  // Walls (left and right)
  for (let side of [-1, 1]) {
    const wallGeo = new THREE.BoxGeometry(0.3, 7.3, 65);
    const wall = new THREE.Mesh(wallGeo, matTileWall);
    wall.position.set(side * 11.5, 3.4, 0);
    wall.receiveShadow = true;
    stationGroup.add(wall);

    // Wall tiles pattern - horizontal lines every 2m
    for (let z = -30; z <= 30; z += 2) {
      const tileLineGeo = new THREE.BoxGeometry(0.35, 0.08, 1.9);
      const tileLine = new THREE.Mesh(tileLineGeo, matDarkMetal);
      tileLine.position.set(side * 11.4, 3.5, z);
      stationGroup.add(tileLine);
    }

    // Wall-mounted lights
    for (let z = -28; z <= 28; z += 6) {
      const lightFixtureGeo = new THREE.BoxGeometry(0.1, 0.4, 3);
      const lightFixture = new THREE.Mesh(lightFixtureGeo, matBrightMetal);
      lightFixture.position.set(side * 11.2, 5.5, z);
      stationGroup.add(lightFixture);

      // Light glow panel
      const glowPanelGeo = new THREE.BoxGeometry(0.05, 0.3, 2.8);
      const glowPanel = new THREE.Mesh(glowPanelGeo, matGlowYellow);
      glowPanel.position.set(side * 11.15, 5.4, z);
      stationGroup.add(glowPanel);

      // Point light for each fixture
      const pl = new THREE.PointLight(0xffeedd, 1.5, 15);
      pl.position.set(side * 10.5, 5, z);
      stationGroup.add(pl);
    }
  }

  // Pillars every 8m along platform
  for (let x = -9; x <= 9; x += 4) {
    if (x === 0) continue; // skip center area
    for (let z = -28; z <= 28; z += 8) {
      const pillarGeo = new THREE.BoxGeometry(0.6, 7.3, 0.6);
      const pillar = new THREE.Mesh(pillarGeo, matDarkMetal);
      pillar.position.set(x * (x > 0 ? 1 : -1), 3.4, z);
      pillar.castShadow = true;
      stationGroup.add(pillar);

      // Pillar base plate
      const baseGeo = new THREE.BoxGeometry(1.2, 0.15, 1.2);
      const base = new THREE.Mesh(baseGeo, matBrightMetal);
      base.position.set(x * (x > 0 ? 1 : -1), 0.075, z);
      stationGroup.add(base);

      // Pillar top cap
      const capGeo = new THREE.BoxGeometry(1.2, 0.15, 1.2);
      const cap = new THREE.Mesh(capGeo, matBrightMetal);
      cap.position.set(x * (x > 0 ? 1 : -1), 7.225, z);
      stationGroup.add(cap);
    }
  }

  // Tracks (two sets)
  for (let trackSide of [-1, 1]) {
    const trackBedGeo = new THREE.BoxGeometry(4, 0.6, 65);
    const trackBed = new THREE.Mesh(trackBedGeo, matConcrete);
    trackBed.position.set(trackSide * 7, -0.6, 0);
    stationGroup.add(trackBed);

    // Rails
    for (let railOffset of [-1.2, 1.2]) {
      const railGeo = new THREE.BoxGeometry(0.15, 0.12, 65);
      const rail = new THREE.Mesh(railGeo, matTrackRail);
      rail.position.set(trackSide * (7 + railOffset), -0.48, 0);
      stationGroup.add(rail);
    }

    // Sleepers (ties) every 1m
    for (let z = -32; z <= 32; z += 1) {
      const sleeperGeo = new THREE.BoxGeometry(3.5, 0.1, 0.3);
      const sleeper = new THREE.Mesh(sleeperGeo, matDarkMetal);
      sleeper.position.set(trackSide * 7, -0.55, z);
      stationGroup.add(sleeper);
    }

    // Third rail (power)
    const thirdRailGeo = new THREE.BoxGeometry(0.1, 0.08, 65);
    const thirdRail = new THREE.Mesh(thirdRailGeo, matTrackRail);
    thirdRail.position.set(trackSide * (7 + 2), -0.35, 0);
    stationGroup.add(thirdRail);

    // Third rail glow
    const trGlowGeo = new THREE.BoxGeometry(0.15, 0.04, 65);
    const trGlow = new THREE.Mesh(trGlowGeo, matGlowGreen);
    trGlow.position.set(trackSide * (7 + 2), -0.32, 0);
    stationGroup.add(trGlow);
  }

  // Overhead catenary wires
  for (let trackSide of [-1, 1]) {
    const wireGeo = new THREE.CylinderGeometry(0.02, 0.02, 65);
    const wire = new THREE.Mesh(wireGeo, matDarkMetal);
    wire.rotation.x = Math.PI / 2;
    wire.position.set(trackSide * 7, 6, 0);
    stationGroup.add(wire);

    // Support cables every 10m
    for (let z = -30; z <= 30; z += 10) {
      const supportGeo = new THREE.CylinderGeometry(0.02, 0.02, 2);
      const support = new THREE.Mesh(supportGeo, matDarkMetal);
      support.position.set(trackSide * (7 + trackSide * 1), 5.5, z);
      stationGroup.add(support);

      const crossGeo = new THREE.BoxGeometry(3, 0.04, 0.04);
      const cross = new THREE.Mesh(crossGeo, matDarkMetal);
      cross.position.set(trackSide * 7, 6, z);
      stationGroup.add(cross);
    }
  }

  // Subway trains on tracks
  for (let trackSide of [-1, 1]) {
    const trainGroup = new THREE.Group();
    const trainZ = trackSide * 25;

    // Train body - multiple cars
    for (let car = 0; car < 3; car++) {
      const carGeo = new THREE.BoxGeometry(2.8, 3, 12);
      const carMesh = new THREE.Mesh(carGeo, matTrainBody);
      carMesh.position.set(trackSide * (7 + trackSide * 1), 1.5, trainZ - car * 14);
      carMesh.castShadow = true;
      stationGroup.add(carMesh);

      // Windows on each car
      for (let w = 0; w < 3; w++) {
        const winGeo = new THREE.BoxGeometry(0.05, 1.2, 2);
        const winMat = new THREE.MeshStandardMaterial({ color: 0x88aacc, emissive: 0x446688, emissiveIntensity: 0.3 });
        const win = new THREE.Mesh(winGeo, winMat);
        win.position.set(trackSide * (7 + trackSide * 1) - trackSide * 1.42, 1.5, trainZ - car * 14 + (w - 1) * 3.5);
        stationGroup.add(win);

        const win2 = new THREE.Mesh(winGeo, winMat);
        win2.position.set(trackSide * (7 + trackSide * 1) + trackSide * 1.42, 1.5, trainZ - car * 14 + (w - 1) * 3.5);
        stationGroup.add(win2);
      }

      // Door outlines
      for (let d = 0; d < 2; d++) {
        const doorGeo = new THREE.BoxGeometry(0.06, 2.4, 0.8);
        const doorMat = new THREE.MeshStandardMaterial({ color: 0x556677 });
        const door = new THREE.Mesh(doorGeo, doorMat);
        door.position.set(trackSide * (7 + trackSide * 1) - trackSide * 1.43, 1.2, trainZ - car * 14 + (d === 0 ? -5 : 5));
        stationGroup.add(door);

        const door2 = new THREE.Mesh(doorGeo, doorMat);
        door2.position.set(trackSide * (7 + trackSide * 1) + trackSide * 1.43, 1.2, trainZ - car * 14 + (d === 0 ? -5 : 5));
        stationGroup.add(door2);
      }

      // Headlights on front of first car
      if (car === 0) {
        const hlGeo = new THREE.SphereGeometry(0.15, 8, 8);
        const hlMat = new THREE.MeshStandardMaterial({ color: 0xffffcc, emissive: 0xffee44, emissiveIntensity: 3 });
        for (let h of [-0.6, 0.6]) {
          const hl = new THREE.Mesh(hlGeo, hlMat);
          hl.position.set(trackSide * (7 + trackSide * 1) - trackSide * 1.45, 2.5, trainZ - car * 14 - trackSide * 6);
          stationGroup.add(hl);

          const pl = new THREE.SpotLight(0xffeedd, 3, 30, Math.PI / 6, 0.5);
          pl.position.copy(hl.position);
          pl.target.position.set(trackSide * (7 + trackSide * 1) - trackSide * 1.45, 2.5, trainZ - car * 14 - trackSide * 30);
          stationGroup.add(pl);
        }
      }

      // Tail lights on last car
      if (car === 2) {
        const tlGeo = new THREE.SphereGeometry(0.12, 8, 8);
        const tlMat = new THREE.MeshStandardMaterial({ color: 0xff2200, emissive: 0xff4400, emissiveIntensity: 3 });
        for (let h of [-0.6, 0.6]) {
          const tl = new THREE.Mesh(tlGeo, tlMat);
          tl.position.set(trackSide * (7 + trackSide * 1) - trackSide * 1.45, 2.5, trainZ - car * 14 + trackSide * 6);
          stationGroup.add(tl);
        }
      }
    }
  }

  // Platform signage / advertisements
  for (let z = -20; z <= 20; z += 10) {
    const signGeo = new THREE.BoxGeometry(3, 2, 0.1);
    const signMat = new THREE.MeshStandardMaterial({ color: 0x224466, emissive: 0x112233, emissiveIntensity: 0.5 });
    const sign = new THREE.Mesh(signGeo, signMat);
    sign.position.set(-11.3, 4.5, z);
    stationGroup.add(sign);

    // Ad frame border
    const frameGeo = new THREE.BoxGeometry(3.2, 2.2, 0.05);
    const frameMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
    const frame = new THREE.Mesh(frameGeo, frameMat);
    frame.position.set(-11.35, 4.5, z);
    stationGroup.add(frame);

    // Station name sign above platform
    if (z === 0) {
      const nameSignGeo = new THREE.BoxGeometry(8, 1.2, 0.3);
      const nameSignMat = new THREE.MeshStandardMaterial({ color: 0x0044aa, emissive: 0x002266, emissiveIntensity: 1 });
      const nameSign = new THREE.Mesh(nameSignGeo, nameSignMat);
      nameSign.position.set(0, 6.5, z);
      stationGroup.add(nameSign);

      // Platform edge info screens
      for (let side of [-1, 1]) {
        const screenGeo = new THREE.BoxGeometry(0.1, 1.5, 2);
        const screenMat = new THREE.MeshStandardMaterial({ color: 0x003366, emissive: 0x004488, emissiveIntensity: 1 });
        const screen = new THREE.Mesh(screenGeo, screenMat);
        screen.position.set(side * 9.5, 4, z);
        stationGroup.add(screen);
      }
    }
  }

  // Benches on platform
  for (let z = -15; z <= 15; z += 12) {
    const benchGeo = new THREE.BoxGeometry(3, 0.6, 0.8);
    const benchMat = new THREE.MeshStandardMaterial({ color: 0x443322 });
    const bench = new THREE.Mesh(benchGeo, benchMat);
    bench.position.set(-5, 0.3, z);
    bench.castShadow = true;
    stationGroup.add(bench);

    // Bench legs
    for (let lx of [-1.2, 1.2]) {
      const legGeo = new THREE.BoxGeometry(0.1, 0.6, 0.7);
      const leg = new THREE.Mesh(legGeo, matDarkMetal);
      leg.position.set(-5 + lx, -0.3, z);
      stationGroup.add(leg);
    }

    // Bench on other side too
    const bench2 = new THREE.Mesh(benchGeo, benchMat);
    bench2.position.set(5, 0.3, z);
    bench2.castShadow = true;
    stationGroup.add(bench2);
    for (let lx of [-1.2, 1.2]) {
      const legGeo = new THREE.BoxGeometry(0.1, 0.6, 0.7);
      const leg = new THREE.Mesh(legGeo, matDarkMetal);
      leg.position.set(5 + lx, -0.3, z);
      stationGroup.add(leg);
    }
  }

  // Trash cans
  for (let z = -18; z <= 18; z += 9) {
    const canGeo = new THREE.CylinderGeometry(0.25, 0.3, 0.8, 8);
    const canMat = new THREE.MeshStandardMaterial({ color: 0x334433 });
    for (let side of [-1, 1]) {
      const trashCan = new THREE.Mesh(canGeo, canMat);
      trashCan.position.set(side * 7, 0.4, z);
      stationGroup.add(trashCan);

      // Lid
      const lidGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.08, 8);
      const lid = new THREE.Mesh(lidGeo, matDarkMetal);
      lid.position.set(side * 7, 0.84, z);
      stationGroup.add(lid);
    }
  }

  // Staircase down to lower level (one end)
  for (let step = 0; step < 12; step++) {
    const stairGeo = new THREE.BoxGeometry(6, 0.3, 0.8);
    const stair = new THREE.Mesh(stairGeo, matConcrete);
    stair.position.set(-5, -0.15 + step * 0.3, 29 + step * 0.8);
    stationGroup.add(stair);
  }

  // Stair railing
  for (let side of [-1, 1]) {
    const railGeo = new THREE.CylinderGeometry(0.04, 0.04, 5, 6);
    const rail = new THREE.Mesh(railGeo, matDarkMetal);
    rail.position.set(-5 + side * 2.8, 1.3, 35);
    stationGroup.add(rail);

    // Vertical posts
    for (let p = 0; p < 6; p++) {
      const postGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.8, 6);
      const post = new THREE.Mesh(postGeo, matDarkMetal);
      post.position.set(-5 + side * 2.8, 0.4 + p * 0.7, 29 + p * 1.2);
      stationGroup.add(post);
    }
  }

  // Emergency exit signs (red glowing)
  for (let z = -25; z <= 25; z += 15) {
    const signGeo = new THREE.BoxGeometry(0.8, 0.4, 0.1);
    const signMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 3 });
    for (let side of [-1, 1]) {
      const exitSign = new THREE.Mesh(signGeo, signMat);
      exitSign.position.set(side * 9.5, 6, z);
      stationGroup.add(exitSign);

      // Small red light above each sign
      const el = new THREE.PointLight(0xff0000, 0.5, 8);
      el.position.set(side * 9.5, 6.3, z);
      stationGroup.add(el);
    }
  }

  // Drip / water puddles on floor (reflective)
  for (let i = 0; i < 15; i++) {
    const puddleGeo = new THREE.CircleGeometry(Math.random() * 0.8 + 0.3, 16);
    const puddleMat = new THREE.MeshStandardMaterial({ color: 0x445566, roughness: 0.1, metalness: 0.9 });
    const puddle = new THREE.Mesh(puddleGeo, puddleMat);
    puddle.rotation.x = -Math.PI / 2;
    puddle.position.set(
      (Math.random() - 0.5) * 16,
      0.01,
      (Math.random() - 0.5) * 50
    );
    stationGroup.add(puddle);
  }

  // Ceiling pipes and conduits running lengthwise
  for (let x of [-8, -4, 0, 4, 8]) {
    const pipeGeo = new THREE.CylinderGeometry(0.06, 0.06, 65, 6);

  // Ventilation ducts on ceiling
  for (let z = -25; z <= 25; z += 12) {

  // Graffiti on walls (colored rectangles)
  for (let i = 0; i < 8; i++) {

      1 + Math.random() * 3,
      (Math.random() - 0.5) * 40
    );
    graff.rotation.y = Math.PI / 2;
    stationGroup.add(graff);
  }

  // Overhead platform screen doors at ends
  for (let end of [-1, 1]) {
    const doorFrameGeo = new THREE.BoxGeometry(8, 4, 0.3);
    const doorFrameMat = new THREE.MeshStandardMaterial({ color: 0x556677 });
    const doorFrame = new THREE.Mesh(doorFrameGeo, doorFrameMat);
    doorFrame.position.set(0, 2, end * 31);
    stationGroup.add(doorFrame);

    // Glass panels in frame
    for (let gp = -3; gp <= 3; gp += 1.5) {
      const glassGeo = new THREE.BoxGeometry(1.3, 3.8, 0.05);
      const glassMat = new THREE.MeshStandardMaterial({ color: 0x88aacc, transparent: true, opacity: 0.4 });
      const glass = new THREE.Mesh(glassGeo, glassMat);
      glass.position.set(gp, 2, end * 31);
      stationGroup.add(glass);
    }

    // Door opening indicator light
    const indLightGeo = new THREE.BoxGeometry(0.6, 0.15, 0.1);

      const indLight = new THREE.Mesh(indLightGeo, indLightMat);
      indLight.position.set(side * 2.5, 3.8, end * 31);
      stationGroup.add(indLight);
    }
  }

  return stationGroup;
}

// Audio system
let audioCtx;
function initAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playShootSound() {
  if (!audioCtx) initAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.frequency.setValueAtTime(150, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.15);
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.15);
}

function playHitSound() {
  if (!audioCtx) initAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.type = 'square';
  osc.frequency.setValueAtTime(200, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.1);
  gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.1);
}

function playEmptySound() {
  if (!audioCtx) initAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.frequency.setValueAtTime(800, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.05);
}

function playReloadSound() {
  if (!audioCtx) initAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.frequency.setValueAtTime(300, audioCtx.currentTime);
  osc.frequency.setValueAtTime(400, audioCtx.currentTime + 0.1);
  osc.frequency.setValueAtTime(500, audioCtx.currentTime + 0.2);
  gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

  osc.stop(audioCtx.currentTime + 0.3);
}

function shoot() {
  playShootSound();
  const w = weapons[currentWeapon];
  
  // Shotgun fires multiple pellets
  if (currentWeapon === 2) {
    for (let i = 0; i < 5; i++) {
      createTracer();
    }
  } else {
    createTracer();
  }
  
  ammo--;
  document.getElementById('ammo-count').textContent = `${ammo} / ∞`;

  // Recoil effect - more for powerful guns
  recoilAmount = Math.min(recoilAmount + 0.1 + w.damage/500, 0.5);
  euler.setFromQuaternion(camera.quaternion);
  euler.x += (Math.random() - 0.5) * w.spread * 2;
  euler.y += (Math.random() - 0.5) * w.spread;
  camera.quaternion.setFromEuler(euler);

  // Muzzle flash
  muzzleFlashLight.intensity = 10;
  setTimeout(() => { muzzleFlashLight.intensity = 0; }, 50);

  // Weapon kickback animation
  weaponGroup.position.z += 0.2;
  weaponGroup.rotation.x -= 0.15;

  // Check hit on enemies
  checkShootingHit(w.damage);

  if (ammo <= 0) reload();
}

function createTracer() {
  const tracerGeo = new THREE.CylinderGeometry(0.01, 0.01, 2, 4);
  const tracerMat = new THREE.MeshBasicMaterial({ color: 0xffcc44 });
  const tracer = new THREE.Mesh(tracerGeo, tracerMat);

  // Start from weapon muzzle position in world space
  const startPos = new THREE.Vector3();
  barrel.getWorldPosition(startPos);

  // Direction camera is facing
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);

  tracer.position.copy(startPos);
  tracer.lookAt(startPos.clone().add(dir));
  scene.add(tracer);

  // Animate tracer moving forward
  const tracerSpeed = 2;
  let tracerLife = 0.5;
  const startTime = performance.now();

  function animateTracer() {
    const elapsed = (performance.now() - startTime) / 1000;
    if (elapsed > tracerLife) {
      scene.remove(tracer);
      tracerGeo.dispose();
      tracerMat.dispose();
      return;
    }
    tracer.position.add(dir.clone().multiplyScalar(tracerSpeed * elapsed));
    tracer.material.opacity = 1 - (elapsed / tracerLife);
    tracer.material.transparent = true;

    // Add glow at tip
    const glowGeo = new THREE.SphereGeometry(0.05, 6, 6);
    const glowMat = new THREE.MeshBasicMaterial({ color: 0xffee88 });
    const glow = new THREE.Mesh(glowGeo, glowMat);
    glow.position.copy(tracer.position).add(dir.clone().multiplyScalar(1));
    scene.add(glow);

    setTimeout(() => {
      scene.remove(glow);
      glowGeo.dispose();
      glowMat.dispose();
    }, 200);

    requestAnimationFrame(animateTracer);
  }
  animateTracer();
}

function checkShootingHit(damage) {
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);

  // Check against enemies
  enemyGroup.children.forEach((enemy) => {
    if (!enemy.userData.alive) return;
    
    // Get direction to enemy
    const toEnemy = new THREE.Vector3();
    toEnemy.subVectors(enemy.position, camera.position);
    const distToEnemy = toEnemy.length();
    
    // Simple distance-based hit check
    if (distToEnemy < 60 && distToEnemy > 0.5) {
      toEnemy.normalize();
      const dot = dir.dot(toEnemy);
      // If aiming roughly at enemy
      if (dot > 0.8) {
        damageEnemy(enemy, damage);
        playHitSound();
      }
    }
  });
}

  // Arms (reaching forward like zombie)
  for (let side of [-0.35, 0.35]) {

    const armMat = matZombieSkin.clone();
    const arm = new THREE.Mesh(armGeo, armMat);
    arm.position.set(side, 1.5, -0.3);
    arm.rotation.x = -0.5; // Arms raised

    const hand = new THREE.Mesh(handGeo, matZombieSkin.clone());
    hand.position.set(side, 1.9, -0.45);
    enemy.add(hand);

  // Legs
  for (let side of [-0.2, 0.2]) {

function damageEnemy(enemy, amount) {
  if (!enemy.userData.alive) return;
  enemy.userData.health -= amount;

  // Flash the enemy white briefly
  enemy.traverse((child) => {
    if (child.isMesh && child.material) {
      const origColor = child.material.color.getHex();
      child.material.emissive.setHex(0xffffff);
      setTimeout(() => {
        if (child.material) child.material.emissive.setHex(0x000000);
      }, 100);
    }
  });

  // Knockback
  const knockDir = new THREE.Vector3();
  knockDir.subVectors(enemy.position, camera.position).normalize();
  enemy.position.add(knockDir.multiplyScalar(0.5));

  if (enemy.userData.health <= 0) {
    killEnemy(enemy);
  }
}

function killEnemy(enemy) {
  enemy.userData.alive = false;
  kills++;
  document.getElementById('kills').textContent = kills;

  // Death animation - fall over
  const fallDir = new THREE.Vector3();
  fallDir.subVectors(enemy.position, camera.position).normalize();
  let fallProgress = 0;

  function animateFall() {
    if (fallProgress >= Math.PI / 2) {
      enemy.visible = false;
      return;
    }
    fallProgress += 0.05;
    enemy.rotation.x = -fallProgress;
    enemy.position.y = -Math.sin(fallProgress) * 1.3;
    requestAnimationFrame(animateFall);
  }
  animateFall();

  // Spawn new enemy after delay
  setTimeout(() => {
    spawnRandomEnemy();
  }, 5000 + Math.random() * 5000);
}

function spawnRandomEnemy() {
  const angle = Math.random() * Math.PI * 2;
  const dist = 20 + Math.random() * 25;
  const x = Math.cos(angle) * dist;
  const z = Math.sin(angle) * dist;

  // Clamp to station bounds
  const clampedX = Math.max(-9, Math.min(9, x));
  const clampedZ = Math.max(-30, Math.min(30, z));

  createEnemy(clampedX, clampedZ);
}

// Spawn initial enemies
for (let i = 0; i < 4; i++) {
  spawnRandomEnemy();
}

// ============================================================
// MINIMAP
// ============================================================
const minimapCanvas = document.getElementById('minimap');
const minimapCtx = minimapCanvas.getContext('2d');
minimapCanvas.width = 150;
minimapCanvas.height = 150;

function updateMinimap() {
  minimapCtx.fillStyle = '#111';
  minimapCtx.fillRect(0, 0, 150, 150);

  // Station outline
  minimapCtx.strokeStyle = '#444';
  minimapCtx.strokeRect(25, 25, 100, 100);

  // Tracks
  minimapCtx.fillStyle = '#333';
  minimapCtx.fillRect(35, 25, 8, 100);
  minimapCtx.fillRect(107, 25, 8, 100);

  // Player dot
  const px = 75 + (camera.position.x / 24) * 50;
  const pz = 75 + (camera.position.z / 60) * 50;
  minimapCtx.fillStyle = '#0f0';
  minimapCtx.beginPath();
  minimapCtx.arc(px, pz, 4, 0, Math.PI * 2);
  minimapCtx.fill();

  // Player direction indicator
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  minimapCtx.strokeStyle = '#0f0';
  minimapCtx.beginPath();
  minimapCtx.moveTo(px, pz);
  minimapCtx.lineTo(px + dir.x * 15, pz + dir.z * 15);
  minimapCtx.stroke();

  // Enemy dots (red)
  enemyGroup.children.forEach((enemy) => {
    if (!enemy.userData.alive || !enemy.visible) return;
    const ex = 75 + (enemy.position.x / 24) * 50;
    const ez = 75 + (enemy.position.z / 60) * 50;
    minimapCtx.fillStyle = '#f00';
    minimapCtx.beginPath();
    minimapCtx.arc(ex, ez, 3, 0, Math.PI * 2);
    minimapCtx.fill();
  });
}

// ============================================================
// BRIGHTNESS SLIDER
// ============================================================
document.getElementById('brightness-slider').addEventListener('input', (e) => {
  const val = parseInt(e.target.value) / 100;
  ambientLight.intensity = val * 2;
  mainHemisphereLight.intensity = val * 1.5;

  overheadLights.forEach((light) => {
    light.intensity = val * 4;
  });

  scene.fog.near = 5 + (1 - val) * 30;
  scene.fog.far = 20 + val * 80;

  renderer.toneMappingExposure = 0.3 + val * 1.7;
});

// ============================================================
// GAME LOOP
// ============================================================
let lastTime = performance.now();
let fpsFrames = 0;
let fpsTime = 0;

function update() {
  const now = performance.now();
  const delta = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;

  // FPS counter
  fpsFrames++;
  fpsTime += delta;
  if (fpsTime >= 1) {
    document.getElementById('fps-counter').textContent = `FPS: ${Math.round(fpsFrames / fpsTime)}`;
    fpsFrames = 0;
    fpsTime = 0;
  }

  // WASD Movement
  const speed = isSprinting ? 50 : 35;
  direction.set(0, 0, 0);

  const forward = new THREE.Vector3();
  camera.getWorldDirection(forward);
  forward.y = 0;
  forward.normalize();

  const right = new THREE.Vector3();
  right.crossVectors(forward, new THREE.Vector3(0, 1, 0));

  // WASD Movement (and Arrow keys)
  if (keys['KeyW'] || keys['ArrowUp'])    direction.add(forward);
  if (keys['KeyS'] || keys['ArrowDown'])  direction.sub(forward);
  if (keys['KeyD'] || keys['ArrowRight']) direction.add(right);
  if (keys['KeyA'] || keys['ArrowLeft'])  direction.sub(right);

  // Shift for sprint
  isSprinting = keys['ShiftLeft'] || keys['ShiftRight'];

  // Jump with E key
  if (keys['KeyE'] && canJump) {
    velocity.y = jumpHeight;
    canJump = false;
  }

  // Gravity and jump physics
  velocity.y -= 0.8 * delta; // Gravity
  camera.position.y += velocity.y;
  
  // Ground check
  if (camera.position.y < 1.7) {
    camera.position.y = 1.7;
    velocity.y = 0;
    canJump = true;
  }

  if (direction.length() > 0) {
    direction.normalize();
    velocity.x += (direction.x * speed - velocity.x * 10) * delta;
    velocity.z += (direction.z * speed - velocity.z * 10) * delta;
  } else {
    velocity.x *= 0.9;
    velocity.z *= 0.9;
  }

  camera.position.x += velocity.x * delta;
  camera.position.z += velocity.z * delta;

  // Clamp to station bounds
  camera.position.x = Math.max(-10, Math.min(10, camera.position.x));
  camera.position.z = Math.max(-32, Math.min(32, camera.position.z));
  camera.position.y = 1.7;

  // Recoil recovery
  recoilAmount *= recoilRecovery;

  // Weapon return to position
  weaponGroup.position.z += (-0.5 - weaponGroup.position.z) * 0.15;
  weaponGroup.rotation.x += (0 - weaponGroup      .rotation.x) * 0.15;

  // Enemy AI - Move towards player
  enemyGroup.children.forEach((enemy) => {
    if (!enemy.userData.alive || !enemy.visible) return;

    const toPlayer = new THREE.Vector3();
    toPlayer.subVectors(camera.position, enemy.position);
    toPlayer.y = 0;
    const dist = toPlayer.length();
    toPlayer.normalize();

    // Rotate towards player (smoothly)
    const targetRotation = Math.atan2(toPlayer.x, toPlayer.z);
    let rotDiff = targetRotation - enemy.rotation.y;
    while (rotDiff > Math.PI) rotDiff -= Math.PI * 2;
    while (rotDiff < -Math.PI) rotDiff += Math.PI * 2;
    enemy.rotation.y += rotDiff * delta * 3;

    // Move towards player if far enough, stop if too close
    if (dist > 1.5) {
      const moveSpeed = enemy.userData.speed * delta;
      enemy.position.x += toPlayer.x * moveSpeed;
      enemy.position.z += toPlayer.z * moveSpeed;

      // Simple bobbing animation for walking
      enemy.position.y = Math.sin(now * 0.003 + enemy.id) * 0.15;

      // Arm swing animation
      enemy.children.forEach((child, idx) => {
        if (idx >= 6 && idx <= 9) { // Arms and hands
          child.rotation.x = -0.5 + Math.sin(now * 0.004 + idx) * 0.3;
        }
      });
    }

    // Attack player when close enough
    if (dist < 2.0 && enemy.userData.attackTimer <= 0) {
      const damage = 3 + Math.random() * 3;
      playerHealth -= damage;
      enemy.userData.attackTimer = 3; // Cooldown between attacks

      // Damage flash
      document.getElementById('damage-flash').style.opacity = '0.6';
      setTimeout(() => {
        document.getElementById('damage-flash').style.opacity = '0';
      }, 200);

      // Camera shake on hit
      camera.position.x += (Math.random() - 0.5) * 0.3;
      camera.position.z += (Math.random() - 0.5) * 0.3;
    }

    enemy.userData.attackTimer -= delta;
  });

  // Update health bar
  const healthPercent = Math.max(0, playerHealth);
  document.getElementById('health-bar').style.width = `${healthPercent}%`;

  if (playerHealth <= 20) {
    document.getElementById('health-bar').style.background = 'linear-gradient(90deg, #ff0000, #880000)';
  } else if (playerHealth <= 50) {
    document.getElementById('health-bar').style.background = 'linear-gradient(90deg, #ffaa00, #884400)';
  } else {
    document.getElementById('health-bar').style.background = 'linear-gradient(90deg, #00ff00, #006600)';
  }

  // Game over check
  if (playerHealth <= 0 && !document.getElementById('game-over').style.display) {
    document.getElementById('final-kills').textContent = kills;
    document.getElementById('game-over').style.display = 'flex';
    document.exitPointerLock();
  }

  // Update minimap every few frames
  if (Math.floor(now / 100) % 2 === 0) {
    updateMinimap();
  }
}

function render() {
  requestAnimationFrame(render);
  update();
  renderer.render(scene, camera);
}

// ============================================================
// WINDOW RESIZE HANDLER
// ============================================================
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Start the loop
updateWeaponModel();
updateWeaponDisplay();
ammo = weapons[0].ammo;
maxAmmo = weapons[0].ammo;
document.getElementById('ammo-count').textContent = `${ammo} / ∞`;
render();
</script>
