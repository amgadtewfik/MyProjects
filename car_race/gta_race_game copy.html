<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GTA Style 3D Racing - AI Model</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
      * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
      }

      body {
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          overflow: hidden;
          background: #1a1a2e;
      }

      #game-container {
          position: relative;
          width: 100vw;
          height: 100vh;
      }

      /* HUD */
      .hud-top {
          display: flex;
          justify-content: space-between;
          padding: 20px 40px;
          background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
      }

      .hud-left {
          display: flex;
          gap: 30px;
      }

      .hud-right {
          display: flex;
          align-items: center;
          gap: 25px;
      }

      .hud-panel {
          background: rgba(0, 0, 0, 0.6);
          border-left: 3px solid #ff9800;
          padding: 15px 20px;
          border-radius: 8px;
          backdrop-filter: blur(4px);
      }

      .hud-label {
          color: #888;
          font-size: 11px;
          text-transform: uppercase;
          letter-spacing: 2px;
          margin-bottom: 5px;
      }

      .hud-value {
          color: #fff;
          font-size: 24px;
          font-weight: bold;
          font-family: 'Courier New', monospace;
          text-shadow: 0 0 10px rgba(255,255,255,0.3);
      }

      .hud-value.speed {
          color: #4caf50;
          font-size: 36px;
      }

      .hud-value.lap {
          color: #ff9800;
      }

      .hud-value.time {
          color: #2196f3;
      }

      /* Speedometer */
      .speedometer-container {
          position: absolute;
          bottom: 40px;
          right: 50px;
          width: 180px;
          height: 180px;
          background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.4) 70%);
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: 0 0 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.8);
      }

      .speedometer-inner {
          width: 140px;
          height: 140px;
          background: linear-gradient(135deg, #1e3a5f 0%, #0d1621 100%);
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
      }

      .speedometer-value {
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          font-size: 42px;
          font-weight: bold;
          color: #ff9800;
          font-family: 'Courier New', monospace;
      }

      .speedometer-unit {
          position: absolute;
          bottom: 15px;
          right: 35px;
          font-size: 12px;
          color: #666;
      }

      /* Controls hint */
      .controls-hint {
          position: absolute;
          top: 40px;
          left: 50%;
          transform: translateX(-50%);
          text-align: center;
      }

      .controls-hint h3 {
          color: #ff9800;
          margin-bottom: 10px;
          font-size: 20px;
          letter-spacing: 3px;
      }

      .controls-hint p {
          color: #aaa;
          font-size: 14px;
          line-height: 1.8;
      }

      /* Menu */
      #main-menu {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: linear-gradient(135deg, rgba(10,20,40,0.95) 0%, rgba(20,30,60,0.98) 100%);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          z-index: 1000;
      }

      .menu-logo {
          text-align: center;
          margin-bottom: 50px;
      }

      .menu-logo h1 {
          font-size: 72px;
          color: #ff9800;
          text-transform: uppercase;
          letter-spacing: 8px;
          text-shadow: 0 0 40px rgba(255,152,0,0.6), 0 0 80px rgba(255,152,0,0.3);
          margin-bottom: 10px;
      }

      .menu-logo h1::after {
          content: '';
          display: block;
          width: 100%;
          height: 4px;
          background: linear-gradient(90deg, transparent, #ff9800, transparent);
          margin-top: 5px;
      }

      .menu-logo p {
          color: #666;
          font-size: 16px;
          letter-spacing: 4px;
          text-transform: uppercase;
          margin-top: 8px;
      }

      .menu-buttons {
          display: flex;
          gap: 20px;
          flex-wrap: wrap;
          justify-content: center;
      }

      .menu-btn {
          padding: 16px 40px;
          font-size: 18px;
          text-transform: uppercase;
          letter-spacing: 3px;
          border: none;
          cursor: pointer;
          transition: all 0.3s ease;
          position: relative;
          overflow: hidden;
      }

      .menu-btn::before {
          content: '';
          position: absolute;
          top: 0;
          left: -100%;
          width: 100%;
          height: 100%;
          background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
          animation: shimmer 3s infinite;
      }

      @keyframes shimmer {
          0%, 100% { transform: translateX(-100%) rotate(45deg); }
          50% { transform: translateX(100%) rotate(45deg); }
      }

      .menu-btn-primary {
          background: linear-gradient(135deg, #ff9800 0%, #ff6f00 100%);
          color: white;
          border-radius: 8px;
          box-shadow: 0 4px 20px rgba(255,152,0,0.4), inset 0 1px 0 rgba(255,255,255,0.3);
      }

      .menu-btn-primary:hover {
          transform: translateY(-2px);
          box-shadow: 0 6px 30px rgba(255,152,0,0.6), inset 0 1px 0 rgba(255,255,255,0.4);
      }

      .menu-btn-secondary {
          background: transparent;
          color: #ff9800;
          border: 2px solid #ff9800;
          border-radius: 8px;\n        }

      .menu-btn-secondary:hover {
          background: rgba(255,152,0,0.1);
          color: white;
      }

      /* Win Screen */
      #win-screen {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: linear-gradient(135deg, rgba(0,40,20,0.9) 0%, rgba(0,20,40,0.95) 100%);
          display: none;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          z-index: 1000;
      }

      .win-title {
          font-size: 64px;
          color: #4caf50;
          text-transform: uppercase;
          letter-spacing: 8px;
          margin-bottom: 20px;
          text-shadow: 0 0 40px rgba(76,175,80,0.8);
      }

      .win-time {
          font-size: 32px;
          color: #fff;
          margin-bottom: 40px;
      }

      /* Lap Counter */
      .lap-counter {
          position: absolute;
          top: 150px;
          right: 40px;
          text-align: center;
      }

      .lap-counter h2 {
          color: #ff9800;
          font-size: 16px;
          letter-spacing: 3px;
          margin-bottom: 5px;
      }

      .lap-counter .current-lap {
          font-size: 48px;
          color: white;
          font-weight: bold;
          text-shadow: 0 0 20px rgba(255,152,0,0.6);
      }

      /* Boost indicator */
      .boost-indicator {
          position: absolute;
          bottom: 40px;
          left: 50%;
          transform: translateX(-50%);
          display: flex;
          gap: 8px;
      }

      .boost-bar {
          width: 12px;
          height: 60px;
          background: #333;
          border-radius: 4px;
          overflow: hidden;
          position: relative;
      }

      .boost-fill {
          height: 0%;
          width: 100%;
          background: linear-gradient(180deg, #ff9800 0%, #ff5722 100%);
          border-radius: 4px;
      }

      .boost-fill.active {
          animation: boostPulse 0.3s ease-in-out infinite alternate;
      }

      @keyframes boostPulse {
          from { transform: scaleY(1); }
          to { transform: scaleY(1.2); }
      }

      /* Ghost car indicator */
      .ghost-indicator {
          position: absolute;
          top: 40px;
          right: 50%;
          transform: translateX(50%);
          display: flex;
          gap: 8px;
      }

      .ghost-dot {
          width: 12px;
          height: 12px;
          border-radius: 50%;
          background: #333;
          position: relative;
          overflow: hidden;
      }

      .ghost-dot.active {
          animation: ghostPulse 1s ease-in-out infinite;
      }

      @keyframes ghostPulse {
          0%, 100% { transform: scale(1); opacity: 1; }
          50% { transform: scale(1.3); opacity: 0.7; }
      }

      /* Collectible indicator */
      .collectible-indicator {
          position: absolute;
          top: 40px;
          left: 50%;
          transform: translateX(-50%);
          display: flex;
          gap: 8px;
      }

      .collectible-dot {
          width: 12px;
          height: 12px;
          border-radius: 50%;
          background: #333;
          position: relative;
          overflow: hidden;
      }

      .collectible-dot.active {
          animation: collectPulse 0.8s ease-in-out infinite alternate;
      }

      @keyframes collectPulse {
          from { transform: scale(1); opacity: 1; }
          to { transform: scale(1.4); opacity: 0.6; }
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <!-- Main Menu -->
      <div id="main-menu">
        <div class="menu-logo">
          <h1>Street Racer</h1>
          <p>AI Model Racing Game</p>
        </div>
        <div class="menu-buttons">
          <button class="menu-btn menu-btn-primary" onclick="startGame()">
            Start Race
          </button>
          <button class="menu-btn menu-btn-secondary" onclick="togglePause()">
            Pause
          </button>
        </div>
      </div>

      <!-- Win Screen -->
      <div id="win-screen">
        <h1 class="win-title">Race Complete!</h1>
        <p class="win-time" id="final-time"></p>
        <button class="menu-btn menu-btn-primary" onclick="resetGame()">
          Play Again
        </button>
      </div>

      <!-- HUD -->
      <div class="hud-top">
        <div class="hud-left">
          <div class="hud-panel">
            <div class="hud-label">Lap</div>
            <div class="hud-value lap" id="lap-display">1/3</div>
          </div>
          <div class="hud-panel">
            <div class="hud-label">Time</div>
            <div class="hud-value time" id="time-display">00:00.00</div>
          </div>
        </div>
        <div class="hud-right">
          <div class="lap-counter">
            <h2>Lap Counter</h2>
            <div class="current-lap" id="lap-number">1</div>
            /3
          </div>
          <div class="collectible-indicator">
            <span style="color: #888; font-size: 10px">BOOST</span>
            <div class="boost-indicator">
              <div class="boost-bar">
                <div class="boost-fill" id="boost-fill"></div>
              </div>
              <div class="boost-bar">
                <div class="boost-fill" id="boost-fill-2"></div>
              </div>
              <div class="boost-bar">
                <div class="boost-fill" id="boost-fill-3"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="controls-hint">
        <h3>CONTROLS</h3>
        <p>WASD / Arrows - Drive | SPACE - Brake | SHIFT - Boost</p>
      </div>

      <!-- Speedometer -->
      <div class="speedometer-container">
        <div class="speedometer-inner">
          <span class="speedometer-value" id="speed-display">0</span
          ><span style="font-size: 14px; color: #666">KM/H</span>
          <span class="speedometer-unit">AI MODEL RACING</span>
        </div>
      </div>

      <!-- Ghost Indicator -->
      <div class="ghost-indicator">
        <span style="color: #888; font-size: 10px">GHOST</span>
        <div class="ghost-dot" id="ghost-1"></div>
        <div class="ghost-dot" id="ghost-2"></div>
      </div>
    </div>

    <script>
      // Game State
      const gameState = {
        isPlaying: false,
        isPaused: true,
        currentLap: 1,
        totalLaps: 3,
        startTime: null,
        elapsedTime: 0,
        speed: 0,
        boostActive: false,
        collectiblesCollected: 0,
      };

      // Three.js Setup
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a2e);
      scene.fog = new THREE.FogExp2(0x1a1a2e, 0.008);

      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document
        .getElementById("game-container")
        .appendChild(renderer.domElement);

      // Lighting
      const ambientLight = new THREE.AmbientLight(0x404060, 0.5);
      scene.add(ambientLight);

      const sunLight = new THREE.DirectionalLight(0xffffff, 1);
      sunLight.position.set(50, 100, 75);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.width = 2048;
      sunLight.shadow.mapSize.height = 2048;
      sunLight.shadow.camera.left = -100;
      sunLight.shadow.camera.right = 100;
      sunLight.shadow.camera.top = 100;
      sunLight.shadow.camera.bottom = -100;
      scene.add(sunLight);

      // Track Setup
      const trackWidth = 25;
      const trackLength = 800;
      const numSegments = 40;
      const segmentLength = trackLength / numSegments;

      // Create grassy areas on sides
      for (let i = 0; i < numSegments; i++) {
        const zPos = -trackLength / 2 + i * segmentLength;

        // Left grass
        const leftGrassGeo = new THREE.PlaneGeometry(15, 40);
        const leftGrassMat = new THREE.MeshStandardMaterial({
          color: 0x2d5a27,
          roughness: 0.9,
        });
        const leftGrass = new THREE.Mesh(leftGrassGeo, leftGrassMat);
        leftGrass.rotation.x = -Math.PI / 2;
        leftGrass.position.set(-trackWidth / 2 - 15, 0, zPos);
        scene.add(leftGrass);

        // Right grass
        const rightGrassGeo = new THREE.PlaneGeometry(15, 40);
        const rightGrassMat = new THREE.MeshStandardMaterial({
          color: 0x2d5a27,
          roughness: 0.9,
        });
        const rightGrass = new THREE.Mesh(rightGrassGeo, rightGrassMat);
        rightGrass.rotation.x = -Math.PI / 2;
        rightGrass.position.set(trackWidth / 2 + 15, 0, zPos);
        scene.add(rightGrass);
      }

      // Create track segments with curves and straights
      const trackSegments = [];
      let currentZ = -trackLength / 2;

      for (let i = 0; i < numSegments; i++) {
        const zPos = -trackLength / 2 + i * segmentLength;

        // Create varied track segments
        if (i % 5 === 0) {
          // Straight section
          createStraightSegment(zPos);
        } else if (i % 3 === 0) {
          // Curved section
          const curveZ = zPos + segmentLength / 2;
          createCurvedSection(curveZ, i % 6 === 0 ? -1 : 1);
        } else {
          // Mixed section with small curves
          createMixedSegment(zPos);
        }
      }

      function createStraightSegment(zPos) {
        const segmentGeo = new THREE.BoxGeometry(2, 1, trackWidth + 4);
        const segmentMat = new THREE.MeshStandardMaterial({
          color: 0x333355,
          roughness: 0.8,
        });

        for (let z = -trackWidth / 2; z < trackWidth; z += 1) {
          const segment = new THREE.Mesh(segmentGeo, segmentMat);
          segment.position.set(0, 0.5, zPos + z);
          scene.add(segment);
        }
      }

      function createCurvedSection(zCenter, direction) {
        const radius = 40;
        const angleStart = -Math.PI / 2;
        const angleEnd = Math.PI / 2;

        for (let angle = angleStart; angle <= angleEnd; angle += 0.1) {
          const x = Math.cos(angle) * radius + direction * 60;
          const z = zCenter + Math.sin(angle) * radius;

          if (z < -trackLength / 2 || z > trackLength / 2) continue;

          const segmentGeo = new THREE.BoxGeometry(1, 1, 1);
          const segmentMat = new THREE.MeshStandardMaterial({
            color: 0x333355,
            roughness: 0.8,
          });

          const segment = new THREE.Mesh(segmentGeo, segmentMat);
          segment.position.set(x, 0.5, z);
          scene.add(segment);
        }
      }

      function createMixedSegment(zPos) {
        // Small curves and straights
        for (let i = 0; i < 3; i++) {
          const curveZ = zPos + (i * segmentLength) / 2;
          createCurvedSection(curveZ, Math.sin(i) > 0 ? 1 : -1);
        }
      }

      // Create barriers on track edges
      for (let i = 0; i < numSegments; i++) {
        const zPos = -trackLength / 2 + i * segmentLength;

        // Left barrier
        const leftBarrierGeo = new THREE.BoxGeometry(1, 3, trackWidth);
        const leftBarrierMat = new THREE.MeshStandardMaterial({
          color: 0x8888aa,
          roughness: 0.6,
        });
        const leftBarrier = new THREE.Mesh(leftBarrierGeo, leftBarrierMat);
        leftBarrier.position.set(-trackWidth / 2 - 1, 1.5, zPos);
        scene.add(leftBarrier);

        // Right barrier
        const rightBarrierGeo = new THREE.BoxGeometry(1, 3, trackWidth);
        const rightBarrierMat = new THREE.MeshStandardMaterial({
          color: 0x8888aa,
          roughness: 0.6,
        });
        const rightBarrier = new THREE.Mesh(rightBarrierGeo, rightBarrierMat);
        rightBarrier.position.set(trackWidth / 2 + 1, 1.5, zPos);
        scene.add(rightBarrier);
      }

      // Create start/finish line
      const finishLineZ = trackLength / 2 - 10;
      for (let i = 0; i < 4; i++) {
        const stripeGeo = new THREE.BoxGeometry(0.5, 3, 0.8);
        const stripeMat = new THREE.MeshStandardMaterial({
          color: i % 2 === 0 ? 0xffffff : 0x1a1a2e,
        });
        const stripe = new THREE.Mesh(stripeGeo, stripeMat);
        stripe.position.set(0, 1.5, finishLineZ + i * 3 - 6);
        scene.add(stripe);
      }

      // Create player car
      const playerCarGroup = new THREE.Group();

      // Car body
      const carBodyGeo = new THREE.BoxGeometry(1.8, 0.5, 3.5);
      const carBodyMat = new THREE.MeshStandardMaterial({
        color: 0xff4444,
        metalness: 0.7,
        roughness: 0.2,
      });
      const carBody = new THREE.Mesh(carBodyGeo, carBodyMat);
      playerCarGroup.add(carBody);

      // Car roof
      const carRoofGeo = new THREE.BoxGeometry(1.4, 0.3, 1.5);
      const carRoofMat = new THREE.MeshStandardMaterial({
        color: 0xff6666,
        metalness: 0.7,
        roughness: 0.2,
      });
      const carRoof = new THREE.Mesh(carRoofGeo, carRoofMat);
      carRoof.position.set(0, 0.45, -0.3);
      playerCarGroup.add(carRoof);

      // Car windshield
      const windshieldGeo = new THREE.BoxGeometry(1.2, 0.25, 0.1);
      const windshieldMat = new THREE.MeshStandardMaterial({
        color: 0x88ccff,
        transparent: true,
        opacity: 0.6,
      });
      const windshield = new THREE.Mesh(windshieldGeo, windshieldMat);
      windshield.position.set(0, 0.35, -1.2);
      playerCarGroup.add(windshield);

      // Car wheels
      for (let i = 0; i < 4; i++) {
        const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.2, 16);
        const wheelMat = new THREE.MeshStandardMaterial({
          color: 0x1a1a1a,
          roughness: 0.9,
        });
        const wheel = new THREE.Mesh(wheelGeo, wheelMat);
        wheel.rotation.x = Math.PI / 2;

        if (i === 0 || i === 3) {
          wheel.position.set(1, -0.45, 1.2 + (i % 2) * 0.8);
        } else {
          wheel.position.set(-1, -0.45, 1.2 + (i % 2) * 0.8);
        }
        playerCarGroup.add(wheel);
      }

      // Car lights
      const tailLightGeo = new THREE.BoxGeometry(0.3, 0.15, 0.1);
      const tailLightMat = new THREE.MeshStandardMaterial({
        color: 0xff2222,
        emissive: 0xff2222,
        emissiveIntensity: 0.8,
      });
      for (let i = 0; i < 4; i++) {
        const tailLight = new THREE.Mesh(tailLightGeo, tailLightMat);
        tailLight.position.set(
          1 + (i % 2) * 0.6,
          -0.35,
          -1.75 + (i > 1 ? 0.4 : 0)
        );
        playerCarGroup.add(tailLight);
      }

      // Car headlights
      const headlightGeo = new THREE.BoxGeometry(0.2, 0.1, 0.1);
      const headlightMat = new THREE.MeshStandardMaterial({
        color: 0xffffaa,
        emissive: 0xffffaa,
        emissiveIntensity: 0.9,
      });
      for (let i = 0; i < 2; i++) {
        const headlight = new THREE.Mesh(headlightGeo, headlightMat);
        headlight.position.set(1 + (i % 2) * 0.6, -0.35, 1.75);
        playerCarGroup.add(headlight);
      }

      scene.add(playerCarGroup);

      // Collectibles / Boost pads
      const collectibles = [];
      for (let i = 0; i < 8; i++) {
        const angle = (i / 8) * Math.PI * 2;
        const radius = trackWidth + 15;
        const x = Math.cos(angle) * radius;
        const z = -trackLength / 4 + (i % 3 === 0 ? 0 : segmentLength);

        const collectibleGeo = new THREE.OctahedronGeometry(0.8);
        const collectibleMat = new THREE.MeshStandardMaterial({
          color: Math.random() > 0.5 ? 0x4caf50 : 0xff9800,
          emissive: Math.random() > 0.5 ? 0x4caf50 : 0xff9800,
          emissiveIntensity: 0.6,
        });
        const collectible = new THREE.Mesh(collectibleGeo, collectibleMat);
        collectible.position.set(x, 1, z);
        scene.add(collectible);
        collectibles.push({ mesh: collectible, active: true });
      }

      // Ghost cars (AI)
      const ghostCars = [];
      for (let i = 0; i < 3; i++) {
        const ghostCarGroup = new THREE.Group();

        // Car body
        const carBodyGeo = new THREE.BoxGeometry(1.8, 0.5, 3.5);
        const colors = [0x2196f3, 0xe91e63, 0xffc107];
        const color = colors[i % colors.length];

        const carBodyMat = new THREE.MeshStandardMaterial({
          color: color,
          metalness: 0.7,
          roughness: 0.2,
        });
        const carBody = new THREE.Mesh(carBodyGeo, carBodyMat);
        ghostCarGroup.add(carBody);

        // Car roof
        const carRoofGeo = new THREE.BoxGeometry(1.4, 0.3, 1.5);
        const carRoofMat = new THREE.MeshStandardMaterial({
          color: color,
          metalness: 0.7,
          roughness: 0.2,
        });
        const carRoof = new THREE.Mesh(carRoofGeo, carRoofMat);
        carRoof.position.set(0, 0.45, -0.3);
        ghostCarGroup.add(carRoof);

        // Wheels
        for (let j = 0; j < 4; j++) {
          const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.2, 16);
          const wheelMat = new THREE.MeshStandardMaterial({
            color: 0x1a1a1a,
            roughness: 0.9,
          });
          const wheel = new THREE.Mesh(wheelGeo, wheelMat);
          wheel.rotation.x = Math.PI / 2;

          if (j === 0 || j === 3) {
            wheel.position.set(1, -0.45, 1.2 + (j % 2) * 0.8);
          } else {
            wheel.position.set(-1, -0.45, 1.2 + (j % 2) * 0.8);
          }
          ghostCarGroup.add(wheel);
        }

        // Set initial position for each ghost car
        const positions = [
          { x: -30, z: 0 },
          { x: 30, z: 150 },
          { x: -40, z: -200 },
        ];

        ghostCarGroup.position.set(positions[i].x, 0, positions[i].z);
        scene.add(ghostCarGroup);
        ghostCars.push({
          group: ghostCarGroup,
          speed: 15 + Math.random() * 10,
          offset: (i % 3) * segmentLength,
        });
      }

      // Camera follow player car
      const cameraOffset = new THREE.Vector3(0, 8, -20);
      let targetCameraPos = new THREE.Vector3();

      // Game loop
      function update() {
        if (!gameState.isPlaying) return;

        // Update speedometer
        document.getElementById("speed-display").textContent =
          Math.round(gameState.speed * 10) / 10;

        // Update boost indicator
        const boostFill1 = document.getElementById("boost-fill");
        const boostFill2 = document.getElementById("boost-fill-2");
        const boostFill3 = document.getElementById("boost-fill-3");

        if (gameState.boostActive) {
          [boostFill1, boostFill2, boostFill3].forEach((fill) => {
            fill.classList.add("active");
          });
        } else {
          [boostFill1, boostFill2, boostFill3].forEach((fill) => {
            fill.classList.remove("active");
          });
        }

        // Update ghost indicators
        const ghosts = document.querySelectorAll(".ghost-dot");
        ghosts.forEach((dot, i) => {
          if (i < ghostCars.length && gameState.ghostCarsActive > 0 && gameState.ghostCarsActive[i]) {
            dot.classList.add("active");
          } else {
            dot.classList.remove("active");
          }
        });

        // Update collectible indicators
        const collectiblesEl = document.querySelectorAll(".collectible-dot");
        collectiblesEl.forEach((el, i) => {
          if (i < collectibles.length && gameState.collectiblesActive[i]) {
            el.classList.add("active");
          } else {
            el.classList.remove("active");
          }
        });

        // Update lap counter
        document.getElementById("lap-display").textContent =
          `${gameState.currentLap}/${gameState.totalLaps}`;
        document.getElementById("lap-number").textContent =
          gameState.currentLap;

        // Update time display
        if (gameState.startTime) {
          const elapsed = Date.now() - gameState.startTime;
          const minutes = Math.floor(elapsed / 60000);
          const seconds = Math.floor((elapsed % 60000) / 1000);
          const milliseconds = Math.floor((elapsed % 1000) / 10);
          document.getElementById("time-display").textContent =
            `${minutes.toString().padStart(2, "0")}:${seconds.toString().padStart(2, "0")}.${milliseconds.toString().padStart(2, "0")}`;
        }

        // Update camera position to follow player car
        const camPos = new THREE.Vector3(
          targetCameraPos.x + 15 * Math.sin(targetCameraPos.y / 40),
          8,
          -targetCameraPos.z + 20
        );
        camera.position.lerp(camPos, 0.05);
        camera.lookAt(
          playerCarGroup.position.clone().add(new THREE.Vector3(0, 0, 10))
        );
      }

      // Input handling
      const keys = {
        ArrowUp: false,
        ArrowDown: false,
        ArrowLeft: false,
        ArrowRight: false,
        w: false,
        W: false,
        s: false,
        S: false,
        a: false,
        A: false,
        d: false,
        D: false,
      };

      window.addEventListener("keydown", (e) => {
        if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
      });

      window.addEventListener("keyup", (e) => {
        if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
      });

      // Game functions
      function startGame() {
        document.getElementById("main-menu").style.display = "none";
        gameState.isPlaying = true;
        gameState.isPaused = false;
        gameState.currentLap = 1;
        gameState.startTime = null;
        gameState.elapsedTime = 0;
        gameState.speed = 0;
        gameState.boostActive = false;

        // Reset ghost cars
        ghostCars.forEach((ghost, i) => {
          const positions = [
            { x: -30, z: 0 },
            { x: 30, z: 150 },
            { x: -40, z: -200 },
          ];
          ghost.group.position.set(positions[i].x, 0, positions[i].z);
        });

        // Reset collectibles
        collectibles.forEach((col) => (col.active = true));
      }

      function togglePause() {
        if (!gameState.isPlaying) return;
        gameState.isPaused = !gameState.isPaused;

        const menuBtn = document.querySelector(".menu-btn-secondary");
        if (gameState.isPaused) {
          menuBtn.textContent = "Resume";
        } else {
          menuBtn.textContent = "Pause";
        }
      }

      function resetGame() {
        document.getElementById("win-screen").style.display = "none";
        startGame();
      }

      // Main game loop
      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        update();
        renderer.render(scene, camera);
      }

      animate();
    </script>
  </body>
</html>
