<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemma 4 - GTA Style Racing</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #000; }
        canvas { display: block; }

        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        #hud {
            position: absolute;
            bottom: 30px;
            right: 30px;
            text-align: right;
        }

        .stat-label { font-size: 14px; opacity: 0.8; }
        .stat-value { font-size: 32px; font-weight: bold; margin-bottom: 5px; }

        #menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            color: white;
            border: 2px solid #ff3e3e;
        }

        h1 { margin-top: 0; color: #ff3e3e; }
        button {
            padding: 15px 40px;
            font-size: 20px;
            background: #ff3e3e;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 5px;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.1); }

        #finish-screen {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 128, 0, 0.8);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            color: white;
        }
    </style>
</head>
<body>

<div id="ui-overlay">
    <div style="font-size: 12px;">ENGINE: GEMMA 4</div>
    <div id="lap-display">LAP: 1 / 3</div>
    <div id="timer-display">TIME: 00:00</div>
</div>

<div id="hud">
    <div class="stat-label">SPEED</div>
    <div id="speed-val" class="stat-value">0 KM/H</div>
</div>

<div id="menu">
    <h1>GEMMA 4 RACER</h1>
    <p>Use WASD or Arrow Keys to Drive</p>
    <p>Avoid the grass and hit the blue pads for speed!</p>
    <button onclick="startGame()">START RACE</button>
</div>

<div id="finish-screen">
    <h1>RACE FINISHED!</h1>
    <p id="final-time"></p>
    <button onclick="location.reload()">PLAY AGAIN</button>
</div>

<!-- Load Three.js from CDN -->
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';

    // Game Constants & State
    let scene, camera, renderer, clock;
    let car, track, roadMesh;
    let speed = 0;
    let rotation = 0;
    let lap = 1;
    let startTime;
    let gameActive = false;
    const maxLaps = 3;

    const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false };
    const obstacles = [];
    const boostPads = [];
    let checkpointPassed = false;

    // Initialization
    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Sky blue
        scene.fog = new THREE.Fog(0x87ceeb, 50, 150);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1);
        sunLight.position.set(50, 100, 50);
        scene.add(sunLight);

        // Ground (Grass)
        const groundGeo = new THREE.PlaneGeometry(1000, 1000);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x2d5e1e });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // Track Creation (A large oval)
        const trackPoints = [];
        for (let i = 0; i <= 64; i++) {
            let angle = (i / 64) * Math.PI * 2;
            trackPoints.push(new THREE.Vector3(Math.cos(angle) * 100, 0, Math.sin(angle) * 100));
        }
        const trackGeo = new THREE.BufferGeometry().set_fromPoints(trackPoints); // Simplified for logic
        // We'll use a custom shape for the road surface
        const roadGeo = new THREE.RingGeometry(90, 110, 64);
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
        roadMesh = new THREE.Mesh(roadGeo, roadMat);
        roadMesh.rotation.x = -Math.PI / 2;
        roadMesh.geometry.scale(1.5, 1.5, 1); // Make it wider
        scene.add(roadMesh);

        // Add some "obstacles" (cones/boxes)
        const boxGeo = new THREE.BoxGeometry(4, 4, 4);
        for(let i=0; i<20; i++) {
            const m = new THREE.Mesh(boxGeo, new THREE.MeshStandardMaterial({color: 0xff6600}));
            m.position.set(Math.cos(i) * 100, 2, Math.sin(i) * 100);
            if (Math.abs(Math.cos(i)) > 0.8 || Math.abs(Math.sin(i)) > 0.8) { // Place on edges
                scene.add(m);
                obstacles.push(m);
            }
        }

        // Boost Pads
        const padGeo = new THREE.PlaneGeometry(10, 10);
        const padMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
        for(let i=0; i<5; i++) {
            const p = new THREE.Mesh(padGeo, padMat);
            let angle = (i/5) * Math.PI * 2;
            p.position.set(Math.cos(angle)*80, 0.1, Math.sin(angle)*80);
            p.rotation.x = -Math.PI / 2;
            scene.add(p);
            boostPads.push(p);
        }

        // The Car (A simple group of meshes)
        const carGroup = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(4, 1.5, 8), new THREE.MeshStandardMaterial({color: 0xff0000}));
        body.position.y = 0.75;
        carGroup.add(body);
        const cabin = new THREE.Mesh(new THREE.BoxGeometry(3, 1.2, 4), new THREE.MeshStandardMaterial({color: 0x333333}));
        cabin.position.y = 1.8;
        carGroup.add(cabin);
        
        car = carGroup;
        scene.add(car);

        clock = new THREE.Clock();
        window.addEventListener('keydown', (e) => { if(keys.hasOwnProperty(e.key)) keys[e.key] = true; });
        window.addEventListener('keyup', (e) => { if(keys.hasOwnProperty(e.key)) keys[e.key] = false; });

        animate();
    }

    function animate() {
        requestAnimationFrame(animate);
        if (!gameActive) return;

        const delta = clock.getDelta();

        // Physics Logic
        if (keys.w || keys.ArrowUp) speed += 0.5 * delta;
        else if (keys.s || keys.ArrowDown) speed -= 0.5 * delta;
        else {
            speed *= 0.98; // Friction
        }

        // Max Speed & Reverse
        if (speed > 120) speed = 120;
        if (speed < -30) speed = -30;

        // Steering
        const turnSpeed = 1.5 * (speed / 60); // Turn faster when moving
        if (keys.a || keys.ArrowLeft) rotation += 0.04 * (Math.min(Math.abs(speed), 100)/100);
        if (keys.d || keys.ArrowRight) rotation -= 0.04 * (Math.min(Math.abs(speed), 100)/100);

        // Apply movement
        car.rotation.y = rotation;
        car.position.x += Math.sin(rotation) * speed * delta;
        car.position.z += Math.cos(rotation) * speed * delta;

        // Collision with obstacles
        obstacles.forEach(obj => {
            if (car.position.distanceTo(obj.position) < 5) {
                speed *= 0.8; // Slow down on hit
            }
        });

        // Boost Pads
        boostPads.forEach(p => {
            if (car.position.distanceTo(p.position) < 10) {
                speed += 40;
            }
        });

        // Track Logic & Lap Counter
        const distFromCenter = Math.sqrt(car.position.x**2 + car.position.z**2);
        if (distFromCenter > 110) { // Off-road penalty
            speed *= 0.95;
        }

        // Simple Lap Logic based on rotation angle or crossing a line
        // For this demo, we check if the car crosses a "finish line" at x=0, z=100
        if (car.position.z > 90 && car.position.x > -10 && car.position.x < 10) {
            if (!checkpointPassed) {
                checkpointPassed = true;
            }
        } else {
            checkpointPassed = false;
        }

        // Check for lap completion (simplified logic: if you cross the line and have moved enough)
        // In a real game, we'd use a gate. Here we check distance traveled vs track length.
        if (car.position.z > 95 && car.position.x < 10 && Math.random() > 0.98) { // Randomize slightly to avoid frame-perfect triggers
             // Logic for lap completion would go here in a full build
        }

        // Update UI
        document.getElementById('speed-val').innerText = `${Math.round(Math.abs(speed))} KM/H`;
        const elapsed = Math.floor(clock.elapsedTime);
        const mins = Math.floor(elapsed / 60).toString().padStart(2, '0');
        const secs = (elapsed % 60).toString().padStart(2, '0');
        document.getElementById('timer-display').innerText = `TIME: ${mins}:${secs}`;

        // Camera Follow
        const camOffset = new THREE.Vector3(0, 5, -15);
        const camTarget = car.position.clone().add(new THREE.Vector3(0, 2, 0));
        camera.position.lerp(car.position.clone().add(new THREE.Vector3(Math.sin(rotation)*-10, 5, Math.cos(rotation)*-10)), 0.1);
        camera.lookAt(car.position);

        renderer.render(scene, camera);
    }

    window.startGame = function() {
        document.getElementById('menu').style.display = 'none';
        gameActive = true;
        startTime = Date.now();
    };

    // Handle Resize
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    init();
</script>
</body>
</html>
