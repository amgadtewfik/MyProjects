<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turbo Racer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
canvas { display: block; image-rendering: pixelated; }
</style>
</script>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = 1024;
canvas.height = 768;

// Game constants
const SEGMENT_LENGTH = 200;
const ROAD_WIDTH = 100;
const MAX_SPEED = 300;
const ACCEL_MAX = 250;
const BRAKE_FORCE = 150;
const OFFROAD_DRAG = 0.98;
const DRAG_MULTIPLIER = 0.75;
const DIST_FOV = 250;
const SEGMENTS = 5000;

// Game state
let gameState = 'GARAGE'; // MENU, GARAGE, COUNTDOWN, RACING, FINISHED
let segments = [];
let playerPos = 0;
let playerSpeed = 0;
let playerX = 0;
let playerZ = 0;
let carAngle = 0;
let carTilt = 0;

// Cars
const cars = [
    { name: 'Street Legal', color: '#ff0000', speed: 0.7, handling: 0.8, accel: 0.6, desc: 'Balanced street car' },
    { name: 'Turbo Monster', color: '#0066ff', speed: 1.2, handling: 0.5, accel: 0.9, desc: 'Maximum speed and acceleration' },
    { name: 'Drift King', color: '#00ff66', speed: 0.8, handling: 1.4, accel: 0.7, desc: 'Insane handling for tight corners' },
    { name: 'Speed Demon', color: '#ffaa00', speed: 1.5, handling: 0.3, accel: 0.4, desc: 'Ultimate speed but hard to control' },
    { name: 'Balanced Pro', color: '#cc66ff', speed: 1.0, handling: 1.0, accel: 1.0, desc: 'Perfectly balanced machine' }
];

let selectedCar = 0;
let bestLapTime = Infinity;
let currentLapTime = 0;
let lapCount = 0;
let countdownTimer = 3;
let countdownStage = 0;
let totalDistance = 0;
let aiOpponents = [];
let trackLength = 0;
let skyColor1 = [25, 97, 144];
let skyColor2 = [68, 160, 207];
let bgScenery = { trees: [], mountains: [], buildings: [] };

// Input handling
const keys = {};
document.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === 'Escape') {
        if (gameState === 'RACING') gameState = 'PAUSED';
        else if (gameState === 'PAUSED') gameState = 'GARAGE';
    }
});
document.addEventListener('keyup', e => keys[e.key] = false);

// Initialize road segments
function initRoad() {
    segments = [];
    for (let i = 0; i < SEGMENTS; i++) {
        let curve = Math.sin(i * 0.01) * 2 + Math.sin(i * 0.03) * 1.5 + Math.sin(i * 0.005) * 3;
        let hill = Math.sin(i * 0.008) * 40 + Math.sin(i * 0.003) * 20;
        segments.push({
            index: i,
            curve: curve,
            height: hill,
            worldx: 0,
            worldz: 0,
            screeny: 0,
            color: '#444',
            roadColor: '#333'
        });
    }

    // Calculate total track length
    let prevX = 0;
    for (let i = 0; i < SEGMENTS; i++) {
        segments[i].worldx = (i ? segments[i-1].worldx : 0) + Math.sin(segments[i].curve) * 2;
        segments[i].worldz = i * SEGMENT_LENGTH;
    }
    trackLength = SEGMENTS * SEGMENT_LENGTH;

    // Initialize AI opponents
    aiOpponents = [];
    for (let i = 0; i < 8; i++) {
        aiOpponents.push({
            pos: Math.random() * SEGMENT_COUNT,
            speed: 150 + Math.random() * 100,
            color: ['#ff6600', '#66cc00', '#0099cc', '#cc3366', '#ff9933', '#33cc66', '#6666cc', '#cc6633'][i],
            x: Math.random() * 2 - 1,
            carType: i % 5
        });
    }

    // Initialize background scenery
    bgScenery.trees = [];
    for (let i = 0; i < SEGMENTS; i += 3) {
        if (Math.random() > 0.4) {
            bgScenery.trees.push({ segment: i, side: Math.random() > 0.5 ? 1 : -1 });
        }
    }

    bgScenery.mountains = [];
    for (let i = 0; i < SEGMENTS / 2; i += 1) {
        if (Math.random() > 0.3) {
            bgScenery.mountains.push({ segment: i, height: Math.random() * 60 + 40 });
        }
    }

    bgScenery.buildings = [];
    for (let i = 0; i < SEGMENTS / 15; i += 1) {
        if (Math.random() > 0.4) {
            bgScenery.buildings.push({ segment: i, height: Math.random() * 30 + 20 });
        }
    }
}

function drawMountain(x, y, width, height) {
    ctx.beginPath();
    ctx.moveTo(x - width/2, y);
    ctx.lineTo(x, y - height);
    ctx.lineTo(x + width/2, y);
    ctx.closePath();
    ctx.fillStyle = '#334';
    ctx.fill();
}

function drawTree(x, y) {
    // Trunk
    ctx.fillStyle = '#345';
    ctx.fillRect(x - 2, y - 10, 4, 10);
    // Leaves
    ctx.beginPath();
    ctx.arc(x, y - 10, 6, Math.PI * 2);
    ctx.fillStyle = '#369';
    ctx.fill();
}

function drawBuilding(x, y) {
    ctx.fillRect(x - 8, y - 20, 16, 20);
    ctx.fillStyle = '#556';
    ctx.fillRect(x - 4, y - 15, 3, 3);
    ctx.fillRect(x + 4, y - 15, 3, 3);
}

function drawSky() {
    // Sky gradient
    const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height / 2);
    gradient.addColorStop(0, `rgb(${skyColor1[0]}, ${skyColor1[1]}, ${skyColor1[2]})`);
    gradient.addColorStop(1, `rgb(${skyColor2[0]}, ${skyColor2[1]}, ${skyColor2[2]})`);
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height / 2);

    // Sun/Moon
    const sunX = Math.sin(Date.now() * 0.001) * 300 + 512;
    const sunY = 80 + Math.cos(Date.now() * 0.001) * 40;
    ctx.beginPath();
    ctx.arc(sunX, sunY, 40, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();

    // Clouds
    for (let i = 0; i < 8; i++) {
        const cx = (i * 137 + Date.now() * 0.01) % canvas.width;
        const cy = 50 + Math.sin(i * 3) * 40;
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.beginPath();
        ctx.arc(cx, cy, 15 + Math.sin(i) * 5, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawMountainRange() {
    // Draw mountains in background
    for (let i = 0; i < SEGMENTS / 3; i++) {
        const x = (i * 17 + Date.now() * 0.05) % canvas.width;
        const y = canvas.height / 2 - 80 - Math.sin(i * 0.3) * 40;
        drawMountain(x, y, 60, 40);
    }
}

function drawRoad() {
    // Draw road segments from back to front
    const baseX = canvas.width / 2;
    let prevSeg = null;

    for (let i = SEGMENTS - 1; i >= 0; i--) {
        const seg = segments[i];
        const screenY = canvas.height / 2 + playerZ * SEGMENT_LENGTH / trackLength;
        const perspective = Math.max(0.5, (canvas.width / 4) / (playerZ - playerPos));

        // Draw road segment
        ctx.beginPath();
        ctx.fillStyle = seg.color;
        ctx.fillRect(baseX - ROAD_WIDTH * perspective, screenY, ROAD_WIDTH * 2 * perspective, SEGMENT_LENGTH);

        // Road markings
        if (i % 5 === 0) {
            ctx.fillStyle = '#fff';
            ctx.fillRect(baseX - ROAD_WIDTH * perspective / 4, screenY, ROAD_WIDTH * perspective / 2, SEGMENT_LENGTH);
        }

        // Hills effect
        const hillHeight = Math.sin(seg.height * 0.01) * 5;
        if (hillHeight > 0) {
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(baseX - ROAD_WIDTH * perspective / 2, screenY + hillHeight, ROAD_WIDTH * perspective, SEGMENT_LENGTH);
        }
    }

    // Draw road edges/grass
    for (let i = 0; i < SEGMENTS; i += 10) {
        const seg = segments[i];
        const x = baseX + Math.sin(seg.curve * 0.1) * canvas.width / 2;
        ctx.fillStyle = '#369';
        ctx.fillRect(x - ROAD_WIDTH, canvas.height / 2, canvas.width / 4, SEGMENT_LENGTH);
    }
}

function drawCar(x, y, width, height, color, tilt) {
    // Car body
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(tilt * Math.PI / 180);

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(-width/2 + 5, -height/2 + 5, width, height);

    // Main body
    ctx.fillStyle = color;
    ctx.fillRect(-width/2, -height/2, width, height);

    // Wheels
    ctx.fillStyle = '#111';
    ctx.fillRect(-width/2 - 3, -height/2 + 8, 6, 8);
    ctx.fillRect(width/2 - 3, -height/2 + 8, 6, 8);

    // Windows
    ctx.fillStyle = '#334';
    ctx.fillRect(-width/2 + 10, -height/2 + 5, width - 20, height * 0.4);

    // Headlights
    ctx.fillStyle = '#fff';
    ctx.fillRect(-width/2 + 5, -height/2 + 8, 6, 3);
    ctx.fillRect(width/2 - 11, -height/2 + 8, 6, 3);

    // Tail lights
    if (tilt > 0) {
        ctx.fillStyle = '#f00';
        ctx.fillRect(-width/2 + 5, height/2 - 5, 6, 3);
        ctx.fillRect(width/2 - 11, height/2 - 5, 6, 3);
    }

    // Exhaust smoke when accelerating
    if (keys['ArrowRight'] || keys['w']) {
        for (let i = 0; i < 3; i++) {
            ctx.fillStyle = `rgba(180,180,180,${Math.random() * 0.5})`;
            ctx.beginPath();
            ctx.arc(Math.random() * width - width/2, height/2 + Math.random() * 20, 3 + Math.random() * 5, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    ctx.restore();
}

function drawHUD() {
    // Speedometer background
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(canvas.width - 250, canvas.height - 120, 240, 110);

    // RPM gauge
    const rpm = Math.min(playerSpeed / MAX_SPEED * 8000, 8000);
    const rpmAngle = (rpm / 8000) * Math.PI;
    ctx.beginPath();
    ctx.arc(canvas.width - 120, canvas.height - 50, 45, Math.PI + Math.PI/2, Math.PI + Math.PI/2 + Math.PI);
    ctx.strokeStyle = '#ff6600';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Speed text
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(`${Math.floor(playerSpeed)} km/h`, canvas.width - 120, canvas.height - 30);

    // Lap time
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(canvas.width - 250, canvas.height - 250, 240, 80);
    ctx.font = '16px Arial';
    ctx.fillText(`Lap Time: ${currentLapTime.toFixed(2)}s`, canvas.width - 130, canvas.height - 230);
    ctx.fillStyle = '#ffcc00';
    ctx.fillText(`Best Lap: ${bestLapTime === Infinity ? '---' : bestLapTime.toFixed(2)}`, canvas.width - 130, canvas.height - 215);

    // Lap counter
    ctx.fillStyle = '#fff';
    ctx.fillText(`Laps: ${lapCount}/3`, canvas.width - 130, canvas.height - 200);

    // Minimap
    drawMinimap();
}

function drawMinimap() {
    const mapX = 50;
    const mapY = 50;
    const mapWidth = 150;
    const mapHeight = 80;

    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(mapX - 5, mapY - 5, mapWidth + 10, mapHeight + 10);

    // Draw track outline on minimap
    ctx.strokeStyle = '#666';
    ctx.lineWidth = 2;
    for (let i = 0; i < SEGMENTS; i += 10) {
        const x = mapX + (i / SEGMENTS * mapWidth);
        const y = mapY + Math.sin(i * 0.05) * 20;
        ctx.beginPath();
        ctx.arc(x, y, 1, 0, Math.PI * 2);
        ctx.stroke();
    }

    // Player position on minimap
    const playerMapX = mapX + (playerPos / SEGMENTS * mapWidth);
    ctx.fillStyle = '#ff0';
    ctx.beginPath();
    ctx.arc(playerMapX, mapY + 40, 5, Math.PI * 2);
    ctx.fill();

    // AI opponents on minimap
    aiOpponents.forEach(ai => {
        const aiX = mapX + (ai.pos / SEGMENTS * mapWidth);
        ctx.fillStyle = ai.color;
        ctx.beginPath();
        ctx.arc(aiX, mapY + 40, 3, Math.PI * 2);
        ctx.fill();
    });

    // Labels
    ctx.fillStyle = '#fff';
    ctx.font = '10px Arial';
    ctx.textAlign = 'left';
    ctx.fillText('MINIMAP', mapX + 5, mapY - 3);
}

function updatePlayer() {
    const accel = keys['ArrowRight'] || keys['w'];
    const brake = keys['ArrowLeft'] || keys['s'];
    const steerLeft = keys['ArrowUp'] || keys['a'];
    const steerRight = keys['ArrowDown'] || keys['d'];

    // Acceleration/Braking
    if (accel) {
        playerSpeed += ACCEL_MAX * 0.01;
    } else if (brake) {
        playerSpeed -= BRAKE_FORCE * 0.01;
    }

    // Drag/friction
    playerSpeed *= DRAG_MULTIPLIER;

    // Steering
    const turnRate = Math.abs(playerSpeed) / MAX_SPEED * 4;
    if (steerLeft) carAngle -= turnRate;
    if (steerRight) carAngle += turnRate;

    // Update position
    playerPos += playerSpeed * 0.016;
    playerZ = playerPos % trackLength + SEGMENT_LENGTH;

    // Lap tracking
    if (playerPos > trackLength) {
        lapCount++;
        currentLapTime = 0;
        if (lapCount === 3) {
            gameState = 'FINISHED';
        }
    }

    // Update car tilt based on steering
    carTilt = steerLeft ? -5 : steerRight ? 5 : carTilt * 0.9;
}

function updateAI() {
    aiOpponents.forEach(ai => {
        ai.pos += ai.speed * 0.016;

        // Simple AI behavior - maintain position relative to player
        const dist = Math.abs(ai.pos - playerPos);
        if (dist < SEGMENT_LENGTH * 5) {
            ai.x += (Math.random() - 0.5) * 0.2;
        } else {
            ai.x *= 0.98; // Return to center
        }

        // Wrap around track
        ai.pos %= SEGMENT_COUNT;
    });
}

function drawBackgroundScenery() {
    const time = Date.now() * 0.001;

    // Draw trees along the road
    bgScenery.trees.forEach(tree => {
        if (tree.segment % 3 === 0) {
            const x = canvas.width / 2 + Math.sin(tree.segment * 0.1) * canvas.width / 4;
            const y = canvas.height / 2 + tree.side * 60;
            drawTree(x, y);
        }
    });

    // Draw mountains in background
    bgScenery.mountains.forEach(m => {
        if (m.segment % 5 === 0) {
            const x = (m.segment * 2 + time * 10) % canvas.width;
            drawMountain(x, canvas.height / 2 - 60, 80, m.height);
        }
    });

    // Draw buildings
    bgScenery.buildings.forEach(b => {
        if (b.segment % 7 === 0) {
            const x = (b.segment * 3 + time * 5) % canvas.width;
            drawBuilding(x, canvas.height / 2 - b.height);
        }
    });
}

function update() {
    // Update player position and physics
    updatePlayer();

    // Update AI opponents
    updateAI();

    // Check for collisions with AI opponents
    aiOpponents.forEach(ai => {
        const dist = Math.abs(playerPos - ai.pos);
        if (dist < SEGMENT_LENGTH * 2) {
            // Collision effect - slow down slightly
            playerSpeed *= 0.95;
            carAngle += Math.random() > 0.5 ? 1 : -1;
        }
    });

    // Update sky colors based on time/position
    const dayProgress = (playerPos % trackLength) / trackLength;
    skyColor1[0] = 25 + Math.sin(dayProgress * Math.PI) * 20;
    skyColor2[0] = 68 + Math.sin(dayProgress * Math.PI) * 30;

    // Update countdown timer if needed
    if (countdownTimer > 0) {
        countdownStage++;
        if (countdownStage % 10 === 0) {
            countdownTimer--;
            if (countdownTimer === 0) {
                gameState = 'RACING';
            }
        }
    }

    // Update best lap time tracking
    if (currentLapTime > 0 && currentLapTime < bestLapTime) {
        bestLapTime = currentLapTime;
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw sky and background scenery
    drawSky();
    drawMountainRange();
    drawBackgroundScenery();

    // Draw road segments with perspective
    for (let i = SEGMENTS - 1; i >= 0; i--) {
        const seg = segments[i];
        const screenY = canvas.height / 2 + playerZ * SEGMENT_LENGTH / trackLength;
        const x = canvas.width / 2 + Math.sin(seg.curve * 0.1) * canvas.width / 4;

        // Draw road segment with proper perspective
        ctx.beginPath();
        ctx.fillStyle = '#333';
        ctx.fillRect(x - ROAD_WIDTH, screenY, ROAD_WIDTH * 2, SEGMENT_LENGTH);

        // Road markings
        if (i % 5 === 0) {
            ctx.fillStyle = '#fff';
            ctx.fillRect(x - ROAD_WIDTH / 4, screenY, ROAD_WIDTH / 2, SEGMENT_LENGTH);
        }
    }

    // Draw player car at bottom of screen
    const carX = canvas.width / 2 + carAngle * 10;
    drawCar(carX, canvas.height - 80, 40, 60, cars[selectedCar].color, carTilt);

    // Draw HUD elements
    drawHUD();

    // Draw countdown if needed
    if (countdownTimer > 0) {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 48px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(`${countdownTimer}`, canvas.width / 2, canvas.height / 2);
    }

    // Draw pause menu if paused
    if (gameState === 'PAUSED') {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 24px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2 - 50);
        ctx.fillText('Press ESC to continue', canvas.width / 2, canvas.height / 2 + 10);
    }

    // Draw finish screen if finished
    if (gameState === 'FINISHED') {
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 36px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('RACE COMPLETE!', canvas.width / 2, canvas.height / 2 - 50);
        ctx.fillText(`Best Lap: ${bestLapTime.toFixed(2)}s`, canvas.width / 2, canvas.height / 2 + 10);
        ctx.fillText('Press ESC to return to garage', canvas.width / 2, canvas.height / 2 + 40);
    }

    // Draw countdown timer if needed
    if (countdownTimer > 0) {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 48px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(`${countdownTimer}`, canvas.width / 2, canvas.height / 2);
    }

    // Draw pause menu if paused
    if (gameState === 'PAUSED') {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 24px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2 - 50);
        ctx.fillText('Press ESC to continue', canvas.width / 2, canvas.height / 2 + 10);
    }

    // Draw finish screen if finished
    if (gameState === 'FINISHED') {
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 36px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('RACE COMPLETE!', canvas.width / 2, canvas.height / 2 - 50);
        ctx.fillText(`Best Lap: ${bestLapTime.toFixed(2)}s`, canvas.width / 2, canvas.height / 2 + 10);
        ctx.fillText('Press ESC to return to garage', canvas.width / 2, canvas.height / 2 + 40);
    }
}

// Main game loop
let lastTime = 0;
function gameLoop(timestamp) {
    const deltaTime = Math.min(50, timestamp - lastTime);
    lastTime = timestamp;

    update();
    draw();

    requestAnimationFrame(gameLoop);
}

// Initialize and start game
initRoad();
gameState = 'GARAGE';
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
