<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turbo Drive 3D</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #000; }
        canvas { display: block; }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            color: white;
        }

        /* HUD */
        #hud {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
        }

        .gauge-container {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 15px;
            border: 2px solid #444;
        }

        #speedo-label { font-size: 24px; font-weight: bold; margin: 0; }
        #rpm-label { font-size: 14px; color: #ffcc00; }

        #lap-timer {
            font-size: 32px;
            font-family: 'Courier New', Courier, monospace;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
        }

        #best-lap { font-size: 14px; color: #00ffcc; }

        /* Minimap */
        #minimap {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 150px;
            height: 150px;
            background: rgba(0,0,0,0.6);
            border: 3px solid #fff;
            border-radius: 50%;
        }
        #minimap-track {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
        }

        /* Garage Menu */
        #garage-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
        }

        .garage-card {
            background: #222;
            padding: 30px;
            border: 4px solid #ffcc00;
            border-radius: 20px;
            text-align: center;
            margin: 10px;
        }

        .btn {
            background: #ffcc00;
            color: black;
            padding: 15px 30px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 10px;
            margin: 10px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="ui-layer">
    <!-- HUD -->
    <div id="hud">
        <div>
            <div class="gauge-container">
                <p id="speedo-label">0 KM/H</p>
                <p id="rpm-label">RPM: 0</p>
            </div>
        </div>
        <div style="text-align: center;">
            <div id="lap-timer">00:00.00</div>
            <div id="best-lap">Best: --:--.--</div>
        </div>
        <div class="gauge-container">
            <div id="minimap">
                <div id="minimap-track"></div>
                <div id="player-dot" style="position:absolute; width:8px; height:8px; background:red; border-radius:50%; top:50%; left:50%;"></div>
            </div>
        </div>
    </div>

    <!-- Garage Screen -->
    <div id="garage-overlay">
        <h1>SELECT YOUR MACHINE</h1>
        <div style="display: flex;">
            <div class="garage-card">
                <h2>SPEEDSTER</h2>
                <p>Speed: High | Handling: Med</p>
                <button class="btn" onclick="selectCar(0)">SELECT</button>
            </div>
            <div class="garage-card">
                <h2>DRIFTER</h2>
                <p>Speed: Med | Handling: High</p>
                <button class="btn" onclick="selectCar(1)">SELECT</button>
            </div>
            <div class="garage-card">
                <h2>TANK</h2>
                <p>Speed: Low | Handling: High</p>
                <button class="btn" onclick="selectCar(2)">SELECT</button>
            </div>
        </div>
    </div>
</div>

<!-- Load Three.js from CDN -->
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';

    // --- Game Configuration & State ---
    const carStats = [
        { name: "Speedster", speed: 1.2, handling: 0.8, accel: 0.05, color: 0xff0000 },
        { name: "Drifter", speed: 0.9, handling: 1.2, accel: 0.06, color: 0x00ff00 },
        { name: "Tank", speed: 0.7, handling: 1.5, accel: 0.08, color: 0x0000ff }
    ];

    let currentCarIndex = 0;
    let gameState = 'garage'; // garage or racing
    let gameTime = 0;
    let bestLap = Infinity;
    let lapStartTime = 0;
    let currentLap = 1;

    // --- Scene Setup ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb); // Sky Blue
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const sunLight = new THREE.DirectionalLight(0xffffff, 1);
    sunLight.position.set(50, 100, 50);
    scene.add(sunLight);

    // --- Environment Generation ---
    // Create a track path (x, z, y)
    const trackPoints = [];
    for (let i = 0; i < 100; i++) {
        trackPoints.push(new THREE.Vector3(
            Math.sin(i * 0.1) * 20 + (i * 0.5 % 40 ? 40 : 0), // Curves
            Math.sin(i * 0.05) * 5, // Hills
            i * 10
        ));
    }

    // Road Mesh
    const roadGeometry = new THREE.PlaneGeometry(20, 1000, 100, 100);
    const roadMaterial = new THREE.MeshStandardMaterial({ color: 0x333333 });
    const road = new THREE.Mesh(roadGeometry, roadMaterial);
    road.rotation.x = -Math.PI / 2;
    scene.add(road);

    // Add some "grass" and scenery
    const grassGeo = new THREE.PlaneGeometry(1000, 1000);
    const grassMat = new THREE.MeshStandardMaterial({ color: 0x228b22 });
    const grass = new THREE.Mesh(grassGeo, grassMat);
    grass.rotation.x = -Math.PI / 2;
    grass.position.y = -1;
    scene.add(grass);

    // Trees and Buildings (Parallax objects)
    const trees = [];
    for(let i=0; i<200; i++) {
        const treeGeo = new THREE.ConeGeometry(2, 8, 8);
        const treeMat = new THREE.MeshStandardMaterial({color: 0x1a4726});
        const tree = new THREE.Mesh(treeGeo, treeMat);
        tree.position.set(Math.random()*200 - 100, 4, Math.random()*1000 - 500);
        scene.add(tree);
        trees.push(tree);
    }

    // --- Entities ---
    const player = new THREE.Group();
    const carBody = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 4), new THREE.MeshStandardMaterial({color: 0xff0000}));
    player.add(carBody);
    scene.add(player);

    const aiCars = [];
    for(let i=0; i<5; i++) {
        const aiGroup = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 4), new THREE.MeshStandardMaterial({color: 0x5555ff}));
        aiGroup.add(body);
        aiGroup.position.set(Math.random()*20-10, 0.5, -Math.random()*300);
        scene.add(aiGroup);
        aiCars.push({
            mesh: aiGroup,
            speed: 0.4 + Math.random() * 0.3,
            offset: Math.random() * 100
        });
    }

    // --- Game Logic Variables ---
    let velocity = 0;
    let rotation = 0;
    const keys = {};
    window.addEventListener('keydown', (e) => keys[e.key] = true);
    window.addEventListener('keyup', (e) => keys[e.key] = false);

    // Global functions for UI
    window.selectCar = (index) => {
        currentCarIndex = index;
        carBody.material.color.setHex(carStats[index].color);
        document.getElementById('garage-overlay').classList.add('hidden');
        gameState = 'racing';
        player.position.z = 0;
        velocity = 0;
    };

    // --- Main Loop ---
    function animate() {
        requestAnimationFrame(animate);

        if (gameState === 'racing') {
            const stats = carStats[currentCarIndex];

            // Physics
            if (keys['ArrowUp'] || keys['w']) velocity += stats.accel;
            else velocity *= 0.98; // Friction

            if (keys['ArrowLeft'] || keys['a']) rotation += 0.03 * stats.handling;
            if (keys['ArrowRight'] || keys['d']) rotation -= 0.03 * stats.handling;

            // Constraints
            velocity = Math.min(Math.max(velocity, 0), stats.speed);
            
            // Movement
            player.rotation.y = rotation;
            player.position.z -= Math.cos(rotation) * velocity;
            player.position.x += Math.sin(rotation) * velocity;

            // Update Road/Environment (Simulated movement by moving world toward player or camera following)
            // For simplicity in this demo, we move the car and update UI based on position
            
            // AI Movement
            aiCars.forEach(ai => {
                ai.mesh.position.z -= ai.speed;
                if (ai.mesh.position.z < -500) ai.mesh.position.z += 500;
            });

            // Update HUD
            const speedKmh = Math.floor(velocity * 200);
            document.getElementById('speedo-label').innerText = `${speedKmh} KM/H`;
            document.getElementById('rpm-label').innerText = `RPM: ${Math.floor(velocity * 500 + (Math.random()*10))}`;

            // Lap Logic
            gameTime += 0.016;
            const mins = Math.floor(gameTime / 60).toString().padStart(2, '0');
            const secs = Math.floor(gameTime % 60).toString().padStart(2, '0');
            const ms = Math.floor((gameTime % 1) * 100).toString().padStart(2, '0');
            document.getElementById('lap-timer').innerText = `${mins}:${secs}.${ms}`;

            // Minimap Update
            const mapX = (player.position.x + 100) / 200 * 100;
            const mapZ = (player.position.z + 500) / 1000 * 100;
            document.getElementById('player-dot').style.left = `${mapX}%`;
            document.getElementById('player-dot').style.top = `${mapZ}%`;

            // Camera Follow
            const camOffset = new THREE.Vector3(0, 5, 10);
            camera.position.x = player.position.x - Math.sin(rotation) * 10;
            camera.position.z = player.position.z + Math.cos(rotation) * 10;
            camera.position.y = player.position.y + 5;
            camera.lookAt(player.position.x, player.position.y, player.position.z - 5);

            // Parallax Effect for trees (move them slightly based on speed)
            trees.forEach(t => {
                t.position.z += (velocity * 0.1); // Subtle parallax
            });
        }

        renderer.render(scene, camera);
    }

    // Handle Resize
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
