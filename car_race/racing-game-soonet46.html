<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Outrun Racer</title>
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden;font-family:Arial,Helvetica,sans-serif;}
  #wrap{position:relative;width:960px;height:600px;margin:0 auto;background:#000;}
  canvas{position:absolute;top:0;left:0;}
  #ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}
  .screen{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;background:rgba(10,10,20,0.92);pointer-events:auto;}
  .hidden{display:none !important;}
  h1{font-size:48px;margin:0 0 10px 0;letter-spacing:4px;color:#ffcc00;text-shadow:0 0 12px #ff6600;}
  .sub{color:#aac;margin-bottom:20px;font-size:14px;}
  #carList{display:flex;gap:24px;margin:10px 0 24px 0;}
  .carCard{width:170px;padding:14px;border:2px solid #444;border-radius:10px;background:#1a1a2a;cursor:pointer;text-align:center;transition:border-color .15s, transform .15s;}
  .carCard.selected{border-color:#ffcc00;transform:translateY(-4px);}
  .carCard h3{margin:6px 0;color:#fff;font-size:16px;}
  .carSwatch{width:60px;height:30px;margin:0 auto 8px auto;border-radius:6px;border:2px solid #fff;}
  .statRow{display:flex;align-items:center;gap:6px;font-size:11px;margin:3px 0;color:#cde;}
  .statBar{flex:1;height:6px;background:#333;border-radius:3px;overflow:hidden;}
  .statFill{height:100%;background:linear-gradient(90deg,#ffcc00,#ff6600);}
  button.bigBtn{padding:12px 36px;font-size:18px;background:#ffcc00;border:none;border-radius:6px;color:#222;font-weight:bold;cursor:pointer;letter-spacing:2px;}
  button.bigBtn:hover{background:#ffe066;}
  .hint{position:absolute;bottom:14px;font-size:12px;color:#778;}
  #hud{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}
  #topHud{position:absolute;top:10px;left:10px;color:#fff;font-size:14px;text-shadow:0 0 4px #000;}
  #topHud div{margin-bottom:2px;}
  #posHud{position:absolute;top:10px;right:140px;color:#fff;font-size:22px;font-weight:bold;text-shadow:0 0 4px #000;text-align:right;}
  #countdown{position:absolute;top:40%;left:0;width:100%;text-align:center;font-size:90px;color:#ffcc00;text-shadow:0 0 20px #ff6600;font-weight:bold;}
  #finishMsg{position:absolute;top:30%;left:0;width:100%;text-align:center;color:#fff;}
  #finishMsg h2{font-size:42px;color:#ffcc00;margin:0;}
  #finishMsg .results{font-size:16px;margin:14px 0;line-height:1.6;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="600"></canvas>
  <canvas id="hudCanvas" width="960" height="600"></canvas>
  <div id="ui">
    <div id="topHud" class="hidden">
      <div id="lapInfo">LAP 1/3</div>
      <div id="timeInfo">TIME 00.00</div>
      <div id="bestInfo">BEST --.--</div>
    </div>
    <div id="posHud" class="hidden">1ST</div>
    <div id="countdown" class="hidden"></div>
    <div id="garageScreen" class="screen">
      <h1>OUTRUN RACER</h1>
      <div class="sub">Select your car</div>
      <div id="carList"></div>
      <button class="bigBtn" id="startBtn">START RACE</button>
      <div class="hint">Steer: ◀ ▶ / A D &nbsp;&nbsp; Accelerate: ▲ / W &nbsp;&nbsp; Brake: ▼ / S</div>
    </div>
    <div id="finishScreen" class="screen hidden">
      <h2>RACE FINISHED</h2>
      <div class="results" id="resultsText"></div>
      <button class="bigBtn" id="restartBtn">BACK TO GARAGE</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";

/* ============ CONFIG ============ */
const W = 960, H = 600;
const SEG_LEN = 200;          // length of a road segment
const ROAD_WIDTH = 2000;
const RUMBLE_LEN = 3;
const DRAW_DIST = 300;        // segments drawn ahead
const CAMERA_HEIGHT = 1100;
const CAMERA_DEPTH = 0.84;    // fov related
const FOG_DENSITY = 5;
const TOTAL_LAPS = 3;
const PLAYER_Z = CAMERA_HEIGHT * CAMERA_DEPTH;

/* ============ CARS ============ */
const CARS = [
  {name:"Viper", color:"#ff3333", topSpeed:300, accel:42, handling:1.25},
  {name:"Falcon",color:"#3399ff", topSpeed:280, accel:55, handling:1.45},
  {name:"Titan", color:"#ffcc00", topSpeed:330, accel:32, handling:1.0},
  {name:"Wraith",color:"#33ff99", topSpeed:265, accel:65, handling:1.6}
];

/* ============ CANVAS ============ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const hudCanvas = document.getElementById('hudCanvas');
const hctx = hudCanvas.getContext('2d');

/* ============ UTIL ============ */
function lerp(a,b,t){return a+(b-a)*t;}
function easeIn(a,b,t){return a+(b-a)*t*t;}
function easeOut(a,b,t){return a+(b-a)*(1-(1-t)*(1-t));}
function easeInOut(a,b,t){return a+(b-a)*((-Math.cos(t*Math.PI)/2)+0.5);}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
function increase(start,increment,max){ let r = start+increment; while(r>=max) r-=max; while(r<0) r+=max; return r; }
function percentRemaining(n,total){ return (n%total)/total; }
function rand(min,max){ return Math.random()*(max-min)+min; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

/* ============ ROAD BUILD ============ */
let segments = [];
let trackLength = 0;

function lastY(){ return segments.length===0 ? 0 : segments[segments.length-1].p2.world.y; }

function addSegment(curve, y){
  const n = segments.length;
  segments.push({
    index: n,
    p1:{world:{y:lastY(), z:n*SEG_LEN}, camera:{}, screen:{}},
    p2:{world:{y:y, z:(n+1)*SEG_LEN}, camera:{}, screen:{}},
    curve: curve,
    sprites: [],
    cars: [],
    color: Math.floor(n/RUMBLE_LEN)%2 ? COLORS.dark : COLORS.light
  });
}

function addRoad(enter,hold,leave,curve,y0,y1){
  const startY = lastY();
  const total = enter+hold+leave;
  for(let i=0;i<enter;i++) addSegment(easeIn(0,curve,i/enter), easeInOut(startY, y0, i/total));
  for(let i=0;i<hold;i++)  addSegment(curve, easeInOut(startY, y0, (enter+i)/total));
  for(let i=0;i<leave;i++) addSegment(easeInOut(curve,0,i/leave), easeInOut(startY,y0,(enter+hold+i)/total) + (y1-y0)*((i/leave)));
}

function addStraight(n){ addRoad(n,n,n,0,0,0); }
function addCurve(n,curve,y0,y1){ addRoad(n,n,n,curve,y0,y1); }
function addHill(n,y0,y1){ addRoad(n,n,n,0,y0,y1); }
function addSCurves(){
  addRoad(50,50,50,-4,0,0);
  addRoad(50,50,50, 4,0,0);
  addRoad(50,50,50,-4,0,0);
  addRoad(50,50,50, 4,0,0);
  addRoad(50,50,50,-2,0,0);
}

const COLORS = {
  sky:'#72D7EE',
  tree:'#005108',
  fog:'#005108',
  light:{road:'#6B6B6B',grass:'#10AA10',rumble:'#555555',lane:'#CCCCCC'},
  dark: {road:'#696969',grass:'#009A00',rumble:'#BBBBBB',lane:'#696969'}
};

function buildTrack(){
  segments = [];
  addStraight(20);
  addCurve(60,-2,0,0);
  addStraight(20);
  addHill(40,0,400);
  addCurve(60,3,400,400);
  addSCurves();
  addHill(40,400,0);
  addCurve(50,-3,0,200);
  addStraight(30);
  addCurve(40,4,200,0);
  addHill(30,0,-300);
  addStraight(20);
  addCurve(70,-4,-300,0);
  addSCurves();
  addStraight(40);
  addCurve(50,2,0,150);
  addHill(30,150,0);
  addStraight(50);
  trackLength = segments.length * SEG_LEN;
}
buildTrack();

function findSegment(z){ return segments[Math.floor(z/SEG_LEN) % segments.length]; }

/* ============ AI OPPONENTS ============ */
let aiCars = [];
function setupAI(){
  aiCars = [];
  const names = ["Rex","Blaze","Nova","Spike","Ace"];
  for(let i=0;i<5;i++){
    aiCars.push({
      name: names[i],
      color: pick(["#ff66cc","#66ffcc","#cc66ff","#ffaa00","#00aaff"]),
      z: (i+1)*SEG_LEN*14 + rand(0,400),
      offset: rand(-0.6,0.6),
      baseSpeed: rand(170,230),
      speed: 0,
      lap: 0,
      width: 60
    });
  }
}
setupAI();

/* ============ GAME STATE ============ */
let state = 'garage'; // garage | countdown | racing | finished
let selectedCarIdx = 0;
let player = null;
let keys = {};
let position = 0; // player world z position along total track distance (can exceed trackLength)
let speed = 0;
let lapTimes = [];
let bestLap = null;
let currentLapStart = 0;
let raceTime = 0;
let lap = 1;
let countdownVal = 3;
let countdownTimer = 0;
let finished = false;
let playerLapDistance = 0; // distance within current lap used for position calc

/* ============ INPUT ============ */
window.addEventListener('keydown', e=>{ keys[e.key.toLowerCase()] = true; if(["arrowup","arrowdown","arrowleft","arrowright"].includes(e.key.toLowerCase())) e.preventDefault(); });
window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });

/* ============ GARAGE UI ============ */
const carListEl = document.getElementById('carList');
function renderGarage(){
  carListEl.innerHTML = '';
  CARS.forEach((c,i)=>{
    const div = document.createElement('div');
    div.className = 'carCard' + (i===selectedCarIdx?' selected':'');
    div.innerHTML = `
      <div class="carSwatch" style="background:${c.color}"></div>
      <h3>${c.name}</h3>
      <div class="statRow">SPD<div class="statBar"><div class="statFill" style="width:${(c.topSpeed/330*100).toFixed(0)}%"></div></div></div>
      <div class="statRow">ACC<div class="statBar"><div class="statFill" style="width:${(c.accel/65*100).toFixed(0)}%"></div></div></div>
      <div class="statRow">HND<div class="statBar"><div class="statFill" style="width:${(c.handling/1.6*100).toFixed(0)}%"></div></div></div>
    `;
    div.addEventListener('click', ()=>{ selectedCarIdx = i; renderGarage(); });
    carListEl.appendChild(div);
  });
}
renderGarage();

document.getElementById('startBtn').addEventListener('click', ()=>{
  beginCountdown();
});
document.getElementById('restartBtn').addEventListener('click', ()=>{
  document.getElementById('finishScreen').classList.add('hidden');
  document.getElementById('garageScreen').classList.remove('hidden');
  document.getElementById('topHud').classList.add('hidden');
  document.getElementById('posHud').classList.add('hidden');
  state = 'garage';
});

function beginCountdown(){
  document.getElementById('garageScreen').classList.add('hidden');
  document.getElementById('topHud').classList.remove('hidden');
  document.getElementById('posHud').classList.remove('hidden');
  const carDef = CARS[selectedCarIdx];
  player = { def: carDef, x:0 };
  speed = 0;
  position = 0;
  lap = 1;
  lapTimes = [];
  bestLap = null;
  raceTime = 0;
  currentLapStart = 0;
  finished = false;
  setupAI();
  countdownVal = 3;
  countdownTimer = 0;
  state = 'countdown';
  const cd = document.getElementById('countdown');
  cd.classList.remove('hidden');
  cd.textContent = '3';
}

/* ============ UPDATE ============ */
function updatePlayer(dt){
  const def = player.def;
  const maxSpeed = def.topSpeed;
  const accelRate = def.accel * 3;
  const handling = def.handling;

  if(keys['arrowup']||keys['w']) speed += accelRate*dt;
  else if(keys['arrowdown']||keys['s']) speed -= accelRate*4*dt;
  else speed -= accelRate*0.6*dt; // engine drag

  // off-road slowdown
  const offRoad = Math.abs(player.x) > 0.9;
  if(offRoad){ speed -= accelRate*1.2*dt; speed = Math.min(speed, maxSpeed*0.5); }

  speed = clamp(speed, 0, maxSpeed);

  const speedPct = speed/maxSpeed;
  const steerAmt = (1.6 + speedPct*1.4) * handling * dt;
  if(keys['arrowleft']||keys['a']) player.x -= steerAmt;
  if(keys['arrowright']||keys['d']) player.x += steerAmt;

  // curve pull
  const seg = findSegment(position);
  player.x -= (seg.curve * speedPct * 0.013 * dt * 60);

  player.x = clamp(player.x, -1.6, 1.6);

  position = increase(position, dt*speed, trackLength*TOTAL_LAPS===0?trackLength: (trackLength* (TOTAL_LAPS+1)) );
  // we track position as ever-increasing using a separate accumulator instead (see below)
}

let totalDistance = 0; // ever-increasing distance, doesn't wrap
function updateRace(dt){
  if(state==='countdown'){
    countdownTimer += dt;
    if(countdownTimer >= 1){
      countdownTimer = 0;
      countdownVal -= 1;
      const cd = document.getElementById('countdown');
      if(countdownVal>0){ cd.textContent = countdownVal; }
      else if(countdownVal===0){ cd.textContent = 'GO!'; }
      else { cd.classList.add('hidden'); state='racing'; currentLapStart=0; raceTime=0; }
    }
    return;
  }
  if(state!=='racing') return;

  raceTime += dt;

  const def = player.def;
  const maxSpeed = def.topSpeed;
  const accelRate = def.accel * 3;
  const handling = def.handling;

  if(keys['arrowup']||keys['w']) speed += accelRate*dt;
  else if(keys['arrowdown']||keys['s']) speed -= accelRate*4*dt;
  else speed -= accelRate*0.6*dt;

  const offRoad = Math.abs(player.x) > 0.9;
  if(offRoad){ speed -= accelRate*1.2*dt; speed = Math.min(speed, maxSpeed*0.5); }

  speed = clamp(speed, 0, maxSpeed);
  const speedPct = speed/maxSpeed;
  const steerAmt = (1.6 + speedPct*1.4) * handling * dt;
  if(keys['arrowleft']||keys['a']) player.x -= steerAmt;
  if(keys['arrowright']||keys['d']) player.x += steerAmt;

  const seg = findSegment(totalDistance % trackLength);
  player.x -= (seg.curve * speedPct * 0.013 * dt * 60);
  player.x = clamp(player.x, -1.6, 1.6);

  totalDistance += dt*speed;
  const newLap = Math.floor(totalDistance/trackLength) + 1;
  if(newLap > lap){
    // completed a lap
    const lapTime = raceTime - currentLapStart;
    lapTimes.push(lapTime);
    if(bestLap===null || lapTime < bestLap) bestLap = lapTime;
    currentLapStart = raceTime;
    lap = newLap;
    if(lap > TOTAL_LAPS){
      finishRace();
      return;
    }
  }

  // AI update
  aiCars.forEach(ai=>{
    const aseg = findSegment(ai.z % trackLength);
    ai.speed = lerp(ai.speed, ai.baseSpeed, 0.02);
    ai.offset -= aseg.curve*0.0009*dt*60;
    ai.offset = clamp(ai.offset, -0.8, 0.8);
    ai.z += ai.speed*dt;
    if(ai.z > ai.startTotal + trackLength*99) {} // no-op guard
  });
}

function finishRace(){
  state = 'finished';
  document.getElementById('topHud').classList.add('hidden');
  document.getElementById('posHud').classList.add('hidden');
  const fs = document.getElementById('finishScreen');
  fs.classList.remove('hidden');
  let html = `<div>Total time: ${fmtTime(raceTime)}</div>`;
  html += `<div>Best lap: ${bestLap!==null?fmtTime(bestLap):'--'}</div>`;
  lapTimes.forEach((t,i)=>{ html += `<div>Lap ${i+1}: ${fmtTime(t)}</div>`; });
  document.getElementById('resultsText').innerHTML = html;
}

function fmtTime(t){
  const m = Math.floor(t/60);
  const s = (t%60).toFixed(2).padStart(5,'0');
  return (m>0? m+':':'') + s;
}

/* ============ RENDER ROAD ============ */
function project(p, camX, camY, camZ, cameraDepth, width, height, roadWidth){
  p.camera.x = (p.world.x||0) - camX;
  p.camera.y = (p.world.y||0) - camY;
  p.camera.z = (p.world.z||0) - camZ;
  p.screen.scale = cameraDepth / p.camera.z;
  p.screen.x = Math.round((width/2) + (p.screen.scale * p.camera.x * width/2));
  p.screen.y = Math.round((height/2) - (p.screen.scale * p.camera.y * height/2));
  p.screen.w = Math.round(p.screen.scale * roadWidth * width/2);
}

function rumbleWidth(projectedRoadWidth, lanes){ return projectedRoadWidth/Math.max(6,2*lanes); }
function laneMarkerWidth(projectedRoadWidth, lanes){ return projectedRoadWidth/Math.max(32,8*lanes); }

function polygon(c, x1,y1,x2,y2,x3,y3,x4,y4, color){
  c.fillStyle = color;
  c.beginPath();
  c.moveTo(x1,y1); c.lineTo(x2,y2); c.lineTo(x3,y3); c.lineTo(x4,y4);
  c.closePath();
  c.fill();
}

function renderSegment(c, width, lanes, x1,y1,w1, x2,y2,w2, color){
  const r1 = rumbleWidth(w1,lanes), r2 = rumbleWidth(w2,lanes);
  const l1 = laneMarkerWidth(w1,lanes), l2 = laneMarkerWidth(w2,lanes);

  c.fillStyle = color.grass;
  c.fillRect(0,y2,width,y1-y2);

  polygon(c, x1-w1-r1,y1, x1-w1,y1, x2-w2,y2, x2-w2-r2,y2, color.rumble);
  polygon(c, x1+w1+r1,y1, x1+w1,y1, x2+w2,y2, x2+w2+r2,y2, color.rumble);
  polygon(c, x1-w1,y1, x1+w1,y1, x2+w2,y2, x2-w2,y2, color.road);

  if(color.lane){
    const lanesCount = 3;
    const laneW1 = w1*2/lanesCount, laneW2 = w2*2/lanesCount;
    let lx1 = x1 - w1 + laneW1, lx2 = x2 - w2 + laneW2;
    for(let lane=1; lane<lanesCount; lane++){
      polygon(c, lx1-l1/2,y1, lx1+l1/2,y1, lx2+l2/2,y2, lx2-l2/2,y2, color.lane);
      lx1 += laneW1; lx2 += laneW2;
    }
  }
}

/* ---- Parallax background ---- */
let bgOffset = 0;
function skyColorFor(segIndex){
  // cycle sky through a palette over the whole track length for variety
  const t = (segIndex / segments.length);
  const palettes = [
    {top:'#1b2a6b', bot:'#ff8c42'},  // dawn
    {top:'#72D7EE', bot:'#bfe9ff'},  // day
    {top:'#ff5e62', bot:'#ffb347'},  // sunset
    {top:'#0b0c2a', bot:'#3a1c71'}   // dusk
  ];
  const idx = Math.floor(t*palettes.length) % palettes.length;
  const nextIdx = (idx+1)%palettes.length;
  const localT = (t*palettes.length) % 1;
  const a = palettes[idx], b = palettes[nextIdx];
  return {
    top: lerpColor(a.top,b.top,localT),
    bot: lerpColor(a.bot,b.bot,localT)
  };
}
function hexToRgb(h){ h=h.replace('#',''); return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]; }
function lerpColor(c1,c2,t){
  const a=hexToRgb(c1), b=hexToRgb(c2);
  const r = Math.round(lerp(a[0],b[0],t));
  const g = Math.round(lerp(a[1],b[1],t));
  const bl= Math.round(lerp(a[2],b[2],t));
  return `rgb(${r},${g},${bl})`;
}

function renderBackground(baseSegIndex, curveTrend){
  const sky = skyColorFor(baseSegIndex);
  const grad = ctx.createLinearGradient(0,0,0,H*0.55);
  grad.addColorStop(0, sky.top);
  grad.addColorStop(1, sky.bot);
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H*0.55);

  // mountains (slow parallax layer)
  const mountainOffset = -(bgOffset*0.05) % W;
  ctx.fillStyle = 'rgba(60,50,90,0.55)';
  drawRepeatingShape(mountainOffset, H*0.45, 220, 90, 'mountain');

  // distant buildings (medium parallax)
  const buildingOffset = -(bgOffset*0.12) % W;
  ctx.fillStyle = 'rgba(40,35,60,0.7)';
  drawRepeatingShape(buildingOffset, H*0.48, 90, 70, 'building');

  // trees (fast parallax, foreground-ish, just above road horizon)
  const treeOffset = -(bgOffset*0.28) % W;
  ctx.fillStyle = 'rgba(10,40,15,0.85)';
  drawRepeatingShape(treeOffset, H*0.5, 60, 50, 'tree');
}

function drawRepeatingShape(offset, baseY, spacing, size, type){
  for(let x = offset - spacing; x < W+spacing; x += spacing){
    if(type==='mountain'){
      ctx.beginPath();
      ctx.moveTo(x, baseY);
      ctx.lineTo(x+spacing*0.5, baseY-size);
      ctx.lineTo(x+spacing, baseY);
      ctx.closePath();
      ctx.fill();
    } else if(type==='building'){
      const h = size*0.6 + (Math.sin(x*0.13)*10);
      ctx.fillRect(x, baseY-h, spacing*0.55, h);
    } else if(type==='tree'){
      ctx.beginPath();
      ctx.moveTo(x, baseY);
      ctx.lineTo(x+spacing*0.3, baseY-size);
      ctx.lineTo(x+spacing*0.6, baseY);
      ctx.closePath();
      ctx.fill();
      ctx.fillRect(x+spacing*0.26, baseY-6, spacing*0.08, 10);
    }
  }
}

/* ---- car sprite (simple vector car, drawn with canvas shapes) ---- */
function drawCar(c, x, y, scale, color, steerDir, isPlayer){
  c.save();
  c.translate(x,y);
  c.scale(scale, scale);
  if(steerDir) c.rotate(steerDir*0.06);
  // shadow
  c.fillStyle = 'rgba(0,0,0,0.35)';
  c.beginPath();
  c.ellipse(0, 18, 60, 14, 0,0,Math.PI*2);
  c.fill();
  // body
  c.fillStyle = color;
  c.beginPath();
  c.moveTo(-50, 18);
  c.lineTo(-46,-6);
  c.lineTo(-28,-22);
  c.lineTo(28,-22);
  c.lineTo(46,-6);
  c.lineTo(50,18);
  c.closePath();
  c.fill();
  // windshield
  c.fillStyle = 'rgba(180,220,255,0.85)';
  c.beginPath();
  c.moveTo(-22,-20);
  c.lineTo(-14,-30);
  c.lineTo(14,-30);
  c.lineTo(22,-20);
  c.closePath();
  c.fill();
  // wheels
  c.fillStyle = '#111';
  c.fillRect(-54,4,10,16);
  c.fillRect(44,4,10,16);
  // tail lights
  if(!isPlayer){
    c.fillStyle = '#ff2222';
    c.fillRect(-46,12,8,5);
    c.fillRect(38,12,8,5);
  }
  c.restore();
}

/* ============ MAIN RENDER ============ */
function render(){
  ctx.clearRect(0,0,W,H);

  if(state==='garage'){ return; }

  const baseSegment = findSegment(totalDistance % trackLength);
  const basePercent = percentRemaining(totalDistance % trackLength, SEG_LEN);
  const playerSegment = findSegment((totalDistance + PLAYER_Z) % trackLength);
  const playerY = lerp(playerSegment.p1.world.y, playerSegment.p2.world.y, percentRemaining(totalDistance % trackLength, SEG_LEN));

  bgOffset += (player? speed*0.016 : 0) + (baseSegment.curve*2);
  renderBackground(baseSegment.index, baseSegment.curve);

  const camHeight = CAMERA_HEIGHT + playerY;
  const camX = (player ? player.x*ROAD_WIDTH : 0);
  let x = 0, dx = -(baseSegment.curve * basePercent);
  let maxy = H;

  ctx.save();
  ctx.beginPath(); ctx.rect(0,0,W,H); ctx.clip();

  for(let n=0;n<DRAW_DIST;n++){
    const seg = segments[(baseSegment.index+n)%segments.length];
    const looped = (baseSegment.index+n) >= segments.length;
    const segLoopOffset = looped ? trackLength : 0;

    project(seg.p1, camX - x, camHeight, totalDistance - segLoopOffset, CAMERA_DEPTH, W, H, ROAD_WIDTH);
    project(seg.p2, camX - x - dx, camHeight, totalDistance - segLoopOffset, CAMERA_DEPTH, W, H, ROAD_WIDTH);

    x += dx;
    dx += seg.curve;

    seg.clip = maxy;

    if(seg.p1.camera.z <= CAMERA_DEPTH || seg.p2.screen.y >= seg.p1.screen.y || seg.p2.screen.y >= maxy) continue;

    renderSegment(ctx, W, 1,
      seg.p1.screen.x, seg.p1.screen.y, seg.p1.screen.w,
      seg.p2.screen.x, seg.p2.screen.y, seg.p2.screen.w,
      seg.color);

    maxy = seg.p2.screen.y;
  }

  // draw AI cars (back to front using same loop logic, simplified second pass)
  for(let n=DRAW_DIST-1;n>=0;n--){
    const segIdx = (baseSegment.index+n)%segments.length;
    const seg = segments[segIdx];
    aiCars.forEach(ai=>{
      const aiSegIdx = Math.floor((ai.z % trackLength)/SEG_LEN);
      if(aiSegIdx !== segIdx) return;
      const looped = (baseSegment.index+n) >= segments.length;
      const segLoopOffset = looped ? trackLength : 0;
      const carP = {world:{x:ai.offset*ROAD_WIDTH, y:seg.p1.world.y, z: (ai.z % trackLength)}, camera:{}, screen:{}};
      project(carP, camX - x*0, camHeight, totalDistance - segLoopOffset, CAMERA_DEPTH, W, H, ROAD_WIDTH);
      if(carP.camera.z > CAMERA_DEPTH){
        const scale = carP.screen.scale * 100;
        if(scale>0.01 && carP.screen.y < H && carP.screen.y > 0){
          drawCar(ctx, carP.screen.x, carP.screen.y, Math.max(0.04,scale*0.9), ai.color, 0, false);
        }
      }
    });
  }

  ctx.restore();

  // player car (fixed near bottom center, slight x offset by steering)
  const px = W/2 + player.x*(W*0.32);
  drawCar(ctx, px, H-70, 1.15, player.def.color, (keys['arrowleft']||keys['a'])? -1 : (keys['arrowright']||keys['d'])? 1 : 0, true);

  renderHUD(playerSegment);
}

/* ============ HUD ============ */
function renderHUD(playerSegment){
  hctx.clearRect(0,0,W,H);

  // speedometer
  drawGauge(hctx, W-110, H-100, 80, speed, player.def.topSpeed, '#33ccff', 'KM/H', Math.round(speed));
  // RPM gauge (derived from speed % within gear-ish curve for visual flair)
  const rpm = 1000 + (speed/player.def.topSpeed)*7000 + Math.sin(raceTime*8)*60;
  drawGauge(hctx, W-110, H-100, 80, 0, 0, null, null, null, rpm); // not used; replaced below

  drawSpeedRPM();

  // minimap
  drawMinimap();

  // text HUD
  document.getElementById('lapInfo').textContent = `LAP ${Math.min(lap,TOTAL_LAPS)}/${TOTAL_LAPS}`;
  document.getElementById('timeInfo').textContent = `TIME ${fmtTime(raceTime - currentLapStart)}`;
  document.getElementById('bestInfo').textContent = `BEST ${bestLap!==null?fmtTime(bestLap):'--.--'}`;

  // position (based on totalDistance vs ai cars projected distance)
  let aheadCount = 0;
  aiCars.forEach(ai=>{ if(ai.z > totalDistance) aheadCount++; });
  const posNum = aheadCount+1;
  const suffix = posNum===1?'ST':posNum===2?'ND':posNum===3?'RD':'TH';
  document.getElementById('posHud').textContent = posNum+suffix;
}

function drawGauge(){ /* placeholder kept intentionally inert; replaced by drawSpeedRPM */ }

function drawSpeedRPM(){
  const cx1 = W-100, cy = H-90, r = 70;
  const cx2 = W-220;

  // Speed gauge
  drawArcGauge(cx1, cy, r, speed, player.def.topSpeed, '#33ccff', 'SPEED', Math.round(speed)+' km/h');
  // RPM gauge
  const rpm = clamp(1000 + (speed/player.def.topSpeed)*7000, 0, 8000);
  drawArcGauge(cx2, cy, r*0.78, rpm, 8000, rpm>7000?'#ff3333':'#ffaa00', 'RPM', Math.round(rpm));
}

function drawArcGauge(cx,cy,r,value,max,color,label,valText){
  const startA = Math.PI*0.75, endA = Math.PI*2.25;
  hctx.save();
  hctx.beginPath();
  hctx.arc(cx,cy,r,startA,endA);
  hctx.lineWidth = 8;
  hctx.strokeStyle = 'rgba(255,255,255,0.15)';
  hctx.stroke();

  const pct = clamp(value/max,0,1);
  hctx.beginPath();
  hctx.arc(cx,cy,r,startA, startA + (endA-startA)*pct);
  hctx.lineWidth = 8;
  hctx.strokeStyle = color;
  hctx.lineCap = 'round';
  hctx.stroke();

  // needle
  const needleA = startA + (endA-startA)*pct;
  hctx.beginPath();
  hctx.moveTo(cx,cy);
  hctx.lineTo(cx+Math.cos(needleA)*(r-14), cy+Math.sin(needleA)*(r-14));
  hctx.strokeStyle = '#fff';
  hctx.lineWidth = 3;
  hctx.stroke();

  hctx.fillStyle = '#fff';
  hctx.font = 'bold 13px Arial';
  hctx.textAlign = 'center';
  hctx.fillText(label, cx, cy+r+16);
  hctx.font = '12px Arial';
  hctx.fillText(valText, cx, cy+4);
  hctx.restore();
}

function drawMinimap(){
  const mw = 150, mh = 150, mx = 14, my = H-mh-14;
  hctx.save();
  hctx.globalAlpha = 0.85;
  hctx.fillStyle = 'rgba(0,0,0,0.45)';
  hctx.fillRect(mx,my,mw,mh);
  hctx.strokeStyle = '#fff';
  hctx.strokeRect(mx,my,mw,mh);

  // build simplified top-down path once (cache)
  if(!window.__miniPath){
    let px=0, pz=0, ang=0;
    const pts=[];
    let minX=0,maxX=0,minZ=0,maxZ=0;
    for(let i=0;i<segments.length;i+=4){
      const seg = segments[i];
      ang += seg.curve*0.04;
      px += Math.sin(ang)*SEG_LEN*4;
      pz += Math.cos(ang)*SEG_LEN*4;
      pts.push([px,pz]);
      minX=Math.min(minX,px); maxX=Math.max(maxX,px);
      minZ=Math.min(minZ,pz); maxZ=Math.max(maxZ,pz);
    }
    window.__miniPath = {pts,minX,maxX,minZ,maxZ};
  }
  const mp = window.__miniPath;
  const spanX = (mp.maxX-mp.minX)||1, spanZ = (mp.maxZ-mp.minZ)||1;
  const pad = 16;
  function toMini(px,pz){
    const nx = (px-mp.minX)/spanX, nz=(pz-mp.minZ)/spanZ;
    return [mx+pad+nx*(mw-pad*2), my+pad+nz*(mh-pad*2)];
  }
  hctx.beginPath();
  mp.pts.forEach((p,i)=>{
    const [sx,sy] = toMini(p[0],p[1]);
    if(i===0) hctx.moveTo(sx,sy); else hctx.lineTo(sx,sy);
  });
  hctx.closePath();
  hctx.strokeStyle = '#999';
  hctx.lineWidth = 4;
  hctx.stroke();

  // player marker
  const pIdx = Math.floor((totalDistance % trackLength)/SEG_LEN/4) % mp.pts.length;
  const pp = mp.pts[pIdx] || mp.pts[0];
  const [psx,psy] = toMini(pp[0],pp[1]);
  hctx.fillStyle = '#ffcc00';
  hctx.beginPath(); hctx.arc(psx,psy,5,0,Math.PI*2); hctx.fill();

  // AI markers
  aiCars.forEach(ai=>{
    const idx = Math.floor((ai.z % trackLength)/SEG_LEN/4) % mp.pts.length;
    const apt = mp.pts[idx] || mp.pts[0];
    const [asx,asy] = toMini(apt[0],apt[1]);
    hctx.fillStyle = ai.color;
    hctx.beginPath(); hctx.arc(asx,asy,4,0,Math.PI*2); hctx.fill();
  });

  hctx.restore();
}

/* ============ LOOP ============ */
let lastTime = null;
function loop(ts){
  if(lastTime===null) lastTime = ts;
  let dt = (ts-lastTime)/1000;
  lastTime = ts;
  dt = Math.min(dt, 1/30); // clamp for tab-switch / lag spikes

  updateRace(dt);
  render();

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
