<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Racing Game</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
canvas { display: block; cursor: none; }

#ui-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; user-select: none;
}

#start-screen, #garage-screen {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
  align-items: center; justify-content: center; pointer-events: all;
  z-index: 100;
}

#start-screen h1 {
  font-size: 5em; color: #ff6b35; text-shadow: 0 0 30px rgba(255,107,53,0.5);
  margin-bottom: 0.5em; letter-spacing: 4px;
}

#start-screen p { color: #aaa; font-size: 1.2em; margin-bottom: 2em; }

.btn {
  padding: 14px 50px; font-size: 1.3em; font-weight: bold;
  border: none; border-radius: 8px; cursor: pointer;
  transition: all 0.2s; text-transform: uppercase; letter-spacing: 2px;
}

.btn-race { background: linear-gradient(135deg, #ff6b35, #ff4d00); color: white;
  box-shadow: 0 4px 20px rgba(255,107,53,0.4); }
.btn-race:hover { transform: scale(1.05); box-shadow: 0 6px 30px rgba(255,107,53,0.6); }

.btn-garage { background: linear-gradient(135deg, #1a1a2e, #16213e); color: white;
  border: 2px solid #4a90d9; box-shadow: 0 4px 20px rgba(74,144,217,0.3); }
.btn-garage:hover { transform: scale(1.05); box-shadow: 0 6px 30px rgba(74,144,217,0.5); }

#garage-screen h2 { font-size: 3em; color: #4a90d9; margin-bottom: 1em; }
#car-grid {
  display: grid; grid-template-columns: repeat(3,1fr); gap: 20px;
  margin-bottom: 3em; padding: 0 40px; max-width: 90vw;
}

.car-card {
  background: linear-gradient(145deg, #1a1a2e, #0f0f1a); border: 2px solid #333;
  border-radius: 16px; padding: 20px; text-align: center;
  transition: all 0.3s; cursor: pointer; position: relative;
}
.car-card:hover { border-color: #4a90d9; transform: scale(1.03); }
.car-card.selected { border-color: #ff6b35; box-shadow: 0 0 20px rgba(255,107,53,0.4); }
.car-card h3 { color: #ff6b35; font-size: 1.4em; margin-bottom: 0.5em; }
.car-card .car-color { width: 80px; height: 30px; border-radius: 4px;
  margin: 8px auto; display: block; }
.car-card .stats { font-size: 0.85em; color: #aaa; margin-bottom: 0.5em; }
.car-card .stats span { color: #4a90d9; font-weight: bold; }
.stats-bar { width: 100%; height: 6px; background: #333; border-radius: 3px; overflow: hidden; margin-top: 4px; }
.stats-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.car-card .price { color: #ff6b35; font-weight: bold; margin-top: 8px; font-size: 1.1em; }

#hud {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; display: none; z-index: 50;
}

#minimap-container {
  position: absolute; top: 15px; right: 15px;
}

#minimap {
  width: 200px; height: 150px; border-radius: 8px;
  border: 2px solid rgba(255,255,255,0.3);
  background: rgba(10,10,30,0.8); backdrop-filter: blur(5px);
  overflow: hidden;
}

#minimap-canvas { width: 100%; height: 100%; }

#lap-info {
  position: absolute; top: 15px; left: 15px; color: white;
}

#lap-info .lap-line { font-size: 1.4em; font-weight: bold; margin-bottom: 2px; }
#lap-info .lap-label { font-size: 0.8em; color: #aaa; }
#best-lap { font-size: 0.9em; color: #ff6b35; margin-top: 4px; }

#speed-container {
  position: absolute; bottom: 15px; right: 20px;
}

#speed-display {
  font-size: 3em; font-weight: bold; color: white; text-shadow: 0 2px 10px rgba(0,0,0,0.5);
}

#rpm-gauge {
  width: 180px; height: 120px; position: relative;
}

#rpm-gauge canvas { width: 100%; height: 100%; border-radius: 50%;
  border: 3px solid rgba(255,255,255,0.2); }

#gear-display {
  position: absolute; bottom: 15px; left: 20px; color: white;
}

#gear-display .gear-box {
  background: rgba(10,10,30,0.8); border-radius: 12px;
  padding: 15px 20px; border: 1px solid rgba(255,255,255,0.1);
}

#gear-display .gear-label { font-size: 0.8em; color: #aaa; }
#gear-display .gear-value { font-size: 2em; font-weight: bold; color: #ff6b35; }

#position-display {
  position: absolute; top: 15px; left: 200px; color: white;
}

#position-display .pos-value { font-size: 4em; font-weight: bold; color: #ff6b35; }
#position-display .pos-label { font-size: 0.8em; color: #aaa; }

#controls-hint {
  position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,0.3); font-size: 0.8em;
}

#finish-screen {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.9); display: none; flex-direction: column;
  align-items: center; justify-content: center; pointer-events: all; z-index: 100;
}

#finish-screen h2 { font-size: 4em; color: #ff6b35; margin-bottom: 0.5em; }
#finish-screen .finish-stats { color: white; font-size: 1.5em; margin-bottom: 2em; text-align: center; }
#finish-screen .finish-stats span { color: #4a90d9; font-weight: bold; }

#pause-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.6); display: none; align-items: center;
  justify-content: center; pointer-events: all; z-index: 90;
}

#pause-overlay h2 { color: white; font-size: 3em; }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="start-screen">
  <h1>🏎️ TURBO RACING</h1>
  <p>A 3D Racing Experience</p>
  <button class="btn btn-race" onclick="showGarage()">Start Race</button>
  <button class="btn btn-garage" onclick="showGarage()">Select Car</button>
  <div style="color:#666; margin-top:2em; font-size:0.9em;">
    Controls: WASD / Arrow Keys to drive • P to pause
  </div>
</div>

<div id="garage-screen">
  <h2>🏁 GARAGE</h2>
  <div id="car-grid"></div>
  <button class="btn btn-race" onclick="startRace()">Start Race</button>
  <button class="btn btn-garage" onclick="showStart()">Back</button>
</div>

<div id="finish-screen">
  <h2>🏁 RACE COMPLETE!</h2>
  <div class="finish-stats" id="finish-stats"></div>
  <button class="btn btn-race" onclick="showGarage()">Race Again</button>
  <button class="btn btn-garage" onclick="showGarage()">Back to Garage</button>
</div>

<div id="pause-overlay">
  <h2>PAUSED</h2>
  <p style="color:#aaa; margin-top:1em;">Press P to resume</p>
</div>

<div id="hud">
  <div id="minimap-container"><canvas id="minimap-canvas"></canvas></div>
  <div id="lap-info">
    <div class="lap-label">LAP</div>
    <div class="lap-line" id="current-lap">1 / 3</div>
    <div class="lap-label" id="lap-time">Time: 0:00.00</div>
    <div class="best-lap" id="best-lap">Best: --</div>
  </div>
  <div id="position-display">
    <div class="pos-value" id="current-position">1</div>
    <div class="pos-label">Position</div>
  </div>
  <div id="speed-container">
    <div id="rpm-gauge"><canvas id="rpm-canvas" width="180" height="120"></canvas></div>
    <div id="speed-display">0 km/h</div>
  </div>
  <div id="gear-display">
    <div class="gear-box">
      <div class="gear-label">GEAR</div>
      <div class="gear-value" id="gear-display-val">1</div>
    </div>
  </div>
  <div id="controls-hint">WASD / Arrow Keys to drive • P to pause</div>
</div>

<script>
// ============ GAME STATE ============
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const cars = [
  { name: "Sprint", speed: 95, handling: 60, acceleration: 85, color: '#ff3333', weight: 1000 },
  { name: "Gran Turismo", speed: 85, handling: 90, acceleration: 75, color: '#ffcc00', weight: 1200 },
  { name: "M8", speed: 90, handling: 75, acceleration: 90, color: '#ffffff', weight: 1300 },
  { name: "F-1", speed: 98, handling: 50, acceleration: 70, color: '#ff6600', weight: 800 },
  { name: "Rover", speed: 75, handling: 80, acceleration: 60, color: '#44aa44', weight: 1500 },
  { name: "Draco", speed: 88, handling: 65, acceleration: 78, color: '#9933ff', weight: 1100 },
];

let selectedCarIndex = 2;
let currentGame = null;
let paused = false;

// Track data
const TRACK_LENGTH = 2000; // total track length in meters
let trackSegments = [];
let trackControlPoints = [];

// Generate a closed loop track with curves and hills
function generateTrack() {
  const numPoints = 60;
  trackControlPoints = [];

  // Create ellipse-based track with variations
  for (let i = 0; i < numPoints; i++) {
    const t = (i / numPoints) * Math.PI * 2;
    // Main ellipse with some wobble for interesting shape
    const rx = 600 + Math.sin(t * 3) * 100 + Math.cos(t * 2) * 50;
    const ry = 400 + Math.sin(t * 2) * 60 + Math.cos(t * 3) * 40;
    const x = Math.cos(t) * rx + Math.sin(t * 0.5) * 30;
    const y = Math.sin(t) * ry + Math.cos(t * 0.7) * 25;
    // Height variation for hills
    const h = Math.sin(t * 4) * 20 + Math.cos(t * 3) * 15 + Math.sin(t * 2.5) * 10;
    trackControlPoints.push({ x, y, h });
  }

  // Generate interpolated segments with cubic splines
  trackSegments = [];
  const segsPerPoint = 15;

  function cubicSpline(p0, p1, p2, p3, t) {
    const t2 = t * t;
    const t3 = t2 * t;
    return {
      x: 0.5 * ((2*p1.x) + (-p0.x+p2.x)*t + (2*p0.x-5*p1.x+4*p2.x-p3.x)*t2 + (-p0.x+3*p1.x-3*p2.x+p3.x)*t3),
      y: 0.5 * ((2*p1.y) + (-p0.y+p2.y)*t + (2*p0.y-5*p1.y+4*p2.y-p3.y)*t2 + (-p0.y+3*p1.y-3*p2.y+p3.y)*t3),
      h: 0.5 * ((2*p1.h) + (-p0.h+p2.h)*t + (2*p0.h-5*p1.h+4*p2.h-p3.h)*t2 + (-p0.h+3*p1.h-3*p2.h+p3.h)*t3)
    };
  }

  // Build spline segments
  for (let i = 0; i < numPoints; i++) {
    const p0 = trackControlPoints[(i - 1 + numPoints) % numPoints];
    const p1 = trackControlPoints[i];
    const p2 = trackControlPoints[(i + 1) % numPoints];
    const p3 = trackControlPoints[(i + 2) % numPoints];

    for (let j = 0; j < segsPerPoint; j++) {
      const t = j / segsPerPoint;
      trackSegments.push({
        x: cubicSpline(p0, p1, p2, p3, t).x,
        y: cubicSpline(p0, p1, p2, p3, t).y,
        h: cubicSpline(p0, p1, p2, p3, t).h
      });
    }
  }

  // Calculate cumulative distance and normals
  let totalDist = 0;
  for (let i = 0; i < trackSegments.length; i++) {
    const next = (i + 1) % trackSegments.length;
    const dx = trackSegments[next].x - trackSegments[i].x;
    const dy = trackSegments[next].y - trackSegments[i].y;
    trackSegments[i].dist = totalDist;
    trackSegments[i].dx = dx;
    trackSegments[i].dy = dy;
    const len = Math.sqrt(dx*dx + dy*dy);
    if (len > 0) {
      trackSegments[i].nx = -dy / len; // normal left
      trackSegments[i].ny = dx / len;
    } else {
      trackSegments[i].nx = 0;
      trackSegments[i].ny = 1;
    }
    totalDist += len;
  }

  // Track width
  trackSegments[0].totalLength = totalDist;
}

generateTrack();

// Car class
class RaceCar {
  constructor(x, y, h, angle, carData, isPlayer = false) {
    this.x = x;
    this.y = y;
    this.h = h;
    this.angle = angle; // facing angle in radians
    this.speed = 0;
    this.carData = carData || cars[2];
    this.isPlayer = isPlayer;
    this.lapStart = 0;
    this.currentLap = 1;
    this.bestLapTime = Infinity;
    this.totalTime = 0;
    this.lapsCompleted = 0;
    this.progress = 0; // distance along track
    this.gear = 1;
    this.maxGear = 4;
    this.targetProgress = Math.random() * trackSegments[0].totalLength;
    this.color = carData ? carData.color : '#fff';
    this.width = isPlayer ? 25 : 20;
    this.length = isPlayer ? 35 : 30;
    // AI offset from center line
    this.lateralOffset = isPlayer ? 0 : (Math.random() - 0.5) * 40;
    this.bouncePhase = Math.random() * 100;
  }

  update(dt) {
    if (this.isPlayer) return; // Player handled separately

    const carStats = this.carData;
    const maxSpeed = carStats.speed * 4;

    // AI target progress
    this.targetProgress += (maxSpeed * 0.7) * dt;

    // Find closest track segment
    let bestDist = Infinity;
    let targetSegIdx = 0;
    for (let i = 0; i < trackSegments.length; i += 3) {
      const seg = trackSegments[i];
      const d = Math.sqrt((seg.x - this.x)**2 + (seg.y - this.y)**2);
      if (d < bestDist) { bestDist = d; targetSegIdx = i; }
    }

    const targetSeg = trackSegments[targetSegIdx];
    const nextSeg = trackSegments[(targetSegIdx + 1) % trackSegments.length];
    const targetAngle = Math.atan2(nextSeg.y - targetSeg.y, nextSeg.x - targetSeg.x);

    // Steering
    const steerFactor = carStats.handling * 0.02;
    let targetSteer = (targetAngle - this.angle);
    while (targetSteer > Math.PI) targetSteer -= 2*Math.PI;
    while (targetSteer < -Math.PI) targetSteer += 2*Math.PI;
    const steer = Math.max(-1, Math.min(1, targetSteer * 0.3));

    // Acceleration
    const accFactor = carStats.acceleration * 0.5;
    if (Math.abs(targetSteer) < 1 && this.speed < maxSpeed * 0.85) {
      this.speed += accFactor * dt;
    } else if (this.speed > maxSpeed) {
      this.speed *= 0.97;
    }

    // Speed limit on sharp curves
    const curveSharpness = Math.abs(targetSteer);
    const speedLimit = maxSpeed * (1 - curveSharpness * 0.5);
    if (this.speed > speedLimit) this.speed *= 0.98;

    // Apply steering
    if (Math.abs(this.speed) > 0.5) {
      const turnRate = steer * this.speed * 0.01 * (this.length / carStats.weight);
      this.angle += turnRate;
    }

    // Move
    const moveSpeed = this.speed * dt;
    this.x += Math.cos(this.angle) * moveSpeed + targetSeg.dx * 0.1;
    this.y += Math.sin(this.angle) * moveSpeed + targetSeg.dy * 0.1;

    // Keep on track with lateral offset
    const latDist = targetSeg.nx * (this.x - targetSeg.x) + targetSeg.ny * (this.y - targetSeg.y);
    if (Math.abs(latDist) > 50) {
      this.x -= latDist * 0.1 * Math.sign(latDist);
      this.y -= latDist * 0.1 * Math.sign(latDist);
    }

    // Lap tracking
    this.progress = targetSeg.dist;
    if (this.progress > trackSegments[0].totalLength - 100 && this.lapStart > 0) {
      this.currentLap++;
      const lapTime = Date.now() - this.lapStart;
      if (lapTime < this.bestLapTime) this.bestLapTime = lapTime;
      this.lapStart = Date.now();
    }

    // Bounce for visual effect
    this.bouncePhase += dt * 10;
  }

  draw() {
    // Car will be drawn in the main render loop via project3D
  }

  getScreenPos() {
    return this.projectToScreen();
  }
}

// Player car
let player;

function createPlayerCar() {
  const startSeg = trackSegments[0];
  player = new RaceCar(startSeg.x, startSeg.y, startSeg.h, -Math.PI/2, cars[selectedCarIndex], true);
  player.lapStart = Date.now();
}

// Input handling
const keys = {};
window.addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'KeyP') togglePause(); });
window.addEventListener('keyup', e => { keys[e.code] = false; });

function togglePause() {
  if (currentGame && currentGame.state === 'racing') {
    paused = !paused;
    document.getElementById('pause-overlay').style.display = paused ? 'flex' : 'none';
  }
}

// ============ PROJECTION ============
const CAM_OFFSET_X = -30;
const CAM_OFFSET_Y = 60;
const CAM_HEIGHT = 80;

function project3D(x, y, z) {
  // Camera follows player
  let camX = player.x + CAM_OFFSET_X * Math.cos(player.angle);
  let camY = player.y + CAM_OFFSET_Y * Math.sin(player.angle);

  const dx = x - camX;
  const dy = y - camY;
  const dz = z - CAM_HEIGHT;

  // Rotate to camera view (camera looks forward along player angle)
  const cosA = Math.cos(-player.angle);
  const sinA = Math.sin(-player.angle);

  let rx = dx * cosA - dy * sinA;
  let ry = dx * sinA + dy * cosA;

  const scale = H / (rx + 200);
  if (scale < 0.1) return null;

  const screenX = W/2 + rx * scale;
  const screenY = H/2 - ry * scale;

  return { x: screenX, y: screenY, scale };
}

function projectWorld(x, y) {
  return project3D(x, y, 0);
}

// ============ RENDERING ============
let trees = [];
let buildings = [];
let mountains = [];

function generateScenery() {
  trees = [];
  buildings = [];
  mountains = [];

  // Mountains in distance
  for (let i = 0; i < 8; i++) {
    mountains.push({
      x: Math.random() * 2000 - 1000,
      y: Math.random() * 800 - 400,
      w: 200 + Math.random() * 300,
      h: 80 + Math.random() * 150,
      depth: 3 + Math.random() * 2
    });
  }

  // Buildings near track
  for (let i = 0; i < 20; i++) {
    const segIdx = Math.floor(Math.random() * trackSegments.length);
    const seg = trackSegments[segIdx];
    buildings.push({
      x: seg.x + seg.nx * (80 + Math.random() * 120),
      y: seg.y - seg.ny * (80 + Math.random() * 120),
      w: 30 + Math.random() * 40,
      h: 20 + Math.random() * 60,
      depth: 1.5 + Math.random() * 2
    });
  }

  // Trees along track and scattered
  for (let i = 0; i < 150; i++) {
    const segIdx = Math.floor(Math.random() * trackSegments.length);
    const seg = trackSegments[segIdx];
    const side = Math.random() > 0.5 ? seg.nx : -seg.nx;
    const dist = 60 + Math.random() * 200;
    trees.push({
      x: seg.x + side.x * dist,
      y: seg.y + side.y * dist,
      size: 5 + Math.random() * 12,
      depth: 0.5 + Math.random() * 3
    });
  }

  // Far trees
  for (let i = 0; i < 80; i++) {
    trees.push({
      x: Math.random() * 2500 - 1250,
      y: Math.random() * 2500 - 1250,
      size: 3 + Math.random() * 8,
      depth: 2 + Math.random() * 4
    });
  }
}

generateScenery();

// ============ GAME LOOP ============
let lastTime = 0;
let gameTime = 0;

function updatePlayer(dt) {
  const carStats = player.carData;
  let maxSpeed = carStats.speed * 4;

  // Gear calculation based on speed
  if (player.speed > maxSpeed * 0.25) player.gear = 4;
  else if (player.speed > maxSpeed * 0.5) player.gear = 3;
  else if (player.speed > maxSpeed * 0.75) player.gear = 2;
  else if (player.speed > 0.1) player.gear = 1;
  else if (player.speed < -0.5) player.gear = 0; // reverse

  // Acceleration / braking
  const accel = carStats.acceleration * dt;
  if (keys['KeyW'] || keys['ArrowUp']) {
    player.speed += accel;
  } else if (keys['KeyS'] || keys['ArrowDown']) {
    player.speed -= accel * 0.8;
  }

  // Steering
  const steer = carStats.handling * dt * 0.15;
  if (keys['KeyA'] || keys['ArrowLeft']) {
    player.angle -= steer;
  }
  if (keys['KeyD'] || keys['ArrowRight']) {
    player.angle += steer;
  }

  // Speed limits
  if (player.speed > maxSpeed) player.speed *= 0.95;
  if (player.speed < -maxSpeed * 0.3) player.speed *= 0.95;

  // Find current track segment
  let bestDist = Infinity;
  let closestSeg = trackSegments[0];
  for (let i = 0; i < trackSegments.length; i += 5) {
    const seg = trackSegments[i];
    const d = Math.sqrt((seg.x - player.x)**2 + (seg.y - player.y)**2);
    if (d < bestDist) { bestDist = d; closestSeg = seg; }
  }

  // Move along track
  const moveX = Math.cos(player.angle) * player.speed;
  const moveY = Math.sin(player.angle) * player.speed;

  // Keep on track
  const latDist = closestSeg.nx * (player.x - closestSeg.x) + closestSeg.ny * (player.y - closestSeg.y);
  if (Math.abs(latDist) > 40) {
    player.x -= latDist * 0.15 * Math.sign(latDist);
    player.y -= latDist * 0.15 * Math.sign(latDist);
  }

  player.x += moveX;
  player.y += moveY;
  player.h = closestSeg.h;

  // Progress and lap tracking
  player.progress = closestSeg.dist;
  if (player.progress > trackSegments[0].totalLength - 100 && player.lapStart > 0) {
    player.currentLap++;
    const lapTime = Date.now() - player.lapStart;
    if (lapTime < player.bestLapTime) player.bestLapTime = lapTime;
    player.lapStart = Date.now();
  }

  gameTime += dt;
}

function updateAI(dt) {
  for (let car of currentGame.aiCars) {
    const carStats = car.carData;
    const maxSpeed = carStats.speed * 4;

    // Find closest segment
    let bestDist = Infinity;
    let targetSegIdx = 0;
    for (let i = 0; i < trackSegments.length; i += 3) {
      const seg = trackSegments[i];
      const d = Math.sqrt((seg.x - car.x)**2 + (seg.y - car.y)**2);
      if (d < bestDist) { bestDist = d; targetSegIdx = i; }
    }

    const targetSeg = trackSegments[targetSegIdx];
    const nextSeg = trackSegments[(targetSegIdx + 1) % trackSegments.length];
    const targetAngle = Math.atan2(nextSeg.y - targetSeg.y, nextSeg.x - targetSeg.x);

    // Steering
    let targetSteer = (targetAngle - car.angle);
    while (targetSteer > Math.PI) targetSteer -= 2*Math.PI;
    while (targetSteer < -Math.PI) targetSteer += 2*Math.PI;
    const steer = Math.max(-1, Math.min(1, targetSteer * 0.3));

    // Acceleration
    const accFactor = carStats.acceleration * dt;
    if (Math.abs(targetSteer) < 1 && car.speed < maxSpeed * 0.85) {
      car.speed += accFactor;
    } else if (car.speed > maxSpeed) {
      car.speed *= 0.97;
    }

    // Speed limit on curves
    const speedLimit = maxSpeed * (1 - Math.abs(targetSteer) * 0.5);
    if (car.speed > speedLimit) car.speed *= 0.98;

    // Apply steering
    if (Math.abs(car.speed) > 0.5) {
      const turnRate = steer * car.speed * 0.01 * (car.length / carStats.weight);
      car.angle += turnRate;
    }

    // Move
    const moveSpeed = car.speed * dt;
    car.x += Math.cos(car.angle) * moveSpeed + targetSeg.dx * 0.1;
    car.y += Math.sin(car.angle) * moveSpeed + targetSeg.dy * 0.1;

    // Keep on track
    const latDist = targetSeg.nx * (car.x - targetSeg.x) + targetSeg.ny * (car.y - targetSeg.y);
    if (Math.abs(latDist) > 50) {
      car.x -= latDist * 0.1 * Math.sign(latDist);
      car.y -= latDist * 0.1 * Math.sign(latDist);
    }

    car.progress = targetSeg.dist;
  }
}

function getPosition() {
  let pos = 1;
  for (let car of currentGame.aiCars) {
    if (car.progress > player.progress - 50) pos++;
  }
  return pos;
}

// ============ DRAWING FUNCTIONS ============
function drawSky(t) {
  const tNorm = ((t * 0.5) % 1440 + 1440) / 1440;

  // Day/night cycle
  const sunAngle = tNorm * Math.PI * 2;

  let r, g, b;
  if (tNorm < 0.25) { // sunrise
    const s = tNorm / 0.25;
    r = Math.floor(30 + s * 180);
    g = Math.floor(20 + s * 100);
    b = Math.floor(80 - s * 40);
  } else if (tNorm < 0.5) { // morning
    const s = (tNorm - 0.25) / 0.25;
    r = Math.floor(180 + s * 30);
    g = Math.floor(200 + s * 40);
    b = Math.floor(120 + s * 60);
  } else if (tNorm < 0.75) { // afternoon
    const s = (tNorm - 0.5) / 0.25;
    r = Math.floor(210 - s * 80);
    g = Math.floor(240 - s * 60);
    b = Math.floor(180 + s * 40);
  } else { // evening/night
    const s = (tNorm - 0.75) / 0.25;
    r = Math.floor(130 - s * 100);
    g = Math.floor(180 - s * 60);
    b = Math.floor(220 + s * 40);
  }

  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, `rgb(${Math.min(r+40,255)},${Math.min(g+30,255)},${Math.min(b+40,255)})`);
  grad.addColorStop(0.5, `rgb(${Math.min(r+20,255)},${Math.min(g+15,255)},${Math.min(b+30,255)})`);
  grad.addColorStop(1, `rgb(${Math.min(r+60,255)},${Math.min(g+40,255)},${Math.min(b+50,255)})`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Sun/moon
  const sunX = W/2 + Math.cos(sunAngle) * W * 0.3;
  const sunY = H * 0.25 + Math.sin(sunAngle) * H * 0.15;
  const sunR = tNorm < 0.25 || tNorm > 0.7 ? 30 : 6;
  if (tNorm < 0.25) { // sunrise glow
    const sg = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, W*0.4);
    sg.addColorStop(0, 'rgba(255,150,50,0.3)');
    sg.addColorStop(1, 'rgba(255,150,50,0)');
    ctx.fillStyle = sg;
    ctx.fillRect(0, 0, W, H);
  }

  // Stars at night
  if (tNorm > 0.8 || tNorm < 0.15) {
    const starAlpha = Math.max(0, (tNorm > 0.8 ? tNorm - 0.8 : 0.15 - tNorm) / 0.3);
    for (let i = 0; i < 80; i++) {
      const sx = (i * 137.5) % W;
      const sy = (i * 97.3 + tNorm * 10) % (H * 0.4);
      ctx.fillStyle = `rgba(255,255,255,${starAlpha * 0.6})`;
      ctx.fillRect(sx, sy, 1.5, 1.5);
    }
  }

  // Clouds
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  for (let i = 0; i < 6; i++) {
    const cx = ((i * 340 + tNorm * 15) % (W + 200)) - 100;
    const cy = 50 + i * 25 + Math.sin(tNorm * 0.3 + i) * 15;
    ctx.beginPath();
    ctx.arc(cx, cy, 40 + i*5, 0, Math.PI * 2);
    ctx.arc(cx - 30, cy + 10, 30, 0, Math.PI * 2);
    ctx.arc(cx + 30, cy - 5, 35, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawMountains(t) {
  const parallax = t * 0.1;

  for (let m of mountains) {
    const mx = ((m.x - parallax * 0.3) % (W + m.w)) - m.w/2;
    const my = H * 0.45 + m.h * 0.3;

    const grad = ctx.createLinearGradient(mx, my - m.h, mx + m.w/2, my);
    grad.addColorStop(0, `rgba(${180+Math.sin(t*0.2)*30},${160+Math.cos(t*0.2)*25},${140+Math.sin(t*0.3)*20})`);
    grad.addColorStop(1, `rgba(${140+Math.sin(t*0.2)*20},${130+Math.cos(t*0.2)*15},${120+Math.sin(t*0.3)*15})`);

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(mx, my);
    ctx.lineTo(mx + m.w/2, my - m.h);
    ctx.lineTo(mx + m.w, my);
    ctx.fill();
  }

  // Far hills
  ctx.fillStyle = 'rgba(100,80,60,0.3)';
  for (let i = 0; i < 5; i++) {
    const hx = ((i * 400 + t * 0.2) % (W + 500)) - 250;
    const hy = H * 0.4 + Math.sin(i * 1.3) * 25;
    ctx.beginPath();
    ctx.moveTo(hx, H);
    ctx.quadraticCurveTo(hx + 150, hy - 30, hx + 250, H);
    ctx.fill();
  }
}

function drawBuildings(t) {
  const parallax = t * 0.3;

  for (let b of buildings) {
    const bx = ((b.x - parallax * 0.5) % (W + b.w)) - b.w/2;
    const by = H * 0.55 + b.h * 0.2;

    const brightness = 1 + Math.sin(t * 0.3 + b.x) * 0.2;

    ctx.fillStyle = `rgba(${Math.floor(80*brightness)},${Math.floor(70*brightness)},${Math.floor(65*brightness)})`;
    ctx.fillRect(bx, by - b.h * 0.6, b.w, b.h * 0.8);

    // Windows
    ctx.fillStyle = `rgba(255, 200 + Math.sin(t)*30, 150, ${0.3 + Math.sin(t*0.5)*0.2})`;
    for (let w = 0; w < b.w - 10; w += 12) {
      for (let h = 0; h < b.h * 0.7 - 5; h += 12) {
        if (Math.sin(w * 3.7 + h * 2.1) > 0) {
          ctx.fillRect(bx + 5 + w, by - b.h*0.6 + h + 3, 5, 6);
        }
      }
    }

    // Roof detail
    ctx.fillStyle = `rgba(${Math.floor(60*brightness)},${Math.floor(50*brightness)},${Math.floor(45*brightness)})`;
    ctx.fillRect(bx - 3, by - b.h*0.6, b.w + 6, 4);
  }
}

function drawTrees(t) {
  const parallax = t * 0.6;

  for (let tree of trees) {
    const tx = ((tree.x - parallax * 0.7) % (W + tree.size)) - tree.size;
    const ty = H * 0.58 + tree.depth * 5;

    // Tree trunk
    ctx.fillStyle = '#3a2a1a';
    const tw = tree.size * 0.15;
    ctx.fillRect(tx + tree.size/2 - tw/2, ty - 15, tw, 15);

    // Tree foliage
    const shade = Math.sin(t * 0.3 + tree.x) * 0.15;
    ctx.fillStyle = `rgb(${Math.floor(40+shade*60)},${Math.floor(120+shade*80)},${Math.floor(50+shade*40)})`;
    ctx.beginPath();
    ctx.arc(tx + tree.size/2, ty - 15 - tree.size * 0.6, tree.size * 0.7, 0, Math.PI * 2);
    ctx.fill();

    // Second layer
    ctx.fillStyle = `rgb(${Math.floor(30+shade*50)},${Math.floor(100+shade*60)},${Math.floor(40+shade*30)})`;
    ctx.beginPath();
    ctx.arc(tx + tree.size/2, ty - 15 - tree.size * 0.4, tree.size * 0.5, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawRoad() {
  const roadWidth = 100;

  // Draw road segments from far to near (painter's algorithm)
  const sorted = [...trackSegments].sort((a, b) => {
    const da = Math.sqrt((a.x - player.x)**2 + (a.y - player.y)**2);
    const db = Math.sqrt((b.x - player.x)**2 + (b.y - player.y)**2);
    return db - da;
  });

  // Road surface
  for (let i = 0; i < sorted.length - 1; i++) {
    const seg1 = sorted[i];
    const seg2 = sorted[i+1];

    if (seg1.y === seg2.y && seg1.x === seg2.x) continue;

    const p1 = project3D(seg1.x, seg1.y, 0);
    const p2 = project3D(seg2.x, seg2.y, 0);

    if (!p1 || !p2) continue;
    if (p1.scale < 0.05 || p2.scale < 0.05) continue;

    const left1 = project3D(seg1.x + seg1.nx * roadWidth/2, seg1.y + seg1.ny * roadWidth/2, 0);
    const left2 = project3D(seg2.x + seg2.nx * roadWidth/2, seg2.y + seg2.ny * roadWidth/2, 0);
    const right1 = project3D(seg1.x - seg1.nx * roadWidth/2, seg1.y - seg1.ny * roadWidth/2, 0);
    const right2 = project3D(seg2.x - seg2.nx * roadWidth/2, seg2.y - seg2.ny * roadWidth/2, 0);

    if (!left1 || !left2 || !right1 || !right2) continue;

    // Road color with perspective
    const dist = (p1.scale + p2.scale) / 2;
    const alpha = Math.min(0.8, dist * 3);

    ctx.fillStyle = `rgba(60, 55, 45, ${alpha})`;
    ctx.beginPath();
    ctx.moveTo(left1.x, left1.y);
    ctx.lineTo(right1.x, right1.y);
    ctx.lineTo(right2.x, right2.y);
    ctx.lineTo(left2.x, left2.y);
    ctx.fill();

    // Road edges (white lines)
    if (p1.scale > 0.5 && p2.scale > 0.5) {
      ctx.strokeStyle = `rgba(255, 255, 200, ${alpha * 0.6})`;
      ctx.lineWidth = Math.max(1, (p1.scale + p2.scale) / 4);
      ctx.beginPath();
      ctx.moveTo(left1.x, left1.y);
      ctx.lineTo(left2.x, left2.y);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(right1.x, right1.y);
      ctx.lineTo(right2.x, right2.y);
      ctx.stroke();

      // Center dashed line
      const center1 = project3D((seg1.x + seg2.x)/2, (seg1.y + seg2.y)/2, 0);
      const center2 = project3D((seg1.x + seg2.x)/2, (seg1.y + seg2.y)/2, 0);
      if (center1 && center2) {
        ctx.strokeStyle = `rgba(255, 200, 100, ${alpha * 0.3})`;
        ctx.lineWidth = Math.max(1, (p1.scale + p2.scale) / 6);
        ctx.setLineDash([10 * (p1.scale + p2.scale)/2, 15 * (p1.scale + p2.scale)/2]);
        ctx.beginPath();
        ctx.moveTo(center1.x, center1.y);
        ctx.lineTo(center2.x, center2.y);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    // Grass on sides
    const grassAlpha = Math.min(0.4, dist * 2);
    ctx.fillStyle = `rgba(50, 120, 40, ${grassAlpha})`;
    ctx.beginPath();
    ctx.moveTo(left1.x, left1.y);
    ctx.lineTo(right1.x, right1.y);
    ctx.lineTo(right2.x, right2.y);
    ctx.lineTo(left2.x, left2.y);
    ctx.fill();
  }

  // Draw curb details (colored edges)
  for (let i = 0; i < trackSegments.length; i += 4) {
    const seg = trackSegments[i];
    if (seg.y === trackSegments[(i+1)%trackSegments.length].y && seg.x === trackSegments[(i+1)%trackSegments.length].x) continue;

    const p = project3D(seg.x, seg.y, 0);
    if (!p || p.scale < 0.3) continue;

    const left = project3D(seg.x + seg.nx * roadWidth/2, seg.y + seg.ny * roadWidth/2, 0);
    const right = project3D(seg.x - seg.nx * roadWidth/2, seg.y - seg.ny * roadWidth/2, 0);

    if (left && right) {
      const dashLen = Math.max(2, p.scale * 10);

      ctx.strokeStyle = 'rgba(255, 80, 80, 0.7)';
      ctx.lineWidth = Math.max(1, p.scale * 2);

      // Left edge
      ctx.beginPath();
      ctx.moveTo(left.x, left.y);
      const nextL = project3D(seg.nx * roadWidth/2 + (trackSegments[(i+1)%trackSegments.length].x - seg.x), 
                                seg.ny * roadWidth/2 + (trackSegments[(i+1)%trackSegments.length].y - seg.y), 0);
      if (nextL) ctx.lineTo(nextL.x, nextL.y);
      ctx.stroke();

      // Right edge
      ctx.beginPath();
      ctx.moveTo(right.x, right.y);
      const nextR = project3D(-seg.nx * roadWidth/2 + (trackSegments[(i+1)%trackSegments.length].x - seg.x),
                                -seg.ny * roadWidth/2 + (trackSegments[(i+1)%trackSegments.length].y - seg.y), 0);
      if (nextR) ctx.lineTo(nextR.x, nextR.y);
      ctx.stroke();
    }
  }
}

function drawCar3D(x, y, h, angle, color, width, length, isPlayer) {
  const p = project3D(x, y, h);
  if (!p || p.scale < 0.1) return null;

  const s = p.scale;
  const screenX = p.x;
  const screenY = p.y;

  // Car dimensions in screen space
  const carW = width * s;
  const carL = length * s;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(screenX + Math.cos(angle)*carL*0.3*s, screenY + carW*0.2*s, carL*0.6*s, carW*0.3*s, 0, 0, Math.PI*2);
  ctx.fill();

  // Car body (top view from slightly above)
  const bodyTop = screenY - carW * 0.3 * s;

  ctx.save();
  ctx.translate(screenX, bodyTop);
  ctx.rotate(angle + Math.PI/2);

  // Car shadow on ground
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fillRect(-carL/2 + carW*0.1*s, -carW*0.1*s, carL, carW);

  // Car body
  ctx.fillStyle = color;
  const roundedRect = (x, y, w, h, r) => {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  };

  roundedRect(-carL/2, -carW/2 + carW*0.1*s, carL, carW * 0.85, carW * 0.15);
  ctx.fill();

  // Car outline
  ctx.strokeStyle = 'rgba(0,0,0,0.3)';
  ctx.lineWidth = Math.max(1, s * 0.5);
  roundedRect(-carL/2, -carW/2 + carW*0.1*s, carL, carW * 0.85, carW * 0.15);
  ctx.stroke();

  // Windshield
  const windshieldY = -carW/2 + carW*0.1*s + carL * 0.25;
  ctx.fillStyle = 'rgba(100, 180, 255, 0.7)';
  roundedRect(-carW/2 + carW*0.1*s, windshieldY, carL * 0.35, carW * 0.6, carW * 0.1);
  ctx.fill();

  // Headlights
  const lightY = -carW/2 + carW*0.1*s + carL * 0.45;
  ctx.fillStyle = '#ffdd44';
  ctx.fillRect(-carW/2 + carW*0.1*s, lightY, carW * 0.35, carW * 0.1);
  ctx.fillRect(carW/2 - carW*0.45, lightY, carW * 0.35, carW * 0.1);

  // Tail lights
  ctx.fillStyle = '#ff3333';
  const tailY = -carW/2 + carW*0.1*s - carL * 0.45;
  ctx.fillRect(-carW/2 + carW*0.1*s, tailY, carW * 0.35, carW * 0.1);
  ctx.fillRect(carW/2 - carW*0.45, tailY, carW * 0.35, carW * 0.1);

  // Wheels
  ctx.fillStyle = '#222';
  const wheelY1 = -carW/2 + carW*0.1*s;
  const wheelY2 = -carW/2 + carW*0.9*s;
  ctx.fillRect(-carL/2 - carW*0.15, wheelY1, carL * 0.3, carW * 0.2);
  ctx.fillRect(-carL/2 - carW*0.15, wheelY2, carL * 0.3, carW * 0.2);
  ctx.fillRect(carL/2 + carW*0.15 - carL*0.3, wheelY1, carL * 0.3, carW * 0.2);
  ctx.fillRect(carL/2 + carW*0.15 - carL*0.3, wheelY2, carL * 0.3, carW * 0.2);

  ctx.restore();

  return { x: screenX, y: screenY, scale: s };
}

function drawMinimap() {
  const mc = document.getElementById('minimap-canvas');
  const mctx = mc.getContext('2d');
  mc.width = 200;
  mc.height = 150;

  mctx.clearRect(0, 0, 200, 150);

  // Background
  mctx.fillStyle = 'rgba(10, 10, 30, 0.9)';
  mctx.fillRect(0, 0, 200, 150);

  // Calculate track bounds
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (let seg of trackSegments) {
    minX = Math.min(minX, seg.x);
    minY = Math.min(minY, seg.y);
    maxX = Math.max(maxX, seg.x);
    maxY = Math.max(maxY, seg.y);
  }

  const pad = 20;
  const scale = Math.min((200 - pad*2) / (maxX - minX), (150 - pad*2) / (maxY - minY));
  const offsetX = (200 - (maxX - minX) * scale) / 2 - pad;
  const offsetY = (150 - (maxY - minY) * scale) / 2 - pad;

  // Draw track
  mctx.strokeStyle = '#4a90d9';
  mctx.lineWidth = 3;
  mctx.beginPath();
  for (let i = 0; i < trackSegments.length; i += 3) {
    const seg = trackSegments[i];
    const sx = offsetX + (seg.x - minX) * scale;
    const sy = offsetY + (seg.y - minY) * scale;
    if (i === 0) mctx.moveTo(sx, sy);
    else mctx.lineTo(sx, sy);
  }
  mctx.stroke();

  // Draw other cars
  for (let car of currentGame.aiCars) {
    const sx = offsetX + (car.x - minX) * scale;
    const sy = offsetY + (car.y - minY) * scale;
    mctx.fillStyle = '#ff6b35';
    mctx.beginPath();
    mctx.arc(sx, sy, 2.5, 0, Math.PI * 2);
    mctx.fill();

    // Direction indicator
    mctx.strokeStyle = '#ff6b35';
    mctx.lineWidth = 1.5;
    mctx.beginPath();
    mctx.moveTo(sx, sy);
    mctx.lineTo(sx + Math.cos(car.angle) * 8, sy + Math.sin(car.angle) * 8);
    mctx.stroke();
  }

  // Draw player
  const px = offsetX + (player.x - minX) * scale;
  const py = offsetY + (player.y - minY) * scale;
  mctx.fillStyle = '#00ff88';
  mctx.beginPath();
  mctx.arc(px, py, 3.5, 0, Math.PI * 2);
  mctx.fill();

  // Player direction
  mctx.strokeStyle = '#00ff88';
  mctx.lineWidth = 2;
  mctx.beginPath();
  mctx.moveTo(px, py);
  mctx.lineTo(px + Math.cos(player.angle) * 10, py + Math.sin(player.angle) * 10);
  mctx.stroke();

  // Start/finish line marker
  const startSeg = trackSegments[0];
  const sx = offsetX + (startSeg.x - minX) * scale;
  const sy = offsetY + (startSeg.y - minY) * scale;
  mctx.strokeStyle = '#ffffff';
  mctx.lineWidth = 2;
  mctx.setLineDash([4, 4]);
  mctx.beginPath();
  mctx.moveTo(sx - startSeg.ny * 10, sy + startSeg.nx * 10);
  mctx.lineTo(sx + startSeg.ny * 10, sy - startSeg.nx * 10);
  mctx.stroke();
  mctx.setLineDash([]);

  // Label
  mctx.fillStyle = 'white';
  mctx.font = '8px Arial';
  mctx.fillText('START', sx + 5, sy - 10);

  // Position text
  const pos = getPosition();
  mctx.fillStyle = '#ff6b35';
  mctx.font = 'bold 12px Arial';
  mctx.fillText(`P${pos}`, 5, 18);
}

function drawSpeedometer() {
  const rpmCanvas = document.getElementById('rpm-canvas');
  const rctx = rpmCanvas.getContext('2d');
  const w = 180, h = 120;

  rctx.clearRect(0, 0, w, h);

  // Background
  const bgGrad = rctx.createRadialGradient(w/2, h/2, 10, w/2, h/2, 75);
  bgGrad.addColorStop(0, '#1a1a2e');
  bgGrad.addColorStop(1, '#0f0f1a');
  rctx.fillStyle = bgGrad;
  rctx.beginPath();
  rctx.arc(w/2, h/2, 75, 0, Math.PI * 2);
  rctx.fill();

  // Gauge arc (180 degrees, from -90 to +90)
  const startAngle = Math.PI;
  const endAngle = 0;
  rctx.strokeStyle = '#333';
  rctx.lineWidth = 6;
  rctx.beginPath();
  rctx.arc(w/2, h/2 + 10, 65, startAngle, endAngle);
  rctx.stroke();

  // Fill arc based on speed
  const maxSpeed = player.carData.speed * 4;
  const speedRatio = Math.min(1, Math.max(0, player.speed / maxSpeed));
  const currentAngle = startAngle + speedRatio * (endAngle - startAngle);

  const color1 = '#ff6b35';
  const color2 = '#00cc44';

  // Color gradient for speed
  let fillColor;
  if (speedRatio < 0.5) {
    const t = speedRatio / 0.5;
    fillColor = `rgb(${Math.floor(100 + t * 155)}, ${Math.floor(200 - t * 80)}, ${Math.floor(30 + t * 5)})`;
  } else {
    const t = (speedRatio - 0.5) / 0.5;
    fillColor = `rgb(${Math.floor(255 - t * 100)}, ${Math.floor(85 + t * 60)}, ${Math.floor(35 - t * 10)})`;
  }

  rctx.strokeStyle = fillColor;
  rctx.lineWidth = 6;
  rctx.beginPath();
  rctx.arc(w/2, h/2 + 10, 65, startAngle, currentAngle);
  rctx.stroke();

  // Tick marks
  for (let i = 0; i <= 12; i++) {
    const angle = startAngle + (i / 12) * (endAngle - startAngle);
    const innerR = 58;
    const outerR = i === 0 || i === 12 ? 68 : 55;
    rctx.strokeStyle = '#444';
    rctx.lineWidth = i === 0 || i === 12 ? 3 : 1;
    rctx.beginPath();
    rctx.moveTo(w/2 + Math.cos(angle) * innerR, h/2 + 10 + Math.sin(angle) * innerR);
    rctx.lineTo(w/2 + Math.cos(angle) * outerR, h/2 + 10 + Math.sin(angle) * outerR);
    rctx.stroke();

    // Numbers
    if (i % 3 === 0) {
      rctx.fillStyle = '#aaa';
      rctx.font = '9px Arial';
      rctx.textAlign = 'center';
      const textR = 68;
      rctx.fillText(Math.round(maxSpeed * i / 12), w/2 + Math.cos(angle) * textR, h/2 + 10 + Math.sin(angle) * textR);
    }
  }

  // Needle
  rctx.save();
  rctx.translate(w/2, h/2 + 10);

  const needleAngle = currentAngle - Math.PI;
  rctx.rotate(needleAngle);

  // Needle shadow
  rctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(-2, 5, 4, 60);

  // Needle
  rctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(-3, 0);
  ctx.lineTo(3, 0);
  ctx.lineTo(0, -58);
  rctx.fill();

  // Center dot
  rctx.fillStyle = '#ff6b35';
  rctx.beginPath();
  rctx.arc(0, 0, 4, 0, Math.PI * 2);
  rctx.fill();

  rctx.restore();

  // RPM label
  rctx.fillStyle = '#666';
  rctx.font = '10px Arial';
  rctx.textAlign = 'center';
  rctx.fillText('RPM', w/2, h - 15);

  // Speed label
  rctx.fillStyle = '#888';
  rctx.font = '9px Arial';
  rctx.textAlign = 'center';
  rctx.fillText('0', w/2 - 35, h - 15);
  rctx.fillText('MAX', w/2 + 30, h - 15);
}

function drawHUD() {
  const pos = getPosition();

  document.getElementById('current-lap').textContent = `${Math.min(player.currentLap, 3)} / 3`;
  document.getElementById('lap-time').textContent = `Time: ${formatTime(getLapTime())}`;
  document.getElementById('best-lap').textContent = `Best: ${player.bestLapTime < Infinity ? formatTime(player.bestLapTime) : '--'}`;
  document.getElementById('current-position').textContent = pos;
  document.getElementById('speed-display').textContent = `${Math.round(player.speed)} km/h`;
  document.getElementById('gear-display-val').textContent = player.gear === 0 ? 'R' : player.gear;

  drawSpeedometer();
}

function formatTime(ms) {
  const totalSec = Math.floor(ms / 1000);
  const sec = totalSec % 60;
  const min = Math.floor(totalSec / 60);
  const centi = Math.floor((ms % 1000) / 10);
  return `${min}:${sec.toString().padStart(2, '0')}.${centi.toString().padStart(2, '0')}`;
}

function getLapTime() {
  return Date.now() - player.lapStart;
}

// ============ GAME STATES ============
function showGarage() {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('finish-screen').style.display = 'none';
  document.getElementById('garage-screen').style.display = 'flex';

  const grid = document.getElementById('car-grid');
  grid.innerHTML = '';

  cars.forEach((car, i) => {
    const card = document.createElement('div');
    card.className = `car-card ${i === selectedCarIndex ? 'selected' : ''}`;
    card.onclick = () => { selectedCarIndex = i; renderGarage(); };

    const speedPct = (car.speed / 100) * 100;
    const handlingPct = (car.handling / 100) * 100;
    const accelPct = (car.acceleration / 100) * 100;

    card.innerHTML = `
      <h3>${car.name}</h3>
      <div class="car-color" style="background:${car.color}"></div>
      <div class="stats"><strong>Speed:</strong> ${car.speed}</div>
      <div class="stats-bar"><div class="stats-bar-fill" style="width:${speedPct}%;background:#ff6b35"></div></div>
      <div class="stats"><strong>Handling:</strong> ${car.handling}</div>
      <div class="stats-bar"><div class="stats-bar-fill" style="width:${handlingPct}%;background:#4a90d9"></div></div>
      <div class="stats"><strong>Acceleration:</strong> ${car.acceleration}</div>
      <div class="stats-bar"><div class="stats-bar-fill" style="width:${accelPct}%;background:#00cc44"></div></div>
      <div class="price">${car.weight}kg</div>
    `;

    grid.appendChild(card);
  });
}

function renderGarage() {
  document.getElementById('car-grid').innerHTML = '';
  cars.forEach((car, i) => {
    const card = document.createElement('div');
    card.className = `car-card ${i === selectedCarIndex ? 'selected' : ''}`;
    card.onclick = () => { selectedCarIndex = i; renderGarage(); };

    const speedPct = (car.speed / 100) * 100;
    const handlingPct = (car.handling / 100) * 100;
    const accelPct = (car.acceleration / 100) * 100;

    card.innerHTML = `
      <h3>${car.name}</h3>
      <div class="car-color" style="background:${car.color}"></div>
      <div class="stats"><strong>Speed:</strong> ${car.speed}</div>
      <div class="stats-bar"><div class="stats-bar-fill" style="width:${speedPct}%;background:#ff6b35"></div></div>
      <div class="stats"><strong>Handling:</strong> ${car.handling}</div>
      <div class="stats-bar"><div class="stats-bar-fill" style="width:${handlingPct}%;background:#4a90d9"></div></div>
      <div class="stats"><strong>Acceleration:</strong> ${car.acceleration}</div>
      <div class="stats-bar"><div class="stats-bar-fill" style="width:${accelPct}%;background:#00cc44"></div></div>
      <div class="price">${car.weight}kg</div>
    `;

    document.getElementById('car-grid').appendChild(card);
  });
}

function showStart() {
  document.getElementById('garage-screen').style.display = 'none';
  document.getElementById('start-screen').style.display = 'flex';
}

function startRace() {
  document.getElementById('garage-screen').style.display = 'none';

  // Create AI cars
  const aiCarIndices = [0, 1, 3, 4]; // Different cars for AI
  const aiCars = [];

  for (let i = 0; i < 4; i++) {
    const startSeg = trackSegments[(i * 3) % trackSegments.length];
    const carIdx = aiCarIndices[i % aiCarIndices.length];
    const aiCar = new RaceCar(
      startSeg.x + startSeg.nx * (40 + i * 15),
      startSeg.y - startSeg.ny * (40 + i * 15),
      startSeg.h,
      -Math.PI/2 + Math.random() * 0.3 - Math.random() * 0.3,
      cars[carIdx],
      false
    );
    aiCars.push(aiCar);
  }

  currentGame = {
    state: 'racing',
    aiCars: aiCars,
    startTime: Date.now(),
    finishTime: null
  };

  createPlayerCar();
  document.getElementById('hud').style.display = 'block';
  paused = false;

  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
}

// ============ MAIN GAME LOOP ============
function gameLoop(timestamp) {
  if (paused) return;

  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  if (!currentGame || currentGame.state !== 'racing') return;

  // Check for race finish
  if (player.currentLap > 3) {
    currentGame.state = 'finished';
    document.getElementById('finish-screen').style.display = 'flex';
    const totalTime = formatTime(Date.now() - currentGame.startTime);
    document.getElementById('finish-stats').innerHTML = `
      <div>Position: <span>${getPosition()}</span></div>
      <div>Total Time: <span>${totalTime}</span></div>
      <div>Best Lap: <span>${formatTime(player.bestLapTime)}</span></div>
      <div>Cars: ${cars[selectedCarIndex].name}</div>
    `;
    return;
  }

  updatePlayer(dt);
  updateAI(dt);

  // Render
  ctx.clearRect(0, 0, W, H);
  drawSky(gameTime);
  drawMountains(gameTime);
  drawBuildings(gameTime);
  drawTrees(gameTime);
  drawRoad();

  // Collect all cars to sort by distance
  const allCars = [{ ...player, isPlayer: true }, ...currentGame.aiCars];

  // Sort by distance from camera (far to near)
  const sorted = allCars.sort((a, b) => {
    const da = Math.sqrt((a.x - player.x)**2 + (a.y - player.y)**2);
    const db = Math.sqrt((b.x - player.x)**2 + (b.y - player.y)**2);
    return db - da;
  });

  // Draw all cars
  for (let car of sorted) {
    if (car.isPlayer && gameTime % 2 < 1) continue; // Flicker for player visibility

    drawCar3D(car.x, car.y, car.h, car.angle, car.color, car.width, car.length, car.isPlayer);

    // Draw number tag for AI cars
    if (!car.isPlayer) {
      const p = project3D(car.x, car.y + 40, car.h);
      if (p && p.scale > 1) {
        ctx.fillStyle = 'white';
        ctx.font = `bold ${Math.max(8, 14 * p.scale)}px Arial`;
        ctx.textAlign = 'center';
        ctx.fillText('AI', p.x, p.y - 10 * p.scale);
      }
    }
  }

  // Draw player car on top if not flickering
  const pp = project3D(player.x, player.y + 40, player.h);
  if (pp && pp.scale > 1) {
    ctx.fillStyle = 'white';
    ctx.font = `bold ${Math.max(8, 14 * pp.scale)}px Arial`;
    ctx.textAlign = 'center';
    ctx.fillText('YOU', pp.x, pp.y - 10 * pp.scale);
  }

  drawMinimap();
  drawHUD();

  requestAnimationFrame(gameLoop);
}

// ============ INITIALIZE ============
showStart();
</script>
