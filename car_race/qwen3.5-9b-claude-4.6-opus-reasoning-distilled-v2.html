<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Retro Racer 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        
        /* Game Container */
        #game-container { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        canvas { display: block; image-rendering: pixelated; }

        /* UI Overlays */
        .ui-layer { position: absolute; pointer-events: none; width: 100%; height: 100%; top: 0; left: 0; box-sizing: border-box; }
        
        /* HUD */
        #hud-top-left { padding: 20px; color: white; text-shadow: 2px 2px 0 #000; display: flex; flex-direction: column; gap: 10px; }
        .stat-box { background: rgba(0,0,0,0.5); padding: 10px; border-radius: 4px; border-left: 4px solid #ffcc00; }
        h2 { margin: 0; font-size: 18px; color: #ccc; text-transform: uppercase; letter-spacing: 1px; }
        .value { font-size: 32px; font-weight: bold; color: #fff; }
        
        /* Speedometer */
        #speed-container { position: absolute; bottom: 20px; right: 20px; width: 250px; height: 180px; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); border-radius: 10px; overflow: hidden; border: 2px solid #444; }
        .speed-needle { position: absolute; bottom: 0; left: 50%; width: 4px; height: 160px; background: red; transform-origin: bottom center; transition: transform 0.1s cubic-bezier(0.1, 0.7, 1.0, 0.1); }
        .speed-text { position: absolute; bottom: 10px; width: 100%; text-align: center; color: white; font-weight: bold; font-size: 24px; }

        /* Minimap */
        #minimap-container { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.6); padding: 5px; border-radius: 5px; width: 150px; height: 150px; overflow: hidden; }
        #minimap { width: 100%; height: 100%; }

        /* Garage Screen */
        #garage-screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(20, 20, 30, 0.95); z-index: 100; display: flex;
            flex-direction: column; align-items: center; justify-content: center; color: white;
        }
        .garage-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 30px; }
        .car-card { 
            background: #333; padding: 20px; border-radius: 8px; cursor: pointer; 
            transition: transform 0.2s, box-shadow 0.2s; text-align: center; width: 250px;
        }
        .car-card:hover { transform: translateY(-5px); background: #444; box-shadow: 0 10px 20px rgba(0,0,0,0.5); border: 1px solid #ffcc00; }
        .car-icon { font-size: 40px; margin-bottom: 10px; display: block; }
        .stat-bar { height: 6px; background: #222; margin-top: 5px; border-radius: 3px; overflow: hidden; }
        .stat-fill { height: 100%; background: linear-gradient(90deg, #4caf50, #8bc34a); width: 0%; transition: width 0.3s; }

        /* Start Screen */
        #start-screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); z-index: 99; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: white; text-align: center;
        }
        button { padding: 15px 40px; font-size: 24px; background: #ffcc00; border: none; cursor: pointer; font-weight: bold; margin-top: 20px; border-radius: 5px; transition: transform 0.1s;}
        button:hover { transform: scale(1.05); }

        /* Notifications */
        #notification-area { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 48px; color: yellow; text-shadow: 2px 2px 0 red; opacity: 0; transition: opacity 0.5s; pointer-events: none;}
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->
    <div class="ui-layer" id="hud-top-left">
        <div class="stat-box">
            <h2>Lap Time</h2>
            <div class="value" id="lap-time">0.000</div>
        </div>
        <div class="stat-box">
            <h2>Best Lap</h2>
            <div class="value" id="best-lap">--:--:--</div>
        </div>
    </div>

    <div class="ui-layer" id="minimap-container">
        <canvas id="minimap"></canvas>
    </div>

    <div class="ui-layer" id="speed-container">
        <div class="speed-needle" id="speed-needle" style="transform: rotate(-135deg);"></div> <!-- Start at 0 -->
        <div class="speed-text"><span id="speed-val">0</span> km/h</div>
    </div>

    <div class="ui-layer" id="notification-area">LAP COMPLETE!</div>

    <!-- Garage Screen -->
    <div id="garage-screen">
        <h1 style="font-size: 60px; margin-bottom: 10px;">GARAGE</h1>
        <p>Select your machine to start the race.</p>
        <div class="garage-grid" id="car-selection">
            <style>
                .car-card {
                    transition: all 0.3s ease;
                    cursor: pointer;
                    padding: 15px;
                    border-radius: 10px;
                    background: linear-gradient(145deg, #1a1a2e, #16213e);
                    border: 2px solid #333;
                }
                .car-card:hover {
                    transform: translateY(-5px) scale(1.02);
                    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4),
                        inset 0 0 20px rgba(76, 175, 80, 0.2);
                    border-color: #4caf50;
                }
                .car-card.selected-car {
                    border: 3px solid #ffcc00 !important;
                    box-shadow: 0 0 20px rgba(255, 204, 0, 0.6) inset,
                        0 0 30px rgba(255, 204, 0, 0.4);
                    transform: scale(1.05);
                }
            </style>
            <!-- Cars injected via JS -->
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen">
        <h1 style="font-size: 80px; color: #ffcc00; text-shadow: 4px 4px 0 #b36600;">TURBO RACER</h1>
        <p>Use Arrow Keys to Drive. Space to Brake.</p>
        <button onclick="startGame()">START ENGINE</button>
    </div>
</div>

<script>
/** 
 * CONFIGURATION & CONSTANTS 
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); // Optimize for speed
const minimapCanvas = document.getElementById('minimap');
const minCtx = minimapCanvas.getContext('2d');

// Set resolution
canvas.width = 1024;
canvas.height = 768;
minimapCanvas.width = 300;
minimapCanvas.height = 300;

// Game Constants
const FPS = 60;
const STEP = 1 / FPS;
const WIDTH = canvas.width;
const HEIGHT = canvas.height;
const SEGMENT_LENGTH = 200; // Length of each road segment
const RUMBLE_LENGTH = 3;    // Number of segments per rumble strip color
const ROAD_WIDTH = 2000;    // Actual width in world units
const DRAW_DISTANCE = 300;  // How many segments to draw ahead
const FIELD_OF_VIEW = 100;  // Camera FOV
const CAMERA_HEIGHT = 1000; // Height above road
const CAMERA_DEPTH = 2 / Math.tan((FIELD_OF_VIEW / 2) * Math.PI / 180);

// Physics Constants
const ACCELERATION = 0.05;
const MAX_SPEED = 12000;    // Max speed in pixels per second
const DECELERATION = 0.04;
const CENTRIFUGAL_FORCE = 0.3; // Force pushing car out on curves

/** 
 * TRACK DATA GENERATOR 
 */
function generateTrack() {
    const track = [];
    let curve = 0;
    let height = 0;
    
    for (let i = 0; i < 2000; i++) {
        // Randomize curves and hills
        if (Math.random() < 0.1) curve += (Math.random() - 0.5) * 4; 
        if (Math.random() < 0.05) height += (Math.random() - 0.5) * 200;

        // Clamp values
        curve = Math.max(Math.min(curve, 3), -3);
        
        track.push({
            index: i,
            p1: { world: { x: 0, y: height, z: 0 }, camera: {}, screen: {} },
            p2: { world: { x: curve * ROAD_WIDTH, y: height + (Math.random()-0.5)*100, z: 0 }, camera: {}, screen: {} }, // Slight offset for hills
            curve: curve,
            color: Math.floor(i / RUMBLE_LENGTH) % 2 ? 'dark' : 'light',
            grassColor: `rgb(${20 + Math.random()*30}, ${150 + Math.random()*50}, ${50})`, // Varied grass
            building: (i > 50 && i < 400) ? { w: 100, h: 100, x: curve * ROAD_WIDTH } : null
        });
    }
    return track;
}

const TRACK = generateTrack();

/** 
 * GAME STATE 
 */
let playerX = 0;
let playerZ = 0; // Position along the track (index)
let speed = 0;
let position = 0; // Current segment index
let totalDistance = 0;
let currentLapTime = 0;
let bestLapTime = null;
let lastLapTime = Date.now();
let isRacing = false;
let lapComplete = false;

// AI Cars
const AI_CARS = [
    { x: -1.5, z: 200, speedOffset: 0.9 }, // Left lane
    { x: 1.5, z: 200, speedOffset: 0.85 }  // Right lane
];

// Garage Data
const CARS = [
    { name: "Street Beast", color: "#ff4444", stats: { acc: 90, spd: 70, han: 60 }, icon: "🏎️" },
    { name: "Green Machine", color: "#44aa44", stats: { acc: 80, spd: 95, han: 85 }, icon: "🚙" },
    { name: "Blue Blur", color: "#4444ff", stats: { acc: 60, spd: 100, han: 70 }, icon: "🏁" },
    { name: "Golden Eagle", color: "#ffd700", stats: { acc: 95, spd: 85, han: 90 }, icon: "🦅" }
];

let selectedCar = null;

/** 
 * UPDATE SELECTED CAR COLOR FUNCTION
 */
function updateSelectedCarColor() {
    // Update the canvas background to show selected car color
    const canvas = document.getElementById('game-canvas');
    if (canvas) {
        canvas.style.backgroundColor = selectedCar.color;
    }
    
    // Highlight the selected car card in the garage
    const cards = document.querySelectorAll('.car-card');
    cards.forEach(card => {
        if (!card.dataset.selected) {
            card.classList.remove('selected-car');
            card.dataset.selected = 'false';
        }
    });
    
    // Find and highlight the selected car
    const selectedCard = document.querySelector(`.car-card[data-name="${selectedCar.name}"]`);
    if (selectedCard) {
        selectedCard.classList.add('selected-car');
        selectedCard.dataset.selected = 'true';
    }
}

/** 
 * INPUT HANDLING 
 */
const keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => {
    keys[e.code] = false;
    if (e.code === 'Space' && isRacing) speed -= 200; // Brake
});

/** 
 * CORE FUNCTIONS 
 */

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

function resetGame() {
    playerX = 0;
    speed = 0;
    position = 100; // Start in middle of track
    totalDistance = 0;
    currentLapTime = 0;
    lapComplete = false;
    
    // Reset AI positions relative to player start
    AI_CARS.forEach(ai => { ai.z = 200; });

    document.getElementById('start-screen').style.display = 'flex';
    document.getElementById('garage-screen').style.display = 'none';
}

function selectCar(car) {
    selectedCar = car;
    // Update the car color immediately for visual feedback
    updateSelectedCarColor();
}

function startGame() {
    resetGame();
    isRacing = true;
    lastLapTime = Date.now();
    
    document.getElementById('start-screen').style.display = 'none';
    gameLoop();
}

/** 
 * PHYSICS & LOGIC UPDATE 
 */
function update(dt) {
    if (!isRacing) return;

    // 1. Acceleration / Deceleration
    if (keys['ArrowUp']) speed += ACCELERATION;
    else if (keys['ArrowDown']) speed -= ACCELERATION;
    
    // Natural friction
    if (!keys['ArrowUp'] && !keys['ArrowDown']) {
        if (speed > 0) speed -= DECELERATION;
        if (speed < 0) speed += DECELERATION;
    }

    // Clamp Speed
    speed = Math.max(Math.min(speed, MAX_SPEED), -MAX_SPEED/2);

    // 2. Move Player along Track
    const delta = speed * dt;
    position += delta;

    // Handle Lap Logic (Loop track)
    if (position >= TRACK.length) {
        position -= TRACK.length;
        totalDistance++;
        
        // Check for lap completion (simplified: every full loop)
        if (!lapComplete && totalDistance > 0) {
            finishLap();
        }
    }

    // Calculate Player World Position based on Track Index
    const pIndex = Math.floor(position);
    const segment = TRACK[pIndex];
    
    // Interpolate between segments for smooth movement
    const percent = (position - pIndex) / 1; 
    const nextSegment = TRACK[(pIndex + 1) % TRACK.length];

    // Calculate X/Z offset based on curve
    playerX += segment.curve * delta * dt; 
    
    // Centrifugal force pushes car outwards on curves
    if (Math.abs(segment.curve) > 0.1) {
        const centrifugal = speed * segment.curve * CENTRIFUGAL_FORCE;
        playerX -= centrifugal; 
    }

    // Clamp to road width with proper bounds checking
    const limit = ROAD_WIDTH / 2 - 50; // Buffer from edge
    if (playerX > limit) {
        playerX = Math.min(playerX, limit);
        speed *= 0.98; // Slow down on wall hit
    } else if (playerX < -limit) {
        playerX = Math.max(playerX, -limit);
        speed *= 0.98;
    }
    
    // Ensure playerX is always finite to prevent rendering errors
    if (!isFinite(playerX)) {
        playerX = 0;
    }

    // Update AI
    updateAI(dt);

    // Update UI Data
    const kmh = Math.floor(Math.abs(speed) * 3.6 / MAX_SPEED * 250); // Fake conversion
    document.getElementById('speed-val').innerText = kmh;
    
    if (lapComplete) {
        currentLapTime += dt;
        document.getElementById('lap-time').innerText = currentLapTime.toFixed(3);
    } else {
        const now = Date.now();
        currentLapTime = (now - lastLapTime) / 1000;
        document.getElementById('lap-time').innerText = currentLapTime.toFixed(3);
    }

    // Minimap Update
    updateMinimap(playerX, position);
}

function updateAI(dt) {
    AI_CARS.forEach(ai => {
        ai.z += (MAX_SPEED * 0.85 * ai.speedOffset) * dt; // Move forward
        
        // Simple steering logic: try to stay in lane but drift slightly
        const targetX = (ai.x > 0 ? 1 : -1) * (ROAD_WIDTH/2 - 400); 
        ai.x += (targetX - ai.x) * 0.05;

        // Collision with player (simple distance check)
        if (Math.abs(ai.z - position) < 5 && Math.abs(ai.x - playerX) < ROAD_WIDTH/3) {
            speed *= 0.9; // Player slows down slightly
        }
    });
}

function finishLap() {
    lapComplete = true;
    const now = Date.now();
    const lapTimeSecs = (now - lastLapTime) / 1000;
    
    if (!bestLapTime || lapTimeSecs < bestLapTime) {
        bestLapTime = lapTimeSecs;
        document.getElementById('best-lap').innerText = formatTime(bestLapTime);
    }

    showNotification("LAP COMPLETE!");
}

function formatTime(seconds) {
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    const ms = Math.floor((seconds % 1) * 100);
    return `${m}:${s.toString().padStart(2, '0')}.${ms.toString().padStart(2, '0')}`;
}

function showNotification(text) {
    const el = document.getElementById('notification-area');
    el.innerText = text;
    el.style.opacity = 1;
    setTimeout(() => el.style.opacity = 0, 2000);
}

/** 
 * RENDERING ENGINE (Pseudo-3D) 
 */
function project(p, cameraX, cameraY, cameraZ, cameraDepth, width, height, roadWidth) {
    p.camera.x = (p.world.x || 0) - cameraX;
    p.camera.y = (p.world.y || 0) - cameraY;
    p.camera.z = (p.world.z || 0) - cameraZ;
    
    // Perspective projection
    p.screen.scale = cameraDepth / p.camera.z;
    p.screen.x = Math.round((width / 2) + (p.screen.scale * p.camera.x * width / 2));
    p.screen.y = Math.round((height / 2) - (p.screen.scale * p.camera.y * height / 2));
    p.screen.w = Math.round(p.screen.scale * roadWidth * width / 2);
}

function render() {
    // Clear Screen
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    // Sky Gradient (Day/Night Cycle simulation)
    const timeOfDay = Math.sin(Date.now() / 15000) * 0.5 + 0.5; 
    let skyTop = `rgb(${255}, ${255}, ${255})`;
    let skyBottom = `rgb(${135}, ${206}, ${235})`; // SkyBlue
    
    if (timeOfDay < 0.2) { skyTop = '#000'; skyBottom = '#444'; } // Night
    else if (timeOfDay > 0.8) { skyTop = '#ffccaa'; skyBottom = '#fff'; } // Sunset

    const grad = ctx.createLinearGradient(0, 0, 0, HEIGHT);
    grad.addColorStop(0, skyTop);
    grad.addColorStop(1, skyBottom);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    // Parallax Background Layers (Mountains/Trees)
    renderParallax(timeOfDay);

    // Render Road Segments
    const baseSegment = Math.floor(position);
    const maxy = HEIGHT;
    let dx = -(TRACK[baseSegment].p1.world.x + TRACK[baseSegment].p2.world.x) / 2;
    
    for (let n = 0; n < DRAW_DISTANCE; n++) {
        const segment = TRACK[(baseSegment + n) % TRACK.length];
        
        // Project points
        project(segment.p1, playerX, CAMERA_HEIGHT, position - n, CAMERA_DEPTH, WIDTH, HEIGHT, ROAD_WIDTH);
        project(segment.p2, playerX, CAMERA_HEIGHT, position - n, CAMERA_DEPTH, WIDTH, HEIGHT, ROAD_WIDTH);
        
        // Skip segments with invalid screen coordinates (non-finite values)
        if (!isFinite(segment.p1.screen.y) || !isFinite(segment.p2.screen.y)) continue;

        // Create gradient with bounds checking
        const y1 = Math.max(0, Math.min(segment.p1.screen.y, HEIGHT));
        const y2 = Math.max(0, Math.min(segment.p2.screen.y, HEIGHT));
        
        // Ensure y1 and y2 are valid finite numbers before creating gradient
        if (!isFinite(y1) || !isFinite(y2)) continue;
        
        const gradient = ctx.createLinearGradient(0, y1, 0, y2);
        
        // Road Colors
        if (segment.color === 'dark') {
            gradient.addColorStop(0, '#333');
            gradient.addColorStop(0.5, '#444');
            gradient.addColorStop(1, '#333');
        } else {
            gradient.addColorStop(0, '#666');
            gradient.addColorStop(0.5, '#777');
            gradient.addColorStop(1, '#666');
        }

        ctx.fillStyle = gradient;
        
        // Draw Road Strip
        ctx.beginPath();
        ctx.moveTo(segment.p1.screen.x - segment.p1.screen.w, segment.p1.screen.y);
        ctx.lineTo(segment.p2.screen.x + segment.p2.screen.w, segment.p2.screen.y);
        ctx.lineTo(segment.p2.screen.x + segment.p2.screen.w, HEIGHT); // Fill to bottom for hills
        ctx.lineTo(segment.p1.screen.x - segment.p1.screen.w, HEIGHT);
        ctx.fill();

        // Draw Grass/Background behind road
        ctx.fillStyle = segment.grassColor;
        ctx.fillRect(0, segment.p2.screen.y, WIDTH, segment.p1.screen.y - segment.p2.screen.y);

        // Rumble Strips
        if (segment.color === 'dark') {
            ctx.fillStyle = '#fff';
            ctx.fillRect(segment.p1.screen.x - segment.p1.screen.w - 10, segment.p1.screen.y, 10, segment.p2.screen.y - segment.p1.screen.y);
            ctx.fillRect(segment.p2.screen.x + segment.p2.screen.w, segment.p1.screen.y, 10, segment.p2.screen.y - segment.p1.screen.y);
        } else {
            ctx.fillStyle = '#f00';
            ctx.fillRect(segment.p1.screen.x - segment.p1.screen.w - 10, segment.p1.screen.y, 10, segment.p2.screen.y - segment.p1.screen.y);
            ctx.fillRect(segment.p2.screen.x + segment.p2.screen.w, segment.p1.screen.y, 10, segment.p2.screen.y - segment.p1.screen.y);
        }

        // Buildings (Simple Rectangles)
        if (segment.building) {
             const bScale = segment.p1.screen.scale;
             const bw = Math.abs(segment.building.w * bScale);
             const bh = 50 * bScale; 
             const bx = segment.building.x - dx + (WIDTH/2); // Adjust for camera offset
             
             ctx.fillStyle = '#888';
             ctx.fillRect(bx, segment.p1.screen.y, bw, bh);
        }

        dx += (segment.p1.world.x + segment.p2.world.x) / 2;
    }

    // Render Player Car
    renderPlayerCar();

    // Render AI Cars
    renderAICars();
}

function renderParallax(timeOfDay) {
    const layers = [
        { speed: 0.1, color: '#87CEEB', y: HEIGHT * 0.6 }, // Distant Sky/Mountains
        { speed: 0.3, color: '#2E8B57', y: HEIGHT * 0.4 }, // Trees
        { speed: 0.5, color: '#A9A9A9', y: HEIGHT * 0.2 }  // Buildings
    ];

    layers.forEach(layer => {
        ctx.fillStyle = layer.color;
        const offset = (Date.now() * layer.speed) % WIDTH;
        
        // Draw simple shapes to simulate scenery moving
        for(let i=0; i<WIDTH + offset; i+=100) {
            if(layer.y < HEIGHT/2) {
                ctx.fillRect(i, layer.y - 50, 60, 50); // Mountains
            } else {
                ctx.fillRect(i, layer.y, 40, 80); // Trees
            }
        }
    });
}

function renderPlayerCar() {
    // Validate canvas dimensions before rendering
    if (!isFinite(WIDTH) || !isFinite(HEIGHT)) return;
    
    const carW = 200;
    const carH = 100;
    
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath();
    ctx.ellipse(WIDTH/2, HEIGHT - 50, carW/2, carH/4, 0, 0, Math.PI*2);
    ctx.fill();

    // Car Body (Simple Shape)
    const safeY1 = Math.max(0, Math.min(HEIGHT - carH, HEIGHT));
    const safeY2 = Math.max(0, Math.min(HEIGHT, HEIGHT));
    
    const gradient = ctx.createLinearGradient(0, safeY1, 0, safeY2);
    gradient.addColorStop(0, selectedCar.color);
    gradient.addColorStop(1, '#333');
    
    ctx.fillStyle = gradient;
    // Tilt car based on steering input (simulated)
    const tilt = keys['ArrowLeft'] ? 5 : (keys['ArrowRight'] ? -5 : 0);
    
    ctx.save();
    ctx.translate(WIDTH/2, HEIGHT-50);
    ctx.rotate(tilt * Math.PI / 180);
    
    // Main chassis
    ctx.fillRect(-carW/2, -carH, carW, carH);
    
    // Windshield
    ctx.fillStyle = '#333';
    ctx.fillRect(-carW/2 + 10, -carH + 20, carW - 20, 20);
    
    // Headlights
    ctx.fillStyle = '#ffeb3b';
    ctx.shadowBlur = 10;
    ctx.shadowColor = 'yellow';
    ctx.fillRect(-carW/2 + 5, -carH, 40, 10);
    ctx.fillRect(carW/2 - 45, -carH, 40, 10);
    
    // Tail lights (if reversing)
    if(speed < 0) {
        ctx.fillStyle = '#f00';
        ctx.shadowColor = 'red';
        ctx.fillRect(-carW/2 + 5, carH - 10, 40, 10);
        ctx.fillRect(carW/2 - 45, carH - 10, 40, 10);
    }

    ctx.restore();
}

function renderAICars() {
    AI_CARS.forEach(ai => {
        // Calculate relative position to player
        const relZ = ai.z - position;
        
        if (relZ < DRAW_DISTANCE && relZ > 0) {
            // Find segment for AI
            const segIndex = Math.floor(relZ);
            const seg = TRACK[segIndex];
            
            project(seg.p1, playerX + ai.x, CAMERA_HEIGHT, relZ, CAMERA_DEPTH, WIDTH, HEIGHT, ROAD_WIDTH);
            project(seg.p2, playerX + ai.x, CAMERA_HEIGHT, relZ, CAMERA_DEPTH, WIDTH, HEIGHT, ROAD_WIDTH);

            const carW = 150;
            const carH = 80;
            
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.beginPath();
            ctx.ellipse(seg.p1.screen.x, seg.p2.screen.y + 20, carW/2, carH/3, 0, 0, Math.PI*2);
            ctx.fill();

            // Car Body - ensure finite values for gradient
            const safeY1 = isFinite(seg.p2.screen.y - carH) ? seg.p2.screen.y - carH : 0;
            const safeY2 = isFinite(seg.p2.screen.y) ? seg.p2.screen.y : 0;
            
            const aiGradient = ctx.createLinearGradient(0, safeY1, 0, safeY2);
            aiGradient.addColorStop(0, '#555');
            aiGradient.addColorStop(1, '#333');
            
            ctx.fillStyle = aiGradient;
            ctx.fillRect(seg.p1.screen.x - carW/2, seg.p2.screen.y - carH, carW, carH);
        }
    });
}

function updateMinimap(x, z) {
    minCtx.clearRect(0, 0, minimapCanvas.width, minimapCanvas.height);
    
    // Draw Track Loop
    const scale = 2; 
    for(let i=0; i<TRACK.length; i++) {
        const s = TRACK[i];
        const x1 = (s.p1.world.x * scale) + WIDTH/2 - 300;
        const y1 = -(s.p1.world.y * scale) + HEIGHT/2; // Invert Y for top down
        
        minCtx.beginPath();
        minCtx.moveTo(x1, y1);
        
        const s2 = TRACK[(i+1)%TRACK.length];
        const x2 = (s2.p1.world.x * scale) + WIDTH/2 - 300;
        const y2 = -(s2.p1.world.y * scale) + HEIGHT/2;
        
        minCtx.lineTo(x2, y2);
    }
    minCtx.strokeStyle = '#fff';
    minCtx.lineWidth = 2;
    minCtx.stroke();

    // Draw Player
    const pX = (playerX * scale) + WIDTH/2 - 300;
    const pY = -(TRACK[Math.floor(position)].p1.world.y * scale) + HEIGHT/2;
    
    minCtx.fillStyle = 'red';
    minCtx.beginPath();
    minCtx.arc(pX, pY, 5, 0, Math.PI*2);
    minCtx.fill();

    // Draw AI
    AI_CARS.forEach(ai => {
        const aiZ = ai.z - position;
        if (aiZ > 0 && aiZ < TRACK.length) {
            const seg = TRACK[Math.floor(aiZ)];
            const ax = (seg.p1.world.x * scale) + WIDTH/2 - 300;
            const ay = -(seg.p1.world.y * scale) + HEIGHT/2;
            
            minCtx.fillStyle = 'yellow';
            minCtx.beginPath();
            minCtx.arc(ax, ay, 4, 0, Math.PI*2);
            minCtx.fill();
        }
    });
}

/** 
 * MAIN LOOP 
 */
function gameLoop() {
    const now = Date.now();
    let dt = (now - lastTime) / 1000;
    if (dt > 0.1) dt = 0.1; // Cap lag
    lastTime = now;

    update(dt);
    render();

    requestAnimationFrame(gameLoop);
}

// Initialize Garage UI
const garageGrid = document.getElementById('car-selection');
CARS.forEach(car => {
    const div = document.createElement('div');
    div.className = 'car-card';
    div.innerHTML = `
        <span class="car-icon">${car.icon}</span>
        <h3>${car.name}</h3>
        <p style="font-size:12px; color:#aaa;">${car.stats.spd}% Speed</p>
        <div class="stat-bar"><div class="stat-fill" style="width:${car.stats.spd}%; background:#ff4444"></div></div>
        <p style="font-size:12px; color:#aaa;">${car.stats.acc}% Accel</p>
        <div class="stat-bar"><div class="stat-fill" style="width:${car.stats.acc}%; background:#4caf50"></div></div>
    `;
    div.onclick = () => {
        selectCar(car);
        // START THE RACE immediately when a car is selected!
        startGame();
        
        // Show visual feedback that car was selected
        const card = div;
        card.style.transform = 'scale(1.05)';
        card.style.borderColor = '#ffcc00';
        setTimeout(() => {
            card.style.transform = '';
            card.style.borderColor = '';
        }, 200);
    };
    garageGrid.appendChild(div);
});

// Initial render for background
render();

</script>
