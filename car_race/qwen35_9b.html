<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Turbo Drift: 3D Racer</title>
    <style>
        :root {
            --hud-color: #0ff;
            --bg-dark: #1a1a2e;
            --panel-bg: rgba(0, 0, 0, 0.7);
        }

        body { margin: 0; overflow: hidden; background: var(--bg-dark); font-family: 'Segoe UI', sans-serif; color: white; user-select: none; }
        
        /* Game Container */
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background: #333; }
        canvas { box-shadow: 0 0 50px rgba(0,0,0,0.8); border-left: 2px solid #444; border-right: 2px solid #444; max-width: 100%; max-height: 100vh; }

        /* UI Overlays */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; }
        
        /* HUD */
        .hud-top { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; pointer-events: auto; }
        .hud-bottom { display: flex; justify-content: center; gap: 20px; margin-bottom: 10px; pointer-events: auto; }

        /* Gauges */
        .gauge-container { background: var(--panel-bg); padding: 15px; border-radius: 8px; border: 1px solid #444; text-align: center; min-width: 120px; }
        .speedometer { font-size: 3rem; font-weight: bold; color: var(--hud-color); text-shadow: 0 0 5px var(--hud-color); }
        .rpm-container { height: 60px; width: 100%; background: #222; margin-top: 5px; border-radius: 3px; overflow: hidden; position: relative; }
        .rpm-bar { height: 100%; width: 0%; background: linear-gradient(90deg, green, yellow, red); transition: width 0.1s linear; }
        
        /* Minimap */
        #minimap-container { position: absolute; top: 20px; right: 20px; width: 150px; height: 150px; background: rgba(0,0,0,0.8); border-radius: 50%; border: 2px solid var(--hud-color); overflow: hidden; }
        #minimap { width: 100%; height: 100%; transform-origin: center; transition: transform 0.1s linear; }

        /* Menus */
        .menu-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; pointer-events: auto; backdrop-filter: blur(5px); }
        .hidden { display: none !important; }
        
        h1 { font-size: 4rem; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 5px; color: #fff; text-shadow: 0 0 20px var(--hud-color); }
        .btn { background: linear-gradient(45deg, #ff0055, #ff5500); border: none; padding: 15px 40px; color: white; font-size: 1.5rem; cursor: pointer; margin-top: 20px; clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%); transition: transform 0.2s; }
        .btn:hover { transform: scale(1.05); }

        /* Garage */
        .car-grid { display: flex; gap: 20px; margin-top: 30px; }
        .car-card { background: #2a2a40; padding: 20px; border-radius: 10px; width: 200px; text-align: center; cursor: pointer; border: 2px solid transparent; transition: all 0.3s; }
        .car-card:hover, .car-card.selected { border-color: var(--hud-color); transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,255,255,0.2); }
        .stat-bar { height: 6px; background: #444; margin-top: 5px; border-radius: 3px; overflow: hidden; }
        .stat-fill { height: 100%; width: 50%; transition: width 0.3s; }

        /* Notifications */
        #lap-display { font-size: 2rem; color: yellow; text-shadow: 0 0 5px black; margin-top: 5px; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->
    <div class="overlay hidden" id="hud-layer">
        <div class="hud-top">
            <div style="text-align: left;">
                <h2>LAP 1 / 3</h2>
                <div id="lap-display">Time: 0.00s</div>
            </div>
            <div id="minimap-container">
                <!-- Canvas for minimap will be injected here via JS -->
            </div>
        </div>
        
        <div class="hud-bottom">
            <div class="gauge-container">
                <div class="speedometer"><span id="speed-val">0</span> km/h</div>
                <div style="font-size: 0.8rem; color: #aaa;">RPM</div>
                <div class="rpm-container">
                    <div class="rpm-bar" id="rpm-bar"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Garage Menu -->
    <div class="menu-screen" id="garage-menu">
        <h1>Turbo Drift</h1>
        <p>Select your machine:</p>
        <div class="car-grid" id="car-selection">
            <!-- Generated by JS -->
        </div>
    </div>

    <!-- Start Screen -->
    <div class="menu-screen hidden" id="start-menu">
        <h1>Turbo Drift</h1>
        <p>Use Arrow Keys to Drive. Space to Brake.</p>
        <button class="btn" onclick="game.startRace()">START ENGINE</button>
    </div>

     <!-- Game Over Screen -->
     <div class="menu-screen hidden" id="end-menu">
        <h1>RACE FINISHED!</h1>
        <h2 id="final-time">Time: 0.0s</h2>
        <button class="btn" onclick="location.reload()">MAIN MENU</button>
    </div>
</div>

<script>
/**
 * ENGINE CONFIGURATION & CONSTANTS
 */
const FPS = 60;
const STEP = 1 / FPS;
const WIDTH = 1024; // Internal resolution width for rendering
const HEIGHT = 768; // Internal resolution height
const SEGMENT_LENGTH = 200; // Length of one road segment in world units
const RUMBLE_LENGTH = 3; // Number of segments per rumble strip color

// Car Stats
const CARS = [
    { name: "Street Beast", speed: 1.8, accel: 0.5, handling: 0.9, color: "#ff4d4d" },
    { name: "Neon Racer", speed: 2.2, accel: 0.3, handling: 0.7, color: "#00ffff" },
    { name: "Heavy Tank", speed: 1.5, accel: 0.8, handling: 1.1, color: "#4d4dff" }
];

/**
 * GAME STATE & LOGIC
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); // Optimize for no transparency on base
canvas.width = WIDTH;
canvas.height = HEIGHT;

// UI Elements
const speedEl = document.getElementById('speed-val');
const rpmBar = document.getElementById('rpm-bar');
const lapDisplay = document.getElementById('lap-display');
const hudLayer = document.getElementById('hud-layer');
const garageMenu = document.getElementById('garage-menu');
const startMenu = document.getElementById('start-menu');
const endMenu = document.getElementById('end-menu');

let selectedCarIndex = 0;

// Input State
const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, Space: false };

window.addEventListener('keydown', (e) => { if(keys.hasOwnProperty(e.code)) keys[e.code] = true; });
window.addEventListener('keyup', (e) => { if(keys.hasOwnProperty(e.code)) keys[e.code] = false; });

/**
 * TRACK GENERATION
 */
class Track {
    constructor() {
        this.segments = [];
        this.generate();
    }

    generate() {
        // Create a procedural track with hills and curves
        let x = 0, z = 0, y = 0;
        
        for (let i = 0; i < 2000; i++) {
            const segment = new Segment();
            
            // Curve logic: Sine waves to create turns
            const curve = Math.sin(i * 0.1) * 0.05 + Math.cos(i * 0.03) * 0.02; 
            segment.curve = curve;

            // Elevation (Hills)
            const elevation = Math.sin(i * 0.08) * 4000;
            segment.y = y + elevation;
            
            // Scenery generation based on position
            if (Math.random() > 0.5) {
                segment.sceneryType = Math.floor(Math.random() * 3); // 0: Tree, 1: Rock, 2: Building
                segment.sceneryX = x + (Math.random() - 0.5) * 4000;
            }

            this.segments.push(segment);
            
            // Update world position for next segment
            x += Math.cos(i * 0.1) * SEGMENT_LENGTH;
            z += Math.sin(i * 0.1) * SEGMENT_LENGTH;
            y = elevation;
        }
    }

    getSegment(index) {
        if (index < 0) return this.segments[this.segments.length - 1]; // Loop back
        if (index >= this.segments.length) return this.segments[0]; // Loop forward
        return this.segments[index];
    }
}

class Segment {
    constructor() {
        this.curve = 0;
        this.y = 0;
        this.sceneryType = -1;
        this.sceneryX = 0;
    }
}

/**
 * RENDERER (Pseudo-3D)
 */
const track = new Track();
let cameraX = 0, cameraY = 2000, cameraZ = 0; // Camera position relative to road center
let playerX = 0, playerZ = 0; // Player offset from road center

// AI Opponents
class Car {
    constructor(color) {
        this.color = color;
        this.x = 0;
        this.z = 100 * SEGMENT_LENGTH; // Start ahead
        this.speed = 0;
        this.finished = false;
    }

    update() {
        if (this.finished) return;
        
        // Simple AI: Move forward at constant speed, slight steering noise
        const targetSpeed = 1.5 + Math.random() * 0.2; 
        this.speed += (targetSpeed - this.speed) * 0.1;

        this.x += this.speed * Math.sin(this.z / SEGMENT_LENGTH); // Follow curve roughly
        
        // Check finish line
        if (this.z > track.segments.length * SEGMENT_LENGTH) {
            this.finished = true;
            return true;
        }
    }
}

let aiCars = [new Car('#ffaa00'), new Car('#ffffff')];

/**
 * MAIN GAME LOOP
 */
const game = {
    state: 'MENU', // MENU, PLAYING, END
    startTime: 0,
    lapTime: 0,
    
    startRace: function() {
        garageMenu.classList.add('hidden');
        hudLayer.classList.remove('hidden');
        this.state = 'PLAYING';
        this.startTime = Date.now();
        
        // Reset positions
        playerX = 0; 
        aiCars.forEach(c => c.z = 100 * SEGMENT_LENGTH);
        
        requestAnimationFrame(loop);
    },

    update: function() {
        if (this.state !== 'PLAYING') return;

        const carStats = CARS[selectedCarIndex];
        const speedFactor = carStats.speed; // Multiplier for this car's max speed
        
        // Physics
        let accel = 0.2 * speedFactor;
        let brake = 0.4 * speedFactor;
        
        if (keys.ArrowUp) playerZ += accel;
        else if (keys.ArrowDown) playerZ -= brake;

        // Steering
        const maxSteer = 0.15;
        let steer = 0;
        if (keys.ArrowLeft) steer = -maxSteer * speedFactor;
        if (keys.ArrowRight) steer = maxSteer * speedFactor;
        
        playerX += steer;

        // Friction / Limits
        if (playerZ > 2.5) playerZ = 2.5;
        if (playerZ < -1.0) playerZ = -1.0;

        // Camera Follow
        cameraX = playerX * 4000; // Zoom effect
        cameraY = 2000; // Height
        
        // Update AI
        aiCars.forEach(ai => {
            const finished = ai.update();
            if(finished) this.checkWin();
        });

        // Lap Logic (Simplified: every 1500 segments is a lap)
        if (playerZ > track.segments.length * SEGMENT_LENGTH - 200) {
             playerZ -= track.segments.length * SEGMENT_LENGTH;
             this.lapTime = Date.now() - this.startTime;
             lapDisplay.innerText = `LAP: ${(this.lapTime/1000).toFixed(2)}s`;
        }

        // Update UI
        speedEl.innerText = Math.floor(playerZ * 250); // Fake km/h
        
        // RPM Simulation (Visual only)
        const rpmPct = Math.min(Math.max((playerZ / 2.5) * 100, 10), 98);
        rpmBar.style.width = `${rpmPct}%`;

        this.render();
    },

    checkWin: function() {
        if (aiCars.every(c => c.finished)) {
            this.state = 'END';
            hudLayer.classList.add('hidden');
            endMenu.classList.remove('hidden');
            document.getElementById('final-time').innerText = `Time: ${(this.lapTime/1000).toFixed(2)}s`;
        }
    },

    render: function() {
        // Clear Screen
        ctx.fillStyle = '#333';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        if (this.state !== 'PLAYING') return;

        const cx = WIDTH / 2;
        const cy = HEIGHT - 150; // Horizon line
        
        // Draw Background (Parallax)
        this.drawBackground();

        // Project Road Segments
        let baseSegment = track.getSegment(Math.floor(playerZ));
        
        for(let n = 0; n < 200; n++) { // Render distance
            const segment = track.getSegment(baseSegment + n);
            
            // Calculate world position of this segment relative to camera
            const xWorld = (segment.curve * n) * SEGMENT_LENGTH; 
            const zWorld = n * SEGMENT_LENGTH;

            // Project to screen
            // Simple perspective projection: scale = focalLength / (focalLength + z)
            // We add a base Z offset so objects don't clip through camera
            const projectZ = 2000 - playerZ + zWorld; 
            
            if (projectZ < 1) continue; // Behind camera

            const scale = HEIGHT / (projectZ * 4); // Scale factor
            
            // Calculate screen X/Y based on curve and road width
            // Road is roughly 3000 units wide total (-1500 to +1500)
            const roadWidth = 2000; 
            const segmentX = xWorld * scale;
            
            // Draw Scenery (Trees/Buildings) - Simple rectangles
            if (segment.sceneryType > -1 && Math.random() > 0.98) { // Randomly draw some scenery per frame for performance
                 this.drawScenery(segment, segmentX, scale);
            }

            // Draw Road Strip
            const screenY = cy + ((segment.y * scale)); // Elevation
            
            // Left/Right rumble strips
            ctx.fillStyle = (n % RUMBLE_LENGTH === 0) ? '#cc0000' : '#333';
            
            // Right side of road
            this.drawPolygon(cx, screenY - 150*scale, segmentX + roadWidth * scale, cy, cx, screenY + 150*scale, segmentX + roadWidth * scale);
            // Left side of road
            this.drawPolygon(cx, screenY - 150*scale, segmentX - roadWidth * scale, cy, cx, screenY + 150*scale, segmentX - roadWidth * scale);

            // Draw Road Surface (Green)
            ctx.fillStyle = '#2d8a3e';
            this.drawPolygon(cx, screenY - 150*scale, segmentX + roadWidth * scale, cy, cx, screenY + 150*scale, segmentX - roadWidth * scale);

            // Draw AI Cars
            if (segment.zOffset === playerZ) { 
                // This logic is tricky in a simple loop. We need to check if an AI car is at this Z index roughly.
                // For simplicity, we draw cars based on their absolute Z position relative to player
            }
        }

        // Draw Player Car (Bottom Center)
        this.drawPlayerCar(cx, cy);
    },

    drawBackground: function() {
        // Sky Gradient
        const grad = ctx.createLinearGradient(0, 0, 0, HEIGHT/2);
        grad.addColorStop(0, '#001133');
        grad.addColorStop(1, '#445577');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, WIDTH, HEIGHT/2);

        // Mountains (Parallax)
        ctx.fillStyle = '#1a2e4d';
        for(let i=0; i<WIDTH; i+=100) {
            ctx.beginPath();
            ctx.moveTo(i, HEIGHT/2);
            ctx.lineTo(i+50, HEIGHT/2 - 100);
            ctx.lineTo(i+100, HEIGHT/2);
            ctx.fill();
        }
    },

    drawScenery: function(segment, xScale, scale) {
        // Simple procedural trees/buildings
        const y = segment.y * scale;
        const h = 300 * scale; 
        const w = 150 * scale;
        
        ctx.fillStyle = (segment.sceneryType === 2) ? '#4a3b2a' : '#1e4d26'; // Building vs Tree
        
        if(segment.sceneryType === 2) {
            // Building
            ctx.fillRect(xScale - w/2, y - h, w, h);
            // Windows
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            for(let wy=y-h; wy<y; wy+=40*scale) {
                ctx.fillRect(xScale-w/2+10*scale, wy, 20*scale, 20*scale);
            }
        } else {
             // Tree (Triangle)
             ctx.beginPath();
             ctx.moveTo(xScale - w/2, y);
             ctx.lineTo(xScale + w/2, y);
             ctx.lineTo(xScale, y - h);
             ctx.fill();
        }
    },

    drawPolygon: function(x1, y1, x2, y2, x3, y3, x4, y4) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineTo(x3, y3);
        ctx.lineTo(x4, y4);
        ctx.closePath();
        ctx.fill();
    },

    drawPlayerCar: function(cx, cy) {
        // Car Body
        const carW = 180;
        const carH = 100;
        
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(cx - carW/2 + 10, cy + 20, carW, carH);

        // Main Body
        const color = CARS[selectedCarIndex].color;
        ctx.fillStyle = color;
        
        // Tilt effect based on steering
        let tiltX = 0; 
        if (keys.ArrowLeft) tiltX = -5;
        if (keys.ArrowRight) tiltX = 5;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(tiltX * Math.PI / 180);
        
        // Draw Car Shape
        ctx.beginPath();
        ctx.moveTo(-carW/2, -carH/2);
        ctx.lineTo(carW/2, -carH/2);
        ctx.lineTo(carW/2 + 20, carH/2);
        ctx.lineTo(-carW/2 + 20, carH/2);
        ctx.fill();

        // Windshield
        ctx.fillStyle = '#111';
        ctx.fillRect(-carW/4, -carH/3, carW/2, carH/6);

        // Headlights
        ctx.fillStyle = '#ffffaa';
        ctx.shadowBlur = 10;
        ctx.shadowColor = 'yellow';
        ctx.fillRect(-carW/2 + 5, -carH/2, 30, 10);
        ctx.fillRect(carW/2 - 35, -carH/2, 30, 10);
        
        ctx.restore();
    }
};

/**
 * GARAGE SYSTEM
 */
function initGarage() {
    const grid = document.getElementById('car-selection');
    CARS.forEach((car, index) => {
        const card = document.createElement('div');
        card.className = 'car-card';
        if (index === 0) card.classList.add('selected');
        
        card.innerHTML = `
            <h3 style="color:${car.color}">${car.name}</h3>
            <p>Speed</p>
            <div class="stat-bar"><div class="stat-fill" style="width: ${car.speed*100}%; background:${car.color}"></div></div>
            <p>Handling</p>
            <div class="stat-bar"><div class="stat-fill" style="width: ${car.handling*100}%; background:#fff"></div></div>
        `;
        
        card.onclick = () => {
            document.querySelectorAll('.car-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            selectedCarIndex = index;
        };
        
        grid.appendChild(card);
    });
}

// Init Minimap (Static circle for now, could be dynamic)
const minimapCanvas = document.createElement('canvas');
minimapCanvas.width = 150;
minimapCanvas.height = 150;
const mCtx = minimapCanvas.getContext('2d');
function drawMinimap() {
    if(!hudLayer.classList.contains('hidden')) return; // Only draw when playing
    
    mCtx.fillStyle = '#000';
    mCtx.fillRect(0,0,150,150);
    
    // Draw track loop
    mCtx.strokeStyle = '#fff';
    mCtx.lineWidth = 2;
    mCtx.beginPath();
    mCtx.arc(75, 75, 60, 0, Math.PI*2);
    mCtx.stroke();

    // Draw Player Dot
    const angle = (playerZ / track.segments.length) * Math.PI * 2;
    const px = 75 + Math.cos(angle) * 40;
    const py = 75 + Math.sin(angle) * 40;
    
    mCtx.fillStyle = '#ff0';
    mCtx.beginPath();
    mCtx.arc(px, py, 3, 0, Math.PI*2);
    mCtx.fill();
}

// Start Loop
initGarage();
drawMinimap(); // Initial draw for background

</script>
</body>
</html>
