<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA Style 3D Racing - DeepRacer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0a; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
canvas { display: block; }

#menu-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(135deg, #0a0a2e 0%, #1a0a3e 50%, #0a0a2e 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100; cursor: pointer;
}

#menu-overlay h1 {
    font-size: 72px; color: #fff; text-transform: uppercase; letter-spacing: 8px;
    text-shadow: 0 0 30px #ff4444, 0 0 60px #ff2222, 0 4px 0 #881111;
    margin-bottom: 10px; font-style: italic;
}

#menu-overlay h2 {
    font-size: 28px; color: #ffcc00; letter-spacing: 6px; margin-bottom: 40px;
    text-shadow: 0 0 20px rgba(255,204,0,0.5);
}

#menu-overlay .subtitle {
    font-size: 18px; color: #aaa; letter-spacing: 3px; margin-bottom: 60px;
}

#menu-overlay .start-btn {
    padding: 18px 60px; font-size: 24px; background: linear-gradient(90deg, #ff4444, #cc0000);
    color: white; border: 3px solid #ff6666; border-radius: 5px; cursor: pointer;
    text-transform: uppercase; letter-spacing: 4px; transition: all 0.3s;
    box-shadow: 0 0 30px rgba(255,68,68,0.4);
}

#menu-overlay .start-btn:hover {
    background: linear-gradient(90deg, #ff6666, #ee2222);
    box-shadow: 0 0 50px rgba(255,68,68,0.7); transform: scale(1.05);
}

#menu-overlay .controls-info {
    margin-top: 40px; color: #888; font-size: 14px; text-align: center; line-height: 2;
}

#hud {
    position: fixed; top: 0; left: 0; width: 100%; padding: 15px 25px;
    display: none; z-index: 50; pointer-events: none;
}

#hud-top {
    display: flex; justify-content: space-between; align-items: flex-start;
}

.hud-box {
    background: rgba(0,0,0,0.7); border: 2px solid #444; border-radius: 8px;
    padding: 10px 20px; color: white; min-width: 150px;
}

.hud-box .label { font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 2px; }
.hud-box .value { font-size: 32px; font-weight: bold; margin-top: 4px; }
.hud-box .value.speed { color: #00ff88; }
.hud-box .value.lap { color: #ffcc00; }
.hud-box .value.time { color: #66aaff; }

#hud-bottom {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 15px; align-items: center;
}

.minimap-box {
    background: rgba(0,0,0,0.7); border: 2px solid #444; border-radius: 8px;
    padding: 5px; pointer-events: none;
}

#model-name-hud {
    position: fixed; bottom: 15px; right: 20px; color: rgba(255,255,255,0.3);
    font-size: 11px; letter-spacing: 2px; z-index: 50; pointer-events: none;
}

#finish-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85); display: none; flex-direction: column;
    align-items: center; justify-content: center; z-index: 200;
}

#finish-overlay h1 { font-size: 64px; color: #ffcc00; text-shadow: 0 0 30px rgba(255,204,0,0.5); margin-bottom: 20px; }
#finish-overlay .stats { color: white; font-size: 24px; margin: 10px 0; }

#boost-indicator {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    width: 200px; height: 10px; background: rgba(0,0,0,0.6); border-radius: 5px;
    border: 1px solid #444; display: none; z-index: 50; pointer-events: none;
}

#boost-indicator .fill { height: 100%; background: linear-gradient(90deg, #ff8800, #ffcc00); border-radius: 5px; transition: width 0.2s; }

#checkpoint-flash {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: #00ff88; font-size: 48px; font-weight: bold; text-shadow: 0 0 30px rgba(0,255,136,0.5);
    opacity: 0; z-index: 150; pointer-events: none; transition: opacity 0.3s;
}

#countdown {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 120px; color: #ff4444; text-shadow: 0 0 60px rgba(255,68,68,0.6);
    z-index: 150; pointer-events: none; display: none;
}
</style>
</head>
<body>

<div id="menu-overlay">
    <h1>GTA Racing</h1>
    <h2>Street Circuit</h2>
    <div class="subtitle">Powered by DeepRacer Engine v3.0</div>
    <button class="start-btn" onclick="startGame()">Start Race</button>
    <div class="controls-info">
        WASD / Arrow Keys — Drive<br>
        SPACE — Handbrake (Drift)<br>
        R — Reset Car Position
    </div>
</div>

<div id="hud">
    <div id="hud-top">
        <div style="display:flex;gap:15px;">
            <div class="hud-box">
                <div class="label">Speed</div>
                <div class="value speed" id="speed-display">0 km/h</div>
            </div>
            <div class="hud-box">
                <div class="label">Lap</div>
                <div class="value lap" id="lap-display">1 / 3</div>
            </div>
        </div>
        <div class="hud-box" style="text-align:right;">
            <div class="label">Time</div>
            <div class="value time" id="time-display">0:00.000</div>
        </div>
    </div>
</div>

<div id="boost-indicator"><div class="fill" id="boost-fill"></div></div>
<div id="checkpoint-flash"></div>
<div id="countdown"></div>
<div id="model-name-hud">DeepRacer Engine v3.0</div>

<div id="finish-overlay">
    <h1>RACE COMPLETE!</h1>
    <div class="stats" id="final-time">Time: 0:00.000</div>
    <div class="stats" id="best-lap">Best Lap: 0:00.000</div>
    <button class="start-btn" onclick="restartGame()" style="margin-top:30px;">Race Again</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
// ============================================================
// DEEP RACER ENGINE v3.0 - GTA Style Racing Game
// ============================================================

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// --- TRACK DEFINITION ---
// Track is defined as a series of points forming a closed circuit
const trackPoints = [];
const trackWidth = 120;

function generateTrack() {
    trackPoints.length = 0;
    
    // Create an interesting circuit with various turns and straights
    const cx = 0, cy = 0;
    
    // Main loop - a complex circuit
    const points = [
        {x: 0, y: -400},   // Start/finish straight top
        {x: 200, y: -380},
        {x: 350, y: -300},
        {x: 450, y: -150},  // Right curve
        {x: 500, y: 0},
        {x: 520, y: 150},   // Long right side straight
        {x: 500, y: 300},
        {x: 450, y: 450},   // Bottom right curve
        {x: 350, y: 550},
        {x: 200, y: 600},   // Bottom straight
        {x: 50, y: 580},
        {x: -100, y: 550},  // Bottom left curve
        {x: -250, y: 480},
        {x: -350, y: 380},  // Left bottom curve
        {x: -400, y: 250},
        {x: -420, y: 100},  // Long left side
        {x: -400, y: -50},
        {x: -350, y: -180}, // Left top curve
        {x: -250, y: -300},
        {x: -150, y: -370}, // Top left curve
        {x: -50, y: -400},  // Back to start area
    ];
    
    for (let p of points) {
        trackPoints.push({ x: cx + p.x, y: cy + p.y });
    }
}

generateTrack();

// --- SMOOTH TRACK INTERPOLATION ---
function getTrackPoint(t) {
    // t is 0..1 along the track
    const n = trackPoints.length;
    const idx = Math.floor(t * n);
    const frac = (t * n) - idx;
    const i1 = idx % n;
    const i2 = (idx + 1) % n;
    
    // Catmull-Rom spline for smooth interpolation
    const p0 = trackPoints[(i1 - 1 + n) % n];
    const p1 = trackPoints[i1];
    const p2 = trackPoints[i2];
    const p3 = trackPoints[(i2 + 1) % n];
    
    const t2 = frac * frac;
    const t3 = t2 * frac;
    
    return {
        x: 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * frac + (2*p0.x - 5*p1.x + 4*p2.x - p3.x) * t2 + (p0.x - 3*p1.x + 3*p2.x - p3.x) * t3),
        y: 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * frac + (2*p0.y - 5*p1.y + 4*p2.y - p3.y) * t2 + (p0.y - 3*p1.y + 3*p2.y - p3.y) * t3)
    };
}

function getTrackDirection(t) {
    const eps = 0.001;
    const a = getTrackPoint((t + eps) % 1);
    const b = getTrackPoint((t - eps + 1) % 1);
    return Math.atan2(a.y - b.y, a.x - b.x);
}

function getTrackNormal(t) {
    const dir = getTrackDirection(t);
    return { x: Math.cos(dir), y: Math.sin(dir) };
}

// --- CHECKPOINTS ---
const numCheckpoints = 8;
function getCheckpointT(i) {
    return i / numCheckpoints;
}

// --- BOOST PADS & COLLECTIBLES ---
const boostPads = [];
const coins = [];

function generateCollectibles() {
    boostPads.length = 0;
    coins.length = 0;
    
    // Add boost pads at various locations
    const boostLocations = [0.15, 0.35, 0.55, 0.75];
    for (let t of boostLocations) {
        const pos = getTrackPoint(t);
        boostPads.push({ x: pos.x, y: pos.y, radius: 25, active: true });
    }
    
    // Add coins around the track
    for (let i = 0; i < 30; i++) {
        const t = Math.random();
        const pos = getTrackPoint(t);
        const offset = (Math.random() - 0.5) * trackWidth * 0.6;
        const dir = getTrackDirection(t);
        coins.push({
            x: pos.x + Math.cos(dir + Math.PI/2) * offset,
            y: pos.y + Math.sin(dir + Math.PI/2) * offset,
            radius: 12, collected: false, t: t
        });
    }
}

generateCollectibles();

// --- AI CARS ---
const aiCars = [];
function createAICars() {
    aiCars.length = 0;
    for (let i = 0; i < 4; i++) {
        aiCars.push({
            t: 0.1 + i * 0.2, // Start at different positions on track
            speed: 3 + Math.random() * 2,
            color: ['#ff4444', '#4488ff', '#44cc44', '#ff8844'][i],
            lap: 0,
            width: 16,
            height: 32,
            offset: (Math.random() - 0.5) * trackWidth * 0.3,
        });
    }
}

createAICars();

// --- PLAYER CAR ---
const player = {
    x: 0, y: -400,
    vx: 0, vy: 0,
    angle: Math.PI / 2, // Facing up initially (along track)
    speed: 0,
    maxSpeed: 18,
    acceleration: 0.35,
    brakeForce: 0.4,
    friction: 0.97,
    turnRate: 0.06,
    driftFactor: 0,
    width: 18,
    height: 36,
    
    // Lap tracking
    currentLap: 0,
    lastCheckpoint: -1,
    checkpointsPassed: new Set(),
    totalCheckpoints: numCheckpoints,
    raceComplete: false,
    
    // Boost
    boostCharge: 0,
    maxBoost: 100,
    boosting: false,
    
    // Visual effects
    skidMarks: [],
    particles: [],
};

// --- INPUT ---
const keys = {};
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; e.preventDefault(); });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// --- GAME STATE ---
let gameState = 'menu'; // menu, countdown, racing, finished
let raceStartTime = 0;
let bestLapTime = Infinity;
let lapTimes = [];
let currentLapStart = 0;
let countdownValue = 3;
let countdownTimer = null;

// --- CAMERA ---
const camera = { x: 0, y: 0 };

function updateCamera() {
    const targetX = player.x - Math.cos(player.angle) * 150;
    const targetY = player.y - Math.sin(player.angle) * 150;
    
    // Smooth follow with slight lag for dynamic feel
    camera.x += (targetX - camera.x) * 0.08;
    camera.y += (targetY - camera.y) * 0.08;
}

// --- PHYSICS UPDATE ---
function updatePlayer(dt) {
    if (player.raceComplete) return;
    
    // Input handling
    const accel = keys['w'] || keys['arrowup'];
    const brake = keys['s'] || keys['arrowdown'];
    const left = keys['a'] || keys['arrowleft'];
    const right = keys['d'] || keys['arrowright'];
    const handbrake = keys[' '];
    
    // Acceleration / Braking
    if (accel) {
        let spd = player.maxSpeed;
        if (player.boosting && player.boostCharge > 0) spd *= 1.5;
        
        player.vx += Math.cos(player.angle) * player.acceleration * (spd / player.maxSpeed);
        player.vy += Math.sin(player.angle) * player.acceleration * (spd / player.maxSpeed);
    }
    
    if (brake && player.speed > 2) {
        player.vx -= Math.cos(player.angle) * player.brakeForce;
        player.vy -= Math.sin(player.angle) * player.brakeForce;
    } else if (!accel && !handbrake) {
        // Reverse when pressing down at low speed
        if (player.speed < 2 && brake) {
            player.vx -= Math.cos(player.angle) * player.acceleration * 0.5;
            player.vy -= Math.sin(player.angle) * player.acceleration * 0.5;
        }
    }
    
    // Steering
    const speedFactor = Math.min(Math.abs(player.speed) / 5, 1);
    if (left) {
        player.angle -= player.turnRate * (1 + speedFactor * 0.8);
    }
    if (right) {
        player.angle += player.turnRate * (1 + speedFactor * 0.8);
    }
    
    // Drift / Handbrake
    if (handbrake && Math.abs(player.speed) > 3) {
        player.driftFactor = Math.min(player.driftFactor + 0.05, 0.7);
        
        // Add skid marks when drifting
        if (Math.random() < 0.3) {
            const rearX = player.x - Math.cos(player.angle) * 18;
            const rearY = player.y - Math.sin(player.angle) * 18;
            player.skidMarks.push({ x: rearX, y: rearY, age: 200 });
        }
    } else {
        player.driftFactor *= 0.95;
    }
    
    // Apply friction
    const currentFriction = handbrake ? 0.985 : player.friction;
    player.vx *= currentFriction;
    player.vy *= currentFriction;
    
    // Calculate speed magnitude
    player.speed = Math.sqrt(player.vx * player.vx + player.vy * player.vy);
    
    // Apply drift - blend velocity direction with car angle
    const targetVx = Math.cos(player.angle) * player.speed;
    const targetVy = Math.sin(player.angle) * player.speed;
    const driftBlend = 1 - player.driftFactor;
    player.vx += (targetVx - player.vx) * (0.1 + player.driftFactor * 0.3);
    player.vy += (targetVy - player.vy) * (0.1 + player.driftFactor * 0.3);
    
    // Update position
    player.x += player.vx;
    player.y += player.vy;
    
    // Track collision detection
    checkTrackCollision();
    
    // Boost pad collection
    for (let bp of boostPads) {
        if (!bp.active) continue;
        const dx = player.x - bp.x;
        const dy = player.y - bp.y;
        if (Math.sqrt(dx*dx + dy*dy) < bp.radius + 20) {
            bp.active = false;
            player.boostCharge = Math.min(player.maxBoost, player.boostCharge + 50);
            
            // Boost particles
            for (let i = 0; i < 15; i++) {
                player.particles.push({
                    x: bp.x, y: bp.y,
                    vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8,
                    life: 40, color: '#ffaa00', size: Math.random()*6+3
                });
            }
        }
    }
    
    // Coin collection
    for (let c of coins) {
        if (c.collected) continue;
        const dx = player.x - c.x;
        const dy = player.y - c.y;
        if (Math.sqrt(dx*dx + dy*dy) < c.radius + 18) {
            c.collected = true;
            player.boostCharge = Math.min(player.maxBoost, player.boostCharge + 20);
            
            for (let i = 0; i < 8; i++) {
                player.particles.push({
                    x: c.x, y: c.y,
                    vx: (Math.random()-0.5)*6, vy: (Math.random()-0.5)*6,
                    life: 30, color: '#ffdd44', size: Math.random()*4+2
                });
            }
        }
    }
    
    // Boost activation
    if ((keys['shift'] || keys['e']) && player.boostCharge >= 50) {
        player.boosting = true;
        player.boostCharge -= 1.5;
        if (player.boostCharge <= 0) {
            player.boosting = false;
            player.boostCharge = 0;
        }
    } else {
        player.boosting = false;
    }
    
    // Checkpoint / Lap logic
    checkCheckpoints();
    
    // Update particles
    for (let i = player.particles.length - 1; i >= 0; i--) {
        const p = player.particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) player.particles.splice(i, 1);
    }
    
    // Age skid marks
    for (let i = player.skidMarks.length - 1; i >= 0; i--) {
        player.skidMarks[i].age--;
        if (player.skidMarks[i].age <= 0) player.skidMarks.splice(i, 1);
    }
    
    // Natural boost charge regen (slow)
    if (!player.boosting && player.boostCharge < player.maxBoost) {
        player.boostCharge += 0.05;
    }
}

function checkTrackCollision() {
    // Find closest track point to player
    let minDist = Infinity;
    let closestT = 0;
    
    for (let i = 0; i < 100; i++) {
        const t = i / 100;
        const tp = getTrackPoint(t);
        const dx = player.x - tp.x;
        const dy = player.y - tp.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        if (dist < minDist) {
            minDist = dist;
            closestT = t;
        }
    }
    
    // Check if off track
    if (minDist > trackWidth / 2 - 10) {
        // Push player back toward track center
        const tp = getTrackPoint(closestT);
        const dx = tp.x - player.x;
        const dy = tp.y - player.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        if (dist > 0) {
            // Slow down on grass
            player.vx *= 0.96;
            player.vy *= 0.96;
            
            // Push back toward track center
            const pushStrength = (minDist - trackWidth/2 + 10) * 0.3;
            player.x += (dx / dist) * pushStrength;
            player.y += (dy / dist) * pushStrength;
        }
    }
}

function checkCheckpoints() {
    // Find which checkpoint segment the player is closest to
    let bestT = 0;
    let minDist = Infinity;
    
    for (let i = 0; i < numCheckpoints; i++) {
        const cpT = getCheckpointT(i);
        const tp = getTrackPoint(cpT);
        const dx = player.x - tp.x;
        const dy = player.y - tp.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        if (dist < minDist) {
                    minDist = dist;
            bestT = cpT;
        }
    }
    
    // Check if near a checkpoint
    for (let i = 0; i < numCheckpoints; i++) {
        const cpT = getCheckpointT(i);
        const tp = getTrackPoint(cpT);
        const dx = player.x - tp.x;
        const dy = player.y - tp.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        if (dist < 80) {
            // Check if this is the next expected checkpoint
            let expectedCP = (player.lastCheckpoint + 1) % numCheckpoints;
            
            if (i === expectedCP || player.checkpointsPassed.has(i)) {
                player.checkpointsPassed.add(i);
                
                if (i === expectedCP) {
                    player.lastCheckpoint = i;
                    
                    // Flash checkpoint message
                    flashCheckpoint(`Checkpoint ${i + 1}`);
                }
            }
        }
    }
    
    // Lap completion check - must pass all checkpoints and cross start line
    if (player.checkpointsPassed.size === numCheckpoints) {
        const tp = getTrackPoint(0); // Start/finish line
        const dx = player.x - tp.x;
        const dy = player.y - tp.y;
        
        if (Math.sqrt(dx*dx + dy*dy) < 100 && Math.abs(player.speed) > 2) {
            // Lap completed!
            player.currentLap++;
            
            let lapTime = Date.now() - currentLapStart;
            lapTimes.push(lapTime);
            if (lapTime < bestLapTime) bestLapTime = lapTime;
            currentLapStart = Date.now();
            
            // Reset checkpoints
            player.checkpointsPassed.clear();
            player.lastCheckpoint = -1;
            
            flashCheckpoint(`Lap ${player.currentLap} Complete!`);
            
            if (player.currentLap >= 3) {
                finishRace();
            }
        }
    }
}

function flashCheckpoint(text) {
    const el = document.getElementById('checkpoint-flash');
    el.textContent = text;
    el.style.opacity = '1';
    setTimeout(() => { el.style.opacity = '0'; }, 1500);
}

// --- AI UPDATE ---
function updateAI(dt) {
    for (let car of aiCars) {
        // Move along track
        const dir = getTrackDirection(car.t);
        
        // Slight wobble for realism
        const wobble = Math.sin(Date.now() * 0.003 + car.t * 100) * 5;
        
        const tp = getTrackPoint(car.t);
        const perpDir = { x: -Math.sin(dir), y: Math.cos(dir) };
        
        // Move forward along track
        car.t += car.speed * 0.002;
        if (car.t >= 1) {
            car.t -= 1;
            car.lap++;
        }
        
        // Update position
        const pos = getTrackPoint(car.t);
        car.x = pos.x + perpDir.x * car.offset + wobble;
        car.y = pos.y + perpDir.y * car.offset + wobble;
        car.angle = dir;
    }
}

// --- RENDERING ---
function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Camera transform
    const camX = camera.x - canvas.width / 2;
    const camY = camera.y - canvas.height / 2;
    
    ctx.save();
    ctx.translate(-camX, -camY);
    
    // Draw grass background
    drawGrass();
    
    // Draw track
    drawTrack();
    
    // Draw skid marks
    drawSkidMarks();
    
    // Draw boost pads
    drawBoostPads();
    
    // Draw coins
    drawCoins();
    
    // Draw AI cars
    for (let car of aiCars) {
        drawCar(car.x, car.y, car.angle, car.color, car.width, car.height);
    }
    
    // Draw player particles
    for (let p of player.particles) {
        ctx.globalAlpha = p.life / 40;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    
    // Draw player car
    drawCar(player.x, player.y, player.angle, '#ff3333', player.width, player.height);
    
    // Draw start/finish line
    drawStartLine();
    
    ctx.restore();
}

function drawGrass() {
    // Large grass area with subtle pattern
    const gradient = ctx.createRadialGradient(0, 0, 100, 0, 0, 800);
    gradient.addColorStop(0, '#2a5a1a');
    gradient.addColorStop(1, '#1a3a0a');
    
    ctx.fillStyle = gradient;
    ctx.fillRect(-1000, -1000, 2000, 2000);
    
    // Grass texture dots
    ctx.fillStyle = 'rgba(50, 90, 30, 0.3)';
    for (let i = 0; i < 200; i++) {
        const x = Math.random() * 1600 - 800 + camera.x;
        const y = Math.random() * 1600 - 800 + camera.y;
        ctx.fillRect(x, y, 3, 3);
    }
}

function drawTrack() {
    // Draw track surface
    ctx.lineWidth = trackWidth;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    
    // Track shadow/edge
    ctx.strokeStyle = '#1a1a1a';
    ctx.beginPath();
    for (let i = 0; i <= 200; i++) {
        const t = i / 200;
        const p = getTrackPoint(t);
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
    }
    ctx.closePath();
    ctx.stroke();
    
    // Track surface (asphalt)
    ctx.strokeStyle = '#3a3a3a';
    ctx.lineWidth = trackWidth - 8;
    ctx.beginPath();
    for (let i = 0; i <= 200; i++) {
        const t = i / 200;
        const p = getTrackPoint(t);
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
    }
    ctx.closePath();
    ctx.stroke();
    
    // Track center line dashes
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 2;
    ctx.setLineDash([15, 20]);
    ctx.beginPath();
    for (let i = 0; i <= 200; i++) {
        const t = i / 200;
        const p = getTrackPoint(t);
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.setLineDash([]);
    
    // Track curbs (red/white alternating on outer edges)
    drawTrackCurbs();
}

function drawTrackCurbs() {
    const curbWidth = 8;
    const numSegments = 200;
    
    for (let side = -1; side <= 1; side += 2) {
        ctx.lineWidth = curbWidth;
        
        for (let i = 0; i < numSegments; i++) {
            const t1 = i / numSegments;
            const t2 = (i + 1) / numSegments;
            
            const p1 = getTrackPoint(t1);
            const p2 = getTrackPoint(t2);
            
            // Calculate normal
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const len = Math.sqrt(dx*dx + dy*dy) || 1;
            let nx = -dy / len * side;
            let ny = dx / len * side;
            
            // Alternate curb colors
            const isRed = (i % 4 < 2);
            ctx.strokeStyle = isRed ? '#cc0000' : '#ffffff';
            
            ctx.beginPath();
            ctx.moveTo(p1.x + nx * trackWidth/2, p1.y + ny * trackWidth/2);
            ctx.lineTo(p2.x + nx * trackWidth/2, p2.y + ny * trackWidth/2);
            ctx.stroke();
        }
    }
}

function drawSkidMarks() {
    for (let sm of player.skidMarks) {
        const alpha = Math.min(sm.age / 100, 0.5);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = '#111';
        
        // Draw small skid marks at car rear position
        const rearX = sm.x - Math.cos(player.angle) * 18;
        const rearY = sm.y - Math.sin(player.angle) * 18;
        
        ctx.fillRect(rearX - 3, rearY - 3, 6, 6);
    }
    ctx.globalAlpha = 1;
}

function drawBoostPads() {
    for (let bp of boostPads) {
        if (!bp.active) continue;
        
        const pulse = Math.sin(Date.now() * 0.005) * 5 + 25;
        
        // Glow effect
        ctx.fillStyle = 'rgba(255, 170, 0, 0.3)';
        ctx.beginPath();
        ctx.arc(bp.x, bp.y, pulse + 15, 0, Math.PI * 2);
        ctx.fill();
        
        // Pad circle
        const grad = ctx.createRadialGradient(bp.x, bp.y, 0, bp.x, bp.y, pulse);
        grad.addColorStop(0, '#ffdd44');
        grad.addColorStop(1, '#ff8800');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(bp.x, bp.y, pulse, 0, Math.PI * 2);
        ctx.fill();
        
        // Arrow indicator
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        const arrowSize = 8;
        ctx.beginPath();
        ctx.moveTo(bp.x - arrowSize, bp.y);
        ctx.lineTo(bp.x + arrowSize, bp.y);
        ctx.moveTo(bp.x, bp.y - arrowSize);
        ctx.lineTo(bp.x, bp.y + arrowSize);
        ctx.stroke();
    }
}

function drawCoins() {
    for (let c of coins) {
        if (c.collected) continue;
        
        const bob = Math.sin(Date.now() * 0.004 + c.t * 50) * 3;
        
        // Glow
        ctx.fillStyle = 'rgba(255, 221, 68, 0.3)';
        ctx.beginPath();
        ctx.arc(c.x, c.y + bob, c.radius + 8, 0, Math.PI * 2);
        ctx.fill();
        
        // Coin
        const grad = ctx.createRadialGradient(c.x - 3, c.y - 3 + bob, 0, c.x, c.y + bob, c.radius);
        grad.addColorStop(0, '#ffee88');
        grad.addColorStop(1, '#ccaa22');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(c.x, c.y + bob, c.radius, 0, Math.PI * 2);
        ctx.fill();
        
        // Dollar sign
        ctx.strokeStyle = '#886611';
        ctx.lineWidth = 2;
        ctx.font = 'bold 14px Arial';
        ctx.fillStyle = '#886611';
        ctx.textAlign = 'center';
        ctx.fillText('$', c.x, c.y + 5 + bob);
    }
}

function drawCar(x, y, angle, color, w, h) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle - Math.PI/2); // Adjust for canvas rotation
    
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(4, 4, w + 2, h + 2, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Car body
    const grad = ctx.createLinearGradient(-w/2, -h/2, w/2, h/2);
    grad.addColorStop(0, color);
    grad.addColorStop(1, shadeColor(color, -40));
    ctx.fillStyle = grad;
    
    // Car shape (rounded rectangle)
    const r = 6;
    ctx.beginPath();
    ctx.moveTo(-w/2 + r, -h/2);
    ctx.lineTo(w/2 - r, -h/2);
    ctx.quadraticCurveTo(w/2, -h/2, w/2, -h/2 + r);
    ctx.lineTo(w/2, h/2 - r);
    ctx.quadraticCurveTo(w/2, h/2, w/2 - r, h/2);
    ctx.lineTo(-w/2 + r, h/2);
    ctx.quadraticCurveTo(-w/2, h/2, -w/2, h/2 - r);
    ctx.lineTo(-w/2, -h/2 + r);
    ctx.quadraticCurveTo(-w/2, -h/2, -w/2 + r, -h/2);
    ctx.closePath();
    ctx.fill();
    
    // Windshield
    ctx.fillStyle = 'rgba(100, 180, 255, 0.6)';
    ctx.fillRect(-w/3, -h/4, w*2/3, h/5);
    
    // Rear window
    ctx.fillStyle = 'rgba(100, 180, 255, 0.4)';
    ctx.fillRect(-w/3, h/6, w*2/3, h/6);
    
    // Headlights
    ctx.fillStyle = '#ffffcc';
    ctx.beginPath();
    ctx.arc(-w/3 + 2, -h/2 + 3, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(w/3 - 2, -h/2 + 3, 3, 0, Math.PI * 2);
    ctx.fill();
    
    // Tail lights
    ctx.fillStyle = '#ff3333';
    ctx.fillRect(-w/2 + 2, h/2 - 5, 4, 3);
    ctx.fillRect(w/2 - 6, h/2 - 5, 4, 3);
    
    // Racing stripe (for player car)
    if (color === '#ff3333') {
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fillRect(-3, -h/2, 6, h);
    }
    
    // Spoiler for player car
    if (color === '#ff3333') {
        ctx.fillStyle = shadeColor(color, -60);
        ctx.fillRect(-w/2 - 1, h/2 - 8, w + 2, 4);
    }
    
    ctx.restore();
}

function drawStartLine() {
    const tp = getTrackPoint(0);
    const dir = getTrackDirection(0);
    
    // Checkered pattern for start line
    const perpDir = { x: -Math.sin(dir), y: Math.cos(dir) };
    const len = trackWidth;
    const steps = 10;
    
    ctx.save();
    ctx.translate(tp.x, tp.y);
    ctx.rotate(Math.atan2(perpDir.y, perpDir.x));
    
    for (let i = 0; i < steps; i++) {
        for (let j = 0; j < 3; j++) {
            const x = (i - steps/2) * (len / steps);
            const y = (j - 1) * 8;
            ctx.fillStyle = ((i + j) % 2 === 0) ? '#fff' : '#000';
            ctx.fillRect(x, y, len/steps, 8);
        }
    }
    
    ctx.restore();
}

function shadeColor(color, amount) {
    let r = parseInt(color.slice(1,3), 16) + amount;
    let g = parseInt(color.slice(3,5), 16) + amount;
    let b = parseInt(color.slice(5,7), 16) + amount;
    r = Math.max(0, Math.min(255, r));
    g = Math.max(0, Math.min(255, g));
    b = Math.max(0, Math.min(255, b));
    return `rgb(${r},${g},${b})`;
}

// --- HUD UPDATE ---
function updateHUD() {
    const speedKmh = Math.round(player.speed * 18);
    document.getElementById('speed-display').textContent = `${speedKmh} km/h`;
    
    const lapNum = Math.min(player.currentLap + 1, 3);
    document.getElementById('lap-display').textContent = `${lapNum} / 3`;
    
    if (gameState === 'racing') {
        const elapsed = Date.now() - raceStartTime;
        const mins = Math.floor(elapsed / 60000);
        const secs = Math.floor((elapsed % 60000) / 1000);
        const ms = (elapsed % 1000).toString().padStart(3, '0');
        document.getElementById('time-display').textContent = `${mins}:${secs.toString().padStart(2,'0')}.${ms}`;
    }
    
    // Boost indicator
    const boostFill = document.getElementById('boost-fill');
    if (document.getElementById('boost-indicator').style.display === 'block') {
        boostFill.style.width = `${(player.boostCharge / player.maxBoost) * 100}%`;
    }
}

// --- GAME LOOP ---
let lastTime = 0;

function gameLoop(timestamp) {
    if (gameState !== 'racing' && gameState !== 'countdown') {
        requestAnimationFrame(gameLoop);
        return;
    }
    
    const dt = timestamp - lastTime;
    lastTime = timestamp;
    
    updatePlayer(dt / 16.67); // Normalize to ~60fps
    updateAI(dt / 16.67);
    updateCamera();
    render();
    updateHUD();
    
    requestAnimationFrame(gameLoop);
}

// --- GAME FLOW ---
function startGame() {
    document.getElementById('menu-overlay').style.display = 'none';
    document.getElementById('hud').style.display = 'block';
    document.getElementById('boost-indicator').style.display = 'block';
    
    gameState = 'countdown';
    countdownValue = 3;
    
    // Reset player
    const startPos = getTrackPoint(0);
    const startDir = getTrackDirection(0);
    player.x = startPos.x;
    player.y = startPos.y;
    player.angle = startDir + Math.PI/2;
    player.vx = 0;
    player.vy = 0;
    player.speed = 0;
    player.currentLap = 0;
    player.lastCheckpoint = -1;
    player.checkpointsPassed.clear();
    player.raceComplete = false;
    player.boostCharge = 50;
    player.skidMarks.length = 0;
    player.particles.length = 0;
    
    // Reset collectibles
    for (let bp of boostPads) bp.active = true;
    for (let c of coins) c.collected = false;
    
    // Reset AI
    createAICars();
    
    // Countdown
    const countdownEl = document.getElementById('countdown');
    countdownEl.style.display = 'block';
    
    let count = 3;
    countdownEl.textContent = count;
    
    const countInterval = setInterval(() => {
        count--;
        if (count > 0) {
            countdownEl.textContent = count;
        } else if (count === 0) {
            countdownEl.textContent = 'GO!';
            countdownEl.style.color = '#00ff88';
        } else {
            clearInterval(countInterval);
            countdownEl.style.display = 'none';
            gameState = 'racing';
            raceStartTime = Date.now();
            currentLapStart = Date.now();
        }
    }, 1000);
}

function finishRace() {
    player.raceComplete = true;
    gameState = 'finished';
    
    const totalTime = Date.now() - raceStartTime;
    const mins = Math.floor(totalTime / 60000);
    const secs = Math.floor((totalTime % 60000) / 1000);
    const ms = (totalTime % 1000).toString().padStart(3, '0');
    
    document.getElementById('final-time').textContent = `Total Time: ${mins}:${secs.toString().padStart(2,'0')}.${ms}`;
    
    if (bestLapTime !== Infinity) {
        const bMins = Math.floor(bestLapTime / 60000);
        const bSecs = Math.floor((bestLapTime % 60000) / 1000);
        const bMs = (bestLapTime % 1000).toString().padStart(3, '0');
        document.getElementById('best-lap').textContent = `Best Lap: ${bMins}:${bSecs.toString().padStart(2,'0')}.${bMs}`;
    } else {
        document.getElementById('best-lap').textContent = 'Best Lap: N/A';
    }
    
    document.getElementById('finish-overlay').style.display = 'flex';
}

function restartGame() {
    document.getElementById('finish-overlay').style.display = 'none';
    generateCollectibles();
    startGame();
}

// --- START ---
requestAnimationFrame(gameLoop);

</script>
