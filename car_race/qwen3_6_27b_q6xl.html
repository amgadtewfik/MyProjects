<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turbo Racing 3D</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
canvas { display: block; image-rendering: pixelated; }
#gameContainer { position: relative; }
#uiOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
#uiOverlay > * { pointer-events: auto; }
#gaugePanel { position: absolute; bottom: 20px; right: 20px; display: flex; gap: 10px; align-items: flex-end; }
#gaugeCanvas { border-radius: 50%; background: rgba(0,0,0,0.7); border: 3px solid #333; }
#speedDisplay { color: #fff; font-size: 14px; text-align: center; background: rgba(0,0,0,0.7); padding: 5px 10px; border-radius: 8px; border: 2px solid #333; }
#minimap { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.7); border: 2px solid #555; border-radius: 10px; }
#lapInfo { position: absolute; top: 20px; left: 20px; color: #fff; font-size: 16px; background: rgba(0,0,0,0.7); padding: 12px 18px; border-radius: 10px; border: 2px solid #555; line-height: 1.8; }
#lapInfo .label { color: #aaa; font-size: 12px; }
#lapInfo .value { color: #fff; font-weight: bold; }
#lapInfo .best { color: #ff0; }
#position { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 32px; font-weight: bold; background: rgba(0,0,0,0.7); padding: 8px 30px; border-radius: 10px; border: 2px solid #555; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
#position span { color: #ff0; }
#startScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
#startScreen h1 { font-size: 64px; color: #ff4400; text-shadow: 0 0 30px rgba(255,68,0,0.5); margin-bottom: 10px; letter-spacing: 4px; }
#startScreen h2 { font-size: 20px; color: #aaa; margin-bottom: 40px; }
.btn { padding: 15px 50px; font-size: 20px; border: 2px solid #ff4400; background: transparent; color: #ff4400; cursor: pointer; border-radius: 8px; margin: 8px; transition: all 0.3s; font-weight: bold; letter-spacing: 2px; }
.btn:hover { background: #ff4400; color: #fff; transform: scale(1.05); }
#garageScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
#garageScreen h1 { font-size: 42px; color: #ff4400; margin-bottom: 30px; }
.carGrid { display: flex; gap: 20px; margin-bottom: 30px; }
.carCard { background: rgba(255,255,255,0.05); border: 2px solid #333; border-radius: 12px; padding: 20px; width: 200px; text-align: center; cursor: pointer; transition: all 0.3s; }
.carCard:hover, .carCard.selected { border-color: #ff4400; background: rgba(255,68,0,0.1); }
.carCard .carIcon { font-size: 60px; margin-bottom: 10px; }
.carCard .carName { color: #fff; font-size: 18px; font-weight: bold; margin-bottom: 15px; }
.statBar { margin: 6px 0; }
.statBar .statLabel { color: #aaa; font-size: 11px; display: flex; justify-content: space-between; }
.statBar .bar { height: 6px; background: #222; border-radius: 3px; overflow: hidden; }
.statBar .barFill { height: 100%; border-radius: 3px; }
#countdown { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 120px; color: #ff0; font-weight: bold; text-shadow: 0 0 40px rgba(255,255,0,0.5); display: none; z-index: 50; }
#raceComplete { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
#raceComplete h1 { font-size: 48px; color: #ff4400; margin-bottom: 20px; }
#raceComplete .result { color: #fff; font-size: 24px; margin: 5px; }
#raceComplete .result span { color: #ff0; }
#controls { position: absolute; bottom: 20px; left: 20px; color: #666; font-size: 11px; background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 6px; }
#controls kbd { background: #333; padding: 2px 6px; border-radius: 3px; color: #aaa; }
</style>
</head>
<body>
<div id="gameContainer">
<canvas id="gameCanvas"></canvas>
<div id="uiOverlay">
<div id="lapInfo">
<div><span class="label">LAP</span> <span class="value" id="lapNum">1 / 3</span></div>
<div><span class="label">TIME</span> <span class="value" id="lapTime">0:00.000</span></div>
<div><span class="label">BEST</span> <span class="value best" id="bestLap">--:--.---</span></div>
<div><span class="label">TOTAL</span> <span class="value" id="totalTime">0:00.000</span></div>
</div>
<div id="position"><span id="posNum">1</span> / <span id="posTotal">6</span></div>
<canvas id="minimap" width="180" height="180"></canvas>
<div id="gaugePanel">
<canvas id="gaugeCanvas" width="200" height="200"></canvas>
</div>
<div id="controls"><kbd>↑</kbd> Accelerate <kbd>↓</kbd> Brake <kbd>←</kbd><kbd>→</kbd> Steer <kbd>G</kbd> Garage</div>
</div>
<div id="countdown"></div>
<div id="startScreen">
<h1>TURBO RACING</h1>
<h2>3D Grand Prix</h2>
<button class="btn" onclick="openGarage()">GARAGE</button>
<button class="btn" onclick="startRace()">RACE</button>
</div>
<div id="garageScreen">
<h1>🏎️ GARAGE</h1>
<div class="carGrid" id="carGrid"></div>
<button class="btn" onclick="startRace()">START RACE</button>
<button class="btn" onclick="closeGarage()">BACK</button>
</div>
<div id="raceComplete">
<h1>RACE COMPLETE!</h1>
<div class="result">Position: <span id="finalPos">1st</span></div>
<div class="result">Total Time: <span id="finalTime">0:00.000</span></div>
<div class="result">Best Lap: <span id="finalBest">0:00.000</span></div>
<button class="btn" onclick="startRace()">RACE AGAIN</button>
<button class="btn" onclick="openGarage()">GARAGE</button>
</div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const gaugeCanvas = document.getElementById('gaugeCanvas');
const gaugeCtx = gaugeCanvas.getContext('2d');
const minimapCanvas = document.getElementById('minimap');
const minimapCtx = minimapCanvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = Math.min(window.innerWidth, 1280);
    H = canvas.height = Math.min(window.innerHeight, 720);
}
resize();
window.addEventListener('resize', resize);

// Car definitions
const CARS = [
    { name: 'Speed Demon', icon: '🏎️', color: '#ff2200', speed: 95, accel: 70, handling: 60, maxSpeed: 340, accelRate: 2.5, handlingVal: 3.0, desc: 'Top speed king' },
    { name: 'Drift King', icon: '🚗', color: '#0066ff', speed: 65, accel: 80, handling: 95, maxSpeed: 280, accelRate: 2.0, handlingVal: 4.5, desc: 'Corner carver' },
    { name: 'Rocket', icon: '🚙', color: '#00cc44', speed: 75, accel: 95, handling: 70, maxSpeed: 300, accelRate: 3.2, handlingVal: 3.5, desc: 'Quick launcher' },
    { name: 'Balanced', icon: '🚕', color: '#ffaa00', speed: 80, accel: 80, handling: 80, maxSpeed: 310, accelRate: 2.5, handlingVal: 3.8, desc: 'All-rounder' },
    { name: 'Tank', icon: '🛻', color: '#8844ff', speed: 55, accel: 60, handling: 90, maxSpeed: 260, accelRate: 1.8, handlingVal: 4.2, desc: 'Unstoppable' }
];

let selectedCar = 0;
let keys = {};
let gameState = 'menu'; // menu, garage, countdown, racing, complete

// Track definition
const TRACK_LENGTH = 6000;
const SEGMENT_LENGTH = 200;
const ROAD_WIDTH = 2000;
const TOTAL_SEGMENTS = TRACK_LENGTH / SEGMENT_LENGTH;
const DRAW_DISTANCE = 150;
const LANES = 3;

let segments = [];
let trackCurve = [];
let trackHill = [];

function buildTrack() {
    segments = [];
    trackCurve = [];
    trackHill = [];
    
    // Define track shape with curves and hills
    for (let i = 0; i < TOTAL_SEGMENTS; i++) {
        let curve = 0;
        let hill = 0;
        
        // Various curves
        if (i > 100 && i < 200) curve = 3;
        if (i > 250 && i < 350) curve = -4;
        if (i > 400 && i < 500) curve = 2.5;
        if (i > 550 && i < 680) curve = -3;
        if (i > 700 && i < 800) curve = 5;
        if (i > 850 && i < 950) curve = -2;
        if (i > 1000 && i < 1100) curve = 4;
        if (i > 1150 && i < 1250) curve = -3.5;
        if (i > 1300 && i < 1400) curve = 2;
        if (i > 1450 && i < 1550) curve = -4.5;
        if (i > 1600 && i < 1700) curve = 3;
        if (i > 1750 && i < 1850) curve = -2.5;
        if (i > 1900 && i < 2000) curve = 4;
        if (i > 2050 && i < 2150) curve = -3;
        if (i > 2200 && i < 2300) curve = 2;
        if (i > 2350 && i < 2450) curve = -5;
        if (i > 2500 && i < 2600) curve = 3.5;
        if (i > 2650 && i < 2750) curve = -2;
        if (i > 2800 && i < 2900) curve = 4;
        if (i > 2950 && i < 3000) curve = -3;
        
        // Hills
        if (i > 50 && i < 150) hill = Math.sin((i - 50) / 100 * Math.PI) * 40;
        if (i > 300 && i < 400) hill = Math.sin((i - 300) / 100 * Math.PI) * 60;
        if (i > 600 && i < 700) hill = Math.sin((i - 600) / 100 * Math.PI) * 35;
        if (i > 900 && i < 1050) hill = Math.sin((i - 900) / 150 * Math.PI) * 50;
        if (i > 1200 && i < 1300) hill = Math.sin((i - 1200) / 100 * Math.PI) * 45;
        if (i > 1500 && i < 1650) hill = Math.sin((i - 1500) / 150 * Math.PI) * 55;
        if (i > 1800 && i < 1900) hill = Math.sin((i - 1800) / 100 * Math.PI) * 30;
        if (i > 2100 && i < 2250) hill = Math.sin((i - 2100) / 150 * Math.PI) * 65;
        if (i > 2400 && i < 2500) hill = Math.sin((i - 2400) / 100 * Math.PI) * 40;
        if (i > 2700 && i < 2850) hill = Math.sin((i - 2700) / 150 * Math.PI) * 50;
        if (i > 2950 && i < 3000) hill = Math.sin((i - 2950) / 50 * Math.PI) * 35;
        
        trackCurve.push(curve);
        trackHill.push(hill);
        
        let y = 0;
        if (i > 0) {
            y = segments[i-1].y + hill * 0.5;
        }
        
        segments.push({
            index: i,
            p: { world: { x: 0, y: y, z: i * SEGMENT_LENGTH }, screen: {}, scale: 0 },
            curve: curve,
            hill: hill,
            color: Math.floor(i / 3) % 2 === 0 ? 
                { road: '#333', grass: '#2a8a2a', rumble: '#ff0000', lane: '#fff' } : 
                { road: '#3a3a3a', grass: '#2d9a2d', rumble: '#ffffff', lane: '#3a3a3a' },
            sprites: []
        });
    }
    
    // Add scenery sprites
    for (let i = 0; i < TOTAL_SEGMENTS; i++) {
        if (i % 5 === 0) {
            let side = Math.random() > 0.5 ? 1 : -1;
            let offset = 1.2 + Math.random() * 3;
            let type = Math.random();
            if (type < 0.3) segments[i].sprites.push({ type: 'tree', offset: side * offset, scale: 0.8 + Math.random() * 0.5 });
            else if (type < 0.5) segments[i].sprites.push({ type: 'building', offset: side * offset, scale: 1.0 + Math.random() * 0.8 });
            else if (type < 0.65) segments[i].sprites.push({ type: 'rock', offset: side * offset, scale: 0.5 + Math.random() * 0.3 });
        }
        if (i % 8 === 0) {
            segments[i].sprites.push({ type: 'tree', offset: -1.5 - Math.random() * 2, scale: 0.6 + Math.random() * 0.4 });
            segments[i].sprites.push({ type: 'tree', offset: 1.5 + Math.random() * 2, scale: 0.6 + Math.random() * 0.4 });
        }
    }
}

// Player
let player = {
    x: 0,
    z: 0,
    speed: 0,
    maxSpeed: 300,
    accel: 2.0,
    handling: 3.5,
    rpm: 0,
    gear: 1,
    lap: 1,
    totalLaps: 3,
    lapTime: 0,
    bestLap: Infinity,
    totalTime: 0,
    lastLapZ: 0,
    position: 1
};

// AI opponents
let aiCars = [];
const NUM_AI = 5;
const AI_COLORS = ['#ff6600', '#00aaff', '#ff00ff', '#00ff88', '#ffcc00'];

function initAICars() {
    aiCars = [];
    for (let i = 0; i < NUM_AI; i++) {
        aiCars.push({
            x: (Math.random() - 0.5) * 1.5,
            z: (i + 1) * 200 + Math.random() * 100,
            speed: 150 + Math.random() * 100,
            maxSpeed: 200 + Math.random() * 80,
            color: AI_COLORS[i],
            lap: 1,
            targetX: 0,
            wobble: Math.random() * Math.PI * 2,
            name: `AI ${i + 1}`
        });
    }
}

// Sky colors that change with time
let skyPhase = 0;
function getSkyColors(phase) {
    let t = (Math.sin(phase) + 1) / 2;
    let topR = Math.floor(25 + t * 100);
    let topG = Math.floor(25 + t * 150);
    let topB = Math.floor(80 + t * 100);
    let botR = Math.floor(60 + t * 180);
    let botG = Math.floor(40 + t * 160);
    let botB = Math.floor(80 + t * 120);
    return {
        top: `rgb(${topR},${topG},${topB})`,
        bot: `rgb(${botR},${botG},${botB})`,
        sun: t > 0.5 ? `rgba(255,${Math.floor(200*t)},${Math.floor(100*t)},${t})` : 'rgba(255,100,50,0.3)'
    };
}

// Rendering
function project(p, cameraX, cameraY, cameraZ, cameraDepth) {
    let transX = p.world.x - cameraX;
    let transY = p.world.y - cameraY;
    let transZ = p.world.z - cameraZ;
    if (transZ <= 0) transZ = 0.01;
    p.scale = cameraDepth / transZ;
    p.screen.x = Math.round(W / 2 + p.scale * transX * W / 2);
    p.screen.y = Math.round(H / 2 - p.scale * transY * H / 2);
    p.screen.w = Math.round(p.scale * ROAD_WIDTH * W / 2);
}

function drawPolygon(ctx, x1, y1, x2, y2, x3, y3, x4, y4, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.lineTo(x3, y3);
    ctx.lineTo(x4, y4);
    ctx.closePath();
    ctx.fill();
}

function drawSegment(n, s1, s2, color) {
    let x1 = s1.screen.x, y1 = s1.screen.y, w1 = s1.screen.w;
    let x2 = s2.screen.x, y2 = s2.screen.y, w2 = s2.screen.w;
    
    if (y1 <= y2) return;
    
    // Grass
    ctx.fillStyle = color.grass;
    ctx.fillRect(0, y2, W, y1 - y2);
    
    // Road
    let rumbleW1 = w1 * 1.15, rumbleW2 = w2 * 1.15;
    drawPolygon(ctx, x1 - rumbleW1, y1, x1 + rumbleW1, y1, x2 + rumbleW2, y2, x2 - rumbleW2, y2, color.rumble);
    drawPolygon(ctx, x1 - w1, y1, x1 + w1, y1, x2 + w2, y2, x2 - w2, y2, color.road);
    
    // Lane markings
    if (color.lane !== '#3a3a3a') {
        let lw1 = w1 * 0.02, lw2 = w2 * 0.02;
        for (let lane = -1; lane <= 1; lane += 2) {
            let lx1 = x1 + w1 * lane * 0.33;
            let lx2 = x2 + w2 * lane * 0.33;
            drawPolygon(ctx, lx1 - lw1, y1, lx1 + lw1, y1, lx2 + lw2, y2, lx2 - lw2, y2, color.lane);
        }
    }
    
    // Center line
    let clw1 = w1 * 0.01, clw2 = w2 * 0.01;
    drawPolygon(ctx, x1 - clw1, y1, x1 + clw1, y1, x2 + clw2, y2, x2 - clw2, y2, '#fff');
}

function drawSprite(sprite, seg, cameraX, cameraY, cameraZ) {
    let s = seg.p.screen;
    let destX = s.x + s.w * sprite.offset;
    let destY = s.y;
    let scale = seg.p.scale * sprite.scale;
    
    if (scale <= 0) return;
    
    let size = scale * 3000;
    
    ctx.save();
    ctx.translate(destX, destY);
    
    if (sprite.type === 'tree') {
        // Trunk
        ctx.fillStyle = '#5a3a1a';
        ctx.fillRect(-size * 0.05, -size * 0.6, size * 0.1, size * 0.6);
        // Foliage
        ctx.fillStyle = '#1a6a1a';
        ctx.beginPath();
        ctx.arc(0, -size * 0.7, size * 0.25, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#2a8a2a';
        ctx.beginPath();
        ctx.arc(0, -size * 0.85, size * 0.2, 0, Math.PI * 2);
        ctx.fill();
    } else if (sprite.type === 'building') {
        ctx.fillStyle = '#555';
        ctx.fillRect(-size * 0.3, -size * 1.0, size * 0.6, size * 1.0);
        ctx.fillStyle = '#666';
        for (let wy = 0; wy < 4; wy++) {
            for (let wx = 0; wx < 3; wx++) {
                ctx.fillStyle = Math.random() > 0.3 ? '#ffdd44' : '#444';
                ctx.fillRect(-size * 0.25 + wx * size * 0.18, -size * 0.9 + wy * size * 0.22, size * 0.12, size * 0.15);
            }
        }
    } else if (sprite.type === 'rock') {
        ctx.fillStyle = '#777';
        ctx.beginPath();
        ctx.ellipse(0, -size * 0.1, size * 0.2, size * 0.15, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#888';
        ctx.beginPath();
        ctx.ellipse(-size * 0.05, -size * 0.15, size * 0.12, size * 0.1, 0, 0, Math.PI * 2);
        ctx.fill();
    }
    
    ctx.restore();
}

function drawCar(x, y, scale, color, isPlayer, steer) {
    let w = scale * 180;
    let h = scale * 100;
    
    ctx.save();
    ctx.translate(x, y);
    
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(0, h * 0.1, w * 0.6, h * 0.15, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Car body
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(-w * 0.5, 0);
    ctx.lineTo(-w * 0.45, -h * 0.5);
    ctx.lineTo(-w * 0.2, -h * 0.7);
    ctx.lineTo(w * 0.2, -h * 0.7);
    ctx.lineTo(w * 0.45, -h * 0.5);
    ctx.lineTo(w * 0.5, 0);
    ctx.closePath();
    ctx.fill();
    
    // Windshield
    ctx.fillStyle = isPlayer ? 'rgba(100,200,255,0.6)' : 'rgba(150,200,255,0.4)';
    ctx.beginPath();
    ctx.moveTo(-w * 0.3, -h * 0.45);
    ctx.lineTo(-w * 0.15, -h * 0.65);
    ctx.lineTo(w * 0.15, -h * 0.65);
    ctx.lineTo(w * 0.3, -h * 0.45);
    ctx.closePath();
    ctx.fill();
    
    // Wheels
    ctx.fillStyle = '#111';
    ctx.fillRect(-w * 0.55, -h * 0.1, w * 0.12, h * 0.2);
    ctx.fillRect(w * 0.43, -h * 0.1, w * 0.12, h * 0.2);
    
    // Headlights / taillights
    if (isPlayer) {
        ctx.fillStyle = '#ff4400';
        ctx.fillRect(-w * 0.4, -h * 0.05, w * 0.1, h * 0.05);
        ctx.fillRect(w * 0.3, -h * 0.05, w * 0.1, h * 0.05);
    } else {
        ctx.fillStyle = '#ff0000';
        ctx.fillRect(-w * 0.4, -h * 0.05, w * 0.08, h * 0.04);
        ctx.fillRect(w * 0.32, -h * 0.05, w * 0.08, h * 0.04);
    }
    
    // Stripe
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillRect(-w * 0.05, -h * 0.65, w * 0.1, h * 0.65);
    
    ctx.restore();
}

function drawAIcar(x, y, scale, color) {
    drawCar(x, y, scale, color, false, 0);
}

// Gauge drawing
function drawGauge(speed, maxSpeed, rpm, gear) {
    let cx = 100, cy = 100, r = 85;
    gaugeCtx.clearRect(0, 0, 200, 200);
    
    // Background
    gaugeCtx.beginPath();
    gaugeCtx.arc(cx, cy, r, 0, Math.PI * 2);
    gaugeCtx.fillStyle = 'rgba(0,0,0,0.8)';
    gaugeCtx.fill();
    
    // RPM arc background
    let startAngle = Math.PI * 0.75;
    let endAngle = Math.PI * 2.25;
    
    gaugeCtx.beginPath();
    gaugeCtx.arc(cx, cy, r - 10, startAngle, endAngle);
    gaugeCtx.strokeStyle = '#222';
    gaugeCtx.lineWidth = 12;
    gaugeCtx.stroke();
    
    // RPM arc
    let rpmAngle = startAngle + (rpm / 100) * (endAngle - startAngle);
    let rpmColor = rpm < 60 ? '#00cc44' : rpm < 80 ? '#ffaa00' : '#ff2200';
    gaugeCtx.beginPath();
    gaugeCtx.arc(cx, cy, r - 10, startAngle, rpmAngle);
    gaugeCtx.strokeStyle = rpmColor;
    gaugeCtx.lineWidth = 12;
    gaugeCtx.stroke();
    
    // Speed arc
    gaugeCtx.beginPath();
    gaugeCtx.arc(cx, cy, r - 28, startAngle, endAngle);
    gaugeCtx.strokeStyle = '#1a1a1a';
    gaugeCtx.lineWidth = 8;
    gaugeCtx.stroke();
    
    let speedAngle = startAngle + (speed / maxSpeed) * (endAngle - startAngle);
    gaugeCtx.beginPath();
    gaugeCtx.arc(cx, cy, r - 28, startAngle, speedAngle);
    gaugeCtx.strokeStyle = '#00aaff';
    gaugeCtx.lineWidth = 8;
    gaugeCtx.stroke();
    
    // Tick marks
    for (let i = 0; i <= 10; i++) {
        let angle = startAngle + (i / 10) * (endAngle - startAngle);
        let inner = r - 40;
        let outer = r - 32;
        gaugeCtx.beginPath();
        gaugeCtx.moveTo(cx + Math.cos(angle) * inner, cy + Math.sin(angle) * inner);
        gaugeCtx.lineTo(cx + Math.cos(angle) * outer, cy + Math.sin(angle) * outer);
        gaugeCtx.strokeStyle = '#666';
        gaugeCtx.lineWidth = 2;
        gaugeCtx.stroke();
    }
    
    // Speed text
    gaugeCtx.fillStyle = '#fff';
    gaugeCtx.font = 'bold 28px monospace';
    gaugeCtx.textAlign = 'center';
    gaugeCtx.fillText(Math.floor(speed), cx, cy + 5);
    gaugeCtx.font = '10px monospace';
    gaugeCtx.fillStyle = '#888';
    gaugeCtx.fillText('KM/H', cx, cy + 18);
    
    // RPM text
    gaugeCtx.font = 'bold 12px monospace';
    gaugeCtx.fillStyle = rpmColor;
    gaugeCtx.fillText(Math.floor(rpm * 10) + ' RPM', cx, cy - 30);
    
    // Gear
    gaugeCtx.font = 'bold 22px monospace';
    gaugeCtx.fillStyle = '#ff4400';
    gaugeCtx.fillText(gear, cx, cy + 45);
    gaugeCtx.font = '9px monospace';
    gaugeCtx.fillStyle = '#888';
    gaugeCtx.fillText('GEAR', cx, cy + 58);
    
    // Border
    gaugeCtx.beginPath();
    gaugeCtx.arc(cx, cy, r, 0, Math.PI * 2);
    gaugeCtx.strokeStyle = '#444';
    gaugeCtx.lineWidth = 3;
    gaugeCtx.stroke();
}

function drawMinimap() {
    minimapCtx.clearRect(0, 0, 180, 180);
    minimapCtx.fillStyle = 'rgba(0,0,0,0.7)';
    minimapCtx.fillRect(0, 0, 180, 180);
    
    // Draw simplified track
    let trackPoints = [];
    let totalLen = TOTAL_SEGMENTS;
    let step = Math.floor(totalLen / 200);
    
    let cx = 90, cy = 90;
    let scale = 0.06;
    
    // Calculate track shape for minimap
    let px = 0, py = 0, pAngle = 0;
    let points = [];
    for (let i = 0; i < totalLen; i += step) {
        pAngle += trackCurve[i] * 0.002;
        px += Math.sin(pAngle) * scale;
        py -= Math.cos(pAngle) * scale;
        points.push({ x: px + cx, y: py + cy });
    }
    
    // Draw track
    minimapCtx.beginPath();
    minimapCtx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length; i++) {
        minimapCtx.lineTo(points[i].x, points[i].y);
    }
    minimapCtx.closePath();
    minimapCtx.strokeStyle = '#555';
    minimapCtx.lineWidth = 8;
    minimapCtx.stroke();
    minimapCtx.strokeStyle = '#888';
    minimapCtx.lineWidth = 4;
    minimapCtx.stroke();
    
    // Player position
    let playerSeg = Math.floor(player.z / SEGMENT_LENGTH) % totalLen;
    let playerIdx = Math.floor(playerSeg / step);
    if (playerIdx < points.length) {
        minimapCtx.beginPath();
        minimapCtx.arc(points[playerIdx].x, points[playerIdx].y, 5, 0, Math.PI * 2);
        minimapCtx.fillStyle = '#00ff00';
        minimapCtx.fill();
        minimapCtx.strokeStyle = '#fff';
        minimapCtx.lineWidth = 2;
        minimapCtx.stroke();
    }
    
    // AI positions
    aiCars.forEach((ai, idx) => {
        let aiSeg = Math.floor(ai.z / SEGMENT_LENGTH) % totalLen;
        let aiIdx = Math.floor(aiSeg / step);
        if (aiIdx < points.length) {
            minimapCtx.beginPath();
            minimapCtx.arc(points[aiIdx].x, points[aiIdx].y, 4, 0, Math.PI * 2);
            minimapCtx.fillStyle = AI_COLORS[idx];
            minimapCtx.fill();
        }
    });
}

function formatTime(ms) {
    let totalSec = ms / 1000;
    let min = Math.floor(totalSec / 60);
    let sec = Math.floor(totalSec % 60);
    let msec = Math.floor(ms % 1000);
    return `${min}:${sec.toString().padStart(2, '0')}.${msec.toString().padStart(3, '0')}`;
}

// Input
document.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === 'g' || e.key === 'G') {
        if (gameState === 'menu') openGarage();
        else if (gameState === 'garage') closeGarage();
    }
});
document.addEventListener('keyup', e => keys[e.key] = false);

// Garage
function buildGarageUI() {
    let grid = document.getElementById('carGrid');
    grid.innerHTML = '';
    CARS.forEach((car, i) => {
        let card = document.createElement('div');
        card.className = 'carCard' + (i === selectedCar ? ' selected' : '');
        card.onclick = () => { selectedCar = i; buildGarageUI(); };
        card.innerHTML = `
            <div class="carIcon">${car.icon}</div>
            <div class="carName">${car.name}</div>
            <div style="color:#888;font-size:11px;margin-bottom:10px">${car.desc}</div>
            <div class="statBar"><div class="statLabel"><span>Speed</span><span>${car.speed}</span></div><div class="bar"><div class="barFill" style="width:${car.speed}%;background:${car.color}"></div></div></div>
            <div class="statBar"><div class="statLabel"><span>Accel</span><span>${car.accel}</span></div><div class="bar"><div class="barFill" style="width:${car.accel}%;background:${car.color}"></div></div></div>
            <div class="statBar"><div class="statLabel"><span>Handling</span><span>${car.handling}</span></div><div class="bar"><div class="barFill" style="width:${car.handling}%;background:${car.color}"></div></div></div>
        `;
        grid.appendChild(card);
    });
}

function openGarage() {
    document.getElementById('garageScreen').style.display = 'flex';
    document.getElementById('startScreen').style.display = 'none';
    buildGarageUI();
}

function closeGarage() {
    document.getElementById('garageScreen').style.display = 'none';
    document.getElementById('startScreen').style.display = 'flex';
}

function startRace() {
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('garageScreen').style.display = 'none';
    document.getElementById('raceComplete').style.display = 'none';
    
    let car = CARS[selectedCar];
    player.maxSpeed = car.maxSpeed;
    player.accel = car.accelRate;
    player.handling = car.handlingVal;
    player.x = 0;
    player.z = 0;
    player.speed = 0;
    player.rpm = 0;
    player.gear = 1;
    player.lap = 1;
    player.lapTime = 0;
    player.bestLap = Infinity;
    player.totalTime = 0;
    player.lastLapZ = 0;
    
    buildTrack();
    initAICars();
    
    gameState = 'countdown';
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
    let countEl = document.getElementById('countdown');
    countEl.style.display = 'block';
    
    let count = 3;
    countEl.textContent = count;
    let interval = setInterval(() => {
        count--;
        if (count > 0) {
            countEl.textContent = count;
        } else if (count === 0) {
            countEl.textContent = 'GO!';
            countEl.style.color = '#00ff00';
        } else {
            countEl.style.display = 'none';
            countEl.style.color = '#ff0';
            gameState = 'racing';
            clearInterval(interval);
        }
    }, 1000);
}

function finishRace() {
    gameState = 'complete';
    document.getElementById('raceComplete').style.display = 'flex';
    
    let positions = [];
    aiCars.forEach(ai => {
        let progress = (ai.lap - 1) * TRACK_LENGTH + ai.z;
        positions.push({ name: ai.name, progress, isPlayer: false });
    });
    let playerProgress = (player.lap - 1) * TRACK_LENGTH + player.z;
    positions.push({ name: 'YOU', progress: playerProgress, isPlayer: true });
    positions.sort((a, b) => b.progress - a.progress);
    
    let playerPos = positions.findIndex(p => p.isPlayer) + 1;
    let suffixes = ['st', 'nd', 'rd'];
    document.getElementById('finalPos').textContent = playerPos + (suffixes[playerPos - 1] || 'th');
    document.getElementById('finalTime').textContent = formatTime(player.totalTime);
    document.getElementById('finalBest').textContent = player.bestLap < Infinity ? formatTime(player.bestLap) : '--:--.---';
}

// Main game loop
let lastTime = 0;
let cameraDepth = 1 / Math.tan((80 / 2) * Math.PI / 180);

function gameLoop(timestamp) {
    if (gameState === 'menu' || gameState === 'garage' || gameState === 'complete') return;

    let dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;
    
    skyPhase += dt * 0.1;
    
    update(dt);
    
    render();
    requestAnimationFrame(gameLoop);
}

function update(dt) {
    let car = CARS[selectedCar];
    
    // Player input
    if (gameState === 'racing') {
        let accelInput = 0;
        if (keys['ArrowUp'] || keys['w']) accelInput = 1;
        if (keys['ArrowDown'] || keys['s']) accelInput = -1;
        
        // Acceleration
        if (accelInput > 0) {
            player.speed += player.accel * accelInput * 60 * dt;
        } else if (accelInput < 0) {
            player.speed -= player.accel * 2.5 * 60 * dt;
        } else {
            player.speed -= player.accel * 0.5 * 60 * dt;
        }
        
        player.speed = Math.max(0, Math.min(player.speed, player.maxSpeed));
        
        // Steering
        let steerInput = 0;
        if (keys['ArrowLeft'] || keys['a']) steerInput = -1;
        if (keys['ArrowRight'] || keys['d']) steerInput = 1;
        
        let speedFactor = player.speed / player.maxSpeed;
        player.x += steerInput * player.handling * speedFactor * dt * 60;
        
        // Road curve effect
        let segIdx = Math.floor(player.z / SEGMENT_LENGTH) % TOTAL_SEGMENTS;
        let curve = trackCurve[segIdx] || 0;
        player.x -= curve * speedFactor * dt * 0.8;
        
        // Off-road slowdown
        if (Math.abs(player.x) > 1.2) {
            player.speed *= 0.98;
            player.x = Math.max(-2.5, Math.min(2.5, player.x));
        }
        
        // RPM calculation
        let gearRatios = [0, 0.15, 0.3, 0.5, 0.68, 0.85, 1.0];
        let gear = 1;
        for (let g = 6; g >= 1; g--) {
            if (speedFactor >= gearRatios[g] - 0.05) { gear = g; break; }
        }
        player.gear = gear;
        let gearMin = gearRatios[gear - 1] || 0;
        let gearMax = gearRatios[gear];
        let gearRange = gearMax - gearMin;
        player.rpm = gearRange > 0 ? ((speedFactor - gearMin) / gearRange) : 0;
        player.rpm = Math.max(0, Math.min(1, player.rpm));
        
        // Move forward
        player.z += player.speed * dt * 3;
        
        // Lap tracking
        let currentLapZ = Math.floor(player.z / TRACK_LENGTH);
        if (currentLapZ > player.lastLapZ) {
            if (player.lapTime > 0) {
                if (player.lapTime < player.bestLap) player.bestLap = player.lapTime;
            }
            player.lastLapZ = currentLapZ;
            player.lap = Math.min(currentLapZ + 1, player.totalLaps);
            player.lapTime = 0;
            
            if (player.lap > player.totalLaps) {
                finishRace();
                return;
            }
        }
        
        player.lapTime += dt * 1000;
        player.totalTime += dt * 1000;
        
        // Update UI
        document.getElementById('lapNum').textContent = `${player.lap} / ${player.totalLaps}`;
        document.getElementById('lapTime').textContent = formatTime(player.lapTime);
        document.getElementById('bestLap').textContent = player.bestLap < Infinity ? formatTime(player.bestLap) : '--:--.---';
        document.getElementById('totalTime').textContent = formatTime(player.totalTime);
    }
    
    // Update AI
    aiCars.forEach(ai => {
        ai.wobble += dt * 2;
        ai.targetX = Math.sin(ai.wobble) * 0.8;
        ai.x += (ai.targetX - ai.x) * dt * 2;
        
        // AI speed variation
        let aiSegIdx = Math.floor(ai.z / SEGMENT_LENGTH) % TOTAL_SEGMENTS;
        let aiCurve = Math.abs(trackCurve[aiSegIdx] || 0);
        let curveSlowdown = 1 - aiCurve * 0.05;
        ai.speed = ai.maxSpeed * curveSlowdown + Math.sin(ai.wobble * 0.5) * 20;
        
        ai.z += ai.speed * dt * 3;
        
        // AI lap tracking
        let aiLapZ = Math.floor(ai.z / TRACK_LENGTH);
        if (aiLapZ > 0 && aiLapZ > (ai.lastLapZ || 0)) {
            ai.lap = aiLapZ + 1;
            ai.lastLapZ = aiLapZ;
        }
    });
    
    // Calculate player position
    let playerProgress = (player.lap - 1) * TRACK_LENGTH + player.z;
    let rank = 1;
    aiCars.forEach(ai => {
        let aiProgress = (ai.lap - 1) * TRACK_LENGTH + ai.z;
        if (aiProgress > playerProgress) rank++;
    });
    player.position = rank;
    document.getElementById('posNum').textContent = rank;
    document.getElementById('posTotal').textContent = NUM_AI + 1;
}

function render() {
    ctx.clearRect(0, 0, W, H);
    
    // Sky
    let sky = getSkyColors(skyPhase);
    let skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.5);
    skyGrad.addColorStop(0, sky.top);
    skyGrad.addColorStop(1, sky.bot);
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H * 0.5);
    
    // Sun/Moon
    let sunX = W * 0.75 + Math.sin(skyPhase * 0.5) * W * 0.2;
    let sunY = H * 0.15 + Math.cos(skyPhase * 0.3) * H * 0.05;
    let sunGrad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 60);
    sunGrad.addColorStop(0, sky.sun);
    sunGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = sunGrad;
    ctx.fillRect(sunX - 80, sunY - 80, 160, 160);
    
    // Stars (when dark)
    let brightness = (Math.sin(skyPhase) + 1) / 2;
    if (brightness < 0.4) {
        let starAlpha = (0.4 - brightness) / 0.4;
        ctx.fillStyle = `rgba(255,255,255,${starAlpha})`;
        for (let i = 0; i < 50; i++) {
            let sx = (Math.sin(i * 127.1 + i) * 0.5 + 0.5) * W;
            let sy = (Math.cos(i * 311.7 + i) * 0.5 + 0.5) * H * 0.4;
            ctx.fillRect(sx, sy, 2, 2);
        }
    }
    
    // Mountains (parallax)
    drawMountains(brightness);
    
    if (gameState === 'menu' || gameState === 'garage') {
        // Draw a nice background scene
        drawGroundScene();
        return;
    }
    
    // Road rendering
    let baseSegment = Math.floor(player.z / SEGMENT_LENGTH);
    let cameraY = 1500;
    let cameraZ = player.z - cameraDepth * SEGMENT_LENGTH;
    
    let maxY = H;
    let x = 0;
    let dx = 0;
    
    // Collect visible segments
    let visibleSegments = [];
    for (let n = 0; n < DRAW_DISTANCE; n++) {
        let segIdx = (baseSegment + n) % TOTAL_SEGMENTS;
        let seg = segments[segIdx];
        if (!seg) continue;
        
        let looped = (baseSegment + n) >= TOTAL_SEGMENTS;
        let segZ = seg.p.world.z;
        if (looped) segZ += TRACK_LENGTH;
        
        seg.p.world.x = x;
        seg.p.world.y = seg.p.world.y || 0;
        
        project(seg.p, player.x * ROAD_WIDTH - x, cameraY, cameraZ, cameraDepth);
        
        x += dx;
        dx += seg.curve;
        
        if (seg.p.screen.y >= maxY) continue;
        if (seg.p.screen.y <= 0) continue;
        
        visibleSegments.push({ n, seg, segIdx });
        maxY = seg.p.screen.y;
    }
    
    // Draw segments back to front
    for (let i = visibleSegments.length - 1; i > 0; i--) {
        let { seg, segIdx } = visibleSegments[i];
        let prev = visibleSegments[i - 1];
        if (!prev) continue;
        
        let s1 = prev.seg.p;
        let s2 = seg.p;
        
        if (s1.screen.y <= s2.screen.y) continue;
        
        drawSegment(i, s1, s2, seg.color);
        
        // Draw sprites
        seg.sprites.forEach(sprite => {
            drawSprite(sprite, seg, 0, 0, 0);
        });
    }
    
    // Draw AI cars
    let aiDrawList = [];
    aiCars.forEach((ai, idx) => {
        let aiSegIdx = Math.floor(ai.z / SEGMENT_LENGTH) % TOTAL_SEGMENTS;
        let relZ = ai.z - player.z;
        if (relZ < 0) relZ += TRACK_LENGTH;
        if (relZ < SEGMENT_LENGTH || relZ > DRAW_DISTANCE * SEGMENT_LENGTH) return;
        
        let screenSeg = Math.floor(relZ / SEGMENT_LENGTH);
        if (screenSeg >= visibleSegments.length) return;
        
        let visSeg = visibleSegments[screenSeg];
        if (!visSeg) return;
        
        let s = visSeg.seg.p;
        let aiScreenX = s.screen.x + s.screen.w * ai.x;
        let aiScreenY = s.screen.y;
        let aiScale = s.scale * 0.8;
        
        if (aiScale > 0 && aiScreenY > 0 && aiScreenY < H) {
            aiDrawList.push({ x: aiScreenX, y: aiScreenY, scale: aiScale, color: ai.color, z: relZ });
        }
    });
    
    // Sort AI by distance (far first)
    aiDrawList.sort((a, b) => b.z - a.z);
    aiDrawList.forEach(ai => {
        drawAIcar(ai.x, ai.y, ai.scale, ai.color);
    });
    
    // Draw player car
    let steer = 0;
    if (keys['ArrowLeft'] || keys['a']) steer = -1;
    if (keys['ArrowRight'] || keys['d']) steer = 1;
    
    let bounce = Math.sin(timestamp * 0.01) * (player.speed / player.maxSpeed) * 2;
    let playerCarY = H - 80 + bounce;
    let playerCarX = W / 2 + steer * 30;
    drawCar(playerCarX, playerCarY, 0.015, CARS[selectedCar].color, true, steer);
    
    // Speed lines effect
    if (player.speed > player.maxSpeed * 0.7) {
        let intensity = (player.speed - player.maxSpeed * 0.7) / (player.maxSpeed * 0.3);
        ctx.strokeStyle = `rgba(255,255,255,${intensity * 0.15})`;
        ctx.lineWidth = 1;
        for (let i = 0; i < 10; i++) {
            let lx = Math.random() * W;
            let ly = H * 0.5 + Math.random() * H * 0.5;
            ctx.beginPath();
            ctx.moveTo(lx, ly);
            ctx.lineTo(lx + (lx - W/2) * 0.1, ly + 30 + Math.random() * 20);
            ctx.stroke();
        }
    }
    
    // Draw gauge
    drawGauge(player.speed, player.maxSpeed, player.rpm, player.gear);
    
    // Draw minimap
    drawMinimap();
}

function drawMountains(brightness) {
    // Far mountains
    let offset = (player.z * 0.0001) % W;
    ctx.fillStyle = brightness > 0.5 ? `rgba(40,60,80,0.8)` : `rgba(15,20,30,0.9)`;
    ctx.beginPath();
    ctx.moveTo(0, H * 0.45);
    for (let x = 0; x <= W; x += 3) {
        let y = H * 0.45 - Math.sin((x + offset) * 0.005) * 40 - Math.sin((x + offset) * 0.013) * 25 - Math.cos((x + offset) * 0.008) * 30;
        ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H * 0.5);
    ctx.lineTo(0, H * 0.5);
    ctx.closePath();
    ctx.fill();
    
    // Near mountains
    let offset2 = (player.z * 0.0003) % W;
    ctx.fillStyle = brightness > 0.5 ? `rgba(30,50,40,0.7)` : `rgba(10,15,20,0.8)`;
    ctx.beginPath();
    ctx.moveTo(0, H * 0.48);
    for (let x = 0; x <= W; x += 3) {
        let y = H * 0.48 - Math.sin((x + offset2) * 0.008) * 30 - Math.cos((x + offset2) * 0.02) * 15;
        ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H * 0.5);
    ctx.lineTo(0, H * 0.5);
    ctx.closePath();
    ctx.fill();
}

function drawGroundScene() {
    // Simple ground for menu
    ctx.fillStyle = '#2a8a2a';
    ctx.fillRect(0, H * 0.5, W, H * 0.5);
    
    // Road
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.moveTo(W * 0.3, H);
    ctx.lineTo(W * 0.45, H * 0.55);
    ctx.lineTo(W * 0.55, H * 0.55);
    ctx.lineTo(W * 0.7, H);
    ctx.closePath();
    ctx.fill();
    
    // Road lines
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(W * 0.5, H);
    ctx.lineTo(W * 0.5, H * 0.55);
    ctx.stroke();
}

let timestamp = 0;
buildTrack();
requestAnimationFrame(gameLoop);
</script>
