<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Racing Game</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
canvas { display: block; }

#ui-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 10;
}

.garage-screen, .hud-screen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 20; pointer-events: all;
}

.garage-screen { background: rgba(0,0,0,0.95); }
.hud-screen { display: none; }

.garage-title { color: #fff; font-size: 48px; margin-bottom: 20px; text-shadow: 0 0 20px #ff6600; }
.car-select { display: flex; gap: 30px; margin: 20px 0; flex-wrap: wrap; justify-content: center;}
.car-option {
    width: 200px; padding: 15px; border: 2px solid #444; border-radius: 10px;
    background: rgba(30,30,30,0.9); cursor: pointer; text-align: center; transition: all 0.3s;
}
.car-option:hover { border-color: #ff6600; transform: scale(1.05); }
.car-option.selected { border-color: #ff6600; background: rgba(255,100,0,0.2); }
.car-name { color: #fff; font-size: 18px; margin-bottom: 5px; }
.stat-bar { height: 8px; border-radius: 4px; margin: 3px 0; background: #333; position: relative;}
.stat-fill { height: 8px; border-radius: 4px; background: #ff6600; }
.stat-label { color: #aaa; font-size: 12px; margin-bottom: 2px; }

.start-btn {
    padding: 15px 40px; font-size: 24px; background: #ff6600; color: #fff; border: none;
    border-radius: 8px; cursor: pointer; margin-top: 20px; transition: all 0.3s;
}
.start-btn:hover { background: #ff8800; transform: scale(1.05); }

.hud-speed { position: absolute; bottom: 20px; right: 20px; color: #fff; font-size: 24px; text-align: right;}
.hud-rpm { position: absolute; bottom: 60px; right: 20px; color: #ff6600; font-size: 18px;}
.hud-lap { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 20px; text-align:center;}
.hud-position { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); color: #ff6600; font-size: 18px;}

#minimap { position: absolute; bottom: 20px; left: 20px; width: 150px; height: 150px; }
</style>
</canvas>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div class="garage-screen" id="garage">
    <h1 class="garage-title">🏁 RACING GARAGE</h1>
    <div class="car-select" id="carSelect"></div>
    <button class="start-btn" onclick="startGame()">START RACE</button>
</div>

<div class="hud-screen" id="hud">
    <div class="hud-lap" id="hudLap">LAP 1/5</div>
    <div class="hud-position" id="hudPosition">P1</div>
    <div class="hud-speed" id="hudSpeed">0 km/h</div>
    <div class="hud-rpm" id="hudRPM">RPM: 0</div>
    <canvas id="minimap" width="150" height="150"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W = window.innerWidth, H = window.innerHeight;
canvas.width = W; canvas.height = H;

// Car definitions
const CARS = [
    { name: "Speedster", color: "#ff0000", speed: 95, accel: 85, handling: 70, desc: "Top Speed Machine" },
    { name: "Racer X", color: "#0066ff", speed: 80, accel: 95, handling: 90, desc: "Balanced Performance" },
    { name: "Thunder", color: "#ffaa00", speed: 70, accel: 100, handling: 85, desc: "Quick Acceleration" },
    { name: "Phantom", color: "#cc00cc", speed: 90, accel: 75, handling: 95, desc: "Elite Handling" }
];

let selectedCar = 0;
let gameRunning = false;
let gameTime = 0;
let totalLaps = 5;
let currentLap = 1;
let lapTimes = [];
let bestLapTime = Infinity;
let lapStartTime = 0;

// Road segments
const SEGMENT_COUNT = 600;
const segmentLength = 80;
let segments = [];
let segmentArc = 0.3;

// Player state
let playerX = 0, playerY = 0, playerZ = 0;
let speed = 0, maxSpeed = 120, accelRate = 0.5;
let steerAngle = 0, steerAmount = 0;
let carHandling = 70;

// AI opponents
let aiCars = [];
const AI_COUNT = 8;

// Camera
let camX = 0, camY = 0, camZ = 0;
let cameraHeight = 100;

// Input
let keys = {};
window.addEventListener('keydown', e => { keys[e.key] = true; });
window.addEventListener('keyup', e => { keys[e.key] = false; });

// Initialize road segments
function initSegments() {
    segments = [];
    for (let i = 0; i < SEGMENT_COUNT; i++) {
        let seg = {
            index: i,
            curve: Math.sin(i * 0.01) * segmentArc + Math.sin(i * 0.005) * 0.2,
            hill: Math.sin(i * 0.008) * 30,
            x: 0, y: 0, z: i * segmentLength,
            trees: [],
            buildings: []
        };

        // Generate scenery
        for (let j = 0; j < 5; j++) {
            let side = Math.random() > 0.5 ? 1 : -1;
            seg.trees.push({
                x: side * (200 + Math.random() * 300),
                type: Math.floor(Math.random() * 3)
            });
        }

        if (i % 40 === 0) {
            seg.buildings.push({
                x: (Math.random() - 0.5) * 600,
                height: 50 + Math.random() * 100,
                width: 30 + Math.random() * 20
            });
        }

        segments.push(seg);
    }

    // Calculate cumulative curve positions
    let cx = 0;
    for (let i = 0; i < SEGMENT_COUNT; i++) {
        segments[i].x = cx;
        cx += segments[i].curve * segmentLength;
    }
}

// Initialize AI cars
function initAICars() {
    aiCars = [];
    for (let i = 0; i < AI_COUNT; i++) {
        let offsetZ = Math.random() * SEGMENT_COUNT * segmentLength;
        let laneX = (Math.random() - 0.5) * 200;
        aiCars.push({
            z: offsetZ,
            x: laneX,
            speed: 60 + Math.random() * 40,
            color: ['#ff4444', '#44ff44', '#4444ff', '#ffff44', '#ff44ff'][i % 5],
            lap: Math.floor(offsetZ / (SEGMENT_COUNT * segmentLength)),
            progress: offsetZ % (SEGMENT_COUNT * segmentLength)
        });
    }
}

// Get road segment at position z
function getSegment(z) {
    let idx = ((z % SEGMENT_COUNT) + SEGMENT_COUNT) % SEGMENT_COUNT;
    return segments[Math.floor(idx)];
}

// Update game state
function update(dt) {
    gameTime += dt;

    // Handle input
    let accelInput = keys['ArrowUp'] || keys['w'] || keys['W'];
    let brakeInput = keys['ArrowDown'] || keys['s'] || keys['S'];
    let leftInput = keys['ArrowLeft'] || keys['a'] || keys['A'];
    let rightInput = keys['ArrowRight'] || keys['d'] || keys['D'];

    // Acceleration / braking
    if (accelInput) {
        speed += accelRate * dt;
    } else if (brakeInput) {
        speed -= 1.5 * dt;
    } else {
        speed -= 0.3 * dt; // friction
    }

    speed = Math.max(0, Math.min(maxSpeed, speed));

    // Steering
    steerAmount = 0;
    if (leftInput) steerAmount = -1;
    if (rightInput) steerAmount = 1;

    let turnRate = carHandling * 0.02 * dt;
    playerX += steerAmount * speed * turnRate;

    // Move forward
    playerZ += speed * dt * 5;

    // Wrap around track
    if (playerZ >= SEGMENT_COUNT * segmentLength) {
        playerZ -= SEGMENT_COUNT * segmentLength;
        currentLap++;
        lapTimes.push(gameTime - lapStartTime);
        lapStartTime = gameTime;
        if (currentLap > totalLaps) {
            // Race finished
            document.getElementById('hudLap').textContent = 'RACE COMPLETE!';
        }
    }

    // Update camera
    camZ = playerZ;
    camX = playerX;
    camY = getSegment(playerZ).hill + cameraHeight;

    // Update AI cars
    for (let ai of aiCars) {
        let prevProgress = ai.progress;
        ai.progress += ai.speed * dt * 5;
        if (ai.progress >= SEGMENT_COUNT * segmentLength) {
            ai.progress -= SEGMENT_COUNT * segmentLength;
            ai.lap++;
        }
    }

    // Update HUD
    updateHUD();
}

function updateHUD() {
    let hud = document.getElementById('hud');
    if (!hud || hud.style.display === 'none') return;

    document.getElementById('hudLap').textContent = `LAP ${currentLap}/${totalLaps}`;
    document.getElementById('hudSpeed').textContent = `${Math.floor(speed * 3)} km/h`;
    document.getElementById('hudRPM').textContent = `RPM: ${(speed / maxSpeed * 8000).toFixed(0)}`;

    // Calculate position
    let playerProgress = playerZ % (SEGMENT_COUNT * segmentLength);
    let positions = aiCars.map(a => a.progress + a.lap * SEGMENT_COUNT * segmentLength).sort();
    let pos = 1;
    for (let p of positions) {
        if (p < playerProgress) pos++;
    }
    document.getElementById('hudPosition').textContent = `P${pos}`;

    // Update minimap
    drawMinimap();
}

function drawMinimap() {
    let mc = document.getElementById('minimap');
    let mctx = mc.getContext('2d');
    mctx.clearRect(0, 0, 150, 150);

    // Draw track outline
    mctx.strokeStyle = '#333';
    mctx.lineWidth = 8;
    mctx.beginPath();
    let scale = 150 / SEGMENT_COUNT;
    for (let i = 0; i < SEGMENT_COUNT; i++) {
        let seg = segments[i];
        let x = seg.x * scale + 75;
        let y = (i % SEGMENT_COUNT) * scale + 20;
        if (i === 0) mctx.moveTo(x, y);
        else mctx.lineTo(x, y);
    }
    mctx.closePath();

    // Draw player position
    let px = segments[Math.floor(playerZ / segmentLength)].x * scale + 75;
    let py = (playerZ % SEGMENT_COUNT) * scale + 20;
    mctx.fillStyle = '#ff6600';
    mctx.beginPath();
    mctx.arc(px, py, 4, 0, Math.PI * 2);
    mctx.fill();

    // Draw AI positions
    for (let ai of aiCars) {
        let ax = segments[Math.floor(ai.progress / segmentLength)].x * scale + 75;
        let ay = (ai.progress % SEGMENT_COUNT) * scale + 20;
        mctx.fillStyle = ai.color;
        mctx.beginPath();
        mctx.arc(ax, ay, 3, 0, Math.PI * 2);
        mctx.fill();
    }
}

// Render the game
function render() {
    ctx.clearRect(0, 0, W, H);

    // Sky gradient based on time of day
    let skyPhase = (gameTime % 3600) / 3600;
    let skyColor1 = lerpColor('#87CEEB', '#FF6600', Math.sin(skyPhase * Math.PI));
    let skyColor2 = lerpColor('#4444AA', '#CC3300', Math.cos(skyPhase * Math.PI) * 0.5 + 0.5);

    // Draw sky
    let gradient = ctx.createLinearGradient(0, 0, 0, H);
    gradient.addColorStop(0, skyColor1);
    gradient.addColorStop(0.5, skyColor2);
    gradient.addColorStop(1, '#1a1a2e');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);

    // Draw mountains in background (parallax)
    drawMountains();

    // Draw road segments from back to front
    let startSeg = Math.floor(playerZ / segmentLength) - 50;
    for (let i = SEGMENT_COUNT - 1; i >= 0; i--) {
        let segIdx = ((i % SEGMENT_COUNT) + SEGMENT_COUNT) % SEGMENT_COUNT;
        let seg = segments[segIdx];

        let relZ = seg.z - playerZ;
        if (relZ < 0 || relZ > SEGMENT_COUNT * segmentLength) continue;

        // Perspective projection
        let scale = cameraHeight / (cameraHeight + Math.abs(relZ));
        let screenX = W / 2 + (seg.x - camX) * scale;
        let screenY = H / 2 + (seg.hill - camY) * scale;

        // Draw road segment
        if (screenY > 0 && screenY < H) {
            ctx.fillStyle = '#333';
            ctx.fillRect(screenX - 100, screenY, 200, 5);
        }
    }

    // Draw trees and buildings
    for (let i = SEGMENT_COUNT - 1; i >= 0; i--) {
        let segIdx = ((i % SEGMENT_COUNT) + SEGMENT_COUNT) % SEGMENT_COUNT;
        let seg = segments[segIdx];

        let relZ = seg.z - playerZ;
        if (relZ < 0 || relZ > SEGMENT_COUNT * segmentLength) continue;

        let scale = cameraHeight / (cameraHeight + Math.abs(relZ));
        let screenX = W / 2 + (seg.x - camX) * scale;
        let screenY = H / 2 + (seg.hill - camY) * scale;

        // Draw trees
        for (let tree of seg.trees) {
            let tx = screenX + tree.x * scale;
            let ty = screenY;
            if (ty > 0 && ty < H && tx > 0 && tx < W) {
                drawTree(tx, ty, tree.type, scale);
            }
        }

        // Draw buildings
        for (let b of seg.buildings) {
            let bx = screenX + b.x * scale;
            let by = screenY - b.height * scale;
            if (by > 0 && by < H && bx > 0 && bx < W) {
                drawBuilding(bx, by, b.width * scale, b.height * scale);
            }
        }
    }

    // Draw AI cars
    for (let ai of aiCars) {
        let relZ = ai.progress - playerZ;
        if (relZ < 0 || relZ > SEGMENT_COUNT * segmentLength) continue;

        let scale = cameraHeight / (cameraHeight + Math.abs(relZ));
        let screenX = W / 2 + (ai.x - camX) * scale;
        let screenY = H / 2 + (getSegment(ai.progress).hill - camY) * scale;

        if (screenY > 0 && screenY < H && screenX > 0 && screenX < W) {
            drawCar(screenX, screenY, ai.color, scale);
        }
    }

    // Draw player car at bottom center
    let carScale = cameraHeight / (cameraHeight + 10);
    let carScreenX = W / 2;
    let carScreenY = H - 80;
    drawCar(carScreenX, carScreenY, CARS[selectedCar].color, carScale * 3);

    // Draw HUD elements on canvas
    drawHUDOnCanvas();
}

function drawTree(x, y, type, scale) {
    ctx.fillStyle = '#2d5a2d';
    if (type === 0) {
        // Pine tree
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x - 15 * scale, y + 40 * scale);
        ctx.lineTo(x + 15 * scale, y + 40 * scale);
        ctx.fill();
    } else if (type === 1) {
        // Oak tree
        ctx.beginPath();
        ctx.arc(x, y + 20 * scale, 20 * scale, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(x - 3 * scale, y + 20 * scale, 6 * scale, 20 * scale);
    } else {
        // Palm tree
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(x - 3 * scale, y + 20 * scale, 6 * scale, 25 * scale);
        ctx.fillStyle = '#2d5a2d';
        for (let i = 0; i < 5; i++) {
            let angle = (i / 5) * Math.PI - Math.PI / 2;
            ctx.beginPath();
            ctx.ellipse(x + Math.cos(angle) * 15 * scale, y + 20 * scale + Math.sin(angle) * 10 * scale, 15 * scale, 8 * scale, angle, 0, Math.PI * 2);
            ctx.fill();
        }
    }
}

function drawBuilding(x, y, w, h) {
    if (h < 1 || w < 1) return;
    ctx.fillStyle = '#666';
    ctx.fillRect(x - w / 2, y, w, h);
    // Windows
    ctx.fillStyle = '#ffffcc';
    for (let i = 0; i < Math.floor(h / 15); i++) {
        for (let j = 0; j < Math.floor(w / 10); j++) {
            if (Math.random() > 0.3) {
                ctx.fillRect(x - w / 2 + j * 8, y + i * 12, 6, 8);
            }
        }
    }
}

function drawCar(x, y, color, scale) {
    // Car body
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(x, y, 30 * scale, 15 * scale, 0, 0, Math.PI * 2);
    ctx.fill();

    // Wheels
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(x - 20 * scale, y + 8 * scale, 6 * scale, 0, Math.PI * 2);
    ctx.arc(x + 20 * scale, y + 8 * scale, 6 * scale, 0, Math.PI * 2);
    ctx.fill();

    // Windshield
    ctx.fillStyle = '#444';
    ctx.beginPath();
    ctx.ellipse(x, y - 5 * scale, 15 * scale, 8 * scale, 0, 0, Math.PI * 2);
    ctx.fill();
}

function drawMountains() {
    let mountainColor = '#3a4d6e';
    ctx.fillStyle = mountainColor;
    for (let i = 0; i < W; i += 5) {
        let height = Math.sin(i * 0.01 + gameTime * 0.001) * 100 + 200;
        ctx.fillRect(i, H - height, 5, height);
    }

    // Second mountain layer for parallax
    ctx.fillStyle = '#4a5d7e';
    for (let i = 0; i < W; i += 3) {
        let height = Math.sin((i + 100) * 0.008 + gameTime * 0.002) * 80 + 150;
        ctx.fillRect(i, H - height, 3, height);
    }
}

function drawHUDOnCanvas() {
    // Speed gauge
    let speedPercent = speed / maxSpeed;
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(W - 250, H - 100, 200, 60);

    // RPM bar
    ctx.fillStyle = '#333';
    ctx.fillRect(W - 240, H - 95, 180, 10);
    let rpmColor = speedPercent < 0.7 ? '#ff6600' : '#ff0000';
    ctx.fillStyle = rpmColor;
    ctx.fillRect(W - 240, H - 95, 180 * speedPercent, 10);

    // Speed text
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px Arial';
    ctx.fillText(`${Math.floor(speed * 3)} km/h`, W - 240, H - 75);

    // Lap time display
    if (lapTimes.length > 0) {
        let lapTime = gameTime - lapStartTime;
        ctx.fillStyle = '#fff';
        ctx.font = '14px Arial';
        ctx.fillText(`Current Lap: ${(lapTime / 1000).toFixed(2)}s`, W - 250, H - 30);
    }

    if (bestLapTime < Infinity) {
        ctx.fillStyle = '#ff6600';
        ctx.font = 'bold 14px Arial';
        ctx.fillText(`Best Lap: ${(bestLapTime / 1000).toFixed(2)}s`, W - 250, H - 15);
    }
}

// Utility functions
function lerpColor(c1, c2, t) {
    let r1 = parseInt(c1.slice(1, 3), 16);
    let g1 = parseInt(c1.slice(3, 5), 16);
    let b1 = parseInt(c1.slice(5, 7), 16);
    let r2 = parseInt(c2.slice(1, 3), 16);
    let g2 = parseInt(c2.slice(3, 5), 16);
    let b2 = parseInt(c2.slice(5, 7), 16);

    let r = Math.floor(r1 + (r2 - r1) * t);
    let g = Math.floor(g1 + (g2 - g1) * t);
    let b = Math.floor(b1 + (b2 - b1) * t);
    return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
}

// Initialize garage
function initGarage() {
    let carSelect = document.getElementById('carSelect');
    carSelect.innerHTML = '';

    CARS.forEach((car, i) => {
        let div = document.createElement('div');
        div.className = `car-option ${i === selectedCar ? 'selected' : ''}`;
        div.onclick = () => { selectedCar = i; initGarage(); };
        div.innerHTML = `
            <div class="car-name">${car.name}</div>
            <div style="color: #aaa; font-size: 12px;">${car.desc}</div>
            <div class="stat-label">Speed</div>
            <div class="stat-bar"><div class="stat-fill" style="width:${car.speed}%"></div></div>
            <div class="stat-label">Acceleration</div>
            <div class="stat-bar"><div class="stat-fill" style="width:${car.accel}%"></div></div>
            <div class="stat-label">Handling</div>
            <div class="stat-bar"><div class="stat-fill" style="width:${car.handling}%"></div></div>
        `;
        carSelect.appendChild(div);
    });
}

function startGame() {
    document.getElementById('garage').style.display = 'none';
    document.getElementById('hud').style.display = 'block';

    // Set car stats
    maxSpeed = CARS[selectedCar].speed * 1.2;
    accelRate = CARS[selectedCar].accel / 100;
    carHandling = CARS[selectedCar].handling;

    gameRunning = true;
    initSegments();
    initAICars();
    lapStartTime = gameTime;
}

// Game loop
let lastTime = performance.now();
function gameLoop() {
    let now = performance.now();
    let dt = (now - lastTime) / 1000; // seconds
    lastTime = now;

    if (gameRunning) {
        update(dt);
        render();
    } else {
        // Draw garage background animation
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(0, 0, W, H);
        for (let i = 0; i < 50; i++) {
            let x = Math.sin(i * 0.1 + gameTime * 0.001) * W / 2 + W / 2;
            let y = Math.cos(i * 0.15 + gameTime * 0.002) * H / 2 + H / 2;
            ctx.fillStyle = `rgba(${i % 3 === 0 ? '255,100,0' : '100,100,100'}, 0.3)`;
            ctx.beginPath();
            ctx.arc(x, y, 2 + Math.sin(i * 0.1) * 2, 0, Math.PI * 2);
        }
    }

    gameTime += dt;
    requestAnimationFrame(gameLoop);
}

// Initialize
initGarage();
gameLoop();

// Handle window resize
window.addEventListener('resize', () => {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
});
</script>
</body>
</html>
